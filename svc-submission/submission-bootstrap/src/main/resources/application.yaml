# TPL-16 (INV-T-5964). One DataSource, declared only here and in the Helm values: Spring Boot's `dataSource`, the
# service's one bounded HikariCP pool (STK-17; owner rulings INV-Q-3955, INV-Q-4196). Passwords are never set here:
# service-runtime reads them through SecretStore (STK-29).
spring:
  threads.virtual.enabled: true # STK-03
  main.lazy-initialization: false # STK-06
  datasource:
    username: submission_runtime # the one runtime LOGIN: NOSUPERUSER, NOBYPASSRLS, owns no table (CS-19, INV-AC-2175)
    hikari:
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
  flyway:
    schemas: submission
    default-schema: submission
    user: submission_migrate # read only by the migration Job's MigrationRunner (TPL-12, ARC-20)
service-runtime:
  datasource.credential: db/submission_runtime
  event-log-pool.minimum-idle: 1
  modules.schema: submission
  idempotency.schema: submission
  jobs.retention: P30D # how long finished job runs are kept; the migration runner writes the same value to the job-retention row (INV-Q-4346)
management:
  server.port: 8081 # API-33: health, metrics and diagnostics only on the management port, no token
  endpoints.web:
    base-path: /
    exposure.include: health,prometheus,diagnostics
    path-mapping.prometheus: metrics
  endpoint.health:
    status.order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
    status.http-mapping: { DEGRADED: 200, DOWN: 503, OUT_OF_SERVICE: 503 }
    group:
      live.include: livenessState
      ready.include: readinessState,db
logging.structured.format.console: ecs # STK-35
gst:
  service: submission-svc
  db.event-log-url: ${GST_EVENT_LOG_DB_URL:}
inv:
  tenancy:
    # tenant-free object of the schema that the start-up classification (TableClasses.verify, INV-ADR-3968 item 4a)
    # cannot see as library-declared: the sys-owned claim function of the queue (QueueSchema.CLAIM_DUE, a table-valued
    # function in the generated code). The signed-binding key table is not generated (INV-T-7430), so it is not declared.
    platform-scoped-tables: submission.claim_due,submission.retry_due_tenants,submission.waiting_tenants,submission.compliance_tenants
  submission:
    # INV-Q-14316 A: the retry window of the planner (VP-48 retry_boundary) until the tenant values are read through
    # PolicyReader (a later slice). A positive integer; a missing, zero or negative value fails the start.
    retry-boundary-minutes: 240 # provisional
    job-scheduling.enabled: true # INV-Q-16793 A: fire the registered jobs on their cron; tests set it false (SubmissionContext)
  compliance-metrics:
    # The read of getComplianceMetrics (INV-REQ-1069, INV-REQ-1070); numeric thresholds are configuration, never constants of code.
    many-versions-from: 3 # INV-REQ-1070 behaviour 1: documents with three or more versions; per-company default, overridden by configuration
    high-at-or-above: { numerator: 1, denominator: 10 } # resubmission rate from which the signal reads HIGH; per-company default, overridden by configuration
    trend-periods: 6 # periods in the resubmission trend (the contract allows at most 24); per-company default, overridden by configuration
  compliance-evaluation:
    # The daily compliance evaluation (INV-REQ-1069, INV-Q-12767 A, INV-Q-16757 A): a six-field cron, evaluated in UTC; no default in code.
    cron: "0 0 2 * * *"
  backlog-evaluation:
    # The backlog evaluation (INV-REQ-1370, INV-AC-20583): a six-field cron, evaluated in UTC; no default in code.
    cron: "0 */15 * * * *"
    tolerance: PT30M # ISO-8601 duration, positive; two run intervals; no default in code
