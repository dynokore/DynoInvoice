# .gitlab-ci.yml — svc-masterdata (INV-T-4942).
#
# Uses platform-build's shared CI templates (ci/README.md): compile, unit tests, lint, Semgrep, Trivy, the verify-rules
# gate, the dependency-verification check (STK-72, INV-T-4300) and, because this repository builds a bootable image,
# the Paketo image build with SBOM, scan and publish to the LAN Nexus registry (ci/image.gitlab-ci.yml).
include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'   # always first: stages, workflow rules, shared variables
      - 'ci/build.gitlab-ci.yml'    # compile, unit tests, lint, Semgrep, Trivy, verification-metadata check
      - 'ci/image.gitlab-ci.yml'    # bootBuildImage, SBOM, image scan, publish to Nexus
      - 'ci/publish.gitlab-ci.yml'  # OCI image publish
  # The keel-report job reads the JUnit XML of unit-test from the main push pipeline and reports the INV-AC numbers in
  # the testcase names to Keel (the acceptance results of the criteria in ac-keys.tsv).
  - project: 'keel/tooling'
    ref: main
    file: 'keel-report-junit.yml'
    inputs:
      runner_tags: [inv-arm64]
      junit_paths: '**/build/test-results/*/TEST-*.xml'
      ac_pattern: 'INV-AC-\d+(?!\d)'

variables:
  # CI-FAST, owner ruling 2026-10-17 ("skip repeated checks"; platform-build ci/stages.gitlab-ci.yml): main skips a
  # listed job when the same commit already passed a merge-request pipeline. Only lint is listed. Not unit-test, compile,
  # verify-rules, keel-report, the image, scan and publish jobs: they are Keel done evidence or produce artefacts. Not
  # semgrep: it runs in merge requests only, so main has nothing to skip.
  GST_SKIP_REPEATS: "true"
  GST_SKIP_WHEN_VERIFIED_JOBS: "lint"
  IMAGE_NAME: "svc-masterdata"

# INV-T-4946 (INV-Q-9655, INV-Q-8039): the boundary tests start the certification-kit Peppol directory and Check GST
# Register simulators from the local images certkit/<image>:dev. The job pulls each by the digest pinned in
# <image>.digest (ci/pull-simulator.sh fails closed on a missing or malformed file and on a registry digest that
# differs) before the tests, with the job-local auth file of platform-build's `.gst-registry-auth` and no `docker login`.
unit-test:
  extends: [.gradle-job, .gst-registry]
  image: "$CI_GRADLE_DOCKER_IMAGE"
  # platform-build's unit-test inherits tags [inv-arm64] (the Mac runner), whose Docker daemon cannot pull the HTTP Nexus
  # image $CI_GRADLE_DOCKER_IMAGE. Per the CI-FAST B1 rule, tool-image jobs run on the amd64 group runner, so the
  # inherited tags are cleared.
  tags: []
  before_script:
    - !reference [.gradle-job, before_script]
    - !reference [.gst-registry-auth, script]
    - sh ci/pull-simulator.sh peppol-directory-simulator peppol-directory-simulator.digest
    - sh ci/pull-simulator.sh gst-register-simulator gst-register-simulator.digest
