# masterdata-bootstrap/src/main/resources/application.yaml — TPL-16 (INV-T-4942)
spring:
  threads.virtual.enabled: true                     # STK-03
  main.lazy-initialization: false                   # STK-06
  # One DataSource, declared only here and in the Helm values: Spring Boot's `dataSource`, the service's one bounded,
  # elastic HikariCP pool (STK-17). No code names or builds a DataSource; service-runtime serves every platform-libs
  # adapter from it
  datasource:
    username: masterdata_runtime                        # the one runtime LOGIN: NOSUPERUSER, NOBYPASSRLS, owns no table (CS-19)
    hikari:                                         # maximum-pool-size is not set: service-runtime sizes the pool as the sum of the lanes
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
  flyway:
    schemas: masterdata
    default-schema: masterdata
    user: masterdata_migrate                            # read only by the migration Job's MigrationRunner (TPL-12, ARC-20)
service-runtime:
  modules.schema: masterdata
  workload-identity.audience: masterdata-svc
  pool:
    runs-reprocessing: false                        # masterdata-svc runs no pack-activation reprocessing (INV-Q-4485)
  idempotency.schema: masterdata                   # the API-15 key store of the mounted setPolicy (INV-Q-9649 A)
  datasource.credential: db/masterdata_runtime          # the runtime login only; read through SecretStore on every new connection
  jobs.retention: P30D                              # how long finished job runs are kept (at least the schedule interval plus the tolerance); the migration runner writes the same value to the job-retention row
management:
  server.port: 8081                                 # API-33: health, metrics and diagnostics only on the management port
  endpoints.web:
    base-path: /
    exposure.include: health,prometheus,diagnostics
    path-mapping.prometheus: metrics
  endpoint.health:
    status.order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
    status.http-mapping: { DEGRADED: 200, DOWN: 503, OUT_OF_SERVICE: 503 }
    group:
      live.include: livenessState
      ready.include: readinessState,vault,db,eventLoops   # own schema, event loops and vault only (FR-AH.17)
logging.structured.format.console: ecs             # STK-35
masterdata:
  long-command.sweep-cron: "0 */5 * * * *"          # six-field cron of the long-command-sweep job, evaluated in UTC; no default in code
  long-command.max-run: PT15M                      # a RUNNING gap report, dry run or import older than this is finalised FAILED
gst:
  service: masterdata-svc
  db.event-log-url: ${GST_EVENT_LOG_DB_URL:}
inv:
  tenancy:
    # config-resolver's two table-valued functions (write_installation_setting, config_purge_tenant, created by
    # ConfigSchema.ddl) are generated by jOOQ as tables without a tenant column; they read the signed binding themselves
    # (TableClasses.verify, INV-ADR-3968 item 4a).
    platform-scoped-tables:
      - masterdata.write_installation_setting
      - masterdata.config_purge_tenant
      - masterdata.shedlock                         # JobSchema.platformScopedTables("masterdata")
      - masterdata.job_retention
  masterdata:
    job-scheduling.enabled: true                    # INV-Q-16793 A: fire the registered jobs on their cron; the boundary tests set it false
