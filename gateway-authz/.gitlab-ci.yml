# .gitlab-ci.yml — gateway-authz (INV-T-4056, INV-ADR-4051).
#
# platform-build's shared CI templates (ci/README.md), as every Kotlin service repository: build, unit tests, lint,
# Semgrep and Trivy; then, because IMAGE_NAME is set, the service-image pipeline of ci/image.gitlab-ci.yml:
# bootBuildImage (STK-53), SBOM, image scan, Cosign signature and SLSA provenance (STK-31), publish to the LAN Nexus
# registry and, on main, the reproducibility rebuild (STK-72). No job is overridden here: the shared templates carry
# the Nexus registry steps (CI-FAST 2026-10-22, the local copies had gone stale).
include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'   # always first: stages, workflow rules, shared variables
      - 'ci/build.gitlab-ci.yml'    # compile, unit tests, lint, Semgrep, Trivy, verification-metadata check
      - 'ci/image.gitlab-ci.yml'    # bootBuildImage, SBOM, image scan, sign, provenance, reproducibility
      - 'ci/publish.gitlab-ci.yml'  # OCI image publish

variables:
  IMAGE_NAME: "gateway-authz"
