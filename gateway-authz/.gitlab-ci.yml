# .gitlab-ci.yml — gateway-authz (INV-T-4056, INV-ADR-4051).
#
# platform-build's shared CI templates (ci/README.md), as every Kotlin repository: build, unit tests, lint, Semgrep
# and Trivy; then, because IMAGE_NAME is set, the service-image pipeline of ci/image.gitlab-ci.yml: bootBuildImage
# (STK-53), the Syft CycloneDX SBOM, the Trivy image scan, the Cosign signature and SLSA provenance (STK-31) and, on
# main, the reproducibility rebuild (STK-72); the release tag publishes from main only (ci/publish.gitlab-ci.yml). The convention plugins and platform-libs come from their package registries with the
# job token (settings.gradle.kts).

include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'   # always first: stages, workflow rules, shared variables
      - 'ci/build.gitlab-ci.yml'    # compile, unit tests, coverage, lint, Semgrep, Trivy
      - 'ci/image.gitlab-ci.yml'    # bootBuildImage, SBOM, image scan, sign, provenance, reproducibility
      - 'ci/publish.gitlab-ci.yml'  # OCI image publish (main only)

variables:
  IMAGE_NAME: "gateway-authz"

# ---- Images go to the LAN Nexus Docker registry (owner approval 2026-10-12), not GitLab's container registry ----
# The group CI variables INV_REGISTRY, INV_REGISTRY_USER and INV_REGISTRY_PASSWORD (masked) name it; the account may
# push and pull only under invoice/*. The registry is plain HTTP, so every tool that talks to it runs with its
# insecure-registry flag; the image is pinned by digest after the push. These jobs override the shared templates'
# registry steps only (platform-build ci/image and ci/publish still name $CI_REGISTRY_IMAGE); checks are unchanged.
.inv-registry:
  variables:
    INV_IMAGE_REPO: "${INV_REGISTRY}/invoice/${IMAGE_NAME}"
    REGISTRY_AUTH_FILE: "$CI_PROJECT_DIR/.reg-auth/config.json"   # skopeo

# Registry credentials go into a job-local auth file, never `skopeo login` or `cosign login`: Nexus answers their
# /v2/ ping with 401 for the least-privilege account, while an authenticated push or pull under invoice/* works. The
# file is a Docker config, so skopeo (REGISTRY_AUTH_FILE) and Syft, Trivy and Cosign (DOCKER_CONFIG) all read it; it
# is written with umask 077, never echoed, and removed in after_script.
.inv-registry-auth:
  script:
    - umask 077; mkdir -p "$CI_PROJECT_DIR/.reg-auth"; AUTH=$(printf '%s:%s' "$INV_REGISTRY_USER" "$INV_REGISTRY_PASSWORD" | base64 | tr -d '\n'); printf '{"auths":{"%s":{"auth":"%s"}}}' "$INV_REGISTRY" "$AUTH" > "$CI_PROJECT_DIR/.reg-auth/config.json"; unset AUTH
  after_script:
    - rm -rf "$CI_PROJECT_DIR/.reg-auth"

build-image:
  extends: [.gradle-job, .image-job-rules, .inv-registry]
  before_script:
    - !reference [.gradle-job, before_script]
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io skopeo
  after_script:
    - !reference [.inv-registry-auth, after_script]
  script:
    - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
    - gst_run_if_task_exists bootBuildImage --imageName="${IMAGE_NAME}:${CI_COMMIT_SHA}" --stacktrace
    - test -n "$INV_REGISTRY_PASSWORD" || { echo "INV_REGISTRY_PASSWORD is empty on this ref (protected or unset variable)"; exit 1; }
    - !reference [.inv-registry-auth, script]
    - skopeo copy --dest-tls-verify=false "docker-daemon:${IMAGE_NAME}:${CI_COMMIT_SHA}" "docker://${INV_IMAGE_REPO}:${CI_COMMIT_SHA}"
    - DIGEST=$(skopeo inspect --tls-verify=false --format '{{.Digest}}' "docker://${INV_IMAGE_REPO}:${CI_COMMIT_SHA}")
    - echo "${INV_IMAGE_REPO}@${DIGEST}" > image-digest.txt
    - cat image-digest.txt

.inv-registry-reader:
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.reg-auth"   # Syft, Trivy and Cosign
  before_script:
    - !reference [.inv-registry-auth, script]
  after_script:
    - !reference [.inv-registry-auth, after_script]

# The pinned $SYFT_IMAGE and $COSIGN_IMAGE are distroless (no shell), so a runner cannot execute a job script in them
# (pipeline 18960). As in platform-release: Syft runs as a sibling container from $DOCKER_CLI_IMAGE, with `docker cp`
# in and out, and Cosign is a static binary pinned by version and published SHA-256 (STK-30, STK-31).
.cosign-cli:
  image: "$DOCKER_CLI_IMAGE"
  variables:
    COSIGN_CLI_VERSION: "v3.1.3"   # platform-release's pin
    COSIGN_CLI_SHA256_LINUX_AMD64: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  before_script:
    - apk add --no-cache curl
    - curl -sSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_CLI_VERSION}/cosign-linux-amd64"
    - echo "${COSIGN_CLI_SHA256_LINUX_AMD64}  /usr/local/bin/cosign" | sha256sum -c -
    - chmod +x /usr/local/bin/cosign
    - !reference [.inv-registry-auth, script]

sbom:
  extends: [.image-job-rules, .inv-registry-reader]
  image: "$DOCKER_CLI_IMAGE"
  script:
    - |
      cid="$(docker create --network host -e SYFT_REGISTRY_INSECURE_USE_HTTP=true -e DOCKER_CONFIG=/auth "$SYFT_IMAGE" scan "registry:$(cat image-digest.txt)" -o cyclonedx-json@1.6=/out.json)"
      docker cp "$CI_PROJECT_DIR/.reg-auth" "$cid":/auth
      status=0; docker start -a "$cid" || status=$?
      [ "$status" -ne 0 ] || docker cp "$cid":/out.json ./sbom.cdx.json
      docker rm -f "$cid" >/dev/null
      [ "$status" -eq 0 ]
    - test -s sbom.cdx.json   # STK-31: CycloneDX 1.6, Syft

trivy-image-scan:
  extends: [.image-job-rules, .inv-registry-reader]
  variables:
    TRIVY_INSECURE: "true"
  before_script:
    - apk add --no-cache python3   # the shared template's own step
    - !reference [.inv-registry-auth, script]

sign:
  extends: [.inv-registry-reader, .cosign-cli]
  image: "$DOCKER_CLI_IMAGE"   # the job's own image key outranks extends
  script:
    - echo "$COSIGN_KEY_B64" | base64 -d > /tmp/cosign.key
    - export COSIGN_PASSWORD
    - cosign sign --allow-http-registry --key /tmp/cosign.key --yes "$(cat image-digest.txt)"

slsa-provenance:
  extends: [.inv-registry-reader, .cosign-cli]
  image: "$DOCKER_CLI_IMAGE"   # the job's own image key outranks extends
  script:
    - echo "$COSIGN_KEY_B64" | base64 -d > /tmp/cosign.key
    - export COSIGN_PASSWORD
    - IMAGE_DIGEST_REF=$(cat image-digest.txt)
    - IMAGE_SHA256="${IMAGE_DIGEST_REF#*@sha256:}"
    - IMAGE_REPO="${IMAGE_DIGEST_REF%@*}"
    - |
      cat > provenance.json <<EOF
      {
        "_type": "https://in-toto.io/Statement/v1",
        "subject": [{"name": "$IMAGE_REPO", "digest": {"sha256": "$IMAGE_SHA256"}}],
        "predicateType": "https://slsa.dev/provenance/v1",
        "predicate": {
          "buildDefinition": {
            "buildType": "https://invoice.internal/slsa/gitlab-ci-build@v1",
            "externalParameters": {
              "repository": "$CI_PROJECT_URL",
              "ref": "$CI_COMMIT_REF_NAME",
              "commit": "$CI_COMMIT_SHA"
            },
            "resolvedDependencies": [{"uri": "$CI_PROJECT_URL", "digest": {"gitCommit": "$CI_COMMIT_SHA"}}]
          },
          "runDetails": {
            "builder": {"id": "$CI_SERVER_URL/inv-runner"},
            "metadata": {
              "invocationId": "$CI_PIPELINE_URL",
              "startedOn": "$CI_PIPELINE_CREATED_AT"
            }
          }
        }
      }
      EOF
    - cosign attest --allow-http-registry --key /tmp/cosign.key --yes --type slsaprovenance --predicate provenance.json "$(cat image-digest.txt)"

reproducibility-rebuild:
  extends: [.gradle-job, .inv-registry]
  before_script:
    - !reference [.gradle-job, before_script]
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io skopeo
  after_script:
    - !reference [.inv-registry-auth, after_script]
  script:
    - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
    - gst_run_if_task_exists bootBuildImage --imageName="${IMAGE_NAME}:repro-${CI_COMMIT_SHA}" --stacktrace
    - REBUILD_DIGEST=$(docker inspect --format='{{.Id}}' "${IMAGE_NAME}:repro-${CI_COMMIT_SHA}")
    - !reference [.inv-registry-auth, script]
    - skopeo copy --src-tls-verify=false "docker://$(cat image-digest.txt)" "docker-daemon:${IMAGE_NAME}:original-${CI_COMMIT_SHA}"
    - ORIGINAL_DIGEST=$(docker inspect --format='{{.Id}}' "${IMAGE_NAME}:original-${CI_COMMIT_SHA}")
    - |
      if [ "$REBUILD_DIGEST" != "$ORIGINAL_DIGEST" ]; then
        echo "gst-ci: STK-72 reproducibility check FAILED: $ORIGINAL_DIGEST (original) != $REBUILD_DIGEST (rebuild)"
        exit 1
      fi
      echo "gst-ci: STK-72 reproducibility check passed: $ORIGINAL_DIGEST"
    - docker rmi "${IMAGE_NAME}:repro-${CI_COMMIT_SHA}" "${IMAGE_NAME}:original-${CI_COMMIT_SHA}" || true

oci-image-publish:
  extends: [.inv-registry]
  image: "$GRADLE_IMAGE"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends skopeo
  after_script:
    - !reference [.inv-registry-auth, after_script]
  script:
    - !reference [.inv-registry-auth, script]
    - RELEASE_TAG="${CI_COMMIT_TAG:-edge}"   # a release train tag, or "edge" for the latest merged main (never "latest" pre-1.0)
    - skopeo copy --src-tls-verify=false --dest-tls-verify=false "docker://$(cat image-digest.txt)" "docker://${INV_IMAGE_REPO}:${RELEASE_TAG}"
