  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    ApprovedScheme:
      type: object
      description: One approved scheme status item (INV-REQ-2433); `scheme` is a scenario-pack value, so not an enum.
      properties:
        scheme: { type: string, maxLength: 20 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        evidenceRef: { type: string, maxLength: 256 }
      required: [scheme, effectiveFrom]
    Reachability:
      type: object
      description: Directory reachability of the counterparty (INV-REQ-319).
      properties:
        onNetwork: { type: boolean }
        degradationCode:
          type: string
          pattern: '^[A-Z]{2,10}-[0-9]{3}$'
          description: MDM-008 when the directory or SMP could not be reached and no cache served (INV-REQ-318 b2, INV-REQ-319 b2).
      required: [onNetwork]
    GapReport:
      type: object
      description: The pre-go-live gap report (INV-REQ-316).
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              counterpartyRef: { type: string, maxLength: 40 }
              findingClass:
                type: string
                enum: [UEN_ABSENT, UEN_INVALID, GST_REGISTER_CONFLICT, ADDRESS_INCOMPLETE, DUPLICATE_UEN]
                x-extensible-enum: true
              errorCode:
                type: string
                pattern: '^[A-Z]{2,10}-[0-9]{3}$'
                description: MDM-002, MDM-003, MDM-007, MDM-006 for the first four classes; absent for DUPLICATE_UEN.
            required: [counterpartyRef, findingClass]
        notChecked:
          type: array
          items:
            type: object
            properties:
              counterpartyRef: { type: string, maxLength: 40 }
              reason:
                type: string
                enum: [REGISTER_UNAVAILABLE]
                x-extensible-enum: true
            required: [counterpartyRef, reason]
      required: [rows, notChecked]
    GapReportStatus:
      type: object
      description: Status resource of runGapReport (API-17); also the 202 body, with state RUNNING.
      properties:
        gapReportId: { type: string, maxLength: 40 }
        state:
          $ref: '#/components/schemas/OperationState'
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, description: Present when state is not RUNNING. }
        result:
          $ref: '#/components/schemas/GapReport'
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required: [gapReportId, state, startedAt]
    CreateConnectionRequest:
      type: object
      description: The service assigns `connectionRef`; it is never a request property.
      properties:
        externalService:
          type: string
          enum: [DIRECTORY, CHECK_GST_REGISTER, RATE_SOURCE]
          x-extensible-enum: true
        endpoint: { type: string, format: uri, maxLength: 512 }
        credentialRef: { type: string, maxLength: 100, description: 'The secret-store key, never the secret.' }
        environmentTag:
          type: string
          enum: [PRODUCTION, SANDBOX]
          x-extensible-enum: true
        ownerService: { type: string, maxLength: 40 }
      required: [externalService, endpoint, credentialRef, environmentTag, ownerService]
    ConnectionRecord:
      type: object
      properties:
        connectionRef: { type: string, maxLength: 40, readOnly: true, description: Assigned by the service. }
        externalService:
          type: string
          enum: [DIRECTORY, CHECK_GST_REGISTER, RATE_SOURCE]
          x-extensible-enum: true
        endpoint: { type: string, format: uri, maxLength: 512 }
        credentialRef: { type: string, maxLength: 100, description: 'The secret-store key, never the secret.' }
        environmentTag:
          type: string
          enum: [PRODUCTION, SANDBOX]
          x-extensible-enum: true
        ownerService: { type: string, maxLength: 40 }
      required: [connectionRef, externalService, endpoint, credentialRef, environmentTag, ownerService]
    RotateConnectionCredentialRequest:
      type: object
      description: The replacement credential is already held in the secret store; only its reference is carried, never the secret.
      properties:
        credentialRef: { type: string, maxLength: 100 }
      required: [credentialRef]
    ConnectionTestResult:
      type: object
      properties:
        connectionRef: { type: string, maxLength: 40 }
        classification:
          type: string
          enum: [SUCCESS, UNREACHABLE, AUTHENTICATION_REFUSED, UNEXPECTED_RESPONSE]
          x-extensible-enum: true
        detail:
          type: string
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_-]{1,31}$'
          description: A code only, never free text (INV-Q-2944); absent on SUCCESS.
        checkedAt: { type: string, format: date-time }
      required: [connectionRef, classification, checkedAt]
    SendCounterpartyRequestBody:
      type: object
      properties:
        contactEmail: { type: string, format: email, maxLength: 254 }
        contactMobile: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
      required: [contactEmail]
    ResolutionResult:
      type: object
      properties:
        identityTriple:
          $ref: '#/components/schemas/IdentityTripleFacts'
        counterparty:
          $ref: '#/components/schemas/Counterparty'
        sameGroup: { type: boolean }
        sameTenant: { type: boolean }
        arcsGstChargeAgreed: { type: boolean }
        approvedSchemes:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedScheme'
        reachability:
          $ref: '#/components/schemas/Reachability'
      required: [identityTriple]
    IdentityTripleFacts:
      type: object
      properties:
        senderId: { type: string, maxLength: 64 }
        supplierId: { type: string, maxLength: 64 }
        supplierGstn: { type: string, maxLength: 20 }
      required: [senderId, supplierId, supplierGstn]
    IdentityTriple:
      allOf:
        - $ref: '#/components/schemas/IdentityTripleFacts'
        - type: object
          properties:
            entityRef: { type: string, maxLength: 40 }
            effectiveFrom: { type: string, format: date }
          required: [entityRef, effectiveFrom]
    ConfigureIdentityTripleRequest:
      type: object
      properties:
        senderId: { type: string, maxLength: 64 }
        supplierId: { type: string, maxLength: 64 }
        supplierGstn: { type: string, maxLength: 20 }
        effectiveFrom: { type: string, format: date }
        secondConfirmation:
          deprecated: true
          description: >-
            Deprecated and not accepted: the confirmation is a separate call
            (`confirmIdentityTripleChange`) by a different person, and a body
            carrying this property is refused 400 SRT-001.
          allOf:
            - $ref: '#/components/schemas/SecondConfirmation'
      required: [senderId, supplierId, supplierGstn, effectiveFrom]
    SecondConfirmation:
      type: object
      properties:
        identityRef: { type: string, maxLength: 64 }
        role:
          type: string
          maxLength: 64
          description: 'One of entity.admin, tenant.admin or tax.approver (VP-09) — never the same person as the requester.'
      required: [identityRef, role]
    PendingIdentityTripleChange:
      type: object
      properties:
        changeRef: { type: string, maxLength: 40 }
        entityRef: { type: string, maxLength: 40 }
        senderId: { type: string, maxLength: 64 }
        supplierId: { type: string, maxLength: 64 }
        supplierGstn: { type: string, maxLength: 20 }
        effectiveFrom: { type: string, format: date }
        state:
          type: string
          enum: [PENDING_CONFIRMATION]
        proposedBy:
          type: string
          maxLength: 64
          description: The identity reference of the proposer.
      required: [changeRef, entityRef, senderId, supplierId, supplierGstn, effectiveFrom, state, proposedBy]
    Counterparty:
      type: object
      properties:
        partyRef: { type: string, maxLength: 40 }
        resolvedIdentifiers:
          type: array
          items:
            type: object
            properties:
              scheme: { type: string, maxLength: 20 }
              value: { type: string, maxLength: 64 }
            required: [scheme, value]
        providedBy:
          type: string
          enum: [COUNTERPARTY, INTERNAL, MIGRATED]
          x-extensible-enum: true
        sameGroup: { type: boolean }
        sameTenant: { type: boolean }
        arcsGstChargeAgreed: { type: boolean }
        approvedSchemes:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedScheme'
      required: [partyRef, resolvedIdentifiers, providedBy]
    ResolveCounterpartyRequest:
      type: object
      properties:
        resolvedIdentifiers:
          type: array
          items:
            type: object
            properties:
              scheme: { type: string, maxLength: 20 }
              value: { type: string, maxLength: 64 }
            required: [scheme, value]
        evidenceRef: { type: string, maxLength: 64 }
        arcsGstChargeAgreed: { type: boolean }
        approvedSchemes:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedScheme'
      required: [resolvedIdentifiers, evidenceRef]
    BulkResolveRequest:
      type: object
      properties:
        errorCode: { type: string, pattern: '^[A-Z]{2,10}-[0-9]{3}$' }
        docUuids:
          type: array
          maxItems: 5000
          description: >-
            At most 5,000 documents per call (API-49, INV-Q-3482); a larger
            request is refused with `413`.
          items: { type: string, format: uuid }
        resolvedIdentifiers:
          type: array
          items:
            type: object
            properties:
              scheme: { type: string, maxLength: 20 }
              value: { type: string, maxLength: 64 }
            required: [scheme, value]
        evidenceRef: { type: string, maxLength: 64 }
      required: [errorCode, docUuids, resolvedIdentifiers, evidenceRef]
    BulkResolveResult:
      type: object
      properties:
        resolvedCount: { type: integer, minimum: 0 }
        unchangedCount: { type: integer, minimum: 0 }
      required: [resolvedCount, unchangedCount]
    CounterpartyRequest:
      type: object
      properties:
        requestId: { type: string, maxLength: 40 }
        counterpartyRef: { type: string, maxLength: 40 }
        status:
          type: string
          enum: [SENT, ANSWERED, EXPIRED, INVALIDATED]
          x-extensible-enum: true
        contactEmail: { type: string, format: email, maxLength: 254 }
        contactMobile: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        expiresAt: { type: string, format: date-time }
      required: [requestId, counterpartyRef, status]
    SubmitCounterpartyDetailsRequest:
      type: object
      properties:
        uen: { type: string, maxLength: 20 }
        legalName: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
      required: [uen, legalName, address]
    ImportCounterpartiesRequest:
      type: object
      properties:
        fileHash: { type: string, maxLength: 128 }
        rowCount: { type: integer, minimum: 0 }
        dryRunId:
          type: string
          maxLength: 40
          description: >-
            The reviewed counterparty import dry run (INV-Q-3442 A); unknown,
            not SUCCEEDED or for another fileHash is refused 422 with MDM-009
            (INV-Q-3749). Optional
            only to keep the change additive (API-03).
      required: [fileHash, rowCount]
    CounterpartyDryRunRequest:
      type: object
      description: The dry run's input, as ImportCounterpartiesRequest names it (INV-Q-3466 A).
      properties:
        fileHash: { type: string, maxLength: 128 }
        rowCount: { type: integer, minimum: 0 }
      required: [fileHash, rowCount]
    RejectedRow:
      type: object
      description: One rejected file row, in the API-20 error item shape plus its row number.
      properties:
        row: { type: integer, minimum: 1 }
        code: { type: string, pattern: '^[A-Z]{2,10}-[0-9]{3}$' }
        field: { type: string, maxLength: 200, description: A JSON Pointer or column name (FR-AG.41). }
        message: { type: string, maxLength: 500 }
      required: [row, code, message]
    CounterpartyDryRunRejectedRow:
      type: object
      description: A row the dry run rejects, as RejectedRow with the code limited to the four dry-run checks (INV-Q-3466 A).
      properties:
        row: { type: integer, minimum: 1 }
        code:
          type: string
          pattern: '^MDM-00[2346]$'
          description: MDM-002 (UEN absent), MDM-003 (UEN format), MDM-004 (NA consistency, C-7) or MDM-006 (address incomplete).
        field: { type: string, maxLength: 200, description: A JSON Pointer or column name (FR-AG.41). }
        message: { type: string, maxLength: 500 }
      required: [row, code, message]
    CounterpartyDryRunResult:
      type: object
      description: >-
        Counterparty import dry run result (INV-Q-3466 A; INV-REQ-830 b2),
        mirroring rules DryRunResult: counts plus per-item old and new values.
      properties:
        dryRunId: { type: string, maxLength: 40 }
        fileHash: { type: string, maxLength: 128 }
        rowCount: { type: integer, minimum: 0 }
        validCount: { type: integer, minimum: 0 }
        rejectedRows:
          type: array
          items:
            $ref: '#/components/schemas/CounterpartyDryRunRejectedRow'
        duplicates:
          type: array
          items:
            type: object
            properties:
              uen: { type: string, maxLength: 20 }
              rows:
                type: array
                items: { type: integer, minimum: 1 }
              existingCounterpartyRef: { type: string, maxLength: 40 }
            required: [uen, rows]
        preview:
          type: object
          properties:
            createCount: { type: integer, minimum: 0 }
            updateCount: { type: integer, minimum: 0 }
            unchangedCount: { type: integer, minimum: 0 }
            changes:
              type: array
              items:
                type: object
                properties:
                  uen: { type: string, maxLength: 20 }
                  counterpartyRef: { type: string, maxLength: 40 }
                  field: { type: string, maxLength: 64 }
                  oldValue: { type: string, maxLength: 500 }
                  newValue: { type: string, maxLength: 500 }
                required: [uen, field, newValue]
          required: [createCount, updateCount, unchangedCount, changes]
      required: [dryRunId, fileHash, rowCount, validCount, rejectedRows, duplicates, preview]
    CounterpartyDryRunStatus:
      type: object
      description: >-
        Status resource of dryRunCounterpartyImport (API-17, INV-Q-3466 A);
        also the 202 body, with state RUNNING.
      properties:
        dryRunId: { type: string, maxLength: 40 }
        state:
          $ref: '#/components/schemas/OperationState'
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, description: Present when state is not RUNNING. }
        result:
          $ref: '#/components/schemas/CounterpartyDryRunResult'
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required: [dryRunId, state, startedAt]
    ImportRecord:
      type: object
      description: >-
        The FR-AG.57 import record (INV-REQ-833, INV-AC-1882) and the status
        resource of importCounterparties and importRates (API-17,
        INV-Q-3466 A); also their 202 body, with state RUNNING.
      properties:
        importId: { type: string, maxLength: 40 }
        importKind:
          type: string
          enum: [COUNTERPARTIES, RATES]
          x-extensible-enum: true
        state:
          $ref: '#/components/schemas/OperationState'
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, description: Present when state is not RUNNING. }
        actorRef: { type: string, maxLength: 64, description: 'The importing principal; the server fills it from the token.' }
        fileHash: { type: string, maxLength: 128, description: Counterparty imports only. }
        dryRunId: { type: string, maxLength: 40, description: Counterparty imports only; the reviewed dry run. }
        source: { type: string, maxLength: 40, description: Rate imports only. }
        dateRange:
          type: object
          description: Rate imports only.
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
          required: [from, to]
        result:
          $ref: '#/components/schemas/ImportResult'
        rejectedRows:
          type: array
          items:
            $ref: '#/components/schemas/RejectedRow'
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required: [importId, importKind, state, startedAt, actorRef]
    OperationState:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]
      x-extensible-enum: true
      description: API-17's operation-resource state vocabulary.
    ErrorEnvelope:
      description: The API-20 error envelope, carried in a status resource's `error` when its state is FAILED (API-17).
      $ref: '../service-runtime/schemas/error-envelope.schema.json'
    ImportResult:
      type: object
      properties:
        importId: { type: string, maxLength: 40 }
        appliedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
      required: [importId, appliedCount, failedCount]
    ImportRatesRequest:
      type: object
      properties:
        source: { type: string, maxLength: 40 }
        dateRange:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
          required: [from, to]
        currencyPairs:
          type: array
          items: { type: string, maxLength: 10 }
      required: [source, dateRange, currencyPairs]
    EnterRateRequest:
      type: object
      properties:
        currency: { type: string, maxLength: 3 }
        date: { type: string, format: date }
        source: { type: string, maxLength: 40 }
        rate:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,8})?$'
          description: Exchange rate as a decimal string, up to 8 places (API-12).
        evidenceRef: { type: string, maxLength: 64 }
      required: [currency, date, source, rate, evidenceRef]
    ExchangeRate:
      type: object
      properties:
        currency: { type: string, maxLength: 3 }
        date: { type: string, format: date }
        source: { type: string, maxLength: 40 }
        rate:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,8})?$'
          description: Exchange rate as a decimal string, up to 8 places (API-12).
        provenance:
          $ref: '#/components/schemas/RateProvenance'
      required: [currency, date, source, rate]
    RateProvenance:
      type: object
      description: >-
        How the rate was loaded (INV-REQ-512): kind IMPORT carries the
        `importId` of the ImportRecord that loaded it, kind MANUAL the
        `evidenceRef` given to `enterRate`.
      properties:
        kind:
          type: string
          enum: [MANUAL, IMPORT]
          x-extensible-enum: true
        loadedAt: { type: string, format: date-time }
        importId: { type: string, maxLength: 40 }
        evidenceRef: { type: string, maxLength: 64 }
      required: [kind, loadedAt]
    RegisterAndRateResult:
      type: object
      properties:
        register:
          type: object
          properties:
            status:
              type: string
              enum: [REGISTERED, NOT_REGISTERED, REGISTER_UNAVAILABLE]
              x-extensible-enum: true
            asOf: { type: string, format: date }
          required: [status]
        rate:
          $ref: '#/components/schemas/ExchangeRate'
      required: [register]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
