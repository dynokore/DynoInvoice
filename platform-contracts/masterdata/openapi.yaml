openapi: 3.1.0
info:
  title: masterdata API
  version: 1.4.0
  description: >-
    Contract-first source of truth for masterdata (API-01, STK-44). The
    `masterdata-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07). Replaces the INV-T-2849 scaffold
    (INV-T-2901, T13b).


    Internal API only (API standard §1 and §15): masterdata-svc owns no
    resource in the §15 public catalogue, so every operation below is
    `/internal/v1/…`, never routed by the gateway. Two read operations serve
    the synchronous edges of model/architecture/sync-edges.yaml
    (`canonical-svc -> masterdata-svc`, `payload-svc -> masterdata-svc`); the
    rest are the remediation, import and request commands services.yaml's
    masterdata-svc entry lists under `provides`, reached only through
    console-bff on a person's behalf (API-25 — the callee re-checks writes);
    `submitCounterpartyDetails` is also reached through console-bff, which
    serves the signed-link page (§34.9) the `counterparty` actor opens and
    calls it. The gap report (INV-REQ-316) and the connection records
    (INV-REQ-834, INV-REQ-835) are added by INV-T-4912; counterparty-list
    and directory-lookup reads stay out of this file's declared scope.
  contact:
    name: masterdata (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: resolution
    description: Identity-triple and counterparty resolution for canonical-svc (FR-1.1–1.3, §4.3.2).
  - name: register-and-rates
    description: Register facts and exchange rates for payload-svc validation (AD-23).
  - name: identity-triples
    description: The entity's own Sender ID, Supplier ID and Supplier GSTN (§5.1).
  - name: remediation
    description: Resolving a held or gap-flagged counterparty (§31.2.1, MDM-001).
  - name: counterparty-requests
    description: Self-service requests to a counterparty for its own details (§34.9).
  - name: import
    description: Bulk counterparty and exchange-rate import (§35.10, §35.2).
  - name: gap-report
    description: Pre-go-live gap report over the counterparty masters (INV-REQ-316).
  - name: connections
    description: Connection records of the directory, the Check GST Register and the rate sources (INV-REQ-834, INV-REQ-835).
paths:
  /internal/v1/masterdata/counterparties/resolution:
    get:
      operationId: resolveCounterparty
      summary: Resolve an entity's identity triple and a counterparty's identifiers, by constitution
      description: >-
        The resolution API to canonical-svc (services.yaml masterdata-svc
        `provides`; sync-edges.yaml `canonical-svc -> masterdata-svc`,
        "needed to complete the record; cached, fast"). Resolves the
        entity's identity triple by constitution (FR-1.1–1.3) and the
        counterparty's identifiers and approved-scheme status with
        provenance (FR-1.5, FR-1.14, FR-1.15). A resolution gap follows the
        hold pattern (§4.3.2, MDM-001) rather than blocking the caller.
        Never validates counterparty-supplied data as a precondition
        (masterdata-svc `must_not`).
      tags: [resolution]
      x-principal: ingest
      x-timeout: 300
      x-sync-edge: canonical-svc->masterdata-svc
      x-error-codes: [MDM-001, MDM-002, MDM-005, MDM-007]
      x-requirements: [FR-1.1, FR-1.2, FR-1.3, FR-1.5, FR-1.14, FR-1.15]
      parameters:
        - name: entityRef
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: constitution
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: partyScheme
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
        - name: partyValue
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: transactionDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: The identity triple and, where a party was given, the counterparty's resolved facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionResult'
              examples:
                default:
                  value:
                    identityTriple: { senderId: "0195:201912345A", supplierId: "0195:201912345A", supplierGstn: "201912345A" }
                    counterparty: { partyRef: "CTP-118", resolvedIdentifiers: [{ scheme: "UEN", value: "201954321B" }], providedBy: "INTERNAL" }
        '422':
          description: "MDM-005 - no identity triple is configured for the entity's constitution; nothing is changed"
          content:
            application/problem+json:
              schema:
                $ref: ../service-runtime/schemas/error-envelope.schema.json
              examples:
                default:
                  value:
                    type: https://errors.invoice.internal/MDM-005
                    title: No identity triple configured for the constitution
                    status: 422
                    code: MDM-005
                    severity: BLOCK
                    disposition: MANUAL
                    remediationOwner: Onboarding
                    errors:
                      - { code: "MDM-005", field: "/constitution", message: "No identity triple is configured for constitution PTE_LTD of entity E-001" }
                    correlationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/register-and-rates:
    get:
      operationId: getRegisterAndRates
      summary: Look up register facts and the exchange rate for a transaction
      description: >-
        The register-fact and rate lookup API to payload-svc
        (services.yaml masterdata-svc `provides`; sync-edges.yaml
        `payload-svc -> masterdata-svc`, "register facts and approved rates
        for validation", AD-23). masterdata-svc is the sole client of the IRAS
        Check GST Register and of the exchange-rate sources (AD-23); it
        returns facts, and never decides whether a GST charge is wrongful —
        that rule belongs to payload-svc (masterdata-svc `must_not`). A
        register outage returns REGISTER_UNAVAILABLE rather than blocking
        issuance (FR-E.7); a missing rate is reported and left for
        payload-svc to hold (PAY-013).
      tags: [register-and-rates]
      x-principal: ingest
      x-timeout: 1000
      x-sync-edge: payload-svc->masterdata-svc
      x-error-codes: [MDM-007]
      x-requirements: [FR-E.7, FR-E.8, FR-E.9, "AD-23"]
      parameters:
        - name: counterpartyUen
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
        - name: currency
          in: query
          required: true
          schema: { type: string, maxLength: 3 }
        - name: transactionDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: The register facts and, where the currency is not SGD, the elected-source exchange rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAndRateResult'
              examples:
                default:
                  value:
                    register: { status: "REGISTERED", asOf: "2026-03-19" }
                    rate: { currency: "USD", date: "2026-03-20", source: "MAS", rate: "1.35800000", provenance: { kind: "IMPORT", loadedAt: "2026-03-20T01:00:00Z", importId: "IMP-204" } }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/entities/{entityRef}/identity-triple:
    post:
      operationId: configureIdentityTriple
      summary: Set an entity's Sender ID, Supplier ID and Supplier GSTN
      description: >-
        Remediation command to console-bff (services.yaml masterdata-svc
        `provides`; identity triples belong to masterdata-svc, SDS §5.1;
        VP-09). Effective-dated; a wrong identity triple is not correctable
        by resubmission alone (FR-AC.15) — the remedy is a correction
        effective from the original date plus reprocessing and resubmission
        under the same Doc UUIDs. The call only proposes the change: it
        answers 202 with a pending change, and `confirmIdentityTripleChange`
        confirms it. The confirmation is always a separate call by another
        `entity.admin` or `tenant.admin`, or a `tax.approver`, never the
        proposer and never a sole-operator path (FR-AC.16, VP-09, FR-AB.13).
        Until then the previous triple stays in force. A body carrying
        `secondConfirmation` is refused 400 SRT-001.
      tags: [identity-triples]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: [MDM-005]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-1.1, FR-1.2, FR-AC.15, FR-AC.16, "VP-09"]
      x-operation:
        role: entity.admin
        scope: entity
        precondition: "Constitution known. The call proposes the change; confirmIdentityTripleChange confirms it by another entity.admin/tenant.admin or a tax.approver (FR-AC.16, VP-09)."
        reversibility: UNDOABLE
        repeatKey: "(entityRef, effectiveFrom) — a repeat replaces the same effective-dated change."
      parameters:
        - name: entityRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureIdentityTripleRequest'
            examples:
              default:
                value:
                  senderId: "0195:201912345A"
                  supplierId: "0195:201912345A"
                  supplierGstn: "201912345A"
                  effectiveFrom: "2026-04-01"
      responses:
        '200':
          description: The identity triple, effective from the given date. Kept declared for compatibility; a proposal answers 202.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTriple'
              examples:
                default:
                  value: { entityRef: "E-001", senderId: "0195:201912345A", supplierId: "0195:201912345A", supplierGstn: "201912345A", effectiveFrom: "2026-04-01" }
        '202':
          description: The change is proposed and pending confirmation; the previous triple stays in force until a different person confirms it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingIdentityTripleChange'
              examples:
                default:
                  value: { changeRef: "ITC-0007", entityRef: "E-001", senderId: "0195:201912345A", supplierId: "0195:201912345A", supplierGstn: "201912345A", effectiveFrom: "2026-04-01", state: "PENDING_CONFIRMATION", proposedBy: "IDN-0031" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/entities/{entityRef}/identity-triple/changes/{changeRef}/confirmation:
    post:
      operationId: confirmIdentityTripleChange
      summary: Confirm a pending identity triple change as a different person
      description: >-
        Remediation command to console-bff (INV-REQ-1007, INV-REQ-1270).
        Confirms the change proposed by `configureIdentityTriple`; the
        confirmer is the authenticated subject of the call, never a body
        field. The triple takes effect from its stated date only after this
        call; documents resolved meanwhile carry the previous triple.
      tags: [identity-triples]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1007, INV-REQ-1270]
      x-operation:
        role: entity.admin
        scope: entity
        precondition: "The change is PENDING_CONFIRMATION and the caller is another entity.admin/tenant.admin or a tax.approver, never the proposer (INV-REQ-1007, INV-REQ-1270)."
        reversibility: UNDOABLE
        repeatKey: "(entityRef, changeRef) - a repeat after the first confirmation is refused 409."
      parameters:
        - name: entityRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: changeRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The identity triple, confirmed; it applies from its effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTriple'
              examples:
                default:
                  value: { entityRef: "E-001", senderId: "0195:201912345A", supplierId: "0195:201912345A", supplierGstn: "201912345A", effectiveFrom: "2026-04-01" }
        '403':
          description: >-
            SRT-004 - the confirmer is the proposer, the same identity under
            another role, or not in the confirmer set; the change stays pending.
          content:
            application/problem+json:
              schema:
                $ref: ../service-runtime/schemas/error-envelope.schema.json
        '404':
          description: SRT-005 - unknown changeRef of that entity.
          content:
            application/problem+json:
              schema:
                $ref: ../service-runtime/schemas/error-envelope.schema.json
        '409':
          description: SRT-008 - the change is no longer PENDING_CONFIRMATION (already confirmed or superseded).
          content:
            application/problem+json:
              schema:
                $ref: ../service-runtime/schemas/error-envelope.schema.json
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/counterparties/{counterpartyRef}/resolution:
    post:
      operationId: resolveMasterDataGap
      summary: Resolve one counterparty's held master-data gap
      description: >-
        Remediation command to console-bff (services.yaml masterdata-svc
        `provides`; §31.2.1, MDM-001). Writes the counterparty identifier
        with provenance, emits `MasterDataResolved`, and releases every
        document held on it (§31.2.1). Also covers editing an approved
        scheme status or an ARCS written-agreement flag, each with evidence
        (FR-1.14, FR-1.15).
      tags: [remediation]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: [MDM-001, MDM-002, MDM-003, MDM-004, MDM-006]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-1.5, FR-1.14, FR-1.15, "MDM-001"]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: "Document HELD with MDM-001, or a gap-report entry for this counterparty (§31.2.1)."
        reversibility: UNDOABLE
        repeatKey: "counterpartyRef — a repeat replaces the same resolution before submission."
      parameters:
        - name: counterpartyRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCounterpartyRequest'
            examples:
              default:
                value:
                  resolvedIdentifiers: [{ scheme: "UEN", value: "201954321B" }]
                  evidenceRef: "EVD-2201"
      responses:
        '200':
          description: The counterparty, resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
              examples:
                default:
                  value: { partyRef: "CTP-118", resolvedIdentifiers: [{ scheme: "UEN", value: "201954321B" }], providedBy: "INTERNAL" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/counterparties/bulk-resolution:
    post:
      operationId: bulkResolveCounterparty
      summary: Resolve one master-data gap across every document in a group sharing it
      description: >-
        Remediation command to console-bff (services.yaml masterdata-svc
        `provides`; SCR-02.2, FR-AC.3). Applies the same resolution across
        the group. console-bff's own call to submission-svc's boundary
        query (FR-AC.3) — not this operation — refuses the bulk action, or
        narrows it to unsubmitted members, if any member has reached SENT or
        beyond.


        One call carries at most 5,000 documents (`docUuids` maxItems 5000,
        API-49; INV-REQ-941 b8, INV-Q-3482), which covers a group of 2,000
        in one operation (INV-AC-1973). A request over the cap is refused
        with `413` (API-20 envelope) and changes nothing.
      tags: [remediation]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: [MDM-001, MDM-002, MDM-003, MDM-004, MDM-006]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AC.3, FR-AC.14]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: "A group of documents sharing one error code; none SENT or beyond (FR-AC.3, checked by submission-svc's boundary query)."
        reversibility: UNDOABLE
        repeatKey: "operation id — the second call reports no change (INV-REQ-1010 behaviour #4)."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkResolveRequest'
            examples:
              default:
                value:
                  errorCode: "MDM-001"
                  docUuids: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                  resolvedIdentifiers: [{ scheme: "UEN", value: "201954321B" }]
                  evidenceRef: "EVD-2201"
      responses:
        '200':
          description: The group's resolution outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResolveResult'
              examples:
                default:
                  value: { resolvedCount: 4, unchangedCount: 0 }
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/counterparties/{counterpartyRef}/requests:
    post:
      operationId: sendCounterpartyRequest
      summary: Send a counterparty a signed request link for its own details
      description: >-
        Request command to console-bff (services.yaml masterdata-svc
        `provides`; SCR-02.5, §34.9, FR-AF.23). From a gap-report group, asks
        the counterparty to confirm its UEN, legal name and address, and to
        attach a supporting document (FR-AF.23). Emits `SignedLinkRequested`;
        the link itself is issued by access-svc on that event, never by a
        direct call (DR-11).
      tags: [counterparty-requests]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AF.23]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: "The counterparty has a master-data gap (FR-AF.23)."
        reversibility: UNDOABLE
        repeatKey: "(counterpartyRef, openRequest) — a repeat returns the existing open request."
      parameters:
        - name: counterpartyRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCounterpartyRequestBody'
            examples:
              default:
                value: { contactEmail: "ap@example.com.sg", contactMobile: "+6591234567" }
      responses:
        '201':
          description: The pending counterparty request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyRequest'
              examples:
                default:
                  value: { requestId: "REQ-77", counterpartyRef: "CTP-118", status: "SENT" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/counterparty-requests/{requestId}/submission:
    post:
      operationId: submitCounterpartyDetails
      summary: A counterparty submits its own details through a valid signed link
      description: >-
        Request command. The `counterparty` actor opens its signed link on
        the page console-bff serves, and console-bff calls this operation
        (services.yaml masterdata-svc `provides`, console-bff `provides` the
        signed-link pages; SCR-35.2, FR-AF.24). Values are stored with
        `providedBy = COUNTERPARTY` and the evidence reference (FR-1.5,
        FR-AF.24) and flow through `MasterDataResolved`, which auto-releases
        held documents.
      tags: [counterparty-requests]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: [MDM-002, MDM-003, MDM-006]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AF.24, FR-1.5]
      x-operation:
        role: "The counterparty holding the signed link"
        scope: entity
        precondition: "A valid, unexpired signed link (FR-AF.24)."
        reversibility: COMPENSABLE
        repeatKey: "requestId — the operator corrects a later submission with provenance."
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCounterpartyDetailsRequest'
            examples:
              default:
                value: { uen: "201954321B", legalName: "Acme Trading Pte Ltd", address: "1 Raffles Place, Singapore" }
      responses:
        '200':
          description: The counterparty's details, stored with provenance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counterparty'
              examples:
                default:
                  value: { partyRef: "CTP-118", resolvedIdentifiers: [{ scheme: "UEN", value: "201954321B" }], providedBy: "COUNTERPARTY" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/masterdata/counterparties/import:
    post:
      operationId: importCounterparties
      summary: Import counterparties from a dry-run-reviewed file
      description: >-
        Import command to console-bff (services.yaml masterdata-svc
        `provides`; SCR-19.3, §35.10, FR-R.12). Values are applied with
        provenance and emit `MasterDataResolved`; migrated data is marked
        `MIGRATED`, never `COUNTERPARTY`-provided, because its evidentiary
        standing differs (FR-R.12, FR-1.5).


        The request names the reviewed dry run in `dryRunId`
        (`dryRunCounterpartyImport`, INV-Q-3442 A, INV-REQ-830 b2); a
        `dryRunId` that is unknown, not SUCCEEDED or for another `fileHash`
        is refused `422` with MDM-009 and nothing is recorded
        (INV-Q-3466 A, INV-Q-3749). `dryRunId` is optional in the schema only so that
        this change stays additive (API-03).


        Long command (INV-Q-3438 A, INV-Q-3466 A, API-17): an import
        finished within x-timeout returns `201` with `ImportResult`; one that
        is not returns `202` with `Location` and `Retry-After` pointing at
        its FR-AG.57 import record, `getImportRecord`
        (`/internal/v1/masterdata/imports/{importId}`, INV-REQ-833), and the
        `ImportRecord` body with state RUNNING. A repeat with the same
        Idempotency-Key replays the stored `202` (API-15).
      tags: [import]
      x-principal: filing-workflow
      x-sync-edge: console-bff->masterdata-svc
      x-timeout: 2000
      x-error-codes: [MDM-002, MDM-003, MDM-006, MDM-009]
      x-requirements: [INV-REQ-957, INV-REQ-1010, "§35.10", FR-R.12]
      x-operation:
        role: tax.operator
        scope: tenant
        precondition: "The import's dry run (dryRunCounterpartyImport) has SUCCEEDED for the same fileHash and has been reviewed; its dryRunId is named in the request (INV-REQ-830 b2, INV-Q-3442 A)."
        reversibility: UNDOABLE
        repeatKey: "fileHash — undoable before any affected document submits."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCounterpartiesRequest'
            examples:
              default:
                value: { fileHash: "sha256:1a2b3c4d5e6f708192a3b4c5d6e7f809", rowCount: 240, dryRunId: "CDR-12" }
      responses:
        '201':
          description: The import's outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
              examples:
                default:
                  value: { importId: "IMP-30", appliedCount: 238, failedCount: 2 }
        '202':
          description: >-
            The work did not finish within x-timeout and continues
            asynchronously (API-17, INV-Q-3438 A); poll the status resource.
          headers:
            Location:
              schema: { type: string }
              description: '`/internal/v1/masterdata/imports/{importId}` (API-17).'
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before polling the status resource (API-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRecord'
              examples:
                default:
