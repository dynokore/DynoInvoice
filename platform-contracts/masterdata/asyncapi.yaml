asyncapi: 3.1.0
info:
  title: masterdata events
  version: 1.3.0
  description: >-
    Every event masterdata produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added masterdata's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: masterdata (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  masterdataMasterDataResolved:
    address: 'gst.masterdata.master-data-resolved.v1'
    messages:
      MasterDataResolved:
        $ref: '#/components/messages/MasterDataResolved'

  masterdataReferenceRateLoaded:
    address: 'gst.masterdata.reference-rate-loaded.v1'
    messages:
      ReferenceRateLoaded:
        $ref: '#/components/messages/ReferenceRateLoaded'

  masterdataSignedLinkRequested:
    address: 'gst.masterdata.signed-link-requested.v1'
    messages:
      SignedLinkRequested:
        $ref: '#/components/messages/SignedLinkRequested'
  masterdataIdentityTripleCorrected:
    address: 'gst.masterdata.identity-triple-corrected.v1'
    messages:
      IdentityTripleCorrected:
        $ref: '#/components/messages/IdentityTripleCorrected'
  masterdataIdentityTripleChanged:
    address: 'gst.masterdata.identity-triple-changed.v1'
    messages:
      IdentityTripleChanged:
        $ref: '#/components/messages/IdentityTripleChanged'
  accessSignedLinkIssued:
    address: 'gst.access.signed-link-issued.v1'
    messages:
      SignedLinkIssued:
        $ref: '#/components/messages/SignedLinkIssued'
  accessSignedLinkInvalidated:
    address: 'gst.access.signed-link-invalidated.v1'
    messages:
      SignedLinkInvalidated:
        $ref: '#/components/messages/SignedLinkInvalidated'
  masterdataExampleHappened:
    address: 'gst.masterdata.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishMasterDataResolved:
    action: send
    description: MasterDataResolved — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/masterdataMasterDataResolved'
    messages:
      - $ref: '#/channels/masterdataMasterDataResolved/messages/MasterDataResolved'

  publishReferenceRateLoaded:
    action: send
    description: ReferenceRateLoaded — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/masterdataReferenceRateLoaded'
    messages:
      - $ref: '#/channels/masterdataReferenceRateLoaded/messages/ReferenceRateLoaded'

  publishSignedLinkRequested:
    action: send
    description: SignedLinkRequested — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/masterdataSignedLinkRequested'
    messages:
      - $ref: '#/channels/masterdataSignedLinkRequested/messages/SignedLinkRequested'
  publishIdentityTripleCorrected:
    action: send
    description: IdentityTripleCorrected — published when a confirmed identity triple correction takes effect (INV-REQ-1006).
    channel:
      $ref: '#/channels/masterdataIdentityTripleCorrected'
    messages:
      - $ref: '#/channels/masterdataIdentityTripleCorrected/messages/IdentityTripleCorrected'
  publishIdentityTripleChanged:
    action: send
    description: IdentityTripleChanged — published in the transaction of every confirmed identity triple change (INV-REQ-1135).
    channel:
      $ref: '#/channels/masterdataIdentityTripleChanged'
    messages:
      - $ref: '#/channels/masterdataIdentityTripleChanged/messages/IdentityTripleChanged'
  receiveSignedLinkIssued:
    action: receive
    description: >-
      SignedLinkIssued, published by access-svc (INV-REQ-901, FR-AF.23). masterdata-svc binds the linkRef to the
      request named by subjectReference. Idempotent consumer (at-least-once delivery): a repeated or reordered
      event leaves the binding equal; an event whose subjectReference names no request is ignored, and a
      SignedLinkIssued that arrives after the SignedLinkInvalidated of the same linkRef does not reopen the link.
    channel:
      $ref: '#/channels/accessSignedLinkIssued'
    messages:
      - $ref: '#/channels/accessSignedLinkIssued/messages/SignedLinkIssued'
  receiveSignedLinkInvalidated:
    action: receive
    description: >-
      SignedLinkInvalidated, published by access-svc (INV-REQ-901, FR-AF.23). masterdata-svc marks the link of
      the request named by subjectReference as no longer usable. Idempotent consumer (at-least-once delivery): a
      repeated or reordered event leaves the binding equal.
    channel:
      $ref: '#/channels/accessSignedLinkInvalidated'
    messages:
      - $ref: '#/channels/accessSignedLinkInvalidated/messages/SignedLinkInvalidated'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/masterdataExampleHappened'
    messages:
      - $ref: '#/channels/masterdataExampleHappened/messages/ExampleHappened'
components:
  messages:
    MasterDataResolved:
      name: com.dynokore.gst.masterdata.MasterDataResolved.v1
      title: MasterDataResolved
      summary: MasterDataResolved — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event MasterDataResolved (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: masterdata-svc. Consumed by: canonical-svc. Delivery: At-least-once.
        Payload (catalogue text): partyRef, resolved identifiers. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/master-data-resolved-payload.schema.json'

    ReferenceRateLoaded:
      name: com.dynokore.gst.masterdata.ReferenceRateLoaded.v1
      title: ReferenceRateLoaded
      summary: ReferenceRateLoaded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ReferenceRateLoaded (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: masterdata-svc. Consumed by: payload-svc. Delivery: At-least-once.
        Payload (catalogue text): source, currency pairs, date range. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/reference-rate-loaded-payload.schema.json'

    SignedLinkRequested:
      name: com.dynokore.gst.masterdata.SignedLinkRequested.v1
      title: SignedLinkRequested
      summary: SignedLinkRequested — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event SignedLinkRequested (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: masterdata-svc. Consumed by: access-svc. Delivery: At-least-once.
        Payload (catalogue text): purpose, subject reference, recipient (e-mail, optional mobile number),
        expiry. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/signed-link-requested-payload.schema.json'
    IdentityTripleCorrected:
      name: com.dynokore.gst.masterdata.IdentityTripleCorrected.v1
      title: IdentityTripleCorrected
      summary: IdentityTripleCorrected — a confirmed identity triple correction took effect (INV-REQ-1006).
      description: >-
        Domain event IdentityTripleCorrected (INV-REQ-1006, INV-AC-7823; owner answer INV-Q-7876 option A).
        Emitted by: masterdata-svc. Consumed by: submission-svc. Delivery: At-least-once.
        Payload: entityRef, constitution, effectiveFrom, changeRef, accessPointEscalation.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/identity-triple-corrected-payload.schema.json'
    IdentityTripleChanged:
      name: com.dynokore.gst.masterdata.IdentityTripleChanged.v1
      title: IdentityTripleChanged
      summary: IdentityTripleChanged — a confirmed identity triple change took effect (INV-REQ-1135).
      description: >-
        Domain event IdentityTripleChanged (INV-REQ-1135, INV-AC-16047; ruling INV-Q-16401 option A).
        Emitted by: masterdata-svc. Consumed by: tenancy-svc. Delivery: At-least-once.
        Payload: entityRef, constitution, effectiveFrom, changeRef.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/identity-triple-changed-payload.schema.json'
    SignedLinkIssued:
      name: com.dynokore.gst.access.SignedLinkIssued.v1
      title: SignedLinkIssued
      summary: SignedLinkIssued — access-svc issued the signed link for a request of masterdata (INV-REQ-901).
      description: >-
        Event SignedLinkIssued of access-svc (access/asyncapi.yaml), consumed by masterdata-svc (INV-REQ-901, FR-AF.23).
        Delivery: At-least-once.
      contentType: application/cloudevents+json
      payload:
        $ref: '../access/schemas/signed-link-issued-payload.schema.json'
    SignedLinkInvalidated:
      name: com.dynokore.gst.access.SignedLinkInvalidated.v1
      title: SignedLinkInvalidated
      summary: SignedLinkInvalidated — a signed link stopped being usable before its expiry (INV-REQ-901).
      description: >-
        Event SignedLinkInvalidated of access-svc (access/asyncapi.yaml), consumed by masterdata-svc (INV-REQ-901, FR-AF.23).
        Delivery: At-least-once.
      contentType: application/cloudevents+json
      payload:
        $ref: '../access/schemas/signed-link-invalidated-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.masterdata.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
