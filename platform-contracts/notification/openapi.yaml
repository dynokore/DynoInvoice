components:
  parameters:
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EscalationTier:
      type: object
      properties:
        tier:
          type: integer
          minimum: 1
        afterMinutes:
          type: integer
          minimum: 0
        daysToDue:
          type: integer
          minimum: -366
          maximum: 366
          description: Days to the due date at which the tier applies; a negative value is days after the due date (INV-REQ-1113).
      required: [tier, afterMinutes]
    AlertPolicyRequest:
      type: object
      properties:
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 100
        channels:
          type: array
          items:
            type: string
            enum: [EMAIL, SMS, WEBHOOK, CHAT_WEBHOOK]
            x-extensible-enum: true
        escalationTiers:
          type: array
          description: >-
            A tier not acknowledged by its `afterMinutes` escalates to the
            next tier (INV-AC-104).
          items:
            $ref: '#/components/schemas/EscalationTier'
        thresholdDays:
          type: integer
          minimum: 0
          maximum: 365
          description: >-
            First-alert days before the due date, for the class DEADLINE only.
            More days before the due date is tighter; a value smaller than the
            calendar-pack default is refused (POL-008).
        soleOperatorAcknowledgement:
          type: boolean
          description: Recorded when fewer than two recipients are named (FR-AE.69).
        accountablePerson:
          type: string
          minLength: 1
          maxLength: 100
          description: The accountable person the acknowledgement names; required when `soleOperatorAcknowledgement` is true (INV-Q-6745).
        acknowledgementEffectiveFrom:
          type: string
          format: date
          description: The date the acknowledgement takes effect; not before the business date (INV-Q-6745).
      required: [recipients, channels]
    AlertPolicy:
      type: object
      properties:
        entityRef:
          type: string
        alertClass:
          type: string
          enum: [COVERAGE, DEADLINE, BACKLOG, MISSING_ACKNOWLEDGEMENT, PACK_STALENESS, SECURITY]
          x-extensible-enum: true
        recipients:
          type: array
          items:
            type: string
        channels:
          type: array
          items:
            type: string
            enum: [EMAIL, SMS, WEBHOOK, CHAT_WEBHOOK]
            x-extensible-enum: true
        escalationTiers:
          type: array
          description: >-
            A tier not acknowledged by its `afterMinutes` escalates to the
            next tier (INV-AC-104).
          items:
            $ref: '#/components/schemas/EscalationTier'
        thresholdDays:
          type: integer
          minimum: 0
          maximum: 365
          description: >-
            First-alert days before the due date, for the class DEADLINE only.
            More days before the due date is tighter; a value smaller than
            `calendarPackDefaultDays` is refused (INV-AC-203). Held separately
            for monthly and quarterly filers (INV-AC-109).
        calendarPackDefaultDays:
          type: integer
          minimum: 0
          maximum: 365
          readOnly: true
          description: The default first-alert days of the entity's filing frequency, from the calendar pack (INV-REQ-1117).
        soleOperatorAcknowledgement:
          type: boolean
          description: Sent, with the four properties that follow, while a sole-operator acknowledgement is recorded, and none of the five otherwise (INV-REQ-1115).
        accountablePerson:
          type: string
          description: The accountable person the acknowledgement names; sent with the other four acknowledgement properties or not at all.
        acknowledgementEffectiveFrom:
          type: string
          format: date
          description: The date the acknowledgement takes effect; sent with the other four acknowledgement properties or not at all.
        acknowledgementRecordedBy:
          type: string
          description: The verified caller identity that recorded the acknowledgement, never a request field; sent with the other four acknowledgement properties or not at all.
        acknowledgementRecordedAt:
          type: string
          format: date-time
          description: When the acknowledgement was recorded; sent with the other four acknowledgement properties or not at all.
        updatedAt:
          type: string
          format: date-time
      required: [entityRef, alertClass, recipients, channels, updatedAt]
    Alert:
      type: object
      description: >-
        After a bounce of the only recipient of a DEADLINE alert that is not
        acknowledged, the service raises `currentTier` by one when the policy
        has a next tier (INV-AC-1872); in every other case the tier does not
        move.
      properties:
        alertId:
          type: string
          format: uuid
        entityRef:
          type: string
          description: >-
            The alert of a whole tenant, such as a privacy notice, holds the
            reserved tenant-wide reference
            `00000000-0000-0000-0000-000000000000`. The alert of accreditation
            currency concerns the product and no tenant and holds the reserved
            platform reference `ffffffff-ffff-ffff-ffff-ffffffffffff`. A
            break-glass alert holds the tenant-wide reference whatever the
            scope of the event, TENANT or INSTALLATION (INV-Q-8966).
        alertClass:
          type: string
          enum: [COVERAGE, DEADLINE, BACKLOG, MISSING_ACKNOWLEDGEMENT, PACK_STALENESS, SECURITY, ACCREDITATION]
          x-extensible-enum: true
          description: >-
            For the class ACCREDITATION no entity holds a policy; its alert
            goes to the holders of `release.manager` by e-mail, every
            recipient at once, without tiers; it is read and acknowledged
            through `listPlatformAlerts` and `acknowledgePlatformAlert` only
            (INV-Q-7316, INV-REQ-1365).
        state:
          type: string
          enum: [RAISED, ACKNOWLEDGED, SNOOZED]
          x-extensible-enum: true
        raisedAt:
          type: string
          format: date-time
        trigger:
          type: string
          enum: [DUE_DATE_THRESHOLD, READINESS_CHECK_INVOKED, RETURN_FIGURES_UPLOADED, PAST_DUE, FILING_FACT_NOT_RECORDED, PRIVACY_NOTICE_DUE, ACCREDITATION_LAPSED, REASSESSMENT_NEEDED, BREAK_GLASS_USED, COVERAGE_GAP]
          x-extensible-enum: true
        caseId:
          type: string
          format: uuid
          description: >-
            The privacy request case of the evidence contract
            (`PrivacyCase.caseId`); sent exactly when `trigger` is
            PRIVACY_NOTICE_DUE (INV-REQ-1403).
        alertRef:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The `alertRef` of the event `AccreditationAlertRaised`; sent
            exactly when `alertClass` is ACCREDITATION, one alert per
            `alertRef` (INV-REQ-1365).
        taskRef:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The `taskRef` of the event `AccreditationAlertRaised`; sent
            exactly when `alertClass` is ACCREDITATION (INV-REQ-1365).
        currentTier:
          type: integer
          minimum: 1
        periodRef:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
        snoozedUntil:
          type: string
          format: date-time
          description: Sent only in the state SNOOZED (INV-REQ-1114).
        bounced:
          type: boolean
          description: >-
            Always sent by the service; true while at least one delivery of
            the alert is in the state BOUNCED. An alert shows its bounce with
            the alert (INV-REQ-819 behavior 3).
      required: [alertId, entityRef, alertClass, state, raisedAt]
    SnoozeAlertRequest:
      type: object
      properties:
        snoozeUntil:
          type: string
          format: date-time
          description: Until when the alert is snoozed; bounded as the operation `snoozeAlert` describes (INV-REQ-1114).
      required: [snoozeUntil]
    AlertPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          type: string
      required: [items]
    CreateWebhookSubscriptionRequest:
      type: object
      properties:
        entityRef:
          type: string
          maxLength: 40
        entityRefs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 40
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          description: >-
            Event names: document.acknowledged, document.rejected,
            document.held, document.blocked, period.readiness_changed
            (INV-REQ-820). The 1.0.0 names stay accepted.
          items:
            type: string
            maxLength: 60
      required: [url, events]
      allOf:
        - not:
            required: [entityRef, entityRefs]
        - not:
            allOf:
              - not:
                  required: [entityRef]
              - not:
                  required: [entityRefs]
      description: >-
        Exactly one of `entityRef` and `entityRefs`. An event of an entity
        outside the subscription's list is not delivered (INV-AC-2038).
    WebhookSubscription:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
        entityRef:
          type: string
          description: >-
            For a subscription created with `entityRefs`, the first element of
            `entityRefs` in the order given at creation; otherwise the value
            given at creation.
        entityRefs:
          description: The full list; one value for a subscription created with `entityRef`.
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 40
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED, PAUSED]
          x-extensible-enum: true
        createdAt:
          type: string
          format: date-time
      required: [subscriptionId, entityRef, entityRefs, url, events, status, createdAt]
    WebhookSubscriptionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        nextCursor:
          type: string
      required: [items]
    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              type: string
              description: The signing secret, returned once on creation only.
          required: [secret]
    SecretRotation:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
        secret:
          type: string
        rotatedAt:
          type: string
          format: date-time
        previousSecretValidUntil:
          type: string
          format: date-time
          description: Both the previous and the new secret verify until this instant.
      required: [subscriptionId, secret, rotatedAt]
    RotateWebhookSecretRequest:
      type: object
      properties:
        overlapMinutes:
          type: integer
          minimum: 1
          description: Minutes both secrets verify; absent takes the notification service's configured overlap.
    WebhookDelivery:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        event:
          type: string
        state:
          type: string
          enum: [PENDING, DELIVERED, RETRYING, DEAD_LETTERED]
          x-extensible-enum: true
        attempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
        responseCode:
          type: integer
          minimum: 100
          maximum: 599
        isTest:
          type: boolean
      required: [deliveryId, subscriptionId, event, state, attempts]
    WebhookPayload:
      type: object
      description: >-
        The signed body of a webhook delivery. Signed with HMAC under the
        subscription's secret over the payload and its timestamp; a replay
        carries the same `eventId`. Identifiers and states only, never
        invoice content (INV-AC-839, INV-AC-1873).
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        event:
          type: string
          maxLength: 60
        entityRef:
          type: string
          maxLength: 40
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        acknowledgementId:
          type: string
        periodRef:
          type: string
        state:
          type: string
      required: [eventId, timestamp, event, entityRef]
    AlertPolicyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertPolicy'
        nextCursor:
          type: string
      required: [items]
    WebhookDeliveryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        nextCursor:
          type: string
      required: [items]
    MessageDelivery:
      type: object
      description: >-
        The service sends `templateVersion` and `recipient` always,
        `bouncedAt` only in the state BOUNCED and `failureReason` only in the
        states BOUNCED and FAILED. A FAILED delivery is a failed hand-over to
        the channel and no bounce.
      properties:
        messageId:
          type: string
          format: uuid
        entityRef:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS]
          x-extensible-enum: true
        template:
          type: string
        state:
          type: string
          enum: [QUEUED, SENT, DELIVERED, BOUNCED, FAILED]
          x-extensible-enum: true
        sentAt:
          type: string
          format: date-time
        templateVersion:
          type: string
          minLength: 1
          maxLength: 40
        recipient:
          type: string
          maxLength: 100
          description: The recipient reference as written in the alert policy, never an address.
        alertId:
          type: string
          format: uuid
          description: The alert the message carried, absent for a message that carried none.
        bouncedAt:
          type: string
          format: date-time
        failureReason:
          type: string
          maxLength: 200
          description: Never invoice content.
      required: [messageId, entityRef, channel, template, state]
    MessageDeliveryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageDelivery'
        nextCursor:
          type: string
      required: [items]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
