openapi: 3.1.0
info:
  title: notification API
  version: 1.14.0
  description: >-
    Contract-first source of truth for notification (API-01, STK-44). The
    `notification-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Internal API only (API standard §1): notification-svc has no public,
    gateway-routed surface — it is absent from 04-api-standards.md §15's
    resource catalogue entirely. Every operation below is `/internal/v1/…`,
    reached only by console-bff (services.yaml notification-svc
    `provides`), covered by sync-edges.yaml's generic `console-bff -> any`
    policy edge ("console reads", INV-T-2902, T14b). Alert instances and
    passcode messages are never created through this API: they arrive by
    event consumption (`AccessAlertRaised`, `MessageRequested` and the rest
    of services.yaml notification-svc `consumes`), which this file's scope
    does not cover (asyncapi.yaml does).


    Scope note for the reviewer: services.yaml's notification-svc
    `provides` text — "Policy, subscription and webhook commands, and
    delivery-status queries, to console-bff" — maps to this file's
    operations as follows: "Policy … commands" is `setAlertPolicy` /
    `listAlertPolicies`; "subscription … commands" is
    `createWebhookSubscription`, `rotateWebhookSecret` and
    `deleteWebhookSubscription`; "webhook commands" is `replayWebhookDelivery`;
    "delivery-status queries" is `listWebhookDeliveries` and
    `listMessageDeliveries`. Alert-instance listing and acknowledgement are
    `listAlerts`, `acknowledgeAlert` and `snoozeAlert` (INV-REQ-79,
    INV-REQ-1113, INV-REQ-1114). No
    catalogue error code exists yet under a NOT- prefix
    (model/architecture/error-codes.yaml has no such prefix) — every
    operation below declares `x-error-codes: []`; also flagged as an
    architecture gap.


    Version 1.6.0 adds the operation `snoozeAlert` and the state SNOOZED
    (INV-Q-6747), and the sole-operator acknowledgement properties of the
    alert policy, `accountablePerson` and `acknowledgementEffectiveFrom`
    among them (INV-Q-6745).


    Message delivery records carry the template version, the recipient
    reference, the alert, the bounce and the failure, and an alert shows its
    bounce (INV-Q-6749, INV-REQ-819).


    Version 1.9.0 adds the alert class ACCREDITATION, the triggers
    ACCREDITATION_LAPSED and REASSESSMENT_NEEDED, and the operations
    `listPlatformAlerts` and `acknowledgePlatformAlert`, which read and
    acknowledge the platform alerts of accreditation currency (INV-Q-7316,
    INV-REQ-1365).


    Version 1.13.0 adds the alert trigger BREAK_GLASS_USED, the contract name
    of the alert of a break-glass use, an alert of the class SECURITY
    (INV-Q-8966, INV-REQ-897).


    Version 1.14.0 adds the alert trigger COVERAGE_GAP, the contract name of
    the coverage alert, an alert of the class COVERAGE (INV-Q-12767,
    INV-REQ-1069).
  contact:
    name: notification (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: policies
    description: Alert policies per entity and class, with escalation tiers (§33.13, FR-AE.67).
  - name: alerts
    description: Alert instances, their acknowledgement and their bounded snooze (INV-REQ-79, INV-REQ-1113, INV-REQ-1114).
  - name: webhooks
    description: Customer webhook subscriptions, signing, retries, dead-letter and replay (§35.6).
  - name: deliveries
    description: Message and webhook delivery-status queries (§35.6).
paths:
  /internal/v1/notification/entities/{entityRef}/alert-policies/{alertClass}:
    put:
      operationId: setAlertPolicy
      summary: Set an entity's alert policy for one alert class
      description: >-
        Policy commands (services.yaml notification-svc `provides`).
        Each entity has an alert policy per alert class — coverage,
        deadline, backlog, missing acknowledgement, pack staleness,
        security — naming recipients, channels and escalation tiers
        (FR-AE.67, INV-REQ-1113). Deadline and coverage alerts can be
        rerouted but never disabled (FR-AE.68, INV-REQ-1114); default
        thresholds may be tightened but never loosened (FR-AE.71,
        INV-REQ-1117). Every policy needs at least two recipients, or a
        recorded sole-operator acknowledgement (FR-AE.69, INV-REQ-1115).
        Also permitted for `security.officer` (INV-NOTE-7 §7 SCR-20.1);
        `x-operation.role` is a single string today, so only the primary
        actor is declared here — the multi-role format is tracked
        separately by the coordinator.


        Deadline thresholds: `thresholdDays` is the first-alert number of days
        before the due date, meaningful for the class DEADLINE only. More days
        before the due date is tighter. A `thresholdDays` smaller than the
        policy's `calendarPackDefaultDays` is looser and is refused with
        POL-008 (INV-AC-203: a tighter threshold is accepted, a looser one
        refused); a value equal to or larger is accepted. Thresholds of monthly
        and quarterly filers are held separately, each from its own filing
        frequency's default (INV-AC-109).


        Refusals, each a 422 with the API-20 envelope: POL-008 for a looser
        threshold; POL-015 for a request that disables the class DEADLINE or
        COVERAGE, which can be rerouted to other recipients or channels but
        never disabled (INV-AC-103, INV-AC-185); POL-013 for escalation tiers
        on the class SECURITY, which reaches every recipient at once without
        tiers (INV-AC-2384), and the same for ACC-004, which goes to the link's
        sender only.


        Recipients and the sole-operator acknowledgement (INV-Q-6745, INV-AC-2115):
        a blank entry of `recipients` is refused with POL-013; fewer than two
        distinct recipients without `soleOperatorAcknowledgement` true is
        refused with POL-014; `soleOperatorAcknowledgement` true without
        `accountablePerson` is refused with POL-013; an
        `acknowledgementEffectiveFrom` before the business date is refused with
        POL-022. The service records the author from the verified caller
        identity, never from the request, and sends the five acknowledgement
        properties of `AlertPolicy` while an acknowledgement is recorded and
        none otherwise.


        Disabling (INV-Q-6747, INV-AC-103, INV-AC-185): an empty `channels`
        list on the class DEADLINE or COVERAGE disables the class and is
        refused with POL-015; an empty `channels` list on the other four
        classes (BACKLOG, MISSING_ACKNOWLEDGEMENT, PACK_STALENESS, SECURITY)
        is accepted.
      tags: [policies]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: [POL-008, POL-013, POL-014, POL-015, POL-022]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-1113, INV-REQ-1114, INV-REQ-1115, INV-REQ-1117]
      x-operation:
        role: tenant.admin
        scope: entity
        precondition: >-
          For the DEADLINE and COVERAGE classes, the policy is not disabled
          (FR-AE.68); recipients number at least two, or a sole-operator
          acknowledgement is recorded (FR-AE.69); a threshold is not looser
          than the calendar-pack default (FR-AE.71).
        reversibility: COMPENSABLE
        repeatKey: "(entityRef, alertClass) — a repeat with the same body reports the existing policy, unchanged."
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: alertClass
          in: path
          required: true
          schema:
            type: string
            enum: [COVERAGE, DEADLINE, BACKLOG, MISSING_ACKNOWLEDGEMENT, PACK_STALENESS, SECURITY]
            x-extensible-enum: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertPolicyRequest'
            examples:
              default:
                value:
                  recipients: ["tax.approver:jane.tan", "operator:desk-1"]
                  channels: ["EMAIL"]
                  escalationTiers:
                    - tier: 1
                      afterMinutes: 0
                    - tier: 2
                      afterMinutes: 1440
      responses:
        '200':
          description: The alert policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicy'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    alertClass: "DEADLINE"
                    recipients: ["tax.approver:jane.tan", "operator:desk-1"]
                    channels: ["EMAIL"]
                    escalationTiers:
                      - tier: 1
                        afterMinutes: 0
                      - tier: 2
                        afterMinutes: 1440
                    updatedAt: "2026-04-01T02:00:00Z"
        '422':
          description: >-
            Refused with the API-20 envelope: POL-008 (threshold looser than
            the calendar-pack default), POL-015 (an empty `channels` list on
            the class DEADLINE or COVERAGE, which disables the class), POL-013
            (escalation tiers on the class SECURITY or on ACC-004, a blank
            entry of `recipients`, or `soleOperatorAcknowledgement` true
            without `accountablePerson`), POL-014 (fewer than two distinct
            recipients without `soleOperatorAcknowledgement` true) or POL-022
            (`acknowledgementEffectiveFrom` before the business date).
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                looserThreshold:
                  value:
                    type: "about:blank"
                    title: "Threshold looser than the calendar-pack default"
                    status: 422
                    code: "POL-008"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/entities/{entityRef}/alert-policies:
    get:
      operationId: listAlertPolicies
      summary: List an entity's alert policies, one per class
      description: >-
        Policy commands' read side (services.yaml notification-svc
        `provides`, "Policy … commands"); FR-AE.67. Pages by cursor (API-18,
        INV-REQ-826): `limit` defaults to 100 and is at most 500 (a larger
        value is refused with 400); `cursor` is opaque and integrity-protected,
        bound to the principal, filters and sort that produced it, and valid
        for at least 24 hours (another filter, another principal or an expired
        cursor is refused with 400); the order is total, the documented sort
        is `alertClass` ascending and `alertClass` is the identifier that
        breaks ties (one policy per class per entity); `nextCursor` is omitted
        on the last page; there is no offset and no total count.
      tags: [policies]
      x-principal: reporting
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1113]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of the entity's alert policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPolicyPage'
              examples:
                default:
                  value:
                    items:
                      - entityRef: "E-001"
                        alertClass: "DEADLINE"
                        recipients: ["tax.approver:jane.tan", "operator:desk-1"]
                        channels: ["EMAIL"]
                        escalationTiers:
                          - tier: 1
                            afterMinutes: 0
                        updatedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/entities/{entityRef}/alerts:
    get:
      operationId: listAlerts
      summary: List an entity's alerts, with state
      description: >-
        Alert instances raised by event consumption (INV-REQ-79,
        INV-REQ-1113). Filter by `alertClass` and `state`. A filing prompt is
        an alert of the class DEADLINE with the trigger
        FILING_FACT_NOT_RECORDED, raised when the period first becomes ready
        and on the configured days before the due date (INV-REQ-918,
        INV-REQ-1277). A privacy notice is an alert of the class SECURITY with
        the trigger PRIVACY_NOTICE_DUE, raised once per case when the notice
        falls due, without tiers (INV-REQ-1403, INV-REQ-1113). A break-glass
        use is an alert of the class SECURITY with the trigger
        BREAK_GLASS_USED, raised once for each event `BreakGlassAlertRaised`,
        without tiers (INV-REQ-897, INV-AC-2384). A coverage alert is an
        alert of the class COVERAGE with the trigger COVERAGE_GAP, raised when
        `ComplianceAlertValuesMeasured` reports documents without submission
        for an entity and period (INV-REQ-1069).
      tags: [alerts]
      x-principal: reporting
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-79, INV-REQ-1113]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: alertClass
          in: query
          required: false
          schema:
            type: string
            enum: [COVERAGE, DEADLINE, BACKLOG, MISSING_ACKNOWLEDGEMENT, PACK_STALENESS, SECURITY]
            x-extensible-enum: true
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [RAISED, ACKNOWLEDGED, SNOOZED]
            x-extensible-enum: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              examples:
                default:
                  value:
                    items:
                      - alertId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "E-001"
                        alertClass: "DEADLINE"
                        state: "RAISED"
                        raisedAt: "2026-04-22T00:00:00Z"
                        trigger: "DUE_DATE_THRESHOLD"
                        currentTier: 1
                        periodRef: "2026-Q1"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/entities/{entityRef}/alerts/{alertId}/acknowledgements:
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      description: >-
        Records the acknowledgement of one alert; an acknowledged alert is not
        escalated further (INV-REQ-79, INV-REQ-1113). A repeat reports the
        recorded acknowledgement unchanged.
      tags: [alerts]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-79, INV-REQ-1113]
      x-operation:
        role: tax.approver
        scope: entity
        precondition: The alert exists for the entity and is in the state RAISED, SNOOZED or already ACKNOWLEDGED (a repeat reports the recorded acknowledgement; an acknowledgement ends a snooze).
        reversibility: IRREVERSIBLE
        repeatKey: "alertId — a repeat reports the recorded acknowledgement unchanged."
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The alert, acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
              examples:
                default:
                  value:
                    alertId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    alertClass: "DEADLINE"
                    state: "ACKNOWLEDGED"
                    raisedAt: "2026-04-22T00:00:00Z"
                    acknowledgedAt: "2026-04-23T01:00:00Z"
                    acknowledgedBy: "tax.approver:jane.tan"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/platform/alerts:
    get:
      operationId: listPlatformAlerts
      summary: List the platform alerts of accreditation currency
      description: >-
        Read: the alerts of the class ACCREDITATION, which concern the product
        and no tenant (INV-Q-7316, INV-REQ-1365, INV-REQ-1113). Readable by
        `release.manager` at platform scope. Filter by `state`. The order is
        `raisedAt` descending, then `alertId` ascending. `nextCursor` is
        omitted on the last page. A `limit` outside 1 to 500, or a cursor from
        another query, is refused with 400. An alert of an entity is never
        listed here (`listAlerts` lists those).
      tags: [alerts]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1365, INV-REQ-1113]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [RAISED, ACKNOWLEDGED]
            x-extensible-enum: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of platform alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
              examples:
                default:
                  value:
                    items:
                      - alertId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "ffffffff-ffff-ffff-ffff-ffffffffffff"
                        alertClass: "ACCREDITATION"
                        state: "RAISED"
                        raisedAt: "2026-10-19T00:00:00Z"
                        trigger: "ACCREDITATION_LAPSED"
                        alertRef: "accreditation-lapsed-2026-10"
                        taskRef: "TASK-2026-0042"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/platform/alerts/{alertId}/acknowledgements:
    post:
      operationId: acknowledgePlatformAlert
      summary: Acknowledge a platform alert of accreditation currency
      description: >-
        Records the acknowledgement of one alert of the class ACCREDITATION
        (INV-Q-7316, INV-REQ-1365, INV-REQ-1113). A repeat reports the
        recorded acknowledgement unchanged. An `alertId` that is not an alert
        of the class ACCREDITATION is refused with 404. The acknowledgement
        does not conclude the tracked task (`concludeAccreditationTask` of
        control-plane does).
      tags: [alerts]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1365, INV-REQ-1113]
      x-operation:
        role: release.manager
        scope: platform
        precondition: The alert exists, has the class ACCREDITATION and is in the state RAISED or already ACKNOWLEDGED (a repeat reports the recorded acknowledgement).
        reversibility: IRREVERSIBLE
        repeatKey: "alertId — a repeat reports the recorded acknowledgement unchanged."
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The alert, acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
              examples:
                default:
                  value:
                    alertId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "ffffffff-ffff-ffff-ffff-ffffffffffff"
                    alertClass: "ACCREDITATION"
                    state: "ACKNOWLEDGED"
                    raisedAt: "2026-10-19T00:00:00Z"
                    trigger: "ACCREDITATION_LAPSED"
                    alertRef: "accreditation-lapsed-2026-10"
                    taskRef: "TASK-2026-0042"
                    acknowledgedAt: "2026-10-19T01:00:00Z"
                    acknowledgedBy: "release.manager:jane.tan"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/entities/{entityRef}/alerts/{alertId}/snoozes:
    post:
      operationId: snoozeAlert
      summary: Snooze an alert until a bounded time
      description: >-
        Snoozes one alert until `snoozeUntil`; a snoozed alert is not escalated
        before `snoozedUntil` (INV-REQ-79, INV-REQ-1113, INV-REQ-1114). A
        repeat with the same `snoozeUntil` reports the alert unchanged.


        Bounds (INV-Q-6747, INV-AC-2114), each a 422 with the API-20 envelope
        and POL-013: `snoozeUntil` not after the request time; `snoozeUntil`
        later than the request time plus 7 days; for the classes DEADLINE and
        COVERAGE, `snoozeUntil` later than the due date of the alert's period
        minus the safety margin (INV-REQ-1279). A bound itself is accepted.
        When the hard stop of a DEADLINE or COVERAGE alert cannot be
        determined, the snooze is refused with POL-014.
      tags: [alerts]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->notification-svc
      x-timeout: 2000
      x-error-codes: [POL-013, POL-014]
      x-requirements: [INV-REQ-79, INV-REQ-1113, INV-REQ-1114]
      x-operation:
        role: any human role named as a recipient of the alert's policy (INV-NOTE-7 SCR-00.6)
        scope: entity
        precondition: The alert exists for the entity and is in the state RAISED or SNOOZED (a snooze of a snoozed alert replaces its time).
        reversibility: COMPENSABLE
        repeatKey: "(alertId, snoozeUntil) — a repeat reports the alert unchanged."
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnoozeAlertRequest'
            examples:
              default:
                value:
                  snoozeUntil: "2026-04-24T00:00:00Z"
      responses:
        '200':
          description: The alert, snoozed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
              examples:
                default:
                  value:
                    alertId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    alertClass: "DEADLINE"
                    state: "SNOOZED"
                    raisedAt: "2026-04-22T00:00:00Z"
                    snoozedUntil: "2026-04-24T00:00:00Z"
        '422':
          description: >-
            Refused with the API-20 envelope: POL-013 (`snoozeUntil` not in the
            future, later than 7 days, or, for DEADLINE and COVERAGE, later than
            the due date minus the safety margin) or POL-014 (the hard stop
            cannot be determined).
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                beyondMargin:
                  value:
                    type: "about:blank"
                    title: "Snooze past the due date minus the safety margin"
                    status: 422
                    code: "POL-013"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/notification/webhook-subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: Create a customer webhook subscription
      description: >-
        Subscription commands (services.yaml notification-svc `provides`).
        Customer webhooks: subscription, signing, retries, dead-letter,
        replay, secret rotation (§35.6). The signing secret is generated by
        notification-svc and returned once; it is never echoed by any later
        read.


        Events (INV-REQ-820): the event names are `document.acknowledged`,
        `document.rejected`, `document.held`, `document.blocked` and
        `period.readiness_changed`; the 1.0.0 names stay accepted. A
        subscription names its entities with `entityRef` (one) or `entityRefs`
        (a list), exactly one of the two; an event of an entity outside the
        subscription's list is not delivered (INV-AC-2038).


        Payload (INV-REQ-821): each delivery body is a `WebhookPayload`. It is
        signed with HMAC under the subscription's secret over the payload and
        its timestamp; a replay carries the same `eventId`; the payload
        carries identifiers and states and never invoice content (INV-AC-839,
        INV-AC-1873).


        Private form: deliveries go only to endpoints on the installation's
        egress allow-list; a connection to any other endpoint is never opened
        (INV-AC-2670). The list is an installation setting, not an operation
        of this contract.


        An `entityRef` outside the principal's entity set is refused with
        `403` and the code SRT-004 before the handler runs (API-24), and so is
        each element of `entityRefs` outside the principal's entity set; a
        request without `entityRef` or without `entityRefs` is the service's
        own concern.
      tags: [webhooks]
      x-principal: filing-workflow
      x-caller-auth: end-user
