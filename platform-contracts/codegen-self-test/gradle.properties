# gradle.properties — INV-T-2850 follow-up.
#
# ~70 small generated modules (openapi-generator + a one/two-class Kotlin compile
# each): parallel and cached, with a bounded heap/worker count so this stays fast
# without repeating the inv-runner OOM from an earlier compile job.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
