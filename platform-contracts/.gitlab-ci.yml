
# .gitlab-ci.yml — INV-T-2849 (T5); catalogue-* jobs added by INV-T-2851 (T7),
# extended for VariationPoint by INV-T-2852 (T8) (catalogue-publish's second curl only
# — T8's own drift check is not CI-wired, see catalogue/variation-points/README.md)
#
# platform-contracts' repository root has no Kotlin source of its own (settings.gradle.kts,
# build.gradle.kts there are packaging-only): only the stage list, shared variables and
# pinned tool-image digests come from platform-build's templates (STK-30's "every CI tool
# image is pinned by digest"); the non-catalogue jobs below are this repository's own,
# since none of them is a Gradle/Kotlin build (ci/build.gitlab-ci.yml's jobs do not apply
# to them). catalogue/ (T7) is different: a real Gradle/Kotlin build, but its own separate
# one (catalogue/settings.gradle.kts) — this repository still commits no wrapper (T5's
# choice stands), so the catalogue-* jobs below call the pinned `gradle` binary directly
# (`gradle -p catalogue …`, the same pattern bundle-publish already uses in this file)
# rather than including ci/build.gitlab-ci.yml + ci/publish.gitlab-ci.yml, which invoke
# `./gradlew` and assume a committed wrapper. They reuse those templates' *conventions*
# instead (task names, the gstMavenUrl/User/Password property names, "main/tag only"
# publish rule) — named here as a deliberate choice, not an oversight, and a candidate
# follow-up if this repository ever adopts the shared templates wholesale.
include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'
      - 'ci/publish.gitlab-ci.yml'   # INV-T-5317: the hidden .gst-publish-* and .gst-guard-* sections (its own jobs stay off: MAVEN_PUBLISH "false", IMAGE_NAME and HELM_CHART_NAME empty)
  # Keel request 2026-10-18 (keel-report-junit, CI-FAST plan item E1): the keel-report job of stage .post reads the
  # JUnit XML catalogue-verify leaves as artifacts on the main push pipeline and reports the INV-AC numbers in the
  # testcase names to Keel. Main only (the template's own rule), so merge-request pipelines are unchanged.
  - project: 'keel/tooling'
    ref: main
    file: 'keel-report-junit.yml'
    inputs:
      runner_tags: [inv-arm64]
      junit_paths: 'catalogue/**/build/test-results/test/TEST-*.xml'
      ac_pattern: 'INV-AC-\d+(?!\d)'

variables:
  GST_GRADLE_CACHE_POLICY: "pull"   # CI-FAST B3: catalogue-verify and contracts-codegen-compile set pull-push on main
  SPECTRAL_IMAGE: "stoplight/spectral@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050"
  # CI-FAST B1: python3, py3-yaml, git, curl, check-jsonschema, pyyaml preinstalled (platform-build ci/tool-images/), pinned by digest
  CI_TOOLS_IMAGE: "${INV_REGISTRY}/invoice/ci-tools@sha256:0afee6fd728592d5beafc3a0c82e9007782bddf92f6e31e07f9ebe22d88f3008"
  OASDIFF_IMAGE: "tufin/oasdiff@sha256:0286f138545a39010525df6c1bea67ffafacb384ef800effffa63bbd04718ce5"
  ASYNCAPI_CLI_IMAGE: "asyncapi/cli@sha256:2240534054590b3d41d691fdf88e1f7a1e581b9cc4fb1d4af65ca93434aa681b"
  # CI-FAST plan item A3 (owner ruling 2026-10-18, option b), see gst-rebase-check below.
  GST_REBASE_SKIP_JOBS: "contract-rules tool-self-tests spectral-rule-self-tests spectral-lint asyncapi-validate catalogue-verify"
  GST_REBASE_AGGREGATE_PATHS: ".gitlab-ci.yml ci/* gradle/* *.gradle.kts *gradle.properties *.lockfile spectral/* codegen-self-test/* event-log/topics.yaml catalogue/* service-runtime/* submission/schemas/lifecycle-states.schema.json"

# CI-FAST batch 7 (coordinator, owner request 2026-10-18: fewer, cheaper jobs for small agent merge requests):
# - Every check job sets `needs: []`, so no check waits for an earlier stage. The publish jobs keep waiting for
#   every check.
# - Small checks that share an image run in one job (contract-rules, invoice-docs-checks, tool-self-tests,
#   spectral-rule-self-tests). Every check in such a job runs even when an earlier one fails; the log names each
#   failed check ("gst-ci: FAILED <check>") and the job fails at the end. The former job name of each check is
#   its check name, so a log search for it still finds it.
# - In a merge-request pipeline the tool self-tests and the catalogue build run only when their inputs change
#   (.gst-mr-only-on-*). Main and tag pipelines always run them.
# - A main push pipeline skips a check job whose commit already passed a merge-request pipeline
#   (.gst-skip-verified): merges are fast-forward, so it is the same commit. The publish jobs and
#   invoice-docs-checks (its inputs live outside this repository) and catalogue-verify (Keel acceptance
#   results come from the main run itself, Keel R77) always run in full.
# CI-FAST plan item A3 (owner ruling 2026-10-18, option b: stay fast-forward; after a rebase whose new target commits
# and the merge request's changes touch disjoint paths and no aggregate or generated file, run only the integration
# set). gst-rebase-check (ci/rebase_check.py, tests in ci/tests/rebase_check_test.py) sets GST_REBASE_ONLY=true when
# an earlier pipeline of the merge request passed on the same change and the rebase brought in only other, non-aggregate
# files (GST_REBASE_AGGREGATE_PATHS). Then each job in GST_REBASE_SKIP_JOBS ends at once (.gst-rebase-skip). The
# integration set always runs: invoice-docs-checks (drift), the oasdiff and asyncapi breaking gates,
# contracts-codegen-compile and publish-guard-dry-run (a version the target branch just published must not be reused).
# Any doubt or error in the check means a full run. Main and tag pipelines are not affected.
gst-rebase-check:
  stage: .pre
  needs: []
  image: "$GRADLE_IMAGE"
  rules:
    - !reference [.gst-docs-only-skip, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "500"
  cache: []
  before_script: []
  script:
    - python3 ci/rebase_check.py rebase.env || echo "GST_REBASE_ONLY=false" > rebase.env
  artifacts:
    reports:
      dotenv: rebase.env

.gst-rebase-needs:
  needs:
    - job: gst-rebase-check
      optional: true

.gst-rebase-skip:
  before_script:
    - |
      if [ "${GST_REBASE_ONLY:-}" = "true" ] && case " ${GST_REBASE_SKIP_JOBS:-} " in *" $CI_JOB_NAME "*) true ;; *) false ;; esac; then
        echo "gst-ci: $CI_JOB_NAME skipped: rebase only (see job gst-rebase-check), the same change passed this job before"
        exit 0
      fi

.gst-skip-verified:
  before_script:
    - !reference [.gst-rebase-skip, before_script]
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        gst_u="$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?sha=$CI_COMMIT_SHA&status=success&source=merge_request_event&per_page=20"
        if command -v curl >/dev/null 2>&1; then
          gst_j=$(curl -sf --max-time 30 -H "JOB-TOKEN: $CI_JOB_TOKEN" "$gst_u") || gst_j=""
        else
          gst_j=$(wget -q -O - -T 30 --header "JOB-TOKEN: $CI_JOB_TOKEN" "$gst_u") || gst_j=""
        fi
        case "$gst_j" in
          *"\"sha\":\"$CI_COMMIT_SHA\""*)
            echo "gst-ci: $CI_JOB_NAME skipped: commit $CI_COMMIT_SHORT_SHA already passed a merge-request pipeline"
            exit 0 ;;
        esac
        echo "gst-ci: no successful merge-request pipeline found for $CI_COMMIT_SHORT_SHA, $CI_JOB_NAME runs in full"
      fi

.gst-checks:
  # gst_check NAME CMD...: runs CMD, records NAME when it fails; gst_checks_done fails the job if any failed.
  script:
    - |
      gst_failed=""
      gst_check() { gst_name=$1; shift; echo "gst-ci: == $gst_name"; if "$@"; then echo "gst-ci: ok $gst_name"; else echo "gst-ci: FAILED $gst_name"; gst_failed="$gst_failed $gst_name"; fi; }
      gst_checks_done() { if [ -n "$gst_failed" ]; then echo "gst-ci: failed checks:$gst_failed"; return 1; fi; echo "gst-ci: all checks passed"; }

.gst-mr-only-on-spectral:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["spectral/**/*", ".gitlab-ci.yml"]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success

.gst-mr-only-on-tools:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["spectral/**/*", "catalogue/variation-points/**/*", "ci/**/*", ".gitlab-ci.yml"]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success

.gst-mr-only-on-catalogue:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["catalogue/**/*", ".gitlab-ci.yml"]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success

contract-rules:
  # The content checks of this repository's own files (no other repository read):
  # schema-sample-validation (INV-T-2850 T6 and API-04; INV-T-4909 samples may test an OpenAPI schema),
  # required-identifiers-check (INV-T-4909, INV-Q-4874: every <service>/required-identifiers.tsv row is found as
  # a whole token in that service's file), forbidden-properties-check (INV-T-4910, INV-Q-4902: no response or event
  # schema of access/ carries a listed secret property), event-log-topics-drift-check (INV-T-2855 T11: topics.yaml
  # regenerated from every asyncapi.yaml shows no drift; INV-T-3386 generator unittests). The page-bound check
  # (service-runtime/check-page-bound.py) stays a line of its own (service-runtime/test_check_page_bound.py).
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  image: "$CI_TOOLS_IMAGE"
  before_script:
    - !reference [.gst-skip-verified, before_script]
  script:
    - python3 service-runtime/check-page-bound.py
    - !reference [.gst-checks, script]
    - >
      gst_check schema-sample-validation python3 spectral/validate-schema-samples.py
      service-runtime/schemas/cloud-event-envelope.schema.json spectral/fixtures/schema-samples/cloud-event-envelope
      service-runtime/schemas/error-envelope.schema.json spectral/fixtures/schema-samples/error-envelope
    - gst_check schema-sample-validation-discover python3 spectral/validate-schema-samples.py --discover .
    - gst_check required-identifiers-check python3 spectral/check-required-identifiers.py .
    - gst_check forbidden-properties-check python3 spectral/check-forbidden-properties.py access/
    - gst_check data-classification-check python3 spectral/check-data-classification.py canonical evidence
    - gst_check event-log-topics-drift-check python3 event-log/generate-topics.py . --check event-log/topics.yaml
    - gst_check event-log-generator-tests python3 -m unittest discover -s event-log -p 'test_*.py' -v
    - gst_checks_done

invoice-docs-checks:
  # The checks that read invoice-docs, from one fetch (cloned with gitlab-ci-token:$CI_JOB_TOKEN; invoice-docs is
  # not anonymously readable). They run in full on main too: invoice-docs main moves on its own.
  # - sync-edge-allowlist-check (INV-T-2850 API-08): every x-sync-edge of every service's openapi.yaml is an edge of
  #   invoice-docs model/architecture/sync-edges.yaml on main, its callee is the owning service, and every
  #   /internal/v1 operation has one (no exemptions; read on every run, never vendored).
  # - x-timeout-check (INV-T-3431, INV-Q-3429 A, INV-REQ-1232 b4, INV-REQ-1204): every operation's x-timeout is a
  #   figure of its edge's INV-NOTE-3 section 36.6 row (sync-edges.yaml resilience_policy on main). Public operations,
  #   edges without a row and rows without a figure are listed as unchecked.
  # - lifecycle-states-drift-check (INV-T-2859 T15): submission/schemas/lifecycle-states.schema.json is regenerated
  #   from invoice-docs main model/architecture/lifecycle-states.yaml and must equal the committed file.
  # - catalogue-drift-check (INV-T-2851 T7): the data of the vendored catalogue/errors/error-codes.yaml (from
  #   `error_codes:` on; the header comments differ) equals invoice-docs model/architecture/error-codes.yaml at the
  #   commit its header pins; a main that has moved past the pin is reported without failing (re-vendor in its own
  #   merge request, AGT-11).
  stage: verify
  needs: []
  image: "$CI_TOOLS_IMAGE"
  before_script:
  script:
    - !reference [.gst-checks, script]
    - >
      git clone -q --depth 1
      "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/invoice/invoice-docs.git"
      /tmp/invoice-docs
    - >
      echo "gst-ci: invoice-docs main $(git -C /tmp/invoice-docs rev-parse --short HEAD)"
    - gst_check sync-edge-allowlist-check python3 spectral/check-sync-edges.py /tmp/invoice-docs/model/architecture/sync-edges.yaml .
    - gst_check x-timeout-check python3 spectral/check-timeouts.py /tmp/invoice-docs/model/architecture/sync-edges.yaml .
    - >
      gst_check lifecycle-states-drift-check python3 submission/schemas/generate-lifecycle-states.py
      /tmp/invoice-docs/model/architecture/lifecycle-states.yaml
      --check submission/schemas/lifecycle-states.schema.json
    - |
      gst_catalogue_drift() {
        PIN=$(grep -oE 'pinned at commit [0-9a-f]{7,40}' catalogue/errors/error-codes.yaml | awk '{print $NF}')
        if [ -z "$PIN" ]; then echo "gst-ci: could not read the pinned commit SHA from catalogue/errors/error-codes.yaml's header"; return 1; fi
        echo "gst-ci: vendored error-codes.yaml pinned at invoice-docs commit ${PIN}"
        git -C /tmp/invoice-docs fetch -q --depth 1 origin "${PIN}" || return 1
        git -C /tmp/invoice-docs show FETCH_HEAD:model/architecture/error-codes.yaml > /tmp/pinned-error-codes.yaml || return 1
        MAIN_HEAD=$(git -C /tmp/invoice-docs rev-parse HEAD)
        if [ "$MAIN_HEAD" != "$PIN" ]; then
          echo "gst-ci: NOTICE invoice-docs main (${MAIN_HEAD}) has moved past the pin (${PIN}) for model/architecture/error-codes.yaml; this does not fail the job; re-vendor catalogue/errors/error-codes.yaml in its own merge request (AGT-11) to pick up the design change."
        else
          echo "gst-ci: invoice-docs main is still at the pinned commit."
        fi
        sed -n '/^error_codes:/,$p' catalogue/errors/error-codes.yaml > /tmp/vendored-body.yaml
        sed -n '/^error_codes:/,$p' /tmp/pinned-error-codes.yaml > /tmp/pinned-body.yaml
        if ! diff -u /tmp/pinned-body.yaml /tmp/vendored-body.yaml; then
          echo "gst-ci: catalogue/errors/error-codes.yaml has drifted from invoice-docs' model/architecture/error-codes.yaml at the pinned commit ${PIN}; see the diff above."
          return 1
        fi
        echo "gst-ci: catalogue/errors/error-codes.yaml matches invoice-docs at the pinned commit."
      }
    - gst_check catalogue-drift-check gst_catalogue_drift
    - gst_checks_done

tool-self-tests:
  # The self-tests of this repository's own check tools (lesson P20: a check is proved to fire, against fixtures):
  # breaking-change-self-test (the oasdiff/asyncapi gates; INV-T-3491 normalize-extensible-enum.py),
  # contract-check-self-tests (API-08 allowlist, examples, x-timeout INV-T-3431, required identifiers INV-T-4909,
  # forbidden properties INV-T-4910), catalogue-vendor-tool-tests (INV-T-3377: catalogue/variation-points
  # check-drift.py installation-parameter rows, INV-Q-3202, P57) and publish-jobs-test (INV-T-5317: the publish jobs
  # keep the immutable-release guard). In a merge request they run only when a tool, a fixture or this file changes.
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  extends: .gst-mr-only-on-tools
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - !reference [.gst-skip-verified, before_script]
    - apk add --no-cache python3 py3-yaml git   # git: ci/tests/rebase_check_test.py builds throwaway repositories
  script:
    - !reference [.gst-checks, script]
    - gst_check breaking-change-self-test sh spectral/self-test-fixtures.sh
    - gst_check self-test-sync-edges sh spectral/self-test-sync-edges.sh
    - gst_check self-test-schema-samples sh spectral/self-test-schema-samples.sh
    - gst_check self-test-timeouts sh spectral/self-test-timeouts.sh
    - gst_check self-test-required-identifiers sh spectral/self-test-required-identifiers.sh
    - gst_check self-test-forbidden-properties sh spectral/self-test-forbidden-properties.sh
    - gst_check self-test-data-classification sh spectral/self-test-data-classification.sh
    - gst_check catalogue-vendor-tool-tests python3 -m unittest discover -s catalogue/variation-points -p 'test_*.py' -v
    - gst_check publish-jobs-test python3 -m unittest discover -s ci/tests -p '*_test.py' -v
    - gst_checks_done

spectral-rule-self-tests:
  # Proves the Spectral rules fire (lesson P20): sync-edge-rule-self-test (inv-api-08-x-sync-edge; INV-T-4030
  # inv-api-02-x-principal-workload-restricted; INV-T-6165 API-31 deprecation headers), envelope-rule-self-test
  # (INV-T-2850 T6 inv-api-40-message-references-envelope) and money-rule-self-test (INV-T-2855 T11
  # inv-api-12-money-format against AsyncAPI and standalone event schemas; INV-T-6047 enum casing). In a merge
  # request they run only when spectral/ or this file changes.
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  extends: .gst-mr-only-on-spectral
  image:
    name: "$SPECTRAL_IMAGE"
    entrypoint: [""]
  before_script:
    - !reference [.gst-skip-verified, before_script]
  script:
    - !reference [.gst-checks, script]
    - gst_check sync-edge-rule-self-test sh spectral/self-test-sync-edge-rule.sh
    - gst_check workload-rule-self-test sh spectral/self-test-workload-rule.sh
    - gst_check deprecation-rule-self-test sh spectral/self-test-deprecation-rule.sh
    - gst_check envelope-rule-self-test sh spectral/self-test-message-envelope-rule.sh
    - gst_check money-rule-self-test sh spectral/self-test-money-rule.sh
    - gst_check pagination-rule-self-test sh spectral/self-test-pagination-rule.sh
    - gst_checks_done

catalogue-verify:
  # STK-67 (detekt/ktlint through Spotless) and the two INV-T-2851 acceptance checks
  # (INV-AC-2170 stability, INV-AC-2173 BLOCK disposition) all run through `check`:
  # the `dev.detekt` and Spotless plugins wire `detekt`/`spotlessCheck` into `check`
  # by default, and gst.catalogue-generator wires checkCatalogueStability and
  # checkBlockDispositionCauses into it too (catalogue/generator's own
  # gst.catalogue-generator.gradle.kts).
  # CI-FAST batch 7: the separate catalogue-compile job is gone (check compiles); in a merge request this job runs
  # only when catalogue/ or this file changes. It never skips on main: Keel takes acceptance results only from the
  # main pipeline's own run on the merge commit (Keel R77), so the main push pipeline produces this job's JUnit XML.
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  extends: .gst-mr-only-on-catalogue
  image: "$GRADLE_IMAGE"
  tags: [inv-arm64]   # CI-FAST D1: the Gradle jobs run on runner 91 (arm64), as libs/build do
  # CI-FAST B3: only the main pipeline pushes this cache (about 70 s of archiving per run); merge-request
  # pipelines pull it. The cache is not separated per branch protection, so merge requests read main's copy.
  # The rules repeat .gst-mr-only-on-catalogue (a job's rules replace the extended ones) with the main rule first.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GST_GRADLE_CACHE_POLICY: pull-push
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["catalogue/**/*", ".gitlab-ci.yml"]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  cache:
    key: "gradle-catalogue-$CI_PROJECT_ID"
    policy: "$GST_GRADLE_CACHE_POLICY"
    paths:
      - .gradle-cache/caches
  before_script:
    - !reference [.gst-rebase-skip, before_script]
  script:
    - gradle -p catalogue check --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - "catalogue/**/build/test-results/test/TEST-*.xml"
    paths:
      - "catalogue/**/build/reports/"
      - "catalogue/**/build/test-results/test/TEST-*.xml"   # read by keel-report (E1); reports:junit is not passed to later jobs
    expire_in: 1 week

# INV-T-5317 (coordinator ruling INV-Q-5313): a published version is never replaced. Nothing here uploads by
# itself: Gradle publishes only into a staging directory (ci/release/stage-publish.init.gradle of platform-build, so
# it never sees the registry URL or the job token) and platform-build's guard scripts do every upload, through the
# hidden sections of ci/publish.gitlab-ci.yml. In each job every check (--dry-run) of every file the job would upload
# runs before the first upload of any kind, so a conflict in the last file leaves nothing half-published. The
# guard scripts are fetched from platform-build with the job token; HTTP 403 (this repository is not yet on that
# project's job-token allowlist, an owner action) fails the job with nothing published. ci/tests/publish_jobs_test.py
# asserts this shape.

.catalogue-stage:
  # Stages the Maven publication of catalogue/ and lists the two generic JSON files of the current
  # gstCatalogueVersion in the manifest GST_GENERIC_MANIFEST (PACKAGE VERSION FILE-NAME PATH).
  script:
    - !reference [.gst-publish-prepare, script]
    - >
      gradle -p catalogue publish
      -I "$GST_RELEASE_DIR/stage-publish.init.gradle" -PgstStageDir="$GST_PUBLISH_STAGE"
      --stacktrace
    - VERSION=$(grep '^gstCatalogueVersion=' catalogue/gradle.properties | cut -d= -f2)
    - GEN_DIR=catalogue/gst-catalogue/build/generated/gst-catalogue
    - echo "gst-catalogue-error-codes ${VERSION} gst-catalogue-error-codes-${VERSION}.json ${GEN_DIR}/gst-catalogue-error-codes-${VERSION}.json" >> "$GST_GENERIC_MANIFEST"
    - echo "gst-catalogue-variation-points ${VERSION} gst-catalogue-variation-points-${VERSION}.json ${GEN_DIR}/gst-catalogue-variation-points-${VERSION}.json" >> "$GST_GENERIC_MANIFEST"

.bundle-stage:
  # Builds the train bundle and lists it in the manifest GST_GENERIC_MANIFEST.
  script:
    - VERSION=$(gradle -q printTrainVersion)
    - gradle bundleContracts
    - echo "platform-contracts ${VERSION} platform-contracts-${VERSION}.zip build/distributions/platform-contracts-${VERSION}.zip" >> "$GST_GENERIC_MANIFEST"

.maven-guard-dry-run:
  # The Maven check of INV-T-5257 has no section with a dry run, so the guard script is called with --dry-run itself.
  script:
    - >
      GUARD_USER=gitlab-ci-token GUARD_PASSWORD="${CI_JOB_TOKEN}"
      python3 "$GST_RELEASE_DIR/publish_guard.py"
      --stage "$GST_PUBLISH_STAGE" --registry "${CI_API_V4_URL}/projects/${MAVEN_REGISTRY_PROJECT_ID}/packages/maven"
      --dry-run

catalogue-publish:
  # Publishes to *this* project's own Maven package registry (project $CI_PROJECT_ID) —
  # not platform-build's shared registry (the default of MAVEN_REGISTRY_PROJECT_ID).
  stage: publish
  image: "$GRADLE_IMAGE"
  variables:
    MAVEN_REGISTRY_PROJECT_ID: "$CI_PROJECT_ID"
    GST_PUBLISH_REQUIRE_STAGE: "true"
    GST_PUBLISH_STAGE: "${CI_PROJECT_DIR}/.gst-publish-stage"
    GST_GENERIC_MANIFEST: "${CI_PROJECT_DIR}/.gst-generic-manifest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    - rm -f "$GST_GENERIC_MANIFEST"
    - !reference [.catalogue-stage, script]
    # The catalogue artefacts (STK-61's other output, alongside the jar): ErrorCode (T7) and VariationPoint
    # (INV-T-2852 / T8) land in the same generated/gst-catalogue/ directory.
    - !reference [.gst-artefact-guard-prepare, script]
    - !reference [.maven-guard-dry-run, script]
    - GST_GUARD_DRY=--dry-run
    - !reference [.gst-guard-generic, script]
    - GST_GUARD_DRY=
    - !reference [.gst-publish-upload, script]
    - !reference [.gst-guard-generic, script]
  artifacts:
    paths:
      - "catalogue/gst-catalogue/build/generated/gst-catalogue/"
    expire_in: 1 month

publish-guard-dry-run:
  # INV-T-5317 (coordinator ruling INV-Q-5337): any merge request that changes a published artefact's content steps
  # its version in the same merge request. Stages what catalogue-publish and bundle-publish would publish and runs
  # the guards with --dry-run only, against the registry of this project, so a changed byte under an already
  # published version fails the merge-request pipeline (the log names the artefact and both digests). It never
  # uploads. No allow_failure: a failure blocks the merge.
  stage: publish
  image: "$GRADLE_IMAGE"
  tags: [inv-arm64]   # CI-FAST D1: the Gradle jobs run on runner 91 (arm64), as libs/build do
  needs: []
  variables:
    MAVEN_REGISTRY_PROJECT_ID: "$CI_PROJECT_ID"
    GST_PUBLISH_REQUIRE_STAGE: "true"
    GST_PUBLISH_STAGE: "${CI_PROJECT_DIR}/.gst-publish-stage"
    GST_GENERIC_MANIFEST: "${CI_PROJECT_DIR}/.gst-generic-manifest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    # CI-FAST batch 7: reuse the catalogue dependency cache, read only.
    key: "gradle-catalogue-$CI_PROJECT_ID"
    policy: pull
    paths:
      - .gradle-cache/caches
  script:
    - rm -f "$GST_GENERIC_MANIFEST"
    - !reference [.catalogue-stage, script]
    - !reference [.bundle-stage, script]
    - !reference [.gst-artefact-guard-prepare, script]
    - !reference [.maven-guard-dry-run, script]
    - GST_GUARD_DRY=--dry-run
    - !reference [.gst-guard-generic, script]

spectral-lint:
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  image:
    name: "$SPECTRAL_IMAGE"
    entrypoint: [""]
  before_script:
    - !reference [.gst-skip-verified, before_script]
  script:
    - |
      failed=0
      for dir in */; do
        svc="${dir%/}"
        [ "$svc" = "spectral" ] && continue
        for file in "$svc/openapi.yaml" "$svc/asyncapi.yaml"; do
          [ -f "$file" ] || continue
          echo "gst-ci: spectral lint $file"
          spectral lint --ruleset spectral/ruleset.yaml --fail-severity error "$file" || failed=1
        done
      done
      exit $failed

asyncapi-validate:
  stage: verify
  needs: !reference [.gst-rebase-needs, needs]
  image:
    name: "$ASYNCAPI_CLI_IMAGE"
    entrypoint: [""]
  before_script:
    - !reference [.gst-skip-verified, before_script]
  script:
    - |
      failed=0
      for f in */asyncapi.yaml; do
        echo "gst-ci: asyncapi validate $f"
        asyncapi validate "$f" || failed=1
      done
      exit $failed

oasdiff-breaking-gate:
  stage: verify
  needs: []
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # API-03: CI compares the contract with the previous train's
  before_script:
    - apk add --no-cache python3 py3-yaml   # INV-T-3491 gate fix: normalize-extensible-enum.py
  script:
    - sh spectral/run-oasdiff-gate.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

asyncapi-breaking-gate:
  stage: verify
  needs: []
  image:
    name: "$ASYNCAPI_CLI_IMAGE"
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - sh spectral/run-asyncapi-gate.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

contracts-codegen-compile:
  # INV-T-2850 follow-up (coordinator-authorised) — T9-T14b each proved "server and
  # client generation compiles" / "gst.event-types generates compiling Kotlin types"
  # only with an ad-hoc local harness, deleted before their own MR. codegen-self-test/
  # is that harness, kept: for every service directory it applies platform-build's
  # gst.contract-server + gst.contract-client to that service's openapi.yaml and
  # gst.event-types to every schemas/*.json, and compiles the result. Fails on any
  # generation or compile error.
  #
  # No published plugin-marker artefact exists for platform-build's build-logic yet
  # (its own pipeline has never run a `publish` job — still INV-T-2845's bootstrap
  # pipeline, MAVEN_PUBLISH unset regardless), so this clones platform-build at a
  # pinned commit and `includeBuild`s build-logic/ (codegen-self-test/settings.gradle.kts).
  # Same gitlab-ci-token:$CI_JOB_TOKEN cross-project clone lifecycle-states-drift-check
  # already uses for invoice-docs, just above (the job-token allowlist covers group
  # invoice, so this needs no extra Maintainer action). Bump PLATFORM_BUILD_REF in its
  # own merge request when build-logic changes.
  #
  # PLATFORM_BUILD_REF is a hand-bumped pin with no staleness signal of its own
  # (review) — same shape as catalogue-drift-check's vendored error-codes.yaml pin, so
  # this reports drift the same way: after fetching the pin, also fetch
  # platform-build's main tip and echo (without failing the job) how far the pin has
  # fallen behind, so a stale pin is a visible follow-up, not silent.
  stage: verify
  needs: []
  image: "$GRADLE_IMAGE"
  tags: [inv-arm64]   # CI-FAST D1: the Gradle jobs run on runner 91 (arm64), as libs/build do
  variables:
    PLATFORM_BUILD_REF: "218934eae564ed643a48209d6b40f644402ac7ba" # main: adds gst.contract-server/-client/-event-types (INV-T-2847) + its CVE/signature-verification follow-ups; MR !6 & !7 fix failing modules
  # CI-FAST B3: only the main pipeline pushes this cache (about 70 s of archiving per run); merge-request
  # pipelines pull it. The cache is not separated per branch protection, so merge requests read main's copy.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        GST_GRADLE_CACHE_POLICY: pull-push
    - when: on_success
  cache:
    key: "gradle-codegen-self-test-$CI_PROJECT_ID"
    policy: "$GST_GRADLE_CACHE_POLICY"
    paths:
      - .gradle-cache/caches
  before_script:
    - !reference [.gst-skip-verified, before_script]
  script:
    - mkdir -p /tmp/platform-build-pinned
    - git -C /tmp/platform-build-pinned init -q
    - >
      git -C /tmp/platform-build-pinned remote add origin
      "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/invoice/platform-build.git"
    - git -C /tmp/platform-build-pinned fetch --depth 1 origin "${PLATFORM_BUILD_REF}"
    - git -C /tmp/platform-build-pinned checkout -q FETCH_HEAD
    - git -C /tmp/platform-build-pinned fetch --depth 1 origin main
    - >
      MAIN_HEAD=$(git -C /tmp/platform-build-pinned rev-parse FETCH_HEAD);
      if [ "$MAIN_HEAD" != "$PLATFORM_BUILD_REF" ]; then
        echo "gst-ci: NOTICE platform-build main (${MAIN_HEAD}) has moved past PLATFORM_BUILD_REF (${PLATFORM_BUILD_REF}) — this does not fail the job; bump PLATFORM_BUILD_REF in its own merge request to pick up the build-logic change.";
      else
        echo "gst-ci: platform-build main is still at the pinned commit.";
      fi
    - PLATFORM_BUILD_DIR=/tmp/platform-build-pinned gradle -p codegen-self-test compileAllContracts --stacktrace
  artifacts:
    when: on_failure
    paths:
      - codegen-self-test/build/reports/
    expire_in: 1 week

bundle-publish:
  stage: publish
  image: "$GRADLE_IMAGE"
  variables:
    GST_GENERIC_MANIFEST: "${CI_PROJECT_DIR}/.gst-generic-manifest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'   # a train bundle publishes from the merged result, never an MR (CS-47)
  script:
    - rm -f "$GST_GENERIC_MANIFEST"
    - !reference [.bundle-stage, script]
    - !reference [.gst-artefact-guard-prepare, script]
    - GST_GUARD_DRY=--dry-run
    - !reference [.gst-guard-generic, script]
    - GST_GUARD_DRY=
    - !reference [.gst-guard-generic, script]
  artifacts:
    paths:
      - build/distributions/
    expire_in: 1 month