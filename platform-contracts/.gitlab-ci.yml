# .gitlab-ci.yml — INV-T-2849 (T5); catalogue-* jobs added by INV-T-2851 (T7),
# extended for VariationPoint by INV-T-2852 (T8) (catalogue-publish's second curl only
# — T8's own drift check is not CI-wired, see catalogue/variation-points/README.md)
#
# platform-contracts' repository root has no Kotlin source of its own (settings.gradle.kts,
# build.gradle.kts there are packaging-only): only the stage list, shared variables and
# pinned tool-image digests come from platform-build's templates (STK-30's "every CI tool
# image is pinned by digest"); the non-catalogue jobs below are this repository's own,
# since none of them is a Gradle/Kotlin build (ci/build.gitlab-ci.yml's jobs do not apply
# to them). catalogue/ (T7) is different: a real Gradle/Kotlin build, but its own separate
# one (catalogue/settings.gradle.kts) — this repository still commits no wrapper (T5's
# choice stands), so the catalogue-* jobs below call the pinned `gradle` binary directly
# (`gradle -p catalogue …`, the same pattern bundle-publish already uses in this file)
# rather than including ci/build.gitlab-ci.yml + ci/publish.gitlab-ci.yml, which invoke
# `./gradlew` and assume a committed wrapper. They reuse those templates' *conventions*
# instead (task names, the gstMavenUrl/User/Password property names, "main/tag only"
# publish rule) — named here as a deliberate choice, not an oversight, and a candidate
# follow-up if this repository ever adopts the shared templates wholesale.
include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'

variables:
  SPECTRAL_IMAGE: "stoplight/spectral@sha256:a07aa4455367b9501b574423b684ab0ef3ee42556089013583318ec015249050"
  OASDIFF_IMAGE: "tufin/oasdiff@sha256:0286f138545a39010525df6c1bea67ffafacb384ef800effffa63bbd04718ce5"
  ASYNCAPI_CLI_IMAGE: "asyncapi/cli@sha256:2240534054590b3d41d691fdf88e1f7a1e581b9cc4fb1d4af65ca93434aa681b"

catalogue-compile:
  stage: build
  image: "$GRADLE_IMAGE"
  cache:
    key: "gradle-catalogue-$CI_PROJECT_ID"
    paths:
      - .gradle-cache/caches
  script:
    - gradle -p catalogue compileKotlin compileTestKotlin --stacktrace

catalogue-verify:
  # STK-67 (detekt/ktlint through Spotless) and the two INV-T-2851 acceptance checks
  # (INV-AC-2170 stability, INV-AC-2173 BLOCK disposition) all run through `check`:
  # the `dev.detekt` and Spotless plugins wire `detekt`/`spotlessCheck` into `check`
  # by default, and gst.catalogue-generator wires checkCatalogueStability and
  # checkBlockDispositionCauses into it too (catalogue/generator's own
  # gst.catalogue-generator.gradle.kts).
  stage: verify
  image: "$GRADLE_IMAGE"
  cache:
    key: "gradle-catalogue-$CI_PROJECT_ID"
    paths:
      - .gradle-cache/caches
  script:
    - gradle -p catalogue check --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - "catalogue/**/build/test-results/test/TEST-*.xml"
    paths:
      - "catalogue/**/build/reports/"
    expire_in: 1 week

catalogue-drift-check:
  # INV-T-2851 (T7) reviewer should-fix (MR !6 discussion) — the vendored
  # catalogue/errors/error-codes.yaml is pinned to an invoice-docs commit (its own
  # header comment names the SHA) but nothing verified this copy still matches
  # invoice-docs at that commit. Both INV-AC-2170 and INV-AC-2173 operate purely on
  # the vendored copy, so a silent hand-edit or a bad re-vendor would never be
  # caught otherwise.
  #
  # Same pattern as lifecycle-states-drift-check just below (error-codes.yaml ->
  # ErrorCode is CS-13's own "same shape" example): clones invoice-docs with
  # gitlab-ci-token:$CI_JOB_TOKEN, same URL/protocol/token variables. It differs
  # from that job in one necessary way: the vendored copy is pinned to one specific
  # commit, not the branch tip (AGT-11 re-vendors it deliberately, in its own merge
  # request), so this fetches that one commit directly
  # (`git fetch --depth 1 origin <sha>`) instead of `git clone --depth 1` (`clone
  # --branch` does not accept an arbitrary commit SHA). Fails if the committed
  # vendored copy's data (everything from `error_codes:` on — both copies carry
  # their own, differently worded header comment above that line, which is not
  # part of the contract) differs from invoice-docs' model/architecture/error-codes.yaml
  # at the pinned commit. Also fetches invoice-docs main and reports — without
  # failing the job — when it has moved past the pin, so a stale vendor is a visible
  # follow-up, not silent drift.
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
  script:
    - >
      PIN=$(grep -oE 'pinned at commit [0-9a-f]{7,40}' catalogue/errors/error-codes.yaml | awk '{print $NF}')
    - >
      test -n "$PIN" ||
      (echo "gst-ci: could not read the pinned commit SHA from catalogue/errors/error-codes.yaml's header" && exit 1)
    - >
      echo "gst-ci: vendored error-codes.yaml pinned at invoice-docs commit ${PIN}"
    - mkdir /tmp/invoice-docs-pinned
    - git -C /tmp/invoice-docs-pinned init -q
    - >
      git -C /tmp/invoice-docs-pinned remote add origin
      "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/invoice/invoice-docs.git"
    - git -C /tmp/invoice-docs-pinned fetch --depth 1 origin "${PIN}"
    - >
      git -C /tmp/invoice-docs-pinned show FETCH_HEAD:model/architecture/error-codes.yaml
      > /tmp/pinned-error-codes.yaml
    - git -C /tmp/invoice-docs-pinned fetch --depth 1 origin main
    - >
      MAIN_HEAD=$(git -C /tmp/invoice-docs-pinned rev-parse FETCH_HEAD);
      if [ "$MAIN_HEAD" != "$PIN" ]; then
        echo "gst-ci: NOTICE invoice-docs main (${MAIN_HEAD}) has moved past the pin (${PIN}) for model/architecture/error-codes.yaml — this does not fail the job; re-vendor catalogue/errors/error-codes.yaml in its own merge request (AGT-11) to pick up the design change.";
      else
        echo "gst-ci: invoice-docs main is still at the pinned commit.";
      fi
    - sed -n '/^error_codes:/,$p' catalogue/errors/error-codes.yaml > /tmp/vendored-body.yaml
    - sed -n '/^error_codes:/,$p' /tmp/pinned-error-codes.yaml > /tmp/pinned-body.yaml
    - >
      diff -u /tmp/pinned-body.yaml /tmp/vendored-body.yaml
      || (echo "gst-ci: catalogue/errors/error-codes.yaml has drifted from invoice-docs' model/architecture/error-codes.yaml at the pinned commit ${PIN} — see the diff above." && exit 1)
    - >
      echo "gst-ci: catalogue/errors/error-codes.yaml matches invoice-docs at the pinned commit."

catalogue-publish:
  # Publishes to *this* project's own Maven package registry (project $CI_PROJECT_ID) —
  # not platform-build's shared registry ($MAVEN_REGISTRY_PROJECT_ID convention that
  # platform-build's own modules use): a cross-project publish would need platform-build's
  # Token Access allowlist to include platform-contracts first, which ci/README.md already
  # names as a not-yet-done Maintainer action. Publishing to this repository's own registry
  # needs no such allowlisting — the same reason bundle-publish, just below, already
  # publishes its generic package here rather than anywhere else.
  stage: publish
  image: "$GRADLE_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  script:
    - >
      gradle -p catalogue publish
      -PgstMavenUrl="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven"
      -PgstMavenUser=gitlab-ci-token
      -PgstMavenPassword="${CI_JOB_TOKEN}"
      --stacktrace
    # The catalogue artefacts (STK-61's other output, alongside the jar `publish` above
    # just pushed): the same generic-package mechanism bundle-publish already uses.
    # Both ErrorCode (T7) and VariationPoint (INV-T-2852 / T8) artefacts land in the
    # same generated/gst-catalogue/ directory (gst.catalogue-generator.gradle.kts's own
    # choice, so this one `artifacts.paths` entry below already covers both without a
    # second entry) — only the second `curl` is new.
    - VERSION=$(grep '^gstCatalogueVersion=' catalogue/gradle.properties | cut -d= -f2)
    - >
      curl --fail --request PUT
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "catalogue/gst-catalogue/build/generated/gst-catalogue/gst-catalogue-error-codes-${VERSION}.json"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gst-catalogue-error-codes/${VERSION}/gst-catalogue-error-codes-${VERSION}.json"
    - >
      curl --fail --request PUT
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "catalogue/gst-catalogue/build/generated/gst-catalogue/gst-catalogue-variation-points-${VERSION}.json"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gst-catalogue-variation-points/${VERSION}/gst-catalogue-variation-points-${VERSION}.json"
  artifacts:
    paths:
      - "catalogue/gst-catalogue/build/generated/gst-catalogue/"
    expire_in: 1 month

spectral-lint:
  stage: verify
  image:
    name: "$SPECTRAL_IMAGE"
    entrypoint: [""]
  script:
    - |
      failed=0
      for dir in */; do
        svc="${dir%/}"
        [ "$svc" = "spectral" ] && continue
        for file in "$svc/openapi.yaml" "$svc/asyncapi.yaml"; do
          [ -f "$file" ] || continue
          echo "gst-ci: spectral lint $file"
          spectral lint --ruleset spectral/ruleset.yaml --fail-severity error "$file" || failed=1
        done
      done
      exit $failed

asyncapi-validate:
  stage: verify
  image:
    name: "$ASYNCAPI_CLI_IMAGE"
    entrypoint: [""]
  script:
    - |
      failed=0
      for f in */asyncapi.yaml; do
        echo "gst-ci: asyncapi validate $f"
        asyncapi validate "$f" || failed=1
      done
      exit $failed

breaking-change-self-test:
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3
  script:
    - sh spectral/self-test-fixtures.sh

schema-sample-validation:
  # INV-T-2850 (T6) — "schema validation tests with valid and invalid
  # samples pass". Dependency-free (spectral/validate-schema-samples.py is
  # stdlib-only), so it reuses the already-pinned OASDIFF_IMAGE + python3
  # rather than pinning a new image.
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3
  script:
    - >
      python3 spectral/validate-schema-samples.py
      service-runtime/schemas/cloud-event-envelope.schema.json spectral/fixtures/schema-samples/cloud-event-envelope
      service-runtime/schemas/error-envelope.schema.json spectral/fixtures/schema-samples/error-envelope

lifecycle-states-drift-check:
  # INV-T-2859 (T15) — "generated from model/architecture/lifecycle-states.yaml;
  # drift check passes": submission/schemas/lifecycle-states.schema.json is
  # generated from that invoice-docs design record (SDS §33.2, FR-AE.9), the
  # same shape CS-13 already uses for error-codes.yaml -> ErrorCode; this
  # repository has no Kotlin generator to run instead, so the check
  # regenerates the schema from a fresh clone of invoice-docs and fails if it
  # differs from the committed file. Reuses the already-pinned OASDIFF_IMAGE +
  # python3 (dependency-free script, mirrors schema-sample-validation).
  #
  # invoice-docs is not anonymously readable (confirmed while authoring this
  # job — a plain `git clone http://.../invoice-docs.git` asks for a
  # username), so this clones with `gitlab-ci-token:$CI_JOB_TOKEN`, the same
  # mechanism platform-libs's sibling-checkout jobs use for platform-build
  # (INV-T-2860). That needs invoice/invoice-docs's CI/CD "Token Access"
  # allowlist to include invoice/platform-contracts — a Maintainer action,
  # named here as a follow-up (AGT-24) rather than assumed; until it is
  # granted this job fails at the clone step with a clear message, not
  # silently.
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3 git
  script:
    - >
      git clone --depth 1
      "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/invoice/invoice-docs.git"
      /tmp/invoice-docs
    - >
      python3 submission/schemas/generate-lifecycle-states.py
      /tmp/invoice-docs/model/architecture/lifecycle-states.yaml
      --check submission/schemas/lifecycle-states.schema.json

envelope-rule-self-test:
  # INV-T-2850 (T6) — proves inv-api-40-message-references-envelope itself
  # works, against isolated fixtures, the same way breaking-change-self-test
  # proves the breaking-change gate works.
  stage: verify
  image:
    name: "$SPECTRAL_IMAGE"
    entrypoint: [""]
  script:
    - sh spectral/self-test-message-envelope-rule.sh

money-rule-self-test:
  # INV-T-2855 (T11), coordinator-authorised scope extension — proves
  # inv-api-12-money-format itself works against an AsyncAPI document and a
  # standalone event JSON Schema document, not only an OpenAPI one (the gap
  # that let T10 slip a JSON-`number`-typed money field past CI, fixed by
  # hand in 60d98fe), the same way envelope-rule-self-test proves T6's rule
  # works.
  stage: verify
  image:
    name: "$SPECTRAL_IMAGE"
    entrypoint: [""]
  script:
    - sh spectral/self-test-money-rule.sh

event-log-topics-drift-check:
  # INV-T-2855 (T11) — "event-log/topics.yaml derived from every
  # asyncapi.yaml ...; generator check shows no drift": regenerates
  # topics.yaml in memory from every committed */asyncapi.yaml and fails if
  # it differs from the committed file (same shape as
  # lifecycle-states-drift-check, but entirely within this repository — no
  # sibling checkout needed). Dependency-free (event-log/generate-topics.py
  # is stdlib-only), so it reuses the already-pinned OASDIFF_IMAGE + python3.
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3
  script:
    - python3 event-log/generate-topics.py . --check event-log/topics.yaml

oasdiff-breaking-gate:
  stage: verify
  image:
    name: "$OASDIFF_IMAGE"
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # API-03: CI compares the contract with the previous train's
  before_script:
    - apk add --no-cache python3
  script:
    - sh spectral/run-oasdiff-gate.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

asyncapi-breaking-gate:
  stage: verify
  image:
    name: "$ASYNCAPI_CLI_IMAGE"
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - sh spectral/run-asyncapi-gate.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

bundle-publish:
  stage: publish
  image: "$GRADLE_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'   # a train bundle publishes from the merged result, never an MR (CS-47)
  script:
    - VERSION=$(gradle -q printTrainVersion)
    - gradle bundleContracts
    - >
      curl --fail --request PUT
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "build/distributions/platform-contracts-${VERSION}.zip"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/platform-contracts/${VERSION}/platform-contracts-${VERSION}.zip"
  artifacts:
    paths:
      - build/distributions/
    expire_in: 1 month
