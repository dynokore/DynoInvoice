  /internal/v1/rules/regulatory-packs/{packType}/{version}/arming:
    post:
      operationId: armRegulatoryPack
      summary: Arm a regulatory pack, setting its effective date
      description: >-
        Activation command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.6, FR-AB.10). Private form: `tax.approver` only.
        SaaS form: the operator, after the tenant's grace window. Uses the
        two-phase activation fence — distribute and acknowledge, then arm
        (FR-K.7); a partial load aborts the activation entirely, never
        partially. There is no un-arm (FR-AC.6) — the remedy is
        `rollbackPack` plus `reprocessPopulation`.
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-005]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AB.10, FR-K.7, RUL-005]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "All instances acknowledged (FR-K.7); private form only (FR-AB.10)."
        reversibility: COMPENSABLE
        repeatKey: "(packType, version) — no-op if already armed (INV-REQ-1010 armPack example)."
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 16 }
