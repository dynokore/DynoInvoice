            Number of entries whose `sourceClass` is SECONDARY or INFERRED. Producer-enforced; present on the answer of `getMappingPack` only.
        unacceptedNonPrimaryCount:
          type: integer
          minimum: 0
          description: >-
            Number of those entries whose `accepted` is false, which block sign-off with RUL-007. Producer-enforced; present on the answer of `getMappingPack` only.
        packVersion:
          type: string
          maxLength: 16
          description: >-
            The version label that access-svc stores with a client acknowledgement and takes as `packVersion` in `decidePackApproval`.
        approvals:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/MappingPackApproval'
          description: >-
            The approval records, oldest first, so that a two-approver path of access-svc keeps both. Present on every answer of `approvePack` and `activateMappingPack` and on `getMappingPack` once an approval is recorded. The status becomes APPROVED only when the latest approval has no CLIENT_APPROVAL outstanding.
        activation:
