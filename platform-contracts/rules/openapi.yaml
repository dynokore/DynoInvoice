openapi: 3.1.0
info:
  title: rules API
  version: 1.1.0
  description: >-
    Contract-first source of truth for rules (API-01, STK-44). The
    `rules-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07). Replaces the INV-T-2849 scaffold
    (INV-T-2901, T13b).


    Internal API only (API standard §1 and §15): rules-svc owns no resource
    in the §15 public catalogue, so every operation below is `/internal/v1/…`,
    never routed by the gateway. Two operations serve the synchronous edges
    of model/architecture/sync-edges.yaml (`canonical-svc -> rules-svc`,
    `payload-svc -> rules-svc`); the rest are the authoring, approval and
    activation commands services.yaml's rules-svc entry lists under
    `provides`, reached only through console-bff on a person's behalf
    (API-25 — the callee re-checks writes). Pack registry and dry-run-result
    reads are not named in that `provides` line, so they stay out of this
    file's declared scope, except the API-17 status resources of its long
    commands: `getDryRun` (INV-Q-3438) and the regulatory pack's status,
    `getRegulatoryPack` (INV-Q-3478).
  contact:
    name: rules (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: evaluation
    description: Pure, side-effect-free rule evaluation (FR-B.6, FR-B.8).
  - name: mapping-packs
    description: The tenant's own tax-code mapping pack — draft, approval and activation (§31.2.3, §35.10).
  - name: regulatory-packs
    description: The regulatory pack fed or imported from control-plane-svc — import, arming, rollback and reprocessing (§31.2.3, §31.2.6, §31.4.1).
paths:
  /internal/v1/rules/documents/evaluations:
    post:
      operationId: evaluateDocument
      summary: Evaluate a recorded document's line — scope verdict, category code and scenario handler decision
      description: >-
        The evaluation API to canonical-svc (services.yaml rules-svc
        `provides`; sync-edges.yaml `canonical-svc -> rules-svc`, "scope and
        code verdicts are an atomic pair; pure function, cacheable by pack
        version"). canonical-svc passes the line's internal code, the
        counterparty's scheme data from the masterdata-svc resolution and the
        entity's VP-53 election (FR-AE.89). Pure and side-effect free: same
        inputs and pack version always yield the same verdict (FR-B.6), with
        a decision trace naming the rule, pack version and inputs (FR-B.8).
        The scenario pack's handler returns the category code, the rate and
        the IBT-022 statement, or a RUL-004/RUL-011 verdict (FR-AE.89); for
        self-billing the party-to-type assignment is also a scenario-pack
        decision here (FR-T.2). rules-svc persists no decision trace itself
        (must_not) — the caller carries it to evidence-svc (AD-24).
      tags: [evaluation]
      x-principal: ingest
      x-timeout: 300
      x-sync-edge: canonical-svc->rules-svc
      x-error-codes: [RUL-002, RUL-003, RUL-004, RUL-006, RUL-008, RUL-011]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.1, FR-B.6, FR-B.8, FR-AE.89, FR-T.2]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          None — a pure function; the same inputs and pack version always
          yield the same verdict (FR-B.6). Resolved by the line's transaction
          date, never by clock date (FR-B.1).
        reversibility: UNDOABLE
        repeatKey: >-
          None — pure and side-effect free, so a repeat yields the identical
          verdict and trace (FR-B.6, INV-REQ-1010).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateDocumentRequest'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  transactionDate: "2026-03-20"
                  internalTaxCode: "SR-STD"
                  election: "VP-53-STANDARD"
                  counterpartySchemeData:
                    approvedSchemes: ["ARCS"]
      responses:
        '200':
          description: The scope verdict, category code and decision trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResult'
              examples:
                default:
                  value:
                    scopeVerdict: "SUBMITTABLE"
                    categoryCode: "SR"
                    rate: "9.00"
                    decisionTrace: { ruleId: "R-114", packVersion: "2026.3", inputs: { internalTaxCode: "SR-STD" } }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/pre-issuance-drafts/evaluations:
    post:
      operationId: evaluatePreIssuanceDraft
      summary: Evaluate a pre-issuance draft that has no canonical record yet
      description: >-
        The evaluation API to payload-svc for pre-issuance drafts
        (services.yaml rules-svc `provides`; sync-edges.yaml `payload-svc ->
        rules-svc`, "evaluation of a pre-issuance draft that has no
        canonical record yet", §33.1). Stateless and side-effect free, like
        `evaluateDocument`, but callable before the document is recorded.
      tags: [evaluation]
      x-principal: ingest
      x-timeout: 60
      x-sync-edge: payload-svc->rules-svc
      x-error-codes: [RUL-002, RUL-003, RUL-004, RUL-011]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.6, FR-AE.89]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          None — the draft has no canonical record yet and nothing is
          persisted either way (§33.1); a register or evaluation failure
          within budget is a WARN, never a block (rules-svc `must_not`).
        reversibility: UNDOABLE
        repeatKey: >-
          None — a safe query with no persistent state change; a repeat has
          nothing to make safe (FR-B.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateDocumentRequest'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  transactionDate: "2026-03-20"
                  internalTaxCode: "SR-STD"
      responses:
        '200':
          description: The scope verdict, category code and decision trace, or a WARN reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResult'
              examples:
                default:
                  value: { scopeVerdict: "SUBMITTABLE", categoryCode: "SR", rate: "9.00" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs:
    post:
      operationId: draftMappingPack
      summary: Create a draft of the tenant's own tax-code mapping pack
      description: >-
        Authoring command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.1, FR-2.1). Packs are versioned data, never
        editable in place once activated (FR-B.4).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-2.1, FR-B.4]
      x-operation:
        role: tax.operator
        scope: tenant
        precondition: "None — starts a new draft (SCR-12.1)."
        reversibility: UNDOABLE
        repeatKey: >-
          Idempotency-Key only — each call creates a new draft; the client
          discards a duplicate response (FR-2.1).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftMappingPackRequest'
            examples:
              default:
                value: { label: "2026 mapping refresh" }
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingPack'
              examples:
                default:
                  value: { packId: "MAP-0042", status: "DRAFT" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/{packId}/entries:
    post:
      operationId: mapTaxCode
      summary: Map an unmapped internal tax code into a draft entry
      description: >-
        Authoring command to console-bff (services.yaml rules-svc
        `provides`, SCR-02.3, §31.2.1). Takes an internal tax code from an
        RUL-001 group and adds a mapping-pack entry in draft; does not
        activate (FR-2.3).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-001]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-2.3, C-4]
      x-operation:
        role: tax.operator
        scope: tenant
        precondition: "RUL-001 raised for this internal tax code (§31.2.1)."
        reversibility: UNDOABLE
        repeatKey: "(packId, internalTaxCode) — a repeat replaces the same draft entry."
      parameters:
        - name: packId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
          example: "MAP-0042"
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapTaxCodeRequest'
            examples:
              default:
                value: { internalTaxCode: "SR-STD", irasCode: "SR", sourceClass: "PRIMARY" }
      responses:
        '201':
          description: The draft entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingEntry'
              examples:
                default:
                  value: { entryId: "ENT-9", internalTaxCode: "SR-STD", irasCode: "SR", sourceClass: "PRIMARY" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/import:
    post:
      operationId: importMappingSpreadsheet
      summary: Import a mapping spreadsheet as a new draft
      description: >-
        Authoring command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.2, §35.10). A re-import with any row whose
        category code is absent from the IRAS catalogue version is rejected
        whole with `422` RUL-006 (API-21) and no draft is created; the
        rejected rows are listed in the error envelope's `errors[]` (code
        RUL-006, `field` naming the row) and in the import record
        (INV-REQ-831 b4, INV-REQ-833 b1, INV-AC-2039, INV-Q-3586).
        `failedRows` stays in MappingPack (API-03) and is empty on a `201`.


        Synchronous, within console-bff's 2 s (INV-Q-3480, INV-REQ-831 b5):
        a spreadsheet holds at most 5,000 rows (API-49). A spreadsheet over
        the cap is refused whole with `413` (API-20 envelope) before it is
        parsed, and no draft pack is created (INV-AC-3484).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-006]
      x-requirements: [INV-REQ-957, INV-REQ-1010, "§35.10"]
      x-operation:
        role: tax.operator
        scope: tenant
        precondition: "None."
        reversibility: UNDOABLE
        repeatKey: "fileHash — a repeat returns the same draft, not a second one."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingSpreadsheetRequest'
            examples:
              default:
                value: { fileHash: "sha256:9c1185a5c5e9fc54612808977ee8f548b2258d31", fileName: "mapping-2026.xlsx" }
      responses:
        '201':
          description: The draft, with any rows that failed reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingPack'
              examples:
                default:
                  value: { packId: "MAP-0043", status: "DRAFT", failedRows: [] }
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/{packId}/entries/{entryId}/source-class-acceptance:
    post:
      operationId: acceptSourceClassEntry
      summary: Accept a non-PRIMARY mapping entry with rationale and expiry
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.6, FR-AA.17, FR-AA.18). Clears RUL-007 for this
        entry alone.
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-007]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AA.17, FR-AA.18, RUL-007]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "The entry is SECONDARY or INFERRED in a draft (RUL-007)."
        reversibility: UNDOABLE
        repeatKey: "(packId, entryId) — no-op if already accepted."
      parameters:
        - name: packId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: entryId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptSourceClassEntryRequest'
            examples:
              default:
                value: { rationale: "Confirmed against the customer's own ledger", expiresOn: "2027-03-20" }
      responses:
        '200':
          description: The entry's acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingEntry'
              examples:
                default:
                  value: { entryId: "ENT-9", internalTaxCode: "SR-STD", irasCode: "SR", sourceClass: "SECONDARY", accepted: true }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/{packId}/submissions:
    post:
      operationId: submitForApproval
      summary: Submit a mapping pack draft for approval
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.4). Locks the draft; the dry run behind it must
        already be complete (FR-B.3).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.3]
      x-operation:
        role: tax.operator
        scope: tenant
        precondition: "Dry run complete (FR-B.3)."
        reversibility: UNDOABLE
        repeatKey: "packId — no-op if already submitted."
      parameters:
        - name: packId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The pack, now locked and awaiting approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingPack'
              examples:
                default:
                  value: { packId: "MAP-0042", status: "SUBMITTED" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/{packId}/approval:
    post:
      operationId: approvePack
      summary: Approve a mapping pack's dry-run delta — never the author
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.5, FR-P.2). Refused if the caller authored the
        draft (no self-approval, FR-P.2) or if an unaccepted non-PRIMARY
        entry remains (RUL-007), or a mapped IRAS code is missing from the
        code catalogue (RUL-006, RUL-009, RUL-010).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-006, RUL-007, RUL-009, RUL-010]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-P.2, RUL-007, RUL-009, RUL-010]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: >-
          Dry-run delta reviewed; no unaccepted non-PRIMARY entry (RUL-007);
          approver is not the author (FR-P.2); every mapped code is in the
          R1 Annex E code catalogue (RUL-009).
        reversibility: UNDOABLE
        repeatKey: "packId — no-op if already approved."
      parameters:
        - name: packId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The pack's signed approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingPack'
              examples:
                default:
                  value: { packId: "MAP-0042", status: "APPROVED" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/mapping-packs/{packId}/activation:
    post:
      operationId: activateMappingPack
      summary: Activate an approved mapping pack from an effective date
      description: >-
        Activation command to console-bff (services.yaml rules-svc
        `provides`, SCR-12.7, FR-B.1, FR-B.4). Evaluation begins selecting
        this pack by transaction date from `effectiveFrom` (FR-B.1).
        Compensated, never undone, by `rollbackPack` (FR-AC.6).
      tags: [mapping-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.1, FR-B.4]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "Mapping pack approved; client acknowledged where required (FR-G.9)."
        reversibility: COMPENSABLE
        repeatKey: "packId — no-op if already active (INV-REQ-1010 armPack pattern)."
      parameters:
        - name: packId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivatePackRequest'
            examples:
              default:
                value: { effectiveFrom: "2026-04-01" }
      responses:
        '200':
          description: The pack, now active from its effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingPack'
              examples:
                default:
                  value: { packId: "MAP-0042", status: "ACTIVE", effectiveFrom: "2026-04-01" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/import:
    post:
      operationId: importRegulatoryPack
      summary: Verify and import a signed regulatory-pack bundle (private form)
      description: >-
        Authoring command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.5, FR-H.6, FR-H.9). Does import steps 1 to 3
        only (INV-REQ-1078, INV-REQ-1081 b1, INV-Q-3478): verifies the
        signature, checks the engine-compatibility range and compiles the
        pack, which is then staged. It produces no dry-run delta: step 4,
        the delta against local data with no data leaving the customer's
        network (FR-H.9), is the separate `dryRun` operation, which the
        console calls once the pack is staged; arming stays refused until
        that delta exists (INV-AC-2077). Does not use the pack — that is
        `armRegulatoryPack`.


        Long command (INV-Q-3478, API-17): an import finished within
        x-timeout returns `201` with the staged pack; one that is not
        returns `202` with `Location` and `Retry-After` pointing at the
        pack's status resource, `getRegulatoryPack`
        (`/internal/v1/rules/regulatory-packs/{packType}/{version}`), which
        reads IMPORTING, then STAGED, or FAILED with the failing catalogue
        code in `failureCode`. A repeat with the same Idempotency-Key
        replays the stored `202` (API-15).


        Error codes (INV-REQ-1078 b1-b3, INV-Q-3588): DEP-002 when the
        signature fails, DEP-003 when the engine is not compatible, and
        RUL-005 when step 3's load and compile fail. Each is returned as the
        error of an import finished within x-timeout, and as `failureCode`
        after a `202`.
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [DEP-002, DEP-003, RUL-005]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-H.6, FR-H.9]
      x-operation:
        role: deployment.operator
        scope: tenant
        precondition: "Signed bundle; engine compatible (FR-H.6)."
        reversibility: UNDOABLE
        repeatKey: "(packType, version) — a repeat verifies and re-acknowledges idempotently."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRegulatoryPackRequest'
            examples:
              default:
                value: { packType: "SCOPE", version: "2026.4", bundleHash: "sha256:3b2c1e9a4f5d6c7b8a9e0f1d2c3b4a5e" }
      responses:
        '201':
          description: The imported pack, staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "STAGED" }
        '202':
          description: >-
            The import did not finish within x-timeout and continues
            asynchronously (API-17, INV-Q-3478); poll the pack's status
            resource.
          headers:
            Location:
              schema: { type: string }
              description: '`/internal/v1/rules/regulatory-packs/{packType}/{version}` (API-17).'
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before polling the status resource (API-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "IMPORTING" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/{packType}/{version}:
    get:
      operationId: getRegulatoryPack
      summary: Read a regulatory pack's status, including an import still running or failed
      description: >-
        The pack status resource of `importRegulatoryPack` (API-17,
        INV-Q-3478, INV-Q-3466 A), the pack's own record, as the batch
        resource is (`getBatchStatus`). `status` reads IMPORTING while the
        import runs, STAGED once it has succeeded, and FAILED when it has
        failed, with `failureCode` the catalogue code that failed it
        (DEP-002, DEP-003 or RUL-005); later states (ACKNOWLEDGED, ARMED)
        follow as before. Query to console-bff, readable by the role and in
        the scope of `importRegulatoryPack` (`deployment.operator`,
        tenant).
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1078, INV-REQ-1081, INV-REQ-1232]
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 16 }
      responses:
        '200':
          description: The pack's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "FAILED", failureCode: "DEP-002" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/{packType}/{version}/acknowledgement:
    post:
      operationId: acknowledgePackDelta
      summary: Acknowledge a published regulatory pack's dry-run delta within the grace window
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.4, FR-G.9). The platform's principal recurring
        obligation: a tenant sees the delta against its own data before
        activation (FR-G.8).
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-G.8, FR-G.9]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "Regulatory pack published; grace window open (FR-G.9)."
        reversibility: UNDOABLE
        repeatKey: "(packType, version, tenant) — no-op if already acknowledged."
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 16 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The acknowledgement, recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "ACKNOWLEDGED" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/{packType}/{version}/arming:
    post:
      operationId: armRegulatoryPack
      summary: Arm a regulatory pack, setting its effective date
      description: >-
        Activation command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.6, FR-AB.10). Private form: `tax.approver` only.
        SaaS form: the operator, after the tenant's grace window. Uses the
        two-phase activation fence — distribute and acknowledge, then arm
        (FR-K.7); a partial load aborts the activation entirely, never
        partially. There is no un-arm (FR-AC.6) — the remedy is
        `rollbackPack` plus `reprocessPopulation`.
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: [RUL-005]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AB.10, FR-K.7, RUL-005]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "All instances acknowledged (FR-K.7); private form only (FR-AB.10)."
        reversibility: COMPENSABLE
        repeatKey: "(packType, version) — no-op if already armed (INV-REQ-1010 armPack example)."
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: version
          in: path
          required: true
          schema: { type: string, maxLength: 16 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivatePackRequest'
            examples:
              default:
                value: { effectiveFrom: "2026-04-01" }
      responses:
        '200':
          description: The pack, armed from its effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "ARMED", effectiveFrom: "2026-04-01" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/{packType}/rollback:
    post:
      operationId: rollbackPack
      summary: Roll back an armed regulatory pack with an effective-dated reversal
      description: >-
        Activation command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.7, FR-AC.6). Supersedes the armed pack; the
        remedy for an armed pack is compensation, never an undo (FR-AC.6).
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-AC.6]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "A pack of this type is armed (FR-AC.6)."
        reversibility: COMPENSABLE
        repeatKey: "(packType, effectiveFrom) — a repeat supersedes idempotently at the same effective date."
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivatePackRequest'
            examples:
              default:
                value: { effectiveFrom: "2026-03-20" }
      responses:
        '200':
          description: The superseding reversal, armed from the original date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryPack'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.3-rollback", status: "ARMED", effectiveFrom: "2026-03-20" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/regulatory-packs/{packType}/reprocessing:
    post:
      operationId: reprocessPopulation
      summary: Re-evaluate the affected population under a superseding pack
      description: >-
        Activation command to console-bff (services.yaml rules-svc
        `provides`, §31.2.6, §31.4.1). Produces resubmissions, safe by
        supersession, for every document the superseding pack reclassifies.
      tags: [regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, "§31.4.1"]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "A superseding pack of this type is armed."
        reversibility: COMPENSABLE
        repeatKey: "(packType, version) — a repeat resumes the same reprocessing run."
      parameters:
        - name: packType
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Reprocessing accepted; runs asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessingRun'
              examples:
                default:
                  value: { packType: "SCOPE", version: "2026.4", status: "RUNNING" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/packs/{packRef}/dry-runs:
    post:
      operationId: dryRun
      summary: Produce a classification delta against the tenant's own historical data
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.2, SCR-12.3, FR-B.3). Read-only by construction:
        writes nothing to canonical or submission state, and produces, per
        changed document, the old and new verdict or code, the taxable
        value and the GST value (FR-B.3).


        For a regulatory pack this is import step 4 (UC-8 step 4,
        INV-REQ-1081 b1, INV-Q-3478): once `importRegulatoryPack` has
        staged the pack, the console calls this operation to produce the
        pack's dry-run delta against local data, run locally with no data
        leaving the customer's network (FR-H.9); arming is refused until
        that delta exists (INV-AC-2077).


        Long command (INV-Q-3438 A, INV-Q-3466 A, API-17): a dry run
        finished within x-timeout returns `200` with `DryRunResult`; one
        that is not returns `202` with `Location` and `Retry-After` pointing
        at its own status resource, `getDryRun`
        (`/internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}`), whose
        `result` is the stored delta the approver signs (UC-4). A repeat with
        the same Idempotency-Key replays the stored `202` (API-15).
      tags: [mapping-packs, regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.3, FR-G.8]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "The pack has a draft or published delta; a historical sample is available (FR-B.3)."
        reversibility: UNDOABLE
        repeatKey: "Idempotency-Key — read-only, writes nothing to canonical or submission state (FR-B.3); a repeat with the same key replays the stored result or 202 (API-15)."
      parameters:
        - name: packRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
            examples:
              default:
                value: { firstPeriodRef: "2026-Q1", lastPeriodRef: "2026-Q2", periodCount: 2 }
      responses:
        '200':
          description: The classification delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              examples:
                default:
                  value:
                    packRef: "MAP-0042"
                    changedCount: 3
                    sample:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        oldCategoryCode: "ZR"
                        newCategoryCode: "SR"
                        taxableValue: "1000.00"
                        gstValue: "90.00"
        '202':
          description: >-
            The dry run did not finish within x-timeout and continues
            asynchronously (API-17, INV-Q-3438 A); poll the status resource.
          headers:
            Location:
              schema: { type: string }
              description: '`/internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}` (API-17).'
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before polling the status resource (API-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesDryRunStatus'
              examples:
                default:
                  value:
                    dryRunId: "DRY-0042-01"
                    packRef: "MAP-0042"
                    state: "RUNNING"
                    startedAt: "2026-03-20T03:15:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}:
    get:
      operationId: getDryRun
      summary: Read a dry run's status and, once it has succeeded, the stored delta
      description: >-
        The status resource of `dryRun` (API-17, INV-Q-3438 A, INV-Q-3466 A).
        `state` is RUNNING, SUCCEEDED or FAILED; `result` is the stored
        delta the approver signs (UC-4, INV-AC-1968), present only when
        SUCCEEDED, and `error` the API-20 envelope only when FAILED. Readable
        only by the principal that started the dry run, and kept at least 7
        days (API-17).
      tags: [mapping-packs, regulatory-packs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [FR-B.3, FR-G.8, INV-REQ-1232]
      parameters:
        - name: packRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: dryRunId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: The dry run's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesDryRunStatus'
              examples:
                default:
                  value:
                    dryRunId: "DRY-0042-01"
                    packRef: "MAP-0042"
                    state: "SUCCEEDED"
                    startedAt: "2026-03-20T03:15:00Z"
                    completedAt: "2026-03-20T03:17:42Z"
                    result:
                      packRef: "MAP-0042"
                      changedCount: 3
                      sample:
                        - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                          oldCategoryCode: "ZR"
                          newCategoryCode: "SR"
                          taxableValue: "1000.00"
                          gstValue: "90.00"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    EvaluateDocumentRequest:
      type: object
      properties:
        entityRef:
          type: string
          maxLength: 40
        transactionDate:
          type: string
          format: date
        internalTaxCode:
          type: string
          maxLength: 40
        election:
          type: string
          maxLength: 40
          description: The entity's VP-53 scheme election.
        counterpartySchemeData:
          type: object
          description: The masterdata-svc resolution's approved-scheme facts (FR-1.14, FR-1.15).
          properties:
            approvedSchemes:
              type: array
              items:
                type: string
                maxLength: 20
          additionalProperties: true
        documentFunction:
          type: string
          enum: [BILL_FOR_PAYMENT, ADJUSTMENT, NOT_A_BILL]
          description: >-
            The caller's assertion of the document's function (INV-REQ-371 b1). Rules
            reclassify it; the canonical value is the classification result in
            EvaluationResult, not this assertion.
        documentKind:
          type: string
          maxLength: 32
          description: >-
            The upstream system's own name for the document: the key of the scope pack's
            classification table (INV-REQ-371 b5, INV-REQ-658). Free text with no value set;
            not the document type code 380 or 381, which is the table's result.
        precedingDocumentNumber:
          type: string
          maxLength: 64
          description: The preceding document's number, for a credit note (INV-REQ-701 b3).
        precedingDocumentDate:
          type: string
          format: date
          description: >-
            The preceding document's transaction date. When populated, the rate, category code
            and mapping resolve by it (INV-REQ-701 b1, INV-REQ-362 b4).
        lineSign:
          type: string
          enum: [POSITIVE, NEGATIVE, ZERO]
          description: >-
            The sign of the line's net amount; no amount is carried. The lines of a document that
            reaches evaluation share one sign (mixed-sign documents are held with ING-015 first,
            INV-REQ-660) and a ZERO line adds none, so this supplies the sign-of-total key of the
            classification table.
        apportionmentMode:
          type: string
          enum: [CLAIMABLE_PORTION, ENTIRE_INVOICE]
          description: The entity's VP-23 election (INV-REQ-370); absent while no election is recorded.
        mixedUse:
          type: string
          enum: [CLAIMABLE_PORTION, ENTIRE_INVOICE]
          description: The line's mixed-use indicator, purchases only (INV-REQ-370 b7).
      required: [entityRef, transactionDate, internalTaxCode]
    EvaluationResult:
      type: object
      properties:
        scopeVerdict:
          type: string
          enum: [SUBMITTABLE, NOT_SUBMITTABLE, PRE_OBLIGATION, IN_SCOPE, OUT_OF_SCOPE, EXCLUDED_TXN]
          x-extensible-enum: true
          description: >-
            IN_SCOPE, OUT_OF_SCOPE and EXCLUDED_TXN are the line verdicts of INV-REQ-374 b1,
            INV-REQ-493 and INV-REQ-496.
        categoryCode:
          type: string
          maxLength: 10
        rate:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,6})?$'
          description: Money as a decimal string (API-12).
        ibt022Statement:
          type: string
          maxLength: 500
        decisionTrace:
          type: object
          additionalProperties: true
        documentFunction:
          type: string
          enum: [BILL_FOR_PAYMENT, ADJUSTMENT, NOT_A_BILL]
          description: The classification result, not the caller's assertion (INV-REQ-371 b1).
        signNormalised:
          type: boolean
          description: The classification table's sign-normalisation result (INV-REQ-659 b2).
        packVersionsApplied:
          type: array
          description: One item per pack type the evaluation applied (INV-REQ-771 b2).
          items:
            $ref: '#/components/schemas/PackVersionApplied'
        severity:
          type: string
          enum: [BLOCK, HOLD, WARN]
          x-extensible-enum: true
          description: >-
            The catalogue severity of a refusal (INV-REQ-1178). Present with `code` when the
            evaluation refuses and absent otherwise (enforced by rules-svc).
        code:
          type: string
          pattern: '^[A-Z]{2,10}-[0-9]{3}$'
          description: >-
            The catalogue code of a refusal, the RUL code of a block (INV-REQ-777). Present with
            `severity` when the evaluation refuses and absent otherwise (enforced by rules-svc).
      required: [scopeVerdict]
    PackVersionApplied:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
          description: A pack type name, as RegulatoryPack.packType uses.
        version:
          type: string
          maxLength: 32
      required: [packType, version]
    DraftMappingPackRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 200
      required: [label]
    MappingPack:
      type: object
      properties:
        packId:
          type: string
          maxLength: 40
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, ACTIVE]
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
        failedRows:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [packId, status]
    MapTaxCodeRequest:
      type: object
      properties:
        internalTaxCode:
          type: string
          maxLength: 40
        irasCode:
          type: string
          maxLength: 10
        sourceClass:
          type: string
          enum: [PRIMARY, SECONDARY, INFERRED]
          x-extensible-enum: true
        schemeTag:
          type: string
          enum: [SELF_BILLING, CUSTOMER_ACCOUNTING, GROSS_MARGIN, DISCOUNTED_SALE_PRICE, APPROVED_MARINE_FUEL_TRADER, ACMT, A3PL, AISS, AMCS, ARCS, SWS, MES, IGDS, CASH_ACCOUNTING, ACMT_RECIPIENT_ACCOUNTING, ACMT_OVERSEAS_CLIENT_PURCHASE, AMCS_SELF_ACCOUNTING]
          x-extensible-enum: true
          description: >-
            Optional scheme tag of the entry, drafted and signed off with it (INV-REQ-2444 b1, b2).
            The scenario pack lists which tags are handled (b3).
      required: [internalTaxCode, irasCode, sourceClass]
    MappingEntry:
      type: object
      properties:
        entryId:
          type: string
          maxLength: 40
        internalTaxCode:
          type: string
          maxLength: 40
        irasCode:
          type: string
          maxLength: 10
        sourceClass:
          type: string
          enum: [PRIMARY, SECONDARY, INFERRED]
          x-extensible-enum: true
        accepted:
          type: boolean
        effectiveFrom:
          type: string
          format: date
          readOnly: true
          description: Start date of the pack version the entry belongs to (INV-REQ-362 b2).
        effectiveTo:
          type: string
          format: date
          readOnly: true
          description: End date of that pack version; absent while open (INV-REQ-362 b2).
        schemeTag:
          type: string
          enum: [SELF_BILLING, CUSTOMER_ACCOUNTING, GROSS_MARGIN, DISCOUNTED_SALE_PRICE, APPROVED_MARINE_FUEL_TRADER, ACMT, A3PL, AISS, AMCS, ARCS, SWS, MES, IGDS, CASH_ACCOUNTING, ACMT_RECIPIENT_ACCOUNTING, ACMT_OVERSEAS_CLIENT_PURCHASE, AMCS_SELF_ACCOUNTING]
          x-extensible-enum: true
          description: >-
            Optional scheme tag of the entry, drafted and signed off with it (INV-REQ-2444 b1, b2).
            The scenario pack lists which tags are handled (b3).
      required: [entryId, internalTaxCode, irasCode, sourceClass]
    ImportMappingSpreadsheetRequest:
      type: object
      properties:
        fileHash:
          type: string
          maxLength: 128
        fileName:
          type: string
          maxLength: 200
      required: [fileHash, fileName]
    AcceptSourceClassEntryRequest:
      type: object
      properties:
        rationale:
          type: string
          maxLength: 500
        expiresOn:
          type: string
          format: date
      required: [rationale, expiresOn]
    ActivatePackRequest:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date
      required: [effectiveFrom]
    ImportRegulatoryPackRequest:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        bundleHash:
          type: string
          maxLength: 128
      required: [packType, version, bundleHash]
    RegulatoryPack:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [STAGED, ACKNOWLEDGED, ARMED, IMPORTING, FAILED, ACTIVE, SUPERSEDED, ABORTED]
          x-extensible-enum: true
          description: >-
            IMPORTING while an import that answered `202` runs; FAILED when
            the import failed, with `failureCode` (INV-Q-3478). The lifecycle is STAGED,
            ACKNOWLEDGED, ARMED, ACTIVE, SUPERSEDED, ABORTED (INV-REQ-1166); ABORTED is an
            activation the fence abandoned with RUL-005.
        effectiveFrom:
          type: string
          format: date
        failureCode:
          type: string
          pattern: '^[A-Z]{2,10}-[0-9]{3}$'
          description: >-
            Present when status is FAILED or ABORTED: the catalogue code that
            failed the import, DEP-002, DEP-003 or RUL-005 (INV-Q-3478); RUL-005 for ABORTED.
        graceWindowEnd:
          type: string
          format: date
          readOnly: true
          description: >-
            End of the grace window computed for the calling tenant, never later than
            `effectiveFrom`; present once the effective date is known (INV-REQ-858 b5).
      required: [packType, version, status]
    ReprocessingRun:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [RUNNING, COMPLETE]
          x-extensible-enum: true
      required: [packType, version, status]
    DryRunRequest:
      type: object
      description: >-
        The historical sample window of a dry run (INV-REQ-1303). Absent body means the last
        complete period. The three properties are given together or not at all (enforced by
        rules-svc, which also applies the 2 to 4 period bound of VP-42).
      properties:
        firstPeriodRef:
          type: string
          maxLength: 32
          description: First period of the sample, as the calendar issues the reference (opaque).
        lastPeriodRef:
          type: string
          maxLength: 32
          description: Last period of the sample (opaque reference).
        periodCount:
          type: integer
          minimum: 1
          description: Number of periods from first through last, never less than one.
      required: [firstPeriodRef, lastPeriodRef, periodCount]
    DryRunResult:
      type: object
      properties:
        packRef:
          type: string
          maxLength: 40
        changedCount:
          type: integer
          minimum: 0
        sample:
          type: array
          items:
            type: object
            properties:
              docUuid:
                type: string
                format: uuid
              oldCategoryCode:
                type: string
                maxLength: 10
              newCategoryCode:
                type: string
                maxLength: 10
              taxableValue:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
              gstValue:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
            required: [docUuid, oldCategoryCode, newCategoryCode, taxableValue, gstValue]
      required: [packRef, changedCount]
    RulesDryRunStatus:
      type: object
      description: >-
        Status resource of dryRun (API-17, INV-Q-3466 A); also the 202 body,
        with state RUNNING. DryRunResult is unchanged.
      properties:
        dryRunId:
          type: string
          maxLength: 40
        packRef:
          type: string
          maxLength: 40
        state:
          $ref: '#/components/schemas/OperationState'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: Present when state is not RUNNING.
        result:
          $ref: '#/components/schemas/DryRunResult'
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required: [dryRunId, packRef, state, startedAt]
    OperationState:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]
      x-extensible-enum: true
      description: API-17's operation-resource state vocabulary.
    ErrorEnvelope:
      description: The API-20 error envelope, carried in a status resource's `error` when its state is FAILED (API-17).
      $ref: '../service-runtime/schemas/error-envelope.schema.json'
  responses:
    Error:
