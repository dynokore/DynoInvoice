  /internal/v1/rules/packs/{packRef}/dry-runs:
    post:
      operationId: dryRun
      summary: Produce a classification delta against the tenant's own historical data
      description: >-
        Approval command to console-bff (services.yaml rules-svc
        `provides`, SCR-11.2, SCR-12.3, FR-B.3). Read-only by construction:
        writes nothing to canonical or submission state, and produces, per
        changed document, the old and new verdict or code, the taxable
        value and the GST value (FR-B.3).


        For a regulatory pack this is import step 4 (UC-8 step 4,
        INV-REQ-1081 b1, INV-Q-3478): once `importRegulatoryPack` has
        staged the pack, the console calls this operation to produce the
        pack's dry-run delta against local data, run locally with no data
        leaving the customer's network (FR-H.9); arming is refused until
        that delta exists (INV-AC-2077).


        Totals by change type (INV-REQ-1020, INV-AC-1997, INV-Q-6283 A):
        `changeTypeTotals` is present on every `result` of `getDryRun` and on
        the `200` answer of `dryRun`. These rules are enforced by the producer
        (rules-svc) and are not expressible in the schema: the items come in
        the order CODE_CHANGED, NEWLY_REFUSED, NEWLY_ACCEPTED, one per type; a
        changed document is one whose outcome under the candidate pack differs
        from its outcome under the current pack, an outcome being the category
        code or, when the evaluation refuses, its catalogue `code` and
        `severity`, and a refusal is a severity of BLOCK or HOLD (WARN is not
        a refusal); the type is NEWLY_REFUSED when the new outcome is a
        refusal and the old one is not, NEWLY_ACCEPTED when the old outcome is
        a refusal and the new one is not, and CODE_CHANGED when both or
        neither are refusals and a code differs; every changed document has
        exactly one type, so the three `documentCount` values add up to
        `changedCount`; `taxableValue` and `gstValue` are sums over the
        documents of that type that leave out each document flagged
        `sgdValuesAbsent`, and `valuesAbsentCount` counts those documents.


        Totals by supply type (INV-Q-10703 B'): `supplyTypeTotals` is present
        next to `changeTypeTotals` on every `result` of `getDryRun` and on the
        `200` answer of `dryRun`; see `DryRunResult.supplyTypeTotals`.


        Long command (INV-Q-3438 A, INV-Q-3466 A, API-17): a dry run
        finished within x-timeout returns `200` with `DryRunResult`; one
        that is not returns `202` with `Location` and `Retry-After` pointing
        at its own status resource, `getDryRun`
        (`/internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}`), whose
        `result` is the stored delta the approver signs (UC-4). A repeat with
        the same Idempotency-Key replays the stored `202` (API-15).
      tags: [mapping-packs, regulatory-packs]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-B.3, FR-G.8]
      x-operation:
        role: tax.approver
        scope: tenant
        precondition: "The pack has a draft or published delta; a historical sample is available (FR-B.3)."
        reversibility: UNDOABLE
        repeatKey: "Idempotency-Key — read-only, writes nothing to canonical or submission state (FR-B.3); a repeat with the same key replays the stored result or 202 (API-15)."
      parameters:
        - name: packRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
            examples:
              default:
                value: { firstPeriodRef: "2026-Q1", lastPeriodRef: "2026-Q2", periodCount: 2 }
      responses:
        '200':
          description: The classification delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              examples:
                default:
                  value:
                    packRef: "MAP-0042"
                    changedCount: 4
                    sample:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        oldCategoryCode: "ZR"
                        newCategoryCode: "SR"
                        taxableValue: "1000.00"
                        gstValue: "90.00"
                    changeTypeTotals:
                      - changeType: "CODE_CHANGED"
                        documentCount: 3
                        taxableValue: "3000.00"
                        gstValue: "270.00"
                      - changeType: "NEWLY_REFUSED"
                        documentCount: 1
                        taxableValue: "500.00"
                        gstValue: "45.00"
                        valuesAbsentCount: 0
                      - changeType: "NEWLY_ACCEPTED"
                        documentCount: 0
                        taxableValue: "0.00"
                        gstValue: "0.00"
                    supplyTypeTotals:
                      - supplyType: "STANDARD_RATED"
                        documentCount: 3
                        taxableValue: "3000.00"
                        gstValue: "270.00"
                      - supplyType: "ZERO_RATED"
                        documentCount: 1
                        taxableValue: "500.00"
                        gstValue: "0.00"
        '202':
          description: >-
            The dry run did not finish within x-timeout and continues
            asynchronously (API-17, INV-Q-3438 A); poll the status resource.
          headers:
            Location:
              schema: { type: string }
              description: '`/internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}` (API-17).'
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before polling the status resource (API-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesDryRunStatus'
              examples:
                default:
                  value:
                    dryRunId: "DRY-0042-01"
                    packRef: "MAP-0042"
                    state: "RUNNING"
                    startedAt: "2026-03-20T03:15:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/rules/packs/{packRef}/dry-runs/{dryRunId}:
    get:
      operationId: getDryRun
      summary: Read a dry run's status and, once it has succeeded, the stored delta
      description: >-
        The status resource of `dryRun` (API-17, INV-Q-3438 A, INV-Q-3466 A).
        `state` is RUNNING, SUCCEEDED or FAILED; `result` is the stored
        delta the approver signs (UC-4, INV-AC-1968), present only when
        SUCCEEDED, and `error` the API-20 envelope only when FAILED. Readable
        only by the principal that started the dry run, and kept at least 7
        days (API-17).


        Totals by change type (INV-REQ-1020, INV-AC-1997, INV-Q-6283 A):
        `changeTypeTotals` is present on every `result` of `getDryRun` and on
        the `200` answer of `dryRun`. These rules are enforced by the producer
        (rules-svc) and are not expressible in the schema: the items come in
        the order CODE_CHANGED, NEWLY_REFUSED, NEWLY_ACCEPTED, one per type; a
        changed document is one whose outcome under the candidate pack differs
        from its outcome under the current pack, an outcome being the category
        code or, when the evaluation refuses, its catalogue `code` and
        `severity`, and a refusal is a severity of BLOCK or HOLD (WARN is not
        a refusal); the type is NEWLY_REFUSED when the new outcome is a
        refusal and the old one is not, NEWLY_ACCEPTED when the old outcome is
        a refusal and the new one is not, and CODE_CHANGED when both or
        neither are refusals and a code differs; every changed document has
        exactly one type, so the three `documentCount` values add up to
        `changedCount`; `taxableValue` and `gstValue` are sums over the
        documents of that type that leave out each document flagged
        `sgdValuesAbsent`, and `valuesAbsentCount` counts those documents.


        Totals by supply type (INV-Q-10703 B'): `supplyTypeTotals` is present
        next to `changeTypeTotals` on every `result` of `getDryRun` and on the
        `200` answer of `dryRun`; see `DryRunResult.supplyTypeTotals`.
      tags: [mapping-packs, regulatory-packs]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->rules-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [FR-B.3, FR-G.8, INV-REQ-1232]
      parameters:
        - name: packRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - name: dryRunId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: The dry run's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesDryRunStatus'
              examples:
                default:
                  value:
                    dryRunId: "DRY-0042-01"
                    packRef: "MAP-0042"
                    state: "SUCCEEDED"
                    startedAt: "2026-03-20T03:15:00Z"
                    completedAt: "2026-03-20T03:17:42Z"
                    result:
                      packRef: "MAP-0042"
                      changedCount: 4
                      sample:
                        - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                          oldCategoryCode: "ZR"
                          newCategoryCode: "SR"
                          taxableValue: "1000.00"
                          gstValue: "90.00"
                      changeTypeTotals:
                        - changeType: "CODE_CHANGED"
                          documentCount: 3
                          taxableValue: "3000.00"
                          gstValue: "270.00"
                        - changeType: "NEWLY_REFUSED"
                          documentCount: 1
                          taxableValue: "500.00"
                          gstValue: "45.00"
                          valuesAbsentCount: 0
                        - changeType: "NEWLY_ACCEPTED"
                          documentCount: 0
                          taxableValue: "0.00"
                          gstValue: "0.00"
                      supplyTypeTotals:
                        - supplyType: "STANDARD_RATED"
                          documentCount: 3
                          taxableValue: "3000.00"
                          gstValue: "270.00"
                        - supplyType: "ZERO_RATED"
                          documentCount: 1
                          taxableValue: "500.00"
                          gstValue: "0.00"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    EvaluateDocumentRequest:
      type: object
      properties:
        entityRef:
          type: string
          maxLength: 40
        transactionDate:
          type: string
          format: date
        internalTaxCode:
          type: string
          maxLength: 40
        election:
          type: string
          maxLength: 40
          description: The entity's VP-53 scheme election.
        counterpartySchemeData:
          type: object
          description: The masterdata-svc resolution's approved-scheme facts (FR-1.14, FR-1.15).
          properties:
            approvedSchemes:
              type: array
              items:
                type: string
                maxLength: 20
          additionalProperties: true
        documentFunction:
          type: string
          enum: [BILL_FOR_PAYMENT, ADJUSTMENT, NOT_A_BILL]
          description: >-
            The caller's assertion of the document's function (INV-REQ-371 b1). Rules
            reclassify it; the canonical value is the classification result in
            EvaluationResult, not this assertion.
        documentKind:
          type: string
          maxLength: 32
          description: >-
            The upstream system's own name for the document: the key of the scope pack's
            classification table (INV-REQ-371 b5, INV-REQ-658). Free text with no value set;
            not the document type code 380 or 381, which is the table's result.
        precedingDocumentNumber:
          type: string
          maxLength: 64
          description: The preceding document's number, for a credit note (INV-REQ-701 b3).
        precedingDocumentDate:
          type: string
          format: date
          description: >-
            The preceding document's transaction date. When populated, the rate, category code
            and mapping resolve by it (INV-REQ-701 b1, INV-REQ-362 b4).
        lineSign:
          type: string
          enum: [POSITIVE, NEGATIVE, ZERO]
          description: >-
            The sign of the line's net amount; no amount is carried. The lines of a document that
            reaches evaluation share one sign (mixed-sign documents are held with ING-015 first,
            INV-REQ-660) and a ZERO line adds none, so this supplies the sign-of-total key of the
            classification table.
        apportionmentMode:
          type: string
          enum: [CLAIMABLE_PORTION, ENTIRE_INVOICE]
          description: The entity's VP-23 election (INV-REQ-370); absent while no election is recorded.
        mixedUse:
          type: string
          enum: [CLAIMABLE_PORTION, ENTIRE_INVOICE]
          description: The line's mixed-use indicator, purchases only (INV-REQ-370 b7).
        direction:
          type: string
          enum: [SALE, PURCHASE]
          description: >-
            The direction of the document for the entity, used only to choose the self-billing party
            (INV-REQ-416); absent means SALE, as on the canonical record request. The caller is
            canonical-svc, which passes the direction it recorded.
      required: [entityRef, transactionDate, internalTaxCode]
    EvaluationResult:
      type: object
      properties:
        scopeVerdict:
          type: string
          enum: [SUBMITTABLE, NOT_SUBMITTABLE, PRE_OBLIGATION, IN_SCOPE, OUT_OF_SCOPE, EXCLUDED_TXN]
          x-extensible-enum: true
          description: >-
            IN_SCOPE, OUT_OF_SCOPE and EXCLUDED_TXN are the line verdicts of INV-REQ-374 b1,
            INV-REQ-493 and INV-REQ-496.
        categoryCode:
          type: string
          maxLength: 10
        rate:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,6})?$'
          description: Money as a decimal string (API-12).
        ibt022Statement:
          type: string
          maxLength: 500
        decisionTrace:
          type: object
          additionalProperties: true
        documentFunction:
          type: string
          enum: [BILL_FOR_PAYMENT, ADJUSTMENT, NOT_A_BILL]
          description: The classification result, not the caller's assertion (INV-REQ-371 b1).
        documentTypeCode:
          type: string
          maxLength: 3
          pattern: '^38[01]$'
          description: >-
            The UNCL1001 document type code the classification table yields: 380 (invoice) or
            381 (credit note) (INV-REQ-658). A pattern, not an enum: API-09 forbids numeric enum
            members (coordinator ruling, option 1).
        signNormalised:
          type: boolean
          description: The classification table's sign-normalisation result (INV-REQ-659 b2).
        cancellation:
          type: boolean
          description: >-
            True only when the classification table row applied to this document has `cancellation`
            true, so payload-svc compares the credit note with its original; absent means false; set
            by rules-svc, never by the caller (INV-REQ-694).
        packVersionsApplied:
          type: array
          description: One item per pack type the evaluation applied (INV-REQ-771 b2).
          items:
            $ref: '#/components/schemas/PackVersionApplied'
        severity:
          type: string
          enum: [BLOCK, HOLD, WARN]
          x-extensible-enum: true
          description: >-
            The catalogue severity of a refusal (INV-REQ-1178). Present with `code` when the
            evaluation refuses and absent otherwise (enforced by rules-svc).
        code:
          type: string
          pattern: '^[A-Z]{2,10}-[0-9]{3}$'
          description: >-
            The catalogue code of a refusal, the RUL code of a block (INV-REQ-777). Present with
            `severity` when the evaluation refuses and absent otherwise (enforced by rules-svc).
        selfBillingAssignment:
          type: object
          description: >-
            Present only when the line's mapping entry carries the scheme tag SELF_BILLING. The pair
            is the one the scenario pack of the version resolved by transaction date holds for the
            party the request's `direction` selects: PURCHASE selects `customerCumIssuer` and SALE
            selects `supplierCumRecipient` (INV-REQ-415, INV-REQ-416). The pack's `sourceClass` and
            `sourceReference` are not copied. canonical-svc copies the object unread to `routingFacts`
            of CanonicalVersionCreated; the lines of one document select the same party object, so
            they carry the same pair. Nothing downstream holds or re-derives the assignment
            (INV-REQ-416, INV-Q-6988).
          properties:
            direction:
              type: string
              enum: [SALE, PURCHASE]
            submissionType:
              type: string
              enum: [TYPE_1A, TYPE_1B, TYPE_2, TYPE_3]
          required: [direction, submissionType]
      required: [scopeVerdict]
    PackVersionApplied:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
          description: A pack type name, as RegulatoryPack.packType uses.
        version:
