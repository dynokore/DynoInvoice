            The user ID of the approver, never a role.
        approvedAt:
          type: string
          format: date-time
        soleOperator:
          type: boolean
          description: >-
            True where the author approved under the recorded sole-operator acknowledgement (INV-REQ-994).
        outstanding:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [CLIENT_ACKNOWLEDGEMENT, CLIENT_APPROVAL]
            x-extensible-enum: true
          description: >-
            The steps that access-svc left outstanding after this approval (INV-REQ-996 behavior 5).
        soleOperatorAckRef:
          type: string
          maxLength: 64
        option:
          type: string
          maxLength: 40
          description: >-
            The option key access-svc answered.
      required: [approvedBy, approvedAt, soleOperator, outstanding]
    MappingPackActivation:
      type: object
      properties:
        noDistinctApprover:
          type: boolean
          description: >-
            True where the installation of the private form recorded no distinct tax.approver or recorded nothing, false otherwise and always false in the SaaS form (INV-REQ-992 behavior 2, INV-REQ-1025). Present on the answer of `activateMappingPack` and on `getMappingPack` once the pack is active.
      required: [noDistinctApprover]
    MappingEntryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MappingEntry'
        nextCursor:
          type: string
      required: [items]
    MapTaxCodeRequest:
      type: object
      properties:
        internalTaxCode:
          type: string
          maxLength: 40
        irasCode:
          type: string
          maxLength: 10
        sourceClass:
          type: string
          enum: [PRIMARY, SECONDARY, INFERRED]
          x-extensible-enum: true
        schemeTag:
          type: string
          enum: [SELF_BILLING, CUSTOMER_ACCOUNTING, GROSS_MARGIN, DISCOUNTED_SALE_PRICE, APPROVED_MARINE_FUEL_TRADER, ACMT, A3PL, AISS, AMCS, ARCS, SWS, MES, IGDS, CASH_ACCOUNTING, ACMT_RECIPIENT_ACCOUNTING, ACMT_OVERSEAS_CLIENT_PURCHASE, AMCS_SELF_ACCOUNTING]
          x-extensible-enum: true
          description: >-
            Optional scheme tag of the entry, drafted and signed off with it (INV-REQ-2444 b1, b2).
            The scenario pack lists which tags are handled (b3).
      required: [internalTaxCode, irasCode, sourceClass]
    MappingEntry:
      type: object
      properties:
        entryId:
          type: string
          maxLength: 40
        internalTaxCode:
          type: string
          maxLength: 40
        irasCode:
          type: string
          maxLength: 10
        sourceClass:
          type: string
          enum: [PRIMARY, SECONDARY, INFERRED]
          x-extensible-enum: true
        accepted:
          type: boolean
        effectiveFrom:
          type: string
          format: date
          readOnly: true
          description: Start date of the pack version the entry belongs to (INV-REQ-362 b2).
        effectiveTo:
          type: string
          format: date
          readOnly: true
          description: End date of that pack version; absent while open (INV-REQ-362 b2).
        schemeTag:
          type: string
          enum: [SELF_BILLING, CUSTOMER_ACCOUNTING, GROSS_MARGIN, DISCOUNTED_SALE_PRICE, APPROVED_MARINE_FUEL_TRADER, ACMT, A3PL, AISS, AMCS, ARCS, SWS, MES, IGDS, CASH_ACCOUNTING, ACMT_RECIPIENT_ACCOUNTING, ACMT_OVERSEAS_CLIENT_PURCHASE, AMCS_SELF_ACCOUNTING]
          x-extensible-enum: true
          description: >-
            Optional scheme tag of the entry, drafted and signed off with it (INV-REQ-2444 b1, b2).
            The scenario pack lists which tags are handled (b3).
      required: [entryId, internalTaxCode, irasCode, sourceClass]
    ImportMappingSpreadsheetRequest:
      type: object
      properties:
        fileHash:
          type: string
          maxLength: 128
        fileName:
          type: string
          maxLength: 200
      required: [fileHash, fileName]
    AcceptSourceClassEntryRequest:
      type: object
      properties:
        rationale:
          type: string
          maxLength: 500
        expiresOn:
          type: string
          format: date
      required: [rationale, expiresOn]
    ActivatePackRequest:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date
      required: [effectiveFrom]
    ImportRegulatoryPackRequest:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        bundleHash:
          type: string
          maxLength: 128
      required: [packType, version, bundleHash]
    RegulatoryPack:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [STAGED, ACKNOWLEDGED, ARMED, IMPORTING, FAILED, ACTIVE, SUPERSEDED, ABORTED]
          x-extensible-enum: true
          description: >-
            IMPORTING while an import that answered `202` runs; FAILED when
            the import failed, with `failureCode` (INV-Q-3478). The lifecycle is STAGED,
            ACKNOWLEDGED, ARMED, ACTIVE, SUPERSEDED, ABORTED (INV-REQ-1166); ABORTED is an
            activation the fence abandoned with RUL-005.
        effectiveFrom:
          type: string
          format: date
        failureCode:
          type: string
          pattern: '^[A-Z]{2,10}-[0-9]{3}$'
          description: >-
            Present when status is FAILED or ABORTED: the catalogue code that
            failed the import, DEP-002, DEP-003 or RUL-005 (INV-Q-3478); RUL-005 for ABORTED.
        graceWindowEnd:
          type: string
          format: date
          readOnly: true
          description: >-
            End of the grace window computed for the calling tenant, never later than
            `effectiveFrom`; present once the effective date is known (INV-REQ-858 b5).
      required: [packType, version, status]
    ReprocessingRun:
      type: object
      properties:
        packType:
          type: string
          maxLength: 40
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum: [RUNNING, COMPLETE]
          x-extensible-enum: true
      required: [packType, version, status]
    DryRunRequest:
      type: object
      description: >-
        The historical sample window of a dry run (INV-REQ-1303). Absent body means the last
        complete period. The three properties are given together or not at all (enforced by
        rules-svc, which also applies the 2 to 4 period bound of VP-42).
      properties:
        firstPeriodRef:
          type: string
          maxLength: 32
          description: First period of the sample, as the calendar issues the reference (opaque).
        lastPeriodRef:
          type: string
          maxLength: 32
          description: Last period of the sample (opaque reference).
        periodCount:
          type: integer
          minimum: 1
          description: Number of periods from first through last, never less than one.
      required: [firstPeriodRef, lastPeriodRef, periodCount]
    DryRunResult:
      type: object
      description: >-
        Result of a dry run. Every changed document, one counted in
        `changedCount`, is counted in `documentCount` of exactly one item of
        each of `changeTypeTotals`, `byPeriod` and `supplyTypeTotals`, so the
        `documentCount` values of each add up to `changedCount`; a changed
        document flagged `sgdValuesAbsent` is counted in `documentCount` and in
        `valuesAbsentCount` and left out of `taxableValue` and `gstValue`
        (INV-Q-10786 A). These rules are enforced by the producer (rules-svc)
        and are not expressible in the schema.
      properties:
        packRef:
          type: string
          maxLength: 40
        changedCount:
          type: integer
          minimum: 0
        sample:
          type: array
          description: >-
            Sampled changed documents. A changed document flagged
            `sgdValuesAbsent` is listed and never omitted, with the flag true and
            `0.00` in both values; for any other item the member is not written.
            Straddling credit notes are not listed here, see
            `straddlingCreditNotes`.
          items:
            type: object
            properties:
              docUuid:
                type: string
                format: uuid
              oldCategoryCode:
                type: string
                maxLength: 10
              newCategoryCode:
                type: string
                maxLength: 10
              taxableValue:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
              gstValue:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
              supplyType:
                type: string
                enum: [STANDARD_RATED, ZERO_RATED, EXEMPT, OUT_OF_SCOPE, IMPORTS]
                x-extensible-enum: true
                description: >-
                  GST supply type of the document, as the sample page stated it
                  (`PackDryRunSampleRecorded`, INV-T-10746); the producer sets it
                  on every item it writes (INV-Q-10703 B').
              sgdValuesAbsent:
                type: boolean
                description: >-
                  True only for a changed document in a foreign currency that has
                  no stated SGD totals (INV-Q-5568 A, INV-Q-5634 A, INV-Q-5818 A).
                  `taxableValue` and `gstValue` are then the placeholder `0.00`; a
                  consumer leaves such an item out of every sum and shows it as
                  absent, and a value is never converted. The producer writes the
                  member only on a flagged item.
            required: [docUuid, oldCategoryCode, newCategoryCode, taxableValue, gstValue]
            if:
              properties:
                sgdValuesAbsent:
                  const: true
              required: [sgdValuesAbsent]
            then:
              properties:
                taxableValue:
                  const: '0.00'
                gstValue:
                  const: '0.00'
              required: [taxableValue, gstValue]
        changeTypeTotals:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/DryRunChangeTypeTotal'
          description: >-
            Summary by change type, one item per type in the order CODE_CHANGED,
            NEWLY_REFUSED, NEWLY_ACCEPTED (INV-REQ-1020, INV-Q-6283 A). Optional
            in the schema so a 1.1 body stays valid; the producer always sets it.
            Totals by change type (INV-REQ-1020, INV-AC-1997, INV-Q-6283 A):
            `changeTypeTotals` is present on every `result` of `getDryRun` and on
            the `200` answer of `dryRun`. These rules are enforced by the producer
            (rules-svc) and are not expressible in the schema: the items come in
            the order CODE_CHANGED, NEWLY_REFUSED, NEWLY_ACCEPTED, one per type; a
            changed document is one whose outcome under the candidate pack differs
            from its outcome under the current pack, an outcome being the category
            code or, when the evaluation refuses, its catalogue `code` and
            `severity`, and a refusal is a severity of BLOCK or HOLD (WARN is not
            a refusal); the type is NEWLY_REFUSED when the new outcome is a
            refusal and the old one is not, NEWLY_ACCEPTED when the old outcome is
            a refusal and the new one is not, and CODE_CHANGED when both or
            neither are refusals and a code differs; every changed document has
            exactly one type, so the three `documentCount` values add up to
            `changedCount`; `taxableValue` and `gstValue` are sums over the
            documents of that type that leave out each document flagged
            `sgdValuesAbsent`, and `valuesAbsentCount` counts those documents.
        supplyTypeTotals:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DryRunSupplyTypeTotal'
          description: >-
            Summary by GST supply type (INV-REQ-997, INV-Q-10703 B'). These rules
            are enforced by the producer (rules-svc) and are not expressible in
            the schema: the array holds one item for each supply type that has at
            least one changed document and none for any other type, so a delta
            that changes no document gives an empty array; a changed document is
            one defined as in `changeTypeTotals`; the `documentCount` values add
            up to `changedCount`; `taxableValue` and `gstValue` are the sums over
            the changed documents of that type that leave out each document
            flagged `sgdValuesAbsent`, and `valuesAbsentCount` counts those
            documents; the items come in the order STANDARD_RATED, ZERO_RATED,
            EXEMPT, OUT_OF_SCOPE, IMPORTS and then any other member in ascending
            order of its string. It is present on every `result` of `getDryRun`
            and on the `200` answer of `dryRun`, and is optional in the schema so
            that a 1.7 body stays valid.
        byPeriod:
          type: array
          items:
            $ref: '#/components/schemas/DryRunPeriodDelta'
          description: >-
            Affected documents by period (INV-REQ-686, INV-REQ-703, INV-AC-748,
            INV-Q-10764 A). These rules are enforced by the producer (rules-svc)
            and are not expressible in the schema: every changed document, one
            counted in `changedCount`, is in exactly one item, so the
            `documentCount` values add up to `changedCount`; a changed document
            flagged `sgdValuesAbsent` is counted in `documentCount` and in
            `valuesAbsentCount` and left out of `taxableValue` and `gstValue`; the
            items come in the calendar's order of periods; `taxableValue`,
            `gstValue` and `valuesAbsentCount` of an item follow the rule of
            `changeTypeTotals`. It is present on every `result` of `getDryRun` and
            on the `200` answer of `dryRun`, with an empty array when there is
            nothing to list, and is optional in the schema so that a 1.9 body
            stays valid.
        straddlingCreditNotes:
          type: array
          items:
            $ref: '#/components/schemas/DryRunStraddlingCreditNote'
          description: >-
            Credit notes whose preceding document is on the other side of the
            change (INV-REQ-703, INV-AC-748, INV-Q-10764 A). These rules are
            enforced by the producer (rules-svc) and are not expressible in the
            schema: it lists the changed credit notes (documentFunction
            `ADJUSTMENT` with a `precedingDocumentDate`) whose `transactionDate`
            and `precedingDocumentDate` lie on different sides of the effective
            date of the candidate pack, and those credit notes are not in
            `sample`. It is present on every `result` of `getDryRun` and on the
            `200` answer of `dryRun`, with an empty array when there is nothing to
            list, and is optional in the schema so that a 1.9 body stays valid.
      required: [packRef, changedCount]
    DryRunPeriodDelta:
      type: object
      description: >-
        Affected documents of one period in a dry-run result (INV-REQ-686,
        INV-Q-10764 A). The producer enforces the counts and sums, see
        `DryRunResult.byPeriod`.
      properties:
        periodRef:
          type: string
          maxLength: 32
          description: Opaque calendar reference of the period, like `DryRunRequest.firstPeriodRef`.
        documentCount:
          type: integer
          minimum: 0
        taxableValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12); sum over the documents of this period, leaving out those flagged `sgdValuesAbsent`.
        gstValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12); sum over the documents of this period, leaving out those flagged `sgdValuesAbsent`.
        valuesAbsentCount:
          type: integer
          minimum: 0
          description: Number of documents of this period flagged `sgdValuesAbsent`, left out of both sums.
      required: [periodRef, documentCount, taxableValue, gstValue]
    DryRunStraddlingCreditNote:
      type: object
      description: >-
        A changed credit note whose preceding document is on the other side of
        the effective date (INV-REQ-703, INV-Q-10764 A). The producer enforces
        the listing rule, see `DryRunResult.straddlingCreditNotes`.
      properties:
        docUuid:
          type: string
          format: uuid
        transactionDate:
          type: string
          format: date
        precedingDocumentDate:
          type: string
          format: date
        oldCategoryCode:
          type: string
          maxLength: 10
        newCategoryCode:
          type: string
          maxLength: 10
        taxableValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        gstValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        sgdValuesAbsent:
          type: boolean
          description: >-
            True only for a changed document in a foreign currency that has
            no stated SGD totals (INV-Q-5568 A, INV-Q-5634 A, INV-Q-5818 A).
            `taxableValue` and `gstValue` are then the placeholder `0.00`; a
            consumer leaves such an item out of every sum and shows it as
            absent, and a value is never converted. The producer writes the
            member only on a flagged item.
      required: [docUuid, transactionDate, precedingDocumentDate, oldCategoryCode, newCategoryCode, taxableValue, gstValue]
      if:
        properties:
          sgdValuesAbsent:
            const: true
        required: [sgdValuesAbsent]
      then:
        properties:
          taxableValue:
            const: '0.00'
          gstValue:
            const: '0.00'
        required: [taxableValue, gstValue]
    DryRunSupplyTypeTotal:
      type: object
      description: >-
        Total of one GST supply type in a dry-run result (INV-REQ-997,
        INV-Q-10703 B'). The producer enforces the sums, see
        `DryRunResult.supplyTypeTotals`.
      properties:
        supplyType:
          type: string
          enum: [STANDARD_RATED, ZERO_RATED, EXEMPT, OUT_OF_SCOPE, IMPORTS]
          x-extensible-enum: true
        documentCount:
          type: integer
          minimum: 1
        taxableValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        gstValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        valuesAbsentCount:
          type: integer
          minimum: 0
          description: Number of documents of this supply type flagged `sgdValuesAbsent`, left out of both sums.
      required: [supplyType, documentCount, taxableValue, gstValue]
    DryRunChangeTypeTotal:
      type: object
      description: >-
        Total of one change type in a dry-run result (INV-REQ-1020,
        INV-AC-1997). The producer enforces the type definitions and the
        sums, see `DryRunResult.changeTypeTotals`.
      properties:
        changeType:
          type: string
          enum: [CODE_CHANGED, NEWLY_REFUSED, NEWLY_ACCEPTED]
          x-extensible-enum: true
        documentCount:
          type: integer
          minimum: 0
        taxableValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12); sum over the documents of this type, leaving out those flagged `sgdValuesAbsent`.
        gstValue:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12); sum over the documents of this type, leaving out those flagged `sgdValuesAbsent`.
        valuesAbsentCount:
          type: integer
          minimum: 0
          description: Number of documents of this type flagged `sgdValuesAbsent`, left out of both sums.
      required: [changeType, documentCount, taxableValue, gstValue]
    RulesDryRunStatus:
      type: object
      description: >-
        Status resource of dryRun (API-17, INV-Q-3466 A); also the 202 body,
        with state RUNNING. DryRunResult is unchanged.
      properties:
        dryRunId:
          type: string
          maxLength: 40
        packRef:
          type: string
          maxLength: 40
        state:
          $ref: '#/components/schemas/OperationState'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: Present when state is not RUNNING.
        result:
          $ref: '#/components/schemas/DryRunResult'
        error:
          $ref: '#/components/schemas/ErrorEnvelope'
      required: [dryRunId, packRef, state, startedAt]
    OperationState:
      type: string
      enum: [RUNNING, SUCCEEDED, FAILED]
      x-extensible-enum: true
      description: API-17's operation-resource state vocabulary.
