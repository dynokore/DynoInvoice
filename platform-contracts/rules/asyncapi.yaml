asyncapi: 3.1.0
info:
  title: rules events
  version: 1.1.0
  description: >-
    Every event rules produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added rules's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: rules (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  rulesRulePackStaged:
    address: 'gst.rules.rule-pack-staged.v1'
    messages:
      RulePackStaged:
        $ref: '#/components/messages/RulePackStaged'

  rulesRulePackActivated:
    address: 'gst.rules.rule-pack-activated.v1'
    messages:
      RulePackActivated:
        $ref: '#/components/messages/RulePackActivated'

  rulesPackCurrencyChanged:
    address: 'gst.rules.pack-currency-changed.v1'
    messages:
      PackCurrencyChanged:
        $ref: '#/components/messages/PackCurrencyChanged'
  rulesExampleHappened:
    address: 'gst.rules.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishRulePackStaged:
    action: send
    description: RulePackStaged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/rulesRulePackStaged'
    messages:
      - $ref: '#/channels/rulesRulePackStaged/messages/RulePackStaged'

  publishRulePackActivated:
    action: send
    description: RulePackActivated — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/rulesRulePackActivated'
    messages:
      - $ref: '#/channels/rulesRulePackActivated/messages/RulePackActivated'

  publishPackCurrencyChanged:
    action: send
    description: PackCurrencyChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/rulesPackCurrencyChanged'
    messages:
      - $ref: '#/channels/rulesPackCurrencyChanged/messages/PackCurrencyChanged'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/rulesExampleHappened'
    messages:
      - $ref: '#/channels/rulesExampleHappened/messages/ExampleHappened'
components:
  messages:
    RulePackStaged:
      name: com.dynokore.gst.rules.RulePackStaged.v1
      # INV-REQ-1210, INV-Q-6281: the topic is kept while any pack version it carries is resolvable.
      x-retained-while-resolvable: true
      title: RulePackStaged
      summary: RulePackStaged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event RulePackStaged (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: rules-svc. Consumed by: notification-svc, payload-svc,
        reconciliation-svc, tenancy-svc. Delivery: At-least-once; retained while any pack version it carries
        can still be resolved (FR-Z.10). Payload (catalogue text): pack identifier, pack type, version,
        effective_from, min_engine_version, and the signed artefact — manifest, checksums, signature and
        contents. Added 25 Sep 2026 (AD-31). Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/rule-pack-staged-payload.schema.json'

    RulePackActivated:
      name: com.dynokore.gst.rules.RulePackActivated.v1
      title: RulePackActivated
      summary: RulePackActivated — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event RulePackActivated (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: rules-svc. Consumed by: notification-svc, payload-svc,
        reconciliation-svc, tenancy-svc. Delivery: Fenced, §5.5. Payload (catalogue text): pack identifier,
        version, effective-from. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/rule-pack-activated-payload.schema.json'

    PackCurrencyChanged:
      name: com.dynokore.gst.rules.PackCurrencyChanged.v1
      title: PackCurrencyChanged
      summary: PackCurrencyChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PackCurrencyChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: rules-svc. Consumed by: console-bff, notification-svc. Delivery:
        At-least-once. Payload (catalogue text): DEP code (DEP-001 to DEP-003), raised or cleared, pack and
        version where known, days to the unactivated pack's effective date, days since the feed was last
        reached or a bundle last imported (VP-72). Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/pack-currency-changed-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.rules.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
