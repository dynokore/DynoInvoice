asyncapi: 3.0.0
info:
  title: service-runtime shared event components
  version: 1.0.0
  description: >-
    Not a service: holds the CloudEvents envelope every other directory's
    asyncapi.yaml references (API-40, ./schemas/cloud-event-envelope.schema.json)
    rather than redeclaring its own copy, and the platform event class
    (FR-AH.15, AD-27, AD-31) — AuditEntryRecorded, JobRunRecorded,
    PolicyChanged, PackReadinessAcknowledged, ConnectionStatusChanged,
    EvidenceArtefactRecorded, JobRegistered — whose schema is owned by `service-runtime`
    alone rather than by any one producer (STK-61, INV-REQ-1226 b1-b2,
    INV-ADR-285; INV-T-2853/T9's "T11 authors the three platform events
    once under service-runtime/" follow-up, extended by INV-T-2855/T11 to
    five; EvidenceArtefactRecorded added by INV-T-3313 per INV-Q-3257 and
    INV-API-3310 — T11's note leaving it to evidence-svc under INV-ADR-282
    is superseded: INV-ADR-282 makes evidence-svc the system of record for
    audit entries and decision traces, not the owner of this schema;
    JobRegistered added by INV-T-3007 per owner ruling INV-Q-2981 and
    INV-API-3020). Every platform event's `type` uses the shared
    `com.dynokore.gst.platform.<EventName>.v1` name (AD-24 convention) so
    every producer's instances are one consumer subscription; a producer
    references the message defined here rather than redeclaring its own
    copy (INV-T-2853's dedup follow-up, !3). Owned by whoever owns the
    `service-runtime` L1 module (STK-60).
  contact:
    name: service-runtime (see CODEOWNERS)
  license:
    name: Proprietary
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  platformAuditEntryRecorded:
    address: 'gst.platform.audit-entry-recorded.v1'
    messages:
      AuditEntryRecorded:
        $ref: '#/components/messages/AuditEntryRecorded'

  platformJobRunRecorded:
    address: 'gst.platform.job-run-recorded.v1'
    messages:
      JobRunRecorded:
        $ref: '#/components/messages/JobRunRecorded'

  platformPolicyChanged:
    address: 'gst.platform.policy-changed.v1'
    messages:
      PolicyChanged:
        $ref: '#/components/messages/PolicyChanged'

  platformPackReadinessAcknowledged:
    address: 'gst.platform.pack-readiness-acknowledged.v1'
    messages:
      PackReadinessAcknowledged:
        $ref: '#/components/messages/PackReadinessAcknowledged'

  platformConnectionStatusChanged:
    address: 'gst.platform.connection-status-changed.v1'
    messages:
      ConnectionStatusChanged:
        $ref: '#/components/messages/ConnectionStatusChanged'

  platformEvidenceArtefactRecorded:
    address: 'gst.platform.evidence-artefact-recorded.v1'
    messages:
      EvidenceArtefactRecorded:
        $ref: '#/components/messages/EvidenceArtefactRecorded'

  platformJobRegistered:
    address: 'gst.platform.job-registered.v1'
    messages:
      JobRegistered:
        $ref: '#/components/messages/JobRegistered'
operations:
  publishAuditEntryRecorded:
    action: send
    description: AuditEntryRecorded — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformAuditEntryRecorded'
    messages:
      - $ref: '#/channels/platformAuditEntryRecorded/messages/AuditEntryRecorded'

  publishJobRunRecorded:
    action: send
    description: JobRunRecorded — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformJobRunRecorded'
    messages:
      - $ref: '#/channels/platformJobRunRecorded/messages/JobRunRecorded'

  publishPolicyChanged:
    action: send
    description: PolicyChanged — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformPolicyChanged'
    messages:
      - $ref: '#/channels/platformPolicyChanged/messages/PolicyChanged'

  publishPackReadinessAcknowledged:
    action: send
    description: PackReadinessAcknowledged — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformPackReadinessAcknowledged'
    messages:
      - $ref: '#/channels/platformPackReadinessAcknowledged/messages/PackReadinessAcknowledged'

  publishConnectionStatusChanged:
    action: send
    description: ConnectionStatusChanged — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformConnectionStatusChanged'
    messages:
      - $ref: '#/channels/platformConnectionStatusChanged/messages/ConnectionStatusChanged'

  publishEvidenceArtefactRecorded:
    action: send
    description: EvidenceArtefactRecorded — catalogued in model/architecture/events.yaml (§19.8, FR-AH.15).
    channel:
      $ref: '#/channels/platformEvidenceArtefactRecorded'
    messages:
      - $ref: '#/channels/platformEvidenceArtefactRecorded/messages/EvidenceArtefactRecorded'

  publishJobRegistered:
    action: send
    description: JobRegistered — platform event added by owner ruling INV-Q-2981 (INV-REQ-1226, INV-API-3020).
    channel:
      $ref: '#/channels/platformJobRegistered'
    messages:
      - $ref: '#/channels/platformJobRegistered/messages/JobRegistered'
components:
  messages:
    AuditEntryRecorded:
      name: com.dynokore.gst.platform.AuditEntryRecorded.v1
      title: AuditEntryRecorded
      summary: AuditEntryRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AuditEntryRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: every service. Consumed by: evidence-svc. Delivery:
        At-least-once — platform event (AD-27). Payload (catalogue text): actor, action, scope, reason,
        prior state. Written through the producing service's own outbox in the same transaction as the
        change it records (ARC-05, INV-NOTE-3#row:SB-05); evidence-svc is its system of record (INV-ADR-282).
        Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/audit-entry-recorded-payload.schema.json'

    JobRunRecorded:
      name: com.dynokore.gst.platform.JobRunRecorded.v1
      title: JobRunRecorded
      summary: JobRunRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event JobRunRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: every service with scheduled jobs. Consumed by:
        console-bff, notification-svc. Delivery: At-least-once — platform event (AD-27). Payload (catalogue
        text): job, owner service, entity scope, outcome, duration. Authored by INV-T-2855 (T11).
        INV-T-3007 adds the optional fields schedule, criticality, tolerance, scheduledFor and
        nextRunAt (coordinator ruling INV-Q-2942; additive minor, API-41).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/job-run-recorded-payload.schema.json'

    PolicyChanged:
      name: com.dynokore.gst.platform.PolicyChanged.v1
      title: PolicyChanged
      summary: PolicyChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PolicyChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18, §37,
        INV-REQ-1226; class: platform). Emitted by: every service owning a variation point. Consumed by:
        none. Delivery: At-least-once — platform event (AD-27, §37); feeds runtime replicas directly
        rather than through a consumer inbox (feeds_runtime_replicas, INV-NOTE-3 §37). Payload (catalogue
        text): scope, VP id, value, effective date, source (default, profile or override), relaxation
        acknowledgement reference. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/policy-changed-payload.schema.json'

    PackReadinessAcknowledged:
      name: com.dynokore.gst.platform.PackReadinessAcknowledged.v1
      title: PackReadinessAcknowledged
      summary: PackReadinessAcknowledged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PackReadinessAcknowledged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §5.5,
        §28.18, INV-REQ-1226; class: platform). Emitted by: notification-svc, payload-svc,
        reconciliation-svc, tenancy-svc. Consumed by: rules-svc. Delivery: At-least-once — platform event
        (AD-27, §5.5). Payload (catalogue text): pack identifier, version, instance, outcome — loaded, or
        failed with the reason. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/pack-readiness-acknowledged-payload.schema.json'

    ConnectionStatusChanged:
      name: com.dynokore.gst.platform.ConnectionStatusChanged.v1
      title: ConnectionStatusChanged
      summary: ConnectionStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ConnectionStatusChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: access-svc, evidence-svc, ingestion-svc, masterdata-svc,
        notification-svc, rules-svc, tenancy-svc, transport-svc. Consumed by: console-bff, notification-svc.
        Delivery: At-least-once — platform event (AD-27). Payload (catalogue text): connection, state, last
        failure. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/connection-status-changed-payload.schema.json'

    EvidenceArtefactRecorded:
      name: com.dynokore.gst.platform.EvidenceArtefactRecorded.v1
      title: EvidenceArtefactRecorded
      summary: EvidenceArtefactRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event EvidenceArtefactRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: access-svc, masterdata-svc, payload-svc,
        rules-svc. Consumed by: evidence-svc. Delivery: At-least-once — platform event (AD-27). Payload (catalogue
        text): artefact type, reference, hash — artefactType an extensible UPPER_SNAKE_CASE enumeration,
        hash the SHA-256 of the artefact bytes as 64 lowercase hex characters (INV-Q-3341). Written through the producing service's own outbox in the
        transaction that records the artefact (INV-ADR-283); evidence-svc deduplicates on the event id
        through its inbox and records each artefact once, unique on (artefactType, reference, hash); no
        ordering is needed across artefacts (INV-API-3310, INV-Q-3257). Authored by INV-T-3313.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/evidence-artefact-recorded-payload.schema.json'

    JobRegistered:
      name: com.dynokore.gst.platform.JobRegistered.v1
      title: JobRegistered
      summary: JobRegistered — a scheduled job announced at service start (INV-Q-2981).
      description: >-
        Platform event JobRegistered (INV-REQ-1226 b1-b2, INV-ADR-285, owner ruling INV-Q-2981,
        INV-API-3020; class: platform). Emitted by: every service with scheduled jobs. Consumed by:
        console-bff, notification-svc. Delivery: At-least-once — platform event (AD-27): at start each
        instance's service-runtime writes one JobRegistered per registered job to the service's
        transactional outbox (INV-ADR-283). A registration belongs to the service, not to a tenant: it is
        stored under the reserved platform TenantId and published without tenantid or entityref
        (INV-Q-2927 option D, INV-REQ-1226 b7). Partition key (ownerService, job); consumers deduplicate
        on the event id and upsert on (ownerService, job), the latest envelope time superseding earlier
        registrations; a JobRunRecorded seen before its job's registration is kept and joined later.
        Payload: job, owner service, entity scope (PLATFORM or ENTITY), schedule, criticality
        (STANDARD or DEADLINE_CRITICAL) and tolerance, all required (INV-REQ-1136, INV-Q-2942).
        Authored by INV-T-3007.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/job-registered-payload.schema.json'
