components:
  messages:
    AuditEntryRecorded:
      name: com.dynokore.gst.platform.AuditEntryRecorded.v1
      title: AuditEntryRecorded
      summary: AuditEntryRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AuditEntryRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: every service. Consumed by: evidence-svc. Delivery:
        At-least-once — platform event (AD-27). Payload (catalogue text): actor, action, scope, reason,
        prior state. Written through the producing service's own outbox in the same transaction as the
        change it records (ARC-05, INV-NOTE-3#row:SB-05); evidence-svc is its system of record (INV-ADR-282).
        Authored by INV-T-2855 (T11). INV-T-6256 adds the optional property callingSystem (INV-REQ-587,
        ruling INV-Q-6252; additive minor, API-41): the calling system of a filing-workflow principal.
      # INV-T-3606 (owner ruling INV-Q-3627): a record topic; the purge never removes it above
      # evidence-svc's recorded position. Copied into event-log/topics.yaml as record_topic.
      x-record-topic: true
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/audit-entry-recorded-payload.schema.json'

    JobRunRecorded:
      name: com.dynokore.gst.platform.JobRunRecorded.v1
      title: JobRunRecorded
      summary: JobRunRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event JobRunRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: every service. Consumed by:
        console-bff, notification-svc. Only a service with scheduled jobs records job runs (INV-Q-3539).
        Delivery: At-least-once — platform event (AD-27). Payload (catalogue
        text): job, owner service, entity scope, outcome, duration. Authored by INV-T-2855 (T11).
        INV-T-3007 adds the optional fields schedule, criticality, tolerance, scheduledFor and
        nextRunAt (coordinator ruling INV-Q-2942; additive minor, API-41).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/job-run-recorded-payload.schema.json'

    PolicyChanged:
      name: com.dynokore.gst.platform.PolicyChanged.v1
      title: PolicyChanged
      summary: PolicyChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PolicyChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18, §37,
        INV-REQ-1226; class: platform). Emitted by: every service. Consumed by:
        access-svc, aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc, transport-svc. Only a service owning a variation point emits it (INV-Q-3539). Delivery: At-least-once — platform event (AD-27, §37); feeds the policy replica of every service (feeds_runtime_replicas, INV-NOTE-3 §37; INV-Q-8998). Payload (catalogue
        text): scope, VP id, value, effective date, source (default, profile or override), relaxation
        acknowledgement reference. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/policy-changed-payload.schema.json'

    PackReadinessAcknowledged:
      name: com.dynokore.gst.platform.PackReadinessAcknowledged.v1
      title: PackReadinessAcknowledged
      summary: PackReadinessAcknowledged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PackReadinessAcknowledged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §5.5,
        §28.18, INV-REQ-1226; class: platform). Emitted by: notification-svc, payload-svc,
        reconciliation-svc, tenancy-svc. Consumed by: rules-svc. Delivery: At-least-once — platform event
        (AD-27, §5.5). Payload (catalogue text): pack identifier, version, instance, outcome — loaded, or
        failed with the reason. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/pack-readiness-acknowledged-payload.schema.json'

    PrivacyNoticeDue:
      name: com.dynokore.gst.platform.PrivacyNoticeDue.v1
      title: PrivacyNoticeDue
      summary: PrivacyNoticeDue
      description: >-
        The notice to the individual falls due on an access or correction request case as the response
        deadline approaches unanswered (INV-REQ-1403, INV-AC-1404, INV-Q-6851). Class: platform. Written
        with the tenant-wide entity because a privacy case concerns the whole tenant (INV-Q-6851).
        Emitted by: evidence-svc. Consumed by: notification-svc. Delivery: At-least-once. One event per
        case. The payload carries no personal data.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/privacy-notice-due-payload.schema.json'

    AccreditationAlertRaised:
      name: com.dynokore.gst.platform.AccreditationAlertRaised.v1
      title: AccreditationAlertRaised
      summary: AccreditationAlertRaised
      description: >-
        An accreditation alert is raised when a release train that changes what accreditation covered
        opens an accreditation task (INV-REQ-1365, INV-AC-2340, INV-Q-7316, INV-Q-7336). Class: platform.
        Written under the platform tenant with the platform entity because the platform is not a tenant
        (INV-REQ-1226 b7). Emitted by: control-plane-svc. Consumed by: notification-svc. Delivery:
        At-least-once. One event per alertRef. The payload carries no invoice content.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/accreditation-alert-raised-payload.schema.json'

    AuthorityChanged:
      name: com.dynokore.gst.platform.AuthorityChanged.v1
      title: AuthorityChanged
      summary: AuthorityChanged
      description: >-
        A grant, consent, principal or revocation change of authority, with its validity and a monotonic
        authority version (INV-REQ-1201, INV-REQ-815, INV-Q-9229 A). A role grant record (changeKind ROLE_GRANT) is one grant of a role, carried once (INV-REQ-864, INV-Q-8972 A). CloudEvents subject is principalRef/entityRef (consent record tenant/clientEntityRef; principal record principalRef; role grant record principalRef/grantRef). Class: platform. Written with a real
        tenant and the tenant-wide entity, and a grant at INSTALLATION scope under the platform tenant with
        no tenant and no entity (INV-Q-9229 A). Emitted by: access-svc. Consumed by: aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc, transport-svc. Delivery:
        At-least-once. Every service's authority replica is fed from this topic (INV-REQ-1201, INV-ADR-284).
        access-svc, the source, does not subscribe: it decides from its own store (INV-Q-8994).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/authority-changed-payload.schema.json'

    BreakGlassAlertRaised:
      name: com.dynokore.gst.platform.BreakGlassAlertRaised.v1
      title: BreakGlassAlertRaised
      summary: BreakGlassAlertRaised
      description: >-
        A break-glass alert is raised for each unlock and each recorded action under break-glass:
        ACC-002 (INV-REQ-897 b1, INV-Q-8839). Class: platform. Written with a real tenant and the
        tenant-wide entity because a break-glass unlock concerns a tenant or an installation and not
        one registered entity. Emitted by: access-svc. Consumed by: notification-svc. Delivery:
        At-least-once. One event per unlock and per action. The payload carries no invoice content
        and no credential.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/break-glass-alert-raised-payload.schema.json'

    TenantWideEvidenceIntegrityFailed:
      name: com.dynokore.gst.platform.TenantWideEvidenceIntegrityFailed.v1
      title: TenantWideEvidenceIntegrityFailed
      summary: TenantWideEvidenceIntegrityFailed
      description: >-
        The verification of a tenant-wide audit chain failed and a new integrity_failure row was
        opened for its range (INV-REQ-662 b3, INV-Q-12994 A). Class: platform. Written with a real
        tenant and the tenant-wide entity because the failed chain is the tenant-wide audit chain and
        not one registered entity (a domain event cannot carry it). The payload shape equals that of
        EvidenceIntegrityFailed: range and failingRecord. Emitted by: evidence-svc. Consumed by: console-bff, notification-svc.
        Delivery: At-least-once. One event per newly opened failure row of a tenant-wide chain. The
        payload carries no invoice content.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/tenant-wide-evidence-integrity-failed-payload.schema.json'

    BreakGlassSessionChanged:
      name: com.dynokore.gst.platform.BreakGlassSessionChanged.v1
      title: BreakGlassSessionChanged
      summary: BreakGlassSessionChanged
      description: >-
        A break-glass session opens on an unlock and is sealed again on a reseal: unlockRef, tenantRef,
        status OPEN or SEALED, expiresAt and the approvers (INV-REQ-896, INV-Q-9119 A). Class: platform.
        Written with a real tenant and the tenant-wide entity because a break-glass session concerns a
        tenant and not one registered entity. Emitted by: access-svc. Consumed by: aggregation-svc,
        canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc,
        notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc,
        transport-svc. Delivery: At-least-once. One event per unlock and per reseal. Subscribed by the
        authority replica of every service except access-svc (INV-Q-9298 B: access-svc supplies the
        session view from its own table). The payload carries no invoice content and no credential.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/break-glass-session-changed-payload.schema.json'

    BreakGlassActionReported:
      name: com.dynokore.gst.platform.BreakGlassActionReported.v1
      title: BreakGlassActionReported
      summary: BreakGlassActionReported
      description: >-
        An action a service carried out under an open break-glass session is reported so that access-svc
        records it once with the same ACC-002 alert and audit entry as a synchronous action
        (INV-REQ-897, INV-Q-9117 A, INV-Q-9313 A). Class: platform. Written with a real tenant and the
        tenant-wide entity because a break-glass action concerns a tenant and not one registered entity.
        Emitted by: tenancy-svc. Consumed by: access-svc. Delivery: At-least-once. One event per reported
        action; a second delivery of the same reportId records nothing more. The payload carries no
        invoice content and no credential.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/break-glass-action-reported-payload.schema.json'

    ConnectionStatusChanged:
      name: com.dynokore.gst.platform.ConnectionStatusChanged.v1
      title: ConnectionStatusChanged
      summary: ConnectionStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ConnectionStatusChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: access-svc, evidence-svc, ingestion-svc, masterdata-svc,
        notification-svc, rules-svc, tenancy-svc, transport-svc. Consumed by: console-bff, notification-svc.
        Delivery: At-least-once — platform event (AD-27). Payload (catalogue text): connection, state, last
        failure. Authored by INV-T-2855 (T11).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/connection-status-changed-payload.schema.json'

    EvidenceArtefactRecorded:
      name: com.dynokore.gst.platform.EvidenceArtefactRecorded.v1
      title: EvidenceArtefactRecorded
      summary: EvidenceArtefactRecorded — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event EvidenceArtefactRecorded (model/architecture/events.yaml, INV-NOTE-3 §19.8, §28.18,
        INV-REQ-1226; class: platform). Emitted by: access-svc, masterdata-svc, payload-svc,
        rules-svc. Consumed by: evidence-svc. Delivery: At-least-once — platform event (AD-27). Payload (catalogue
        text): artefact type, reference, hash — artefactType an extensible UPPER_SNAKE_CASE enumeration,
        hash the SHA-256 of the artefact bytes as 64 lowercase hex characters (INV-Q-3341). Written through the producing service's own outbox in the
        transaction that records the artefact (INV-ADR-283); evidence-svc deduplicates on the event id
        through its inbox and records each artefact once, unique on (artefactType, reference, hash); no
        ordering is needed across artefacts (INV-API-3310, INV-Q-3257). Authored by INV-T-3313.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/evidence-artefact-recorded-payload.schema.json'

    JobRegistered:
      name: com.dynokore.gst.platform.JobRegistered.v1
      title: JobRegistered
      summary: JobRegistered — a scheduled job announced at service start (INV-Q-2981).
      description: >-
        Platform event JobRegistered (INV-REQ-1226 b1-b2, INV-ADR-285, owner ruling INV-Q-2981,
        INV-API-3020; class: platform). Emitted by: every service. Consumed by:
        console-bff, notification-svc. Only a service with scheduled jobs registers any (INV-Q-3539).
        Delivery: At-least-once — platform event (AD-27): at start each
        instance's service-runtime writes one JobRegistered per registered job to the service's
        transactional outbox (INV-ADR-283). A registration belongs to the service, not to a tenant: it is
        stored under the reserved platform TenantId and published without tenantid or entityref
        (INV-Q-2927 option D, INV-REQ-1226 b7). Partition key (ownerService, job); consumers deduplicate
        on the event id and upsert on (ownerService, job), the latest envelope time superseding earlier
        registrations; a JobRunRecorded seen before its job's registration is kept and joined later.
        Payload: job, owner service, entity scope (PLATFORM or ENTITY), schedule, criticality
        (STANDARD or DEADLINE_CRITICAL) and tolerance, all required (INV-REQ-1136, INV-Q-2942).
        Authored by INV-T-3007.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/job-registered-payload.schema.json'

    ReplayRequested:
      name: com.dynokore.gst.platform.ReplayRequested.v1
      title: ReplayRequested
      summary: ReplayRequested — a consumer's request that a producer replay by scope or run a full sync (INV-Q-3599).
      description: >-
        Platform event ReplayRequested (INV-REQ-1226 b1-b2, coordinator ruling INV-Q-3674, owner ruling
        INV-Q-3599 A, INV-REQ-1205 b4, INV-API-3654; class: platform). No channel here: its topics are
        generated by INV-T-3606, one request topic per consumer, gst.<consumer>.replay-requested.v1, whose
        producer is that consumer and whose subscribers are every producer of a topic it subscribes to
        ('every service' counting as one). A consumer's rebuildConsumer writes it to the consumer's own
        transactional outbox in the transaction that moves its positions to the head (and, for a full sync,
        clears the read model built from that producer's topics and deletes its held docsequence rows for
        that producer, INV-Q-3603). Payload: replayId (new per request), producer (the addressee: the pair's
        catalogue producer value, a service name or 'every service', INV-Q-3625), mode SCOPE or FULL_SYNC,
        and scope, present only with SCOPE: kind TENANT {tenantId}, ENTITY {tenantId, entityRef} or PERIOD
        {from, to, tenantId?}, PERIOD a half-open range on the time the producer's state was last changed,
        across all tenants unless narrowed by tenantId (owner ruling INV-Q-3671). Every subscribed producer
        receives every request; only the addressee acts on it. A producer takes the request through its
        inbox on the event id and commits the request as handled (its inbox row and its position on the
        request topic) only in the transaction that writes its ReplayCompleted, emitting the replayed
        events in earlier transactions; after a crash before that it reads the request again and restarts
        the replay from the start under the same replayId, the re-sent events being STALE at the consumer
        (coordinator ruling INV-Q-3676). A producer handles one consumer's requests in log order, one at a
        time. Stored under the reserved platform TenantId and published without tenantid or entityref
        (INV-REQ-1226 b7); the requesting consumer is the CloudEvents source (API-40). Carries no invoice
        content. Delivery: At-least-once — platform event (AD-27). Authored by INV-T-3634.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/replay-requested-payload.schema.json'

    ReplayCompleted:
      name: com.dynokore.gst.platform.ReplayCompleted.v1
      title: ReplayCompleted
      summary: ReplayCompleted — the completion marker a producer writes last on the pair's replay topic (INV-Q-3644).
      description: >-
        Platform event ReplayCompleted (INV-REQ-1226 b1-b2, coordinator rulings INV-Q-3644 and INV-Q-3674,
        owner ruling INV-Q-3599 A, INV-REQ-1205 b4, INV-API-3655; class: platform). No channel here: every
        replay topic generated by INV-T-3606, gst.<producer>.replay-<consumer>.v1 or, for the 'every
        service' pairs, gst.platform.replay-<consumer>.v1, carries this type besides the consumer's
        subscribed types. The producer writes it last for a replay, in the transaction that commits the
        request's inbox row and its position on the request topic (INV-Q-3676), so log-offset order puts it
        after every event of that replay; an empty scope gives a replay holding only the marker. Payload:
        replayId (the ReplayRequested it answers) and eventsReplayed (0 or more). The consumer takes it
        through its inbox on the event id and closes 'rebuild required' when it applies the marker, and only
        then (INV-REQ-1205 b6). On an 'every service' replay topic several services answer one request, each
        with its own marker: the consumer keeps, in its consumption state (not in the read model a full sync
        clears), the set of sources it has seen on that topic, and closes the incident when it has applied a
        marker for the replayId from each of them; markers from other services are applied as normal and
        change nothing; a service whose every event on the topic was purged before the consumer saw one is
        not waited for (owner ruling INV-Q-3669). The producing service is the CloudEvents source (API-40);
        an installation-level marker is stored under the platform TenantId without tenantid (INV-REQ-1226
        b7). Carries no invoice content. Delivery: At-least-once — platform event (AD-27). Authored by
        INV-T-3634.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/replay-completed-payload.schema.json'

    PackDryRunSampleRequested:
      name: com.dynokore.gst.platform.PackDryRunSampleRequested.v1
      title: PackDryRunSampleRequested
      summary: PackDryRunSampleRequested — rules-svc asks canonical-svc for the historical sample of a pack dry run (INV-Q-4870 B).
      description: >-
        Platform event PackDryRunSampleRequested (INV-REQ-772 b1, INV-REQ-1303, owner ruling INV-Q-4870 B,
        names pinned by INV-Q-5194; class: platform). Emitted by: rules-svc. Consumed by: canonical-svc.
        Delivery: At-least-once. A dry run evaluates a historical sample under the current and the candidate
        pack; canonical-svc supplies the sample over the event log and rules-svc keeps it for the run. The
        tenant is the envelope attribute tenantid (API-40), not a payload property. Payload: dryRunId,
        entityRef, the first and last calendar period references and their count (at least one complete
        period, INV-REQ-1303) and the current and candidate pack versions. Carries no invoice content.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/pack-dry-run-sample-requested-payload.schema.json'

    PackDryRunSampleRecorded:
      name: com.dynokore.gst.platform.PackDryRunSampleRecorded.v1
      title: PackDryRunSampleRecorded
      summary: PackDryRunSampleRecorded — one page of the historical sample canonical-svc supplies for a pack dry run (INV-Q-4870 B).
      description: >-
        Platform event PackDryRunSampleRecorded (INV-REQ-772 b1, INV-REQ-1303, owner ruling INV-Q-4870 B,
        names pinned by INV-Q-5194; class: platform). Emitted by: canonical-svc. Consumed by: rules-svc.
        Delivery: At-least-once. One page of the sample for the dryRunId of a PackDryRunSampleRequested,
        numbered from 1, the last page marked lastPage; each document carries the entity, the transaction
        date, the internal tax code, the document function, the preceding document date of a credit note and
        the signed taxable and GST values as decimal strings (API-12). The tenant is the envelope attribute
        tenantid (API-40). The event carries invoice content (FR-AH.12), so its topic keeps the content window.
      # INV-Q-4870 B: this event carries invoice content (FR-AH.12), so its topic is a content topic.
      # Copied into event-log/topics.yaml as content_topic by generate-topics.py.
      x-invoice-content: true
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/pack-dry-run-sample-recorded-payload.schema.json'
