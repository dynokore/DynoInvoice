openapi: 3.1.0
info:
  title: service-runtime shared contract components
  version: 1.4.0
  description: >-
    Not a service: the shared OpenAPI components every other directory's
    openapi.yaml references by relative $ref (error envelope, API-20) rather
    than redeclaring its own copy. Owned by whoever owns the `service-runtime`
    L1 module (STK-60), since these mirror what it implements at runtime.
    Also the shared runtime contract every service that owns scheduled jobs
    mounts: runJobNow, pauseJob and resumeJob are defined once here and
    served by service-runtime in each owning service (INV-Q-2950,
    INV-API-3023, INV-API-3025; INV-T-3007). console-bff calls them over its
    existing edge to each owning service, so they carry x-sync-edge
    console-bff->*, which spectral/check-sync-edges.py accepts only in
    service-runtime/ (API-08, INV-Q-3425 A): no contract lists a service's
    jobs, they are known at runtime from JobRegistered (INV-Q-2981). Fields
    as ruled in INV-Q-3425 A. x-timeout 2000 with no client retry: these are
    commands (INV-NOTE-3 §36.6 console-bff -> any, INV-REQ-1232 b1).
    rebuildConsumer (INV-T-3634, owner ruling INV-Q-3599 A, INV-API-3656) is
    declared the same way and served by service-runtime in every service that
    consumes event-log topics. setPolicy and acknowledgeControlRelaxation (INV-T-5179, INV-Q-5172) are the shared
    runtime contract every service that owns variation points mounts, served by service-runtime like runJobNow:
    setPolicy sets a variation point's value at one scope, effective-dated, with a reason, and
    acknowledgeControlRelaxation records the accountable role's acknowledgement of a looser option of a CONTROL.
tags:
- name: jobs
  description: Scheduled-job controls of the shared runtime contract (INV-REQ-1138).
- name: policies
  description: Setting a variation point's value and acknowledging a CONTROL's relaxation (INV-REQ-1241 b1, INV-REQ-1243, INV-REQ-1244).
- name: event-consumers
  description: Recovery of an event-log consumer in 'rebuild required' (INV-REQ-1205 b4, b6).
paths:
  /internal/v1/jobs/{job}/run:
    post:
      operationId: runJobNow
      summary: Run a scheduled job once now, for one entity's share or, for the platform operator role, the whole job
      description: >-
        Runs the job once outside its schedule (INV-REQ-1138 b1, INV-API-3025, INV-NOTE-7 SCR-23.2). Takes
        the job and an entity, absent meaning the whole job; with an entity the run processes only that
        entity's items. Irreversible where the job transmits. Records a JobRunRecorded and writes an
        AuditEntryRecorded in its transaction (INV-REQ-2588). Repeat key (job, entity or whole job, run
        window), the run window being the job's schedule interval containing the request: a second
        run-now in the window returns the first while it is in progress or has succeeded; after a FAILED
        run a new attempt is allowed and recorded as a new attempt (INV-Q-3034). Run-now and scheduled
        runs are keyed apart by trigger; a run-now never suppresses the next scheduled run (INV-Q-3039).
        Closed service-runtime cases carry their SRT catalogue code, mapped once in ProblemMapper
        and not listed in x-error-codes (ARC-19, INV-REQ-827 b3, owner ruling INV-Q-3720): SRT-001
        400 contract violation, SRT-002 400 a missing or malformed Idempotency-Key, SRT-003 401
        without a valid end-user token, SRT-004 403 AccessDenied for an entityRef outside the
        token's entity set (API-24), SRT-007 409 request in flight, SRT-009 422 Idempotency-Key
        reused with a different body (API-15), SRT-010 500.
      tags:
      - jobs
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1138
      - INV-REQ-1136
      - INV-REQ-2588
      - INV-AC-3040
      - INV-AC-3041
      x-error-codes:
      - JOB-001
      - JOB-002
      x-operation:
        role: integration.engineer with a grant on the entity, or deployment.operator (private form), per
          (job, entity); a whole-job run or any run of a PLATFORM-scoped job only by the form's platform
          operator role, platform.engineer (SaaS) or deployment.operator (private) (INV-REQ-1138 b1,
          INV-Q-3032). Roles re-checked against the authority replica, never taken from the caller (CS-23)
        scope: (job, entity), or the whole job
        precondition: The job is registered in the owning service (JOB-001); the caller's role permits the
          run at the requested scope (JOB-002); same confirmation for every job (INV-REQ-1138 b1)
        repeatKey: (job, entity or whole job, run window = the schedule interval containing the request);
          a repeat returns the first run while in progress or succeeded; after FAILED a new attempt
          (INV-Q-3034, INV-Q-3039)
        reversibility: IRREVERSIBLE
      parameters:
      - $ref: '#/components/parameters/Job'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunJobNowRequest'
            examples:
              default:
                value:
                  entityRef: E-001
      responses:
        "202":
          description: Run started; it continues after the response and its outcome reaches the console on
            JobRunRecorded (INV-REQ-1137 b2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunState'
              examples:
                default:
                  value:
                    job: scheduled-despatch
                    entityRef: E-001
                    trigger: MANUAL
                    scheduledFor: "2026-10-11T09:00:00Z"
                    attempt: 1
                    status: IN_PROGRESS
                    startedAt: "2026-10-11T09:12:03Z"
                    repeat: false
        "200":
          description: A run-now repeated in the same run window; the first run-now's current state while in
            progress or succeeded (INV-Q-3034)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunState'
              examples:
                default:
                  value:
                    job: scheduled-despatch
                    entityRef: E-001
                    trigger: MANUAL
                    scheduledFor: "2026-10-11T09:00:00Z"
                    attempt: 1
                    status: SUCCEEDED
                    startedAt: "2026-10-11T09:12:03Z"
                    repeat: true
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/jobs/{job}/pause:
    post:
      operationId: pauseJob
      summary: Pause a scheduled job until a mandatory end time, per (job, entity) or, for the platform operator role, job-wide
      description: >-
        Pauses the job for one entity's share or, absent an entity, job-wide, until a mandatory end time
        (INV-REQ-1138 b2-b3, INV-Q-2985, INV-API-3023, INV-NOTE-7 SCR-23.3). A deadline-critical job cannot
        be paused beyond the entity's nearest due date minus its VP-18 margin (JOB-003, INV-AC-1149); the
        bound is re-checked at every firing (INV-Q-2946). Writes an AuditEntryRecorded with actor, scope,
        reason and prior state in its transaction (INV-REQ-2588). A (job, entity) has at most one
        active pause: the same until has no second effect; a different until replaces the active
        pause's end time, earlier or later, under the same deadline bound, audited with the prior
        until (INV-Q-3037). Closed service-runtime cases carry their SRT catalogue code, mapped once
        in ProblemMapper and not listed in x-error-codes (ARC-19, INV-REQ-827 b3, owner ruling
        INV-Q-3720): SRT-001 400 contract violation (e.g. a missing until), SRT-002 400 a missing or
        malformed Idempotency-Key, SRT-003 401 without a valid end-user token, SRT-004 403
        AccessDenied for an entityRef outside the token's entity set (API-24), SRT-007 409 request
        in flight, SRT-009 422 Idempotency-Key reused with a different body (API-15), SRT-010 500.
      tags:
      - jobs
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1138
      - INV-REQ-2588
      - INV-AC-1149
      x-error-codes:
      - JOB-001
      - JOB-002
      - JOB-003
      - JOB-004
      x-operation:
        role: integration.engineer with a grant on the entity, or deployment.operator (private form), per
          (job, entity); a job-wide pause only by the form's platform operator role, platform.engineer
          (SaaS) or deployment.operator (private) (INV-REQ-1138 b2, INV-Q-2985). Roles re-checked against
          the authority replica (CS-23)
        scope: (job, entity), or job-wide
        precondition: The job is registered (JOB-001); the role permits the scope (JOB-002); until is later
          than the request time (JOB-004) and, for a deadline-critical job, not past the entity's nearest due
          date minus its VP-18 margin (JOB-003)
        repeatKey: (job, entity or job-wide); the same until has no second effect, a different until
          replaces the active pause's end time (INV-Q-3037)
        reversibility: UNDOABLE
      parameters:
      - $ref: '#/components/parameters/Job'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseJobRequest'
            examples:
              default:
                value:
                  entityRef: E-001
                  until: "2026-10-12T09:00:00Z"
                  reason: AP outage, holding despatch
      responses:
        "200":
          description: The pause state for the key (job, entity or job-wide); previousUntil when this call replaced an active pause's end time (INV-Q-3037)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPauseState'
              examples:
                default:
                  value:
                    job: scheduled-despatch
                    entityRef: E-001
                    state: PAUSED
                    until: "2026-10-12T09:00:00Z"
                    pausedAt: "2026-10-11T09:12:03Z"
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/jobs/{job}/resume:
    post:
      operationId: resumeJob
      summary: Resume a paused scheduled job, per (job, entity) or, for the platform operator role, job-wide
      description: >-
        Ends the active pause for one entity's share or, absent an entity, job-wide (INV-REQ-1138 b2,
        INV-Q-2985, INV-API-3023, INV-NOTE-7 SCR-23.3). Writes an AuditEntryRecorded with actor, scope,
        reason and prior state in its transaction (INV-REQ-2588). A resume of a (job, entity) that is not
        paused returns its current state and has no effect. Closed service-runtime cases carry their
        SRT catalogue code, mapped once in ProblemMapper and not listed in x-error-codes (ARC-19,
        INV-REQ-827 b3, owner ruling INV-Q-3720): SRT-001 400 contract violation, SRT-002 400 a
        missing or malformed Idempotency-Key, SRT-003 401 without a valid end-user token, SRT-004
        403 AccessDenied for an entityRef outside the token's entity set (API-24), SRT-007 409
        request in flight, SRT-009 422 Idempotency-Key reused with a different body (API-15),
        SRT-010 500.
      tags:
      - jobs
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1138
      - INV-REQ-2588
      x-error-codes:
      - JOB-001
      - JOB-002
      x-operation:
        role: integration.engineer with a grant on the entity, or deployment.operator (private form), per
          (job, entity); a job-wide resume only by the form's platform operator role, platform.engineer
          (SaaS) or deployment.operator (private) (INV-REQ-1138 b2, INV-Q-2985). Roles re-checked against
          the authority replica (CS-23)
        scope: (job, entity), or job-wide
        precondition: The job is registered (JOB-001); the role permits the scope (JOB-002)
        repeatKey: (job, entity or job-wide); a resume of a scope that is not paused returns its current
          state with no effect
        reversibility: UNDOABLE
      parameters:
      - $ref: '#/components/parameters/Job'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeJobRequest'
            examples:
              default:
                value:
                  entityRef: E-001
      responses:
        "200":
          description: The key's own pause state, ACTIVE; also when the key was not paused, with no effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPauseState'
              examples:
                default:
                  value:
                    job: scheduled-despatch
                    entityRef: E-001
                    state: ACTIVE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/event-consumers/rebuilds:
    post:
      operationId: rebuildConsumer
      summary: Recover a topic this service's consumer holds in 'rebuild required' by replay by scope or full sync
      description: >-
        Recovers a topic that this service's event-log consumer holds in 'rebuild required' (INV-REQ-1205
        b6) by a replay by scope or a full sync from the topic's producer (INV-REQ-1205 b4, owner ruling
        INV-Q-3599 A, INV-API-3656). In one transaction it moves the consumer's position to the head (replay
        by scope: that topic; full sync: every topic of that producer it subscribes to, after clearing the
        read model built from them and deleting its held docsequence rows for that producer, keeping its
        inbox rows, INV-Q-3603), writes a ReplayRequested event to the consumer's own outbox, and writes an
        AuditEntryRecorded (INV-REQ-2588 b9, coordinator ruling INV-Q-3663): actor; action rebuildConsumer;
        scope = consumer service, topic, producer, mode and replay scope; reason = the caller's text,
        otherwise the Idempotency-Key; prior state = the consumer's positions on the moved topics before the
        move and, for a full sync, the producer whose read model and docsequence rows were cleared; a
        tenantless platform event under the platform TenantId (INV-REQ-1226 b7). Either all of it commits or
        none (INV-AC-3657). It answers with the replay id once that transaction has committed; the replay
        runs after the response, and the incident closes when the consumer applies the producer's
        ReplayCompleted marker (INV-Q-3644, INV-AC-3658; on an 'every service' topic, a marker from each
        source seen, INV-Q-3669). The addressee producer is the topic's producer in event-log/topics.yaml, a
        service or 'every service' (INV-Q-3625). Repeat key (consumer, producer): while a replay for the
        pair is pending, a call with the same mode and scope returns 200 with the pending replay (same
        replayId, repeat true) and writes nothing; another mode or scope is EVL-004; after the marker is
        applied a new call starts a new replay (owner ruling INV-Q-3665 A); Idempotency-Key per API-15 on
        top.


        Multi-producer topics (owner ruling INV-Q-3788 A, INV-AC-3817): one call addresses every catalogue
        producer of a topic with several producers in event-log/topics.yaml (for example
        gst.platform.evidence-artefact-recorded.v1). In one transaction the position on the topic moves to
        the head once and one ReplayRequested is written per producer, each naming one producer and all
        with the same replayId (for a full sync, the INV-Q-3603 clear and head move for each producer). The
        repeat rule applies when every (consumer, producer) pair is pending with that replayId, mode and
        scope; any other pending replay on one of the pairs is EVL-004. The incident closes when a
        ReplayCompleted for the replayId has been applied from every catalogue producer (INV-Q-3669's
        rule), and stays open while any producer has not answered. The audit scope names every addressee.
        The response lists every addressee in producers and holds the literal 'several producers' in
        producer. Closed service-runtime cases carry their SRT catalogue code, mapped once in
        ProblemMapper and not listed in x-error-codes (ARC-19, INV-REQ-827 b3, owner ruling
        INV-Q-3720): SRT-001 400 contract violation (a malformed mode or scope, a scope with
        FULL_SYNC or none with SCOPE), SRT-002 400 a missing or malformed Idempotency-Key, SRT-003
        401 without a valid end-user token, SRT-004 403 AccessDenied for a tenantId or entityRef
        outside the token's entity set (API-24), SRT-007 409 request in flight, SRT-009 422
        Idempotency-Key reused with a different body (API-15), SRT-010 500.
      tags:
      - event-consumers
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1205
      - INV-REQ-1226
      - INV-REQ-2588
      - INV-AC-3657
      - INV-AC-3658
      x-error-codes:
      - EVL-001
      - EVL-002
      - EVL-003
      - EVL-004
      x-operation:
        role: only the form's platform operator role, platform.engineer (SaaS) or deployment.operator (private),
          for every mode and scope (INV-REQ-888, coordinator ruling INV-Q-3663); any other role EVL-002. Roles
          re-checked against the authority replica, never taken from the caller (CS-23)
        scope: (consumer service, topic); a full sync covers every topic of the topic's producer the consumer
          subscribes to (INV-Q-3603)
        precondition: The topic is one this service consumes (EVL-001); the caller holds the platform operator
          role (EVL-002); the consumer holds the topic in 'rebuild required' (EVL-003); no replay for the
          (consumer, producer) pair is pending with another mode or scope (EVL-004)
        repeatKey: (consumer, producer); while a replay for the pair is pending, the same mode and scope
          returns the pending replay (200, repeat true) and writes nothing, another mode or scope is EVL-004;
          after its ReplayCompleted is applied a new call starts a new replay (owner ruling INV-Q-3665 A);
          Idempotency-Key (API-15) on top
        reversibility: IRREVERSIBLE
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildConsumerRequest'
            examples:
              default:
                value:
                  topic: gst.canonical.canonical-version-created.v1
                  mode: SCOPE
                  scope:
                    kind: ENTITY
                    tenantId: T-001
                    entityRef: E-001
                  reason: Consumer fell behind the purge watermark
      responses:
        "202":
          description: The head move, the ReplayRequested and the audit entry have committed; the replay runs
            after the response and the incident closes when ReplayCompleted is applied (INV-Q-3599 A)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayState'
              examples:
                default:
                  value:
                    replayId: 3f0c2a4e-8d0b-4c1e-9a57-2b6f1e0d7c11
                    topic: gst.canonical.canonical-version-created.v1
                    producer: canonical-svc
                    producers:
                    - canonical-svc
                    mode: SCOPE
                    scope:
                      kind: ENTITY
                      tenantId: T-001
                      entityRef: E-001
                    requestedAt: "2026-10-11T09:12:03Z"
                    repeat: false
                severalProducers:
                  summary: A topic with several catalogue producers (INV-Q-3788 A)
                  value:
                    replayId: 9b2e7d10-4a6c-4f3e-8c21-5d0a7e9f1b34
                    topic: gst.platform.evidence-artefact-recorded.v1
                    producer: several producers
                    producers:
                    - access-svc
                    - masterdata-svc
                    - payload-svc
                    - rules-svc
                    mode: SCOPE
                    scope:
                      kind: TENANT
                      tenantId: T-001
                    requestedAt: "2026-10-12T08:40:17Z"
                    repeat: false
        "200":
          description: A replay for the (consumer, producer) pair is pending with the same mode and scope; the
            pending replay is returned and nothing is written (owner ruling INV-Q-3665 A)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayState'
              examples:
                default:
                  value:
                    replayId: 3f0c2a4e-8d0b-4c1e-9a57-2b6f1e0d7c11
                    topic: gst.canonical.canonical-version-created.v1
                    producer: canonical-svc
                    producers:
                    - canonical-svc
                    mode: SCOPE
                    scope:
                      kind: ENTITY
                      tenantId: T-001
                      entityRef: E-001
                    requestedAt: "2026-10-11T09:12:03Z"
                    repeat: true
                severalProducers:
                  summary: A topic with several catalogue producers (INV-Q-3788 A)
                  value:
                    replayId: 9b2e7d10-4a6c-4f3e-8c21-5d0a7e9f1b34
                    topic: gst.platform.evidence-artefact-recorded.v1
                    producer: several producers
                    producers:
                    - access-svc
                    - masterdata-svc
                    - payload-svc
                    - rules-svc
                    mode: SCOPE
                    scope:
                      kind: TENANT
                      tenantId: T-001
                    requestedAt: "2026-10-12T08:40:17Z"
                    repeat: true
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/policies/{variationPoint}:
    post:
      operationId: setPolicy
      summary: Set a variation point's value at one scope, effective-dated, with a reason, in its owning service
      description: >-
        Sets the value of one variation point at one scope in the owning service, which stores and enforces it
        (INV-REQ-1241 b1, INV-REQ-1243 b1, INV-Q-5172). Every service that owns variation points mounts this
        operation, served by service-runtime like runJobNow. The new value takes an effective date and a reason;
        the operation writes an audit entry holding the prior value (INV-REQ-1243 b2, INV-AC-2229) and the owning
        service publishes PolicyChanged (INV-REQ-1241 b2); policyChangedEventId is null where the service has no
        outbox. The tenant, the actor and the roles are never request fields: they come from the verified token
        and the owning service's authority replica (CS-23). An installation-level value is set by the platform
        operator role of the form (for example VP-66, VP-70 and VP-72, INV-AC-2551) under the platform tenant
        (INV-Q-2927). A value with source PROFILE is written by console-bff's applyOperatingProfile through this
        operation (INV-Q-2979, INV-Q-5022). A repeat with the same Idempotency-Key returns the stored response
        (API-15). The contract declares no per-variation-point value schema: the value is typed per variation
        point by the gst-catalogue row and checked by config-resolver (INV-REQ-5039). Where JSON Schema states a
        present-exactly-when rule the request schema carries it as if/then; that entityRef equals scopeRef for
        ENTITY is enforced by the service with SRT-001, and a PROFILE request missing profileRef or profileVersion is
        refused with POL-023. Refusals carry their POL catalogue code, mapped once in
        ProblemMapper; closed service-runtime cases carry their SRT code (SRT-001 400 contract violation, SRT-002
        400 missing or malformed Idempotency-Key, SRT-003 401, SRT-004 403 entityRef outside the token's entity
        set, SRT-007 409 request in flight, SRT-009 422 Idempotency-Key reused with a different body, SRT-010 500).
      tags:
      - policies
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1241
      - INV-REQ-1243
      - INV-REQ-1239
      - INV-AC-2224
      - INV-AC-2229
      x-error-codes:
      - POL-001
      - POL-002
      - POL-003
      - POL-004
      - POL-005
      - POL-006
      - POL-007
      - POL-008
      - POL-009
      - POL-010
      - POL-011
      - POL-012
      - POL-013
      - POL-014
      - POL-015
      - POL-016
      - POL-017
      - POL-018
      - POL-019
      - POL-020
      - POL-021
      - POL-022
      - POL-023
      - POL-024
      x-operation:
        role: the setting role or roles the gst-catalogue names for the variation point (INV-REQ-1239 b3,
          INV-NOTE-7 operation catalogue), checked by config-resolver against the roles the owning service's
          authority replica holds for the actor at the scope, never taken from a request field (CS-23)
        scope: (scopeLevel, scopeRef, entityRef) of the variation point
        precondition: the value is within the bounds of the catalogue row, the scope level is one the row
          allows, a reason is given, the effective date is not before the installation business date except a
          scope's first value (INV-REQ-1243 b6), and a looser option of a CONTROL has a complete relaxation
          (INV-REQ-1244 b2)
        repeatKey: (variation point, scope, effective date) as the catalogue row; a second value at the same key
          is a superseding version, resolved by the latest recorded (INV-REQ-1243 b5)
        reversibility: COMPENSABLE
      parameters:
      - $ref: '#/components/parameters/VariationPoint'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPolicyRequest'
            examples:
              default:
                value:
                  scopeLevel: ENTITY
                  scopeRef: E-001
                  entityRef: E-001
                  selected:
                  - option: OPTION_B
                  effectiveDate: "2026-11-01"
                  reason: Change requested by the setting role
      responses:
        "200":
          description: The setting as stored; a repeat with the same Idempotency-Key returns the stored response
            (API-15)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySettingState'
              examples:
                default:
                  value:
                    variationPoint: VP-12
                    scopeLevel: ENTITY
                    scopeRef: E-001
                    entityRef: E-001
                    selected:
                    - option: OPTION_B
                    source: OVERRIDE
                    effectiveDate: "2026-11-01"
                    setBy: user-17
                    reason: Change requested by the setting role
                    recordedAt: "2026-10-15T09:12:03Z"
                    settingId: 7d2c1b0e-3a4f-4c85-9e16-0b5a8f3d2c71
                    prior:
                      selected:
                      - option: OPTION_A
                      effectiveDate: "2026-01-01"
                      source: PROFILE
                    auditEventId: AE-000123
                    policyChangedEventId: EV-000456
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/policies/{variationPoint}/relaxations:
    post:
      operationId: acknowledgeControlRelaxation
      summary: Acknowledge, as the accountable role, the relaxation of a CONTROL to a looser option
      description: >-
        Records one acknowledgement of the relaxation of a CONTROL to a looser option by the accountable role the
        catalogue names (INV-REQ-1244 b2, INV-AC-205, INV-AC-2230, INV-Q-5172). Every service that owns variation
        points mounts this operation, served by service-runtime like runJobNow. Absent relaxationId starts a new
        relaxation; present, the acknowledgement joins that relaxation, whose target, value and effective date
        must be the same (INV-Q-3138). Two acknowledgers must be distinct principals (INV-Q-3134). The relaxation
        is complete when every role the option names has acknowledged; setPolicy then carries its relaxationId.
        The tenant, the actor and the roles are never request fields: they come from the verified token and the
        owning service's authority replica, and asRole is checked against the roles the actor holds (CS-23). A
        repeat with the same Idempotency-Key returns the stored response (API-15). Refusals carry their POL
        catalogue code; closed service-runtime cases carry their SRT code as for setPolicy.
      tags:
      - policies
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: "console-bff->*"
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1244
      - INV-REQ-1241
      - INV-AC-205
      - INV-AC-2230
      x-error-codes:
      - POL-001
      - POL-002
      - POL-003
      - POL-004
      - POL-005
      - POL-006
      - POL-007
      - POL-008
      - POL-009
      - POL-010
      - POL-011
      - POL-012
      - POL-013
      - POL-014
      - POL-015
      - POL-016
      - POL-017
      - POL-018
      - POL-019
      - POL-020
      - POL-021
      - POL-022
      - POL-023
      - POL-024
      x-operation:
        role: the accountable role the catalogue names for the control (INV-REQ-1244 b2), supplied as asRole
          and checked against the roles the actor holds; two acknowledgers must be distinct principals
          (INV-Q-3134)
        scope: (scopeLevel, scopeRef, entityRef) of the variation point
        precondition: a looser option of a CONTROL is selected and the value is looser
        repeatKey: (variation point, scope, option) as the catalogue row
        reversibility: COMPENSABLE
      parameters:
      - $ref: '#/components/parameters/VariationPoint'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRelaxationRequest'
            examples:
              default:
                value:
                  scopeLevel: ENTITY
                  scopeRef: E-001
                  entityRef: E-001
                  selected:
                  - option: LOOSER_OPTION
                  effectiveDate: "2026-11-01"
                  asRole: control.owner
      responses:
        "200":
          description: The relaxation as it now stands, with the roles still outstanding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelaxationState'
              examples:
                default:
                  value:
                    relaxationId: 5b9e0c42-71d3-4a68-8f1e-2c4d6a9b3e10
                    variationPoint: VP-31
                    scopeLevel: ENTITY
                    scopeRef: E-001
                    entityRef: E-001
                    selected:
                    - option: LOOSER_OPTION
                    effectiveDate: "2026-11-01"
                    acknowledgements:
                    - role: control.owner
                      principal: user-17
                      acknowledgedAt: "2026-10-15T09:12:03Z"
                    outstandingRoles: []
                    complete: true
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Job:
      name: job
      in: path
      required: true
      description: The scheduled job's name, as registered by the owning service (JobRegistered.job, INV-API-3020).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h; a same-key replay
        returns the stored response, a different body gives 422, a request in flight 409.'
      schema:
        type: string
        format: uuid
    VariationPoint:
      name: variationPoint
      in: path
      required: true
      description: The variation point's key in the gst-catalogue VariationPoint catalogue (INV-REQ-1239); not
        registered is POL-001, retired is POL-002.
      schema:
        type: string
        pattern: ^VP-[0-9]+$
  schemas:
    RunJobNowRequest:
      type: object
      description: runJobNow request (INV-API-3025, INV-Q-3425 A). The actor comes from the propagated token,
        never a field (CS-23); no confirmation field, the SCR-23.2 confirmation is the console's step.
      properties:
        entityRef:
          $ref: '#/components/schemas/JobEntityRef'
        reason:
          $ref: '#/components/schemas/JobCommandReason'
    PauseJobRequest:
      type: object
      description: pauseJob request (INV-API-3023, INV-Q-3425 A).
      required:
      - until
      properties:
        entityRef:
          $ref: '#/components/schemas/JobEntityRef'
        until:
          type: string
          format: date-time
          description: End of the pause; required (missing is 400), later than the request time (JOB-004) and,
            for a deadline-critical job, not past the entity's nearest due date minus its VP-18 margin (JOB-003;
            INV-Q-2946, INV-Q-2985). A different until on an active pause replaces its end time (INV-Q-3037).
        reason:
          $ref: '#/components/schemas/JobCommandReason'
    ResumeJobRequest:
      type: object
      description: resumeJob request (INV-API-3023, INV-Q-3425 A).
      properties:
        entityRef:
          $ref: '#/components/schemas/JobEntityRef'
        reason:
          $ref: '#/components/schemas/JobCommandReason'
    JobEntityRef:
      type: string
      maxLength: 40
      description: The entity whose share of the job the command applies to; absent = the whole job or
        job-wide (INV-Q-2985, INV-Q-3032). Outside the token's entity set is 403 (API-24).
    JobCommandReason:
      type: string
      maxLength: 500
      description: Optional free text added to the audit entry, whose reason records the Idempotency-Key
        (INV-REQ-2588 b5).
    JobRunState:
      type: object
      description: State of a run-now (INV-API-3025, INV-Q-3425 A).
      required:
      - job
      - trigger
      - scheduledFor
      - attempt
      - status
      - startedAt
      - repeat
      properties:
        job:
          type: string
          description: The registered job name (JobRegistered.job).
        entityRef:
          type: string
          maxLength: 40
          description: The entity whose share ran; absent for a whole-job run.
        trigger:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
          x-extensible-enum: true
          description: MANUAL for a run-now; extensible (API-09; INV-Q-3039).
        scheduledFor:
          type: string
          format: date-time
          description: The tick of the schedule interval containing the request, as
            JobRunRecorded.scheduledFor (INV-Q-3034).
        attempt:
          type: integer
          minimum: 1
          description: From 1; a new attempt after a FAILED run in the same window (INV-Q-3034).
        status:
          type: string
          enum:
          - IN_PROGRESS
          - SUCCEEDED
          - FAILED
          x-extensible-enum: true
          description: The run's status; extensible (API-09; JobRunRecorded.outcome).
        startedAt:
          type: string
          format: date-time
        repeat:
          type: boolean
          description: True when the window's earlier run-now is returned (INV-Q-3034).
    JobPauseState:
      type: object
      description: Pause state of the key (job, entity or job-wide) (INV-API-3023, INV-Q-3425 A). The state is
        the key's own, so a (job, entity) resume does not report a job-wide pause (INV-Q-2985).
      required:
      - job
      - state
      properties:
        job:
          type: string
          description: The registered job name (JobRegistered.job).
        entityRef:
          type: string
          maxLength: 40
          description: The entity; absent = job-wide.
        state:
          type: string
          enum:
          - PAUSED
          - ACTIVE
          x-extensible-enum: true
          description: Extensible (API-09).
        until:
          type: string
          format: date-time
          description: End of the pause, when PAUSED.
        pausedAt:
          type: string
          format: date-time
          description: When the pause began, when PAUSED; unchanged when the end time is replaced (INV-Q-3037).
        previousUntil:
          type: string
          format: date-time
          description: Only when this call replaced an active pause's end time (INV-Q-3037).
    RebuildConsumerRequest:
      type: object
      description: rebuildConsumer request (INV-API-3656). The actor comes from the propagated token, never a
        field (CS-23).
      required:
      - topic
      - mode
      properties:
        topic:
          type: string
          maxLength: 128
          description: The gst.* event topic this service's consumer holds in 'rebuild required' (INV-REQ-1205
            b6); not one it consumes is EVL-001.
        mode:
          $ref: '#/components/schemas/ReplayMode'
        scope:
          $ref: '#/components/schemas/ReplayScope'
        reason:
          type: string
          maxLength: 500
          description: Optional free text recorded as the audit entry's reason; absent, the reason is the
            Idempotency-Key (INV-REQ-2588 b5, INV-Q-3663).
    ReplayMode:
      type: string
      enum:
      - SCOPE
      - FULL_SYNC
      x-extensible-enum: true
      description: SCOPE for a replay by scope (scope required), FULL_SYNC for a full sync (no scope)
        (INV-REQ-1205 b4); extensible (API-09).
    ReplayScope:
      type: object
      description: The scope of a replay by scope, present only with mode SCOPE; a tagged union on kind (owner
        ruling INV-Q-3671), the same shape as ReplayRequested.scope (schemas/replay-requested-payload.schema.json)
        - TENANT {tenantId}; ENTITY {tenantId, entityRef}; PERIOD {from, to, tenantId?}, a half-open range
        [from, to) on the time the producer's state was last changed, across all tenants unless narrowed by
        tenantId. A tenantId or entityRef outside the token's entity set is 403 (API-24).
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - TENANT
          - ENTITY
          - PERIOD
          x-extensible-enum: true
          description: Which scope shape this is (INV-Q-3671); extensible (API-09).
        tenantId:
          type: string
          maxLength: 40
          description: Required for TENANT and ENTITY; optional for PERIOD, narrowing it to one tenant.
        entityRef:
          type: string
          maxLength: 40
          description: Required for ENTITY.
        from:
          type: string
          format: date-time
          description: PERIOD only, required there; inclusive start.
        to:
          type: string
          format: date-time
          description: PERIOD only, required there; exclusive end, later than from.
      allOf:
      - if:
          properties:
            kind:
              const: TENANT
        then:
          required:
          - tenantId
      - if:
          properties:
            kind:
              const: ENTITY
        then:
          required:
          - tenantId
          - entityRef
      - if:
          properties:
            kind:
              const: PERIOD
        then:
          required:
          - from
          - to
    ReplayState:
      type: object
      description: The replay a rebuildConsumer started or, on a repeat, the pending one (INV-API-3656,
        INV-Q-3665).
      required:
      - replayId
      - topic
      - producer
      - producers
      - mode
      - requestedAt
      - repeat
      properties:
        replayId:
          type: string
          format: uuid
          description: The ReplayRequested's replayId, echoed by the ReplayCompleted that closes the incident.
        topic:
          type: string
          maxLength: 128
          description: The topic the call named.
        producer:
          type: string
          description: The addressee, the topic's producer in event-log/topics.yaml, a service or 'every
            service' (INV-Q-3625); the literal 'several producers' for a topic with several catalogue
            producers (owner ruling INV-Q-3788 A).
        producers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Every addressee of the call, one element for a single-producer topic (the service
            or 'every service'), every catalogue producer of the topic in event-log/topics.yaml otherwise
            (owner ruling INV-Q-3788 A, INV-API-3656).
        mode:
          $ref: '#/components/schemas/ReplayMode'
        scope:
          $ref: '#/components/schemas/ReplayScope'
        requestedAt:
          type: string
          format: date-time
          description: When the request committed.
        repeat:
          type: boolean
          description: True when a pending replay with the same mode and scope is returned (INV-Q-3665).
    PolicyScopeLevel:
      type: string
      enum:
      - INSTALLATION
      - TENANT
      - GROUP
      - ENTITY
      - FEED
      - AP_CONNECTION
      - CLIENT_ENTITY
      x-extensible-enum: true
      description: The seven scope levels of config-resolver's ScopeLevel (INV-REQ-1242 b1). A variation point
        allows only the levels its catalogue row lists; another is POL-003.
    PolicySource:
      type: string
      enum:
      - OVERRIDE
      - PROFILE
      x-extensible-enum: true
      default: OVERRIDE
      description: OVERRIDE for a value set directly, PROFILE for a value written by console-bff's
        applyOperatingProfile through setPolicy (INV-Q-2979, INV-Q-5022).
    SelectedOption:
      type: object
      description: One selected option of a variation point. The contract declares no per-variation-point
        value schema; the value is typed per variation point by the gst-catalogue row and checked by
        config-resolver, which keeps domain content out of a shared schema (INV-REQ-5039).
      required:
      - option
      properties:
        option:
          type: string
          minLength: 1
          description: The option key of the catalogue row; one the row does not have or offer is POL-011.
        value:
          description: The option's value, of any JSON type; absent for an option that carries none. Not of
            the option's shape or outside its bounds is POL-013.
    PolicyReason:
      type: string
      minLength: 1
      maxLength: 500
      description: Why the policy changes (INV-REQ-1243 b1, INV-AC-2229); empty or absent is POL-005.
    PolicyScopeRef:
      type: string
      minLength: 1
      description: The reference of the scope the value applies to, as the scope level defines it; absent
        exactly when scopeLevel is INSTALLATION.
    PolicyEntityRef:
      type: string
      minLength: 1
      description: The entity the scope belongs to; present exactly when scopeLevel is ENTITY, FEED,
        AP_CONNECTION or CLIENT_ENTITY, and equal to scopeRef for ENTITY (enforced by the service with
        SRT-001; JSON Schema cannot state it). Outside the token's entity set is 403 (API-24).
    SetPolicyRequest:
      type: object
      description: setPolicy request (INV-REQ-1241 b1, INV-REQ-1243 b1, INV-Q-5172). The tenant, the actor
        and the roles are never fields; they come from the verified token and the authority replica (CS-23).
        The scopeRef, entityRef and profile-pair rules are stated as allOf if/then/else (profileRef and
        profileVersion with source OVERRIDE are refused as SRT-001); a source PROFILE request missing profileRef
        or profileVersion is not a schema rule and is refused by config-resolver with 400 POL-023. entityRef equal
        to scopeRef for ENTITY cannot be stated in JSON Schema and is enforced by the service with 400 SRT-001.
      required:
      - scopeLevel
      - selected
      - effectiveDate
      - reason
      properties:
        scopeLevel:
          $ref: '#/components/schemas/PolicyScopeLevel'
        scopeRef:
          $ref: '#/components/schemas/PolicyScopeRef'
        entityRef:
          $ref: '#/components/schemas/PolicyEntityRef'
        selected:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SelectedOption'
          description: The selected options; empty is POL-012.
        effectiveDate:
          type: string
          format: date
          description: When the value applies, a date of the installation's business calendar (Asia/Singapore);
            before the business date and not a scope's first value is POL-022 (INV-REQ-1243 b6).
        reason:
          $ref: '#/components/schemas/PolicyReason'
        source:
          $ref: '#/components/schemas/PolicySource'
        profileRef:
          type: string
          minLength: 1
          maxLength: 64
          description: The operating profile the value comes from; required when source is PROFILE (missing is POL-023) and absent when source is OVERRIDE (SRT-001).
        profileVersion:
          type: integer
          minimum: 1
          description: The profile version applied (INV-Q-3283); required when source is PROFILE (missing is POL-023) and absent when source is OVERRIDE (SRT-001).
        relaxationId:
          type: string
          format: uuid
          description: The complete relaxation of a looser option of a CONTROL (acknowledgeControlRelaxation);
            absent for any other value.
      allOf:
      - if:
          required:
          - scopeLevel
          properties:
            scopeLevel:
              const: INSTALLATION
        then:
          not:
            required:
            - scopeRef
        else:
          required:
          - scopeRef
      - if:
          required:
          - scopeLevel
          properties:
            scopeLevel:
              enum:
              - ENTITY
              - FEED
              - AP_CONNECTION
              - CLIENT_ENTITY
        then:
          required:
          - entityRef
        else:
          not:
            required:
            - entityRef
      - if:
          required:
          - source
          properties:
            source:
              const: PROFILE
        else:
          allOf:
          - not:
              required:
              - profileRef
          - not:
              required:
              - profileVersion
    PolicySettingPrior:
      type:
      - object
      - 'null'
      description: The value this setting replaced at its scope on its effective date; null when none applied.
      required:
      - selected
      - effectiveDate
      - source
      properties:
        selected:
          type: array
          items:
            $ref: '#/components/schemas/SelectedOption'
        effectiveDate:
          type: string
          format: date
        source:
          $ref: '#/components/schemas/PolicySource'
    PolicySettingState:
      type: object
      description: setPolicy response (INV-REQ-1243 b2, INV-Q-5172).
      required:
      - variationPoint
      - scopeLevel
      - selected
      - source
      - effectiveDate
      - setBy
      - reason
      - recordedAt
      properties:
        variationPoint:
          type: string
          pattern: ^VP-[0-9]+$
        scopeLevel:
          $ref: '#/components/schemas/PolicyScopeLevel'
        scopeRef:
          $ref: '#/components/schemas/PolicyScopeRef'
        entityRef:
          $ref: '#/components/schemas/PolicyEntityRef'
        selected:
          type: array
          items:
            $ref: '#/components/schemas/SelectedOption'
        source:
          $ref: '#/components/schemas/PolicySource'
        profileRef:
          type: string
        profileVersion:
          type: integer
        relaxationId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        setBy:
          type: string
          description: The principal that set it, from the verified token.
        reason:
          $ref: '#/components/schemas/PolicyReason'
        recordedAt:
          type: string
          format: date-time
        settingId:
          type: string
          format: uuid
        prior:
          $ref: '#/components/schemas/PolicySettingPrior'
        auditEventId:
          type: string
          description: The audit entry holding the prior value (INV-REQ-1243 b2).
        policyChangedEventId:
          type:
          - string
          - 'null'
          description: The PolicyChanged event published by the owning service; null where the service has no
            outbox.
    AcknowledgeRelaxationRequest:
      type: object
      description: acknowledgeControlRelaxation request (INV-REQ-1244 b2, INV-Q-3138, INV-Q-5172). Scope,
        selected and effectiveDate are the looser value being acknowledged, exactly as in SetPolicyRequest.
        The actor and the roles are never fields (CS-23).
      required:
      - scopeLevel
      - selected
      - effectiveDate
      - asRole
      properties:
        scopeLevel:
          $ref: '#/components/schemas/PolicyScopeLevel'
        scopeRef:
          $ref: '#/components/schemas/PolicyScopeRef'
        entityRef:
          $ref: '#/components/schemas/PolicyEntityRef'
        selected:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SelectedOption'
        effectiveDate:
          type: string
          format: date
        asRole:
          type: string
          minLength: 1
          description: The accountable role the actor acts as; not one the option names or the actor does not
            hold is POL-019.
        relaxationId:
          type: string
          format: uuid
          description: Absent starts a new relaxation; present joins that relaxation, whose target, value and
            effective date must be the same (INV-Q-3138).
        reason:
          type: string
          maxLength: 500
      allOf:
      - if:
          required:
          - scopeLevel
          properties:
            scopeLevel:
              const: INSTALLATION
        then:
          not:
            required:
            - scopeRef
        else:
          required:
          - scopeRef
      - if:
          required:
          - scopeLevel
          properties:
            scopeLevel:
              enum:
              - ENTITY
              - FEED
              - AP_CONNECTION
              - CLIENT_ENTITY
        then:
          required:
          - entityRef
        else:
          not:
            required:
            - entityRef
    RelaxationAcknowledgement:
      type: object
      required:
      - role
      - principal
      - acknowledgedAt
      properties:
        role:
          type: string
        principal:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
    RelaxationState:
      type: object
      description: acknowledgeControlRelaxation response (INV-REQ-1244 b2).
      required:
      - relaxationId
      - variationPoint
      - scopeLevel
      - selected
      - effectiveDate
      - acknowledgements
      - outstandingRoles
      - complete
      properties:
        relaxationId:
          type: string
          format: uuid
