openapi: 3.1.0
info:
  title: payload API
  version: 1.4.0
  description: >-
    Contract-first source of truth for payload (API-01, STK-44). The
    `payload-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Internal API only (API standard §1): payload-svc has no public,
    gateway-routed surface. Every operation below is `/internal/v1/…`,
    reached only on the synchronous edge of model/architecture/sync-edges.yaml
    (`ingestion-svc -> payload-svc`) and by console-bff's read queries
    (INV-T-2858, T14). payload-svc receives the canonical version it
    validates through `CanonicalVersionCreated` (canonical/asyncapi.yaml,
    AD-30) — asynchronous, and therefore out of this file's scope.
  contact:
    name: payload (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: pre-issuance
    description: The Observe-mode side-effect-free check ahead of network issuance (§33.1).
  - name: validation
    description: Full validation and Relay-mode pre-issuance verdict for a recorded canonical version (§33.1, §33.3).
  - name: queries
    description: Payload, rendition and regeneration reads for console-bff (INV-REQ-1168).
  - name: rendition
    description: The entity's rendition sample check and its PAY-014 finding (INV-REQ-1033, INV-REQ-813).
paths:
  /internal/v1/payload/pre-issuance-checks:
    post:
      operationId: checkPreIssuance
      summary: Observe-mode pre-issuance check — stateless, side-effect-free, PASS/WARN/BLOCK with reasons
      description: >-
        ingestion-svc's public `POST /v1/pre-issuance-checks` calls this
        internally within its 150 ms budget (sync-edges.yaml
        `ingestion-svc -> payload-svc`; resilience_policy.yaml). Stateless and
        side-effect free (INV-REQ-325): it has no canonical record yet and
        writes nothing. Register unavailability never blocks it (payload-svc
        `must_not`); it proceeds with a WARN reason instead of BLOCK.


        Records nothing, not even the register lookup: the same draft sent
        twice yields identical verdicts and reasons (INV-REQ-325). When the
        Check GST Register is unavailable the verdict is WARN, never BLOCK on
        that ground, and carries the flag `REGISTER_UNAVAILABLE` (INV-REQ-326);
        the re-check after issuance and PAY-011 raised by it are in the
        service tasks, not in this contract.


        The wrongful GST charge check (PAY-011) is performed by default
        (INV-REQ-475). It blocks for TYPE_1A and only warns for TYPE_2,
        TYPE_1B and TYPE_3 (INV-REQ-476). The controls are the same whichever
        system issues the invoice (INV-REQ-503).
      tags: [pre-issuance]
      x-principal: ingest
      x-timeout: 150
      x-sync-edge: ingestion-svc->payload-svc
      x-error-codes: [PAY-001, PAY-005, PAY-011, PAY-013]
      x-requirements: [INV-REQ-957, INV-REQ-325, INV-REQ-326, INV-REQ-475, INV-REQ-476, INV-REQ-503]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          None — a stateless, side-effect-free check (INV-REQ-325); the draft
          document need not yet be recorded and nothing is persisted either way.
        reversibility: UNDOABLE
        repeatKey: >-
          None — a safe query with no persistent state change; a repeat has
          nothing to make safe (INV-REQ-325, API-15 "takes no key").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftDocument'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  currency: "SGD"
                  totalIncludingTax: "1090.00"
              type1aBlock:
                summary: TYPE_1A draft whose Supplier GSTN is not registered on the invoice date
                value:
                  entityRef: "E-001"
                  currency: "SGD"
                  totalIncludingTax: "1090.00"
                  submissionType: "TYPE_1A"
                  supplierGstn: "M90012345X"
                  invoiceDate: "2026-03-20"
                  gstAmount: "90.00"
                  lines:
                    - { categoryCode: "S", taxableAmount: "1000.00", gstAmount: "90.00" }
              type2Warn:
                summary: TYPE_2 draft with the same finding (warns only)
                value:
                  entityRef: "E-001"
                  currency: "SGD"
                  totalIncludingTax: "1090.00"
                  submissionType: "TYPE_2"
                  supplierGstn: "M90012345X"
                  invoiceDate: "2026-03-20"
                  gstAmount: "90.00"
                  lines:
                    - { categoryCode: "S", taxableAmount: "1000.00", gstAmount: "90.00" }
      responses:
        '200':
          description: The verdict, with reasons where not a clean PASS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreIssuanceVerdict'
              examples:
                default:
                  value: { verdict: "PASS", reasons: [] }
                type1aBlock:
                  summary: TYPE_1A with a wrongful GST charge (PAY-011) is BLOCK
                  value:
                    verdict: "BLOCK"
                    reasons:
                      - { code: "PAY-011", message: "Wrongful GST charge: the Supplier GSTN is not registered on the invoice date", field: "supplierGstn", severity: "BLOCK", overridable: false }
                type2Warn:
                  summary: TYPE_2 with a wrongful GST charge (PAY-011) is WARN
                  value:
                    verdict: "WARN"
                    reasons:
                      - { code: "PAY-011", message: "Wrongful GST charge: the Supplier GSTN is not registered on the invoice date", field: "supplierGstn", severity: "WARN", overridable: false }
                registerUnavailable:
                  summary: Register unavailable — WARN with the flag, never BLOCK on that ground
                  value: { verdict: "WARN", reasons: [], flags: ["REGISTER_UNAVAILABLE"] }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/documents/{docUuid}/versions/{version}/validate:
    post:
      operationId: validateIssuance
      summary: Full validation of a recorded canonical version for Relay-mode issuance
      description: >-
        The Relay-mode leg of ingestion-svc's public `POST /v1/issuances`,
        within its 2 s budget (sync-edges.yaml `ingestion-svc -> payload-svc`;
        FR-AE.2). Both validation layers with the severity override map
        (Schematron and business rules), the wrongful-GST rule against
        masterdata-svc register facts, and exchange-rate validation. On a
        failure nothing is sent to the AP (FR-AE.2; API-21's stated
        exception, `422` even though the document itself is recorded by
        canonical-svc as `NOT_SUBMITTABLE` with `ISSUANCE_REFUSED`). Byte-identical
        on repeat (§6.8) — never recomputes totals (payload-svc `must_not`).


        A variance of the line sum against the stated total beyond the
        tolerance gives a 200 with verdict WARN, a reason PAY-004 and the
        payload built, never a 422; the stated totals are used as stated
        (INV-REQ-474, INV-REQ-810). When the Check GST Register is unavailable
        the verdict is WARN with the flag `REGISTER_UNAVAILABLE`, never BLOCK on
        that ground (INV-REQ-326); the lookup is returned as `registerLookup`
        and kept against the submission as evidence (INV-REQ-478). The re-check
        after issuance and PAY-011 raised by it are in the service tasks.


        The wrongful GST charge check (PAY-011) is performed by default
        (INV-REQ-475). It blocks for TYPE_1A and only warns for TYPE_2,
        TYPE_1B and TYPE_3 (INV-REQ-476). The controls are the same whichever
        system issues the invoice (INV-REQ-503).
      tags: [validation]
      x-principal: ingest
      x-timeout: 2000
      x-sync-edge: ingestion-svc->payload-svc
      x-error-codes: [PAY-001, PAY-002, PAY-003, PAY-004, PAY-005, PAY-006, PAY-009, PAY-011, PAY-013]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-324, INV-REQ-326, INV-REQ-474, INV-REQ-475, INV-REQ-476, INV-REQ-478, INV-REQ-499, INV-REQ-810]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          The canonical version (docUuid, version) is recorded
          (CanonicalVersionCreated) and not superseded by a later version.
        reversibility: COMPENSABLE
        repeatKey: >-
          (docUuid, version) — byte-identical regeneration; a repeat returns
          the same payload and verdict unchanged (§6.8).
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateIssuanceRequest'
            examples:
              default:
                value: { submissionType: "TYPE_1A" }
      responses:
        '200':
          description: Validation passed; the payload is built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              examples:
                default:
                  value:
                    verdict: "PASS"
                    specVersion: "PINT-SG-1.2"
                    customizationId: "SG:PINT:1.2"
                    reasons: []
                    packVersions:
                      - { packType: "severity-override", version: "1.0.0" }
                variance:
                  summary: Line sum differs from the stated total beyond the tolerance — WARN, payload built
                  value:
                    verdict: "WARN"
                    specVersion: "PINT-SG-1.2"
                    customizationId: "SG:PINT:1.2"
                    reasons:
                      - { code: "PAY-004", message: "Line sum differs from the stated total beyond the tolerance", severity: "WARN", overridable: false }
                registerUnavailable:
                  summary: Register unavailable — WARN with the flag and the lookup evidence
                  value:
                    verdict: "WARN"
                    specVersion: "PINT-SG-1.2"
                    customizationId: "SG:PINT:1.2"
                    reasons: []
                    flags: ["REGISTER_UNAVAILABLE"]
                    registerLookup:
                      queriedValue: "M90012345X 2026-03-20"
                      outcome: "UNAVAILABLE"
                      queriedAt: "2026-03-20T03:15:22Z"
        '422':
          description: Validation failed; nothing is sent to the AP (FR-AE.2, API-21's stated exception).
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                default:
                  value:
                    type: "about:blank"
                    title: "Wrongful GST charge detected against the Check GST Register"
                    status: 422
                    code: "PAY-011"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/documents/{docUuid}/versions/{version}/overrides:
    post:
      operationId: overrideValidation
      summary: Override an OVERRIDABLE blocking validation code for one document version
      description: >-
        Releases a blocking check the System adds beyond IRAS's own
        requirements, for one document and version, with a mandatory reason.
        The override is per document and version (INV-REQ-330) and is recorded
        in the immutable audit log with its reason (INV-REQ-500).


        A missing or empty `reason` is refused with `400` and SRT-001 and
        nothing is recorded (INV-AC-1551). An override of a code whose
        catalogue disposition is MANUAL or TERMINAL (for example PAY-001,
        PAY-008) is refused with PAY-017 and the document stays blocked
        (INV-AC-1584). With the override of a PAY-011 block on the Relay path
        recorded, issuance proceeds on the next `validateIssuance`
        (INV-REQ-330).


        Who approves is INV-REQ-1293 and is not decided here.
      tags: [validation]
      x-principal: filing-workflow
      x-timeout: 2000
      x-sync-edge: console-bff->payload-svc
      x-error-codes: [PAY-017]
      x-requirements: [INV-REQ-500, INV-REQ-330]
      x-operation:
        role: tax.approver
        scope: entity
        precondition: >-
          The document version carries the blocking code named, whose
          catalogue disposition is OVERRIDABLE.
        reversibility: IRREVERSIBLE
        repeatKey: >-
          (docUuid, version, code) — a repeat reports the recorded override
          unchanged.
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideValidationRequest'
            examples:
              default:
                value: { code: "PAY-011", reason: "Register lag: the supplier's GST registration was confirmed by IRAS on the phone." }
      responses:
        '201':
          description: The override is recorded (a repeat returns the recorded override unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationOverride'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 1
                    code: "PAY-011"
                    reason: "Register lag: the supplier's GST registration was confirmed by IRAS on the phone."
                    overriddenBy: "5b1f7c0e-2d4a-4c55-9a3e-0c1d2e3f4a5b"
                    overriddenAt: "2026-03-20T03:20:00Z"
        '400':
          description: The reason is missing or empty (SRT-001); nothing is recorded (INV-AC-1551).
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                default:
                  value:
                    type: "about:blank"
                    title: "A required field is missing"
                    status: 400
                    code: "SRT-001"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '422':
          description: The code's disposition is MANUAL or TERMINAL; the override is refused and the document stays blocked (PAY-017, INV-AC-1584).
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                default:
                  value:
                    type: "about:blank"
                    title: "Override refused for a MANUAL or TERMINAL code"
                    status: 422
                    code: "PAY-017"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/entities/{entityRef}/rendition-samples:
    post:
      operationId: recordRenditionSample
      summary: Check one sample PDF of an off-network rendition and record the result against the entity
      description: >-
        `tax.operator` uploads one sample PDF per call, for one scenario and
        submission type, at onboarding and every quarter. payload-svc extracts
        the text and checks the wording the Scenario pack lists for that
        (scenario, submissionType) pair, in the pack effective on the day of
        the call (INV-REQ-1033, INV-REQ-813, INV-REQ-1032; INV-Q-6321 option A).


        The check rules: the extracted text and the required wording are
        normalised, then compared case-sensitively; no dash folding is done
        (an en dash and a hyphen are different characters); "Tax Invoice" is
        never required for TYPE_1A and TYPE_1B; a sample with no extractable
        text fails every required wording (`textFound` false).


        PAY-014 is the entity's finding, not an error response: a failed check
        is a `201` with `result` FAILED and `findingCode` PAY-014, and the
        finding is raised against the entity, not against documents
        (INV-AC-681, INV-AC-1858, INV-AC-674). The finding stays open while
        the latest sample of any (scenario, submissionType) pair has failed.


        A missing or invalid field is refused with `400` and SRT-001. An
        unknown entity, or a (scenario, submissionType) pair the pack does not
        list, is refused with `404` and SRT-005; nothing is recorded.
      tags: [rendition]
      x-principal: filing-workflow
      x-timeout: 2000
      x-sync-edge: console-bff->payload-svc
      x-error-codes: [SRT-005]
      x-requirements: [INV-REQ-1033, INV-REQ-813, INV-REQ-1032]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: >-
          The entity exists and the Scenario pack effective on the day of the
          call lists the (scenario, submissionType) pair.
        reversibility: COMPENSABLE
        repeatKey: >-
          (entityRef, sampleSha256, scenario, submissionType) — a repeat
          returns the recorded result unchanged.
      parameters:
        - $ref: '#/components/parameters/EntityRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRenditionSampleRequest'
            examples:
              default:
                value: { scenario: "SELF_BILLING", submissionType: "TYPE_2", sampleContent: "JVBERi0xLjQK" }
      responses:
        '201':
          description: The sample is checked and the result is recorded (a repeat returns the recorded result unchanged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenditionSampleResult'
              examples:
                default:
                  value:
                    entityRef: "ENT-0001"
                    scenario: "SELF_BILLING"
                    submissionType: "TYPE_2"
                    sampleSha256: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    result: "FAILED"
                    textFound: true
                    missingWording: ["Buyer Created Tax Invoice"]
                    checkedAt: "2026-03-20T03:20:00Z"
                    packVersion: "2026.1"
                    findingCode: "PAY-014"
        '400':
          description: A required field is missing or invalid (SRT-001); nothing is recorded.
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                default:
                  value:
                    type: "about:blank"
                    title: "A required field is missing"
                    status: 400
                    code: "SRT-001"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        '404':
          description: The entity is unknown, or the pack does not list the (scenario, submissionType) pair (SRT-005); nothing is recorded.
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
              examples:
                default:
                  value:
                    type: "about:blank"
                    title: "Not found"
                    status: 404
                    code: "SRT-005"
                    correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/documents/{docUuid}/versions/{version}:
    get:
      operationId: getPayload
      summary: Read the built payload's metadata for a canonical version
      description: Payload query API to console-bff (services.yaml payload-svc `provides`; INV-REQ-1168).
      tags: [queries]
      x-principal: reporting
      x-sync-edge: console-bff->payload-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The built payload's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadMetadata'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    specVersion: "PINT-SG-1.2"
                    customizationId: "SG:PINT:1.2"
                    verdict: "PASS"
                    totalAmount: "1090.00"
                    sizeBytes: 4096
                    builtAt: "2026-03-20T03:15:22Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/documents/{docUuid}/versions/{version}/rendition:
    get:
      operationId: getRendition
      summary: Read the rendition sample-check status for a canonical version
      description: >-
        Rendition query API to console-bff (services.yaml payload-svc
        `provides`; INV-REQ-1168). Rendition sample checks (FR-9.13, PAY-014)
        — owned-mode rendition itself was withdrawn 24 Sep 2026; this reports
        the sample-check status against the external renderer's contract
        (FR-E.10).
      tags: [queries]
      x-principal: reporting
      x-sync-edge: console-bff->payload-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The rendition sample-check status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenditionStatus'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    sampleCheckStatus: "PASS"
                    lastCheckedAt: "2026-03-20T03:15:22Z"
                    findings: []
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/payload/documents/{docUuid}/versions/{version}/regenerated:
    get:
      operationId: getRegeneratedPayload
      summary: Read the byte-identical regeneration of a previously built payload
      description: >-
        Regeneration query API to console-bff (services.yaml payload-svc
        `provides`; INV-REQ-1168). Regenerated from the canonical input taken
        at build time (§6.8) — deterministic and side-effect-free, so it is
        safe as a `GET`. `identicalToBuilt` is true exactly when the SHA-256 of
        the regenerated bytes equals `builtSha256`, the SHA-256 of the bytes
        built at the time (INV-REQ-591, INV-AC-1701); `builtSha256` and
        `identicalToBuilt` are present together. `regenerationKey` is the key
        (canonical version, specification version, pack versions) the
        regeneration ran under; no two `packVersions` items share a `packRef`
        (producer-enforced).
      tags: [queries]
      x-principal: reporting
      x-sync-edge: console-bff->payload-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The regenerated payload's content reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegeneratedPayload'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    contentHash: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    sizeBytes: 4096
                    generatedAt: "2026-03-20T03:16:00Z"
                    regenerationKey:
                      canonicalVersion: 2
                      specificationVersion: "PINT-SG-1.0"
                      packVersions:
                        - packRef: "gst-rules"
                          version: "2026.1"
                    builtSha256: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    identicalToBuilt: true
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    DocUuid:
      name: docUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    DraftDocument:
      type: object
      description: A pre-issuance draft with no canonical record yet (§33.1).
      properties:
        entityRef:
          type: string
          maxLength: 40
        currency:
          type: string
          maxLength: 3
        totalIncludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        submissionType:
          type: string
          enum: [TYPE_1A, TYPE_1B, TYPE_2, TYPE_3]
          x-extensible-enum: true
          description: Same values as `ValidateIssuanceRequest.submissionType`.
        supplierGstn:
          type: string
          maxLength: 20
        invoiceDate:
          type: string
          format: date
        gstAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DraftLine'
      required: [entityRef, currency, totalIncludingTax]
    DraftLine:
      type: object
      properties:
        categoryCode:
          type: string
          maxLength: 20
        taxableAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        gstAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
