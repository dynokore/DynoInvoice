asyncapi: 3.1.0
info:
  title: payload events
  version: 1.2.0
  description: >-
    Every event payload produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2854 (T10) added payload's real §19.8 domain
    events below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T10's
    declared scope (spectral/ is not in it), named in the INV-T-2854 MR.
    payload-svc also produces the platform events EvidenceArtefactRecorded
    and PackReadinessAcknowledged (model/architecture/events.yaml); those are
    authored once under service-runtime/ (STK-61) — PackReadinessAcknowledged
    by T11 (INV-T-2855), EvidenceArtefactRecorded by INV-T-3313 (INV-Q-3257) —
    not here (T9's
    review, !3, rejected copying platform events into a producer directory).
  contact:
    name: payload (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  payloadPayloadReady:
    address: 'gst.payload.payload-ready.v1'
    messages:
      PayloadReady:
        $ref: '#/components/messages/PayloadReady'

  payloadPayloadRejected:
    address: 'gst.payload.payload-rejected.v1'
    messages:
      PayloadRejected:
        $ref: '#/components/messages/PayloadRejected'
  payloadRenditionFindingChanged:
    address: 'gst.payload.rendition-finding-changed.v1'
    messages:
      RenditionFindingChanged:
        $ref: '#/components/messages/RenditionFindingChanged'
  payloadExampleHappened:
    address: 'gst.payload.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishPayloadReady:
    action: send
    description: PayloadReady — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/payloadPayloadReady'
    messages:
      - $ref: '#/channels/payloadPayloadReady/messages/PayloadReady'

  publishPayloadRejected:
    action: send
    description: PayloadRejected — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/payloadPayloadRejected'
    messages:
      - $ref: '#/channels/payloadPayloadRejected/messages/PayloadRejected'
  publishRenditionFindingChanged:
    action: send
    description: RenditionFindingChanged — the entity's PAY-014 rendition finding opened or closed (INV-Q-6323).
    channel:
      $ref: '#/channels/payloadRenditionFindingChanged'
    messages:
      - $ref: '#/channels/payloadRenditionFindingChanged/messages/RenditionFindingChanged'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/payloadExampleHappened'
    messages:
      - $ref: '#/channels/payloadExampleHappened/messages/ExampleHappened'
components:
  messages:
    PayloadReady:
      name: com.dynokore.gst.payload.PayloadReady.v1
      title: PayloadReady
      summary: PayloadReady — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PayloadReady (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: payload-svc. Consumed by: evidence-svc, submission-svc. Delivery:
        At-least-once, idempotent consumption mandatory — the dedupe key is docUuid+version (FR-M.12), not
        the envelope id alone. Payload (catalogue text): docUuid, version, docsequence, submissionType,
        specificationVersion, the payload bytes and their SHA-256, amendment class, and the optional
        regenerationKey (INV-Q-6228, INV-REQ-591) and exchangeRate (INV-Q-6230, INV-REQ-512; both added by INV-T-6234). A payload over 10 MB
        raises PAY-010 and yields PayloadRejected, never PayloadReady (FR-4.13); inbound documents are at
        most 1 MB (VP-78), so payloads are normally far smaller. Bytes added 25 Sep 2026 (AD-30): submission-svc
        holds them with the queue item (FR-J.4); evidence-svc seals them as transmitted on
        SubmissionDespatched. Authored by INV-T-2854 (T10).
      # INV-T-3386 (owner ruling INV-Q-3249, INV-REQ-1205 b4): this event carries invoice content
      # (FR-AH.12, INV-REQ-1223), so its topic keeps the content window (INV-ADR-2772), not the
      # event-log retention. Copied into event-log/topics.yaml as content_topic by generate-topics.py.
      x-invoice-content: true
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/payload-ready-payload.schema.json'

    PayloadRejected:
      name: com.dynokore.gst.payload.PayloadRejected.v1
      title: PayloadRejected
      summary: PayloadRejected — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PayloadRejected (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: payload-svc. Consumed by: console-bff, notification-svc, submission-svc.
        Delivery: At-least-once. Payload (catalogue text): docUuid, version, docsequence, validation trace.
        Authored by INV-T-2854 (T10).
      # INV-T-3386 (owner ruling INV-Q-3249, coordinator decision on review of !24): this event
      # carries invoice content, so its topic keeps the content window (INV-ADR-2772), not the
      # event-log retention. Copied into event-log/topics.yaml as content_topic by generate-topics.py.
      x-invoice-content: true
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/payload-rejected-payload.schema.json'
    RenditionFindingChanged:
      name: com.dynokore.gst.payload.RenditionFindingChanged.v1
      title: RenditionFindingChanged
      summary: The entity's PAY-014 rendition finding opened or closed.
      description: >-
        Event RenditionFindingChanged (INV-Q-6323 option A, INV-REQ-648; class: domain). Emitted by:
        payload-svc. Consumed by: submission-svc. Delivery: At-least-once; consumers order by `sequence`
        and ignore a lower value than the one already applied. Payload: entityRef, open (true while the
        entity's PAY-014 finding is open), code (PAY-014), sequence, changedAt.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/rendition-finding-changed-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.payload.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
