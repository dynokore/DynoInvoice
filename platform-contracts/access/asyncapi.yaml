asyncapi: 3.1.0
info:
  title: access events
  version: 1.5.0
  description: >-
    Every event access produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added access's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: access (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  accessAuthorityChanged:
    address: 'gst.access.authority-changed.v1'
    messages:
      AuthorityChanged:
        $ref: '#/components/messages/AuthorityChanged'

  accessAuthorityHeadObserved:
    address: 'gst.access.authority-head-observed.v1'
    messages:
      AuthorityHeadObserved:
        $ref: '#/components/messages/AuthorityHeadObserved'

  accessOperatorSessionKeysChanged:
    address: 'gst.access.operator-session-keys-changed.v1'
    messages:
      OperatorSessionKeysChanged:
        $ref: '#/components/messages/OperatorSessionKeysChanged'
  accessAccessAlertRaised:
    address: 'gst.access.access-alert-raised.v1'
    messages:
      AccessAlertRaised:
        $ref: '#/components/messages/AccessAlertRaised'

  accessMessageRequested:
    address: 'gst.access.message-requested.v1'
    messages:
      MessageRequested:
        $ref: '#/components/messages/MessageRequested'
  accessExampleHappened:
    address: 'gst.access.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishAuthorityChanged:
    action: send
    description: AuthorityChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/accessAuthorityChanged'
    messages:
      - $ref: '#/channels/accessAuthorityChanged/messages/AuthorityChanged'

  publishAuthorityHeadObserved:
    action: send
    description: AuthorityHeadObserved — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/accessAuthorityHeadObserved'
    messages:
      - $ref: '#/channels/accessAuthorityHeadObserved/messages/AuthorityHeadObserved'

  publishOperatorSessionKeysChanged:
    action: send
    description: OperatorSessionKeysChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/accessOperatorSessionKeysChanged'
    messages:
      - $ref: '#/channels/accessOperatorSessionKeysChanged/messages/OperatorSessionKeysChanged'

  publishAccessAlertRaised:
    action: send
    description: AccessAlertRaised — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/accessAccessAlertRaised'
    messages:
      - $ref: '#/channels/accessAccessAlertRaised/messages/AccessAlertRaised'

  publishMessageRequested:
    action: send
    description: MessageRequested — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/accessMessageRequested'
    messages:
      - $ref: '#/channels/accessMessageRequested/messages/MessageRequested'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/accessExampleHappened'
    messages:
      - $ref: '#/channels/accessExampleHappened/messages/ExampleHappened'
components:
  messages:
    AuthorityChanged:
      name: com.dynokore.gst.access.AuthorityChanged.v1
      title: AuthorityChanged
      summary: AuthorityChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AuthorityChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: access-svc. Consumed by: aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc, transport-svc. Delivery:
        At-least-once. Payload (catalogue text): grant, consent, principal or revocation change, with
        validity and a monotonic authority version. Authored by INV-T-2853 (T9). INV-T-3298
        (INV-API-3325, INV-Q-3322 (b), INV-Q-3339) adds, additively, one record per event: a
        grantRecord with one entity's full grant state per (principal, entity), a consentRecord per
        client entity, or a principalRecord for a deletion or revocation, each versioned by the
        event's authorityVersion. Every service's authority replica is fed from this topic
        (INV-REQ-1201, INV-ADR-284). access-svc, the source, does not subscribe: it decides from its own store (INV-Q-8994). An event without any record is denied, never kept. CloudEvents
        subject is principalRef/entityRef (consent record tenant/clientEntityRef; principal record
        principalRef).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/authority-changed-payload.schema.json'
    AuthorityHeadObserved:
      name: com.dynokore.gst.access.AuthorityHeadObserved.v1
      title: AuthorityHeadObserved
      summary: AuthorityHeadObserved — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AuthorityHeadObserved (model/architecture/events.yaml, class: domain). Emitted by: access-svc. Consumed by: aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc, transport-svc. Delivery: At-least-once. Subscribed on gst.access.authority-head-observed.v1 by the authority replica of every service except access-svc, which decides from its own store; a heartbeat of access-svc carrying its highest committed authority version, published every 500 ms, so that a replica measures its lag against a known head and counts silence of more than 1000 ms as a lost feed; the subscription is not a consumers entry, because a consumers entry is a domain edge from access-svc and INV-REQ-1227 needs the graph acyclic (INV-Q-8994, INV-Q-9047).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/authority-head-observed-payload.schema.json'
    OperatorSessionKeysChanged:
      name: com.dynokore.gst.access.OperatorSessionKeysChanged.v1
      title: OperatorSessionKeysChanged
      summary: OperatorSessionKeysChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event OperatorSessionKeysChanged (model/architecture/events.yaml; class: domain;
        feeds runtime replicas). Emitted by: access-svc. Consumed by: aggregation-svc,
        canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc,
        notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, tenancy-svc,
        transport-svc. Delivery: At-least-once. Payload (catalogue text): operator-session signing
        keys: key id, algorithm, public key, valid-from, valid-until; the current and the next key
        during rotation. On its own topic (one channel, one message; API standard 'Topics per event
        type'; coordinator ruling INV-Q-4171), subscribed by every service that lacks the keys (every
        service except access-svc, which signs with them and verifies operator tokens from its own
        key store; a reading of INV-Q-4171): each subscribing service's authority
        replica (service-runtime) consumes it beside AuthorityChanged, with no ordering between the
        two, keeps the keys in the replica, and verifies an operator-session token (one with act,
        issued by openOperatorSession) only against them, refusing it (401) while none is valid.
        access-svc publishes a key before signing with it and keeps the old key until every token it
        signed has expired. getVerificationKeys and getRevocationList stay gateway-only (owner ruling
        INV-Q-4006 A; coordinator ruling INV-Q-4162; owner ruling INV-Q-4119). Each key item carries
        use, OPERATOR_SESSION or MACHINE_ACCESS. access-svc keeps one signing key for each use.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/operator-session-keys-changed-payload.schema.json'
      examples:
      - name: currentKey
        summary: The current key only
        payload:
          keys:
          - kid: ops-2026-10
            alg: RS256
            publicKey: U0lHTkVELVBMQUNFSE9MREVSCg==
            validFrom: '2026-10-01T00:00:00Z'
            validUntil: '2026-11-15T00:00:00Z'
      - name: rotation
        summary: The current and the next key during rotation
        payload:
          keys:
          - kid: ops-2026-10
            alg: RS256
            publicKey: U0lHTkVELVBMQUNFSE9MREVSCg==
            validFrom: '2026-10-01T00:00:00Z'
            validUntil: '2026-11-15T00:00:00Z'
          - kid: ops-2026-11
            alg: RS256
            publicKey: TkVYVC1QTEFDRUhPTERFUgo=
            validFrom: '2026-11-01T00:00:00Z'
            validUntil: '2026-12-15T00:00:00Z'
      - name: bothUses
        summary: One operator-session key and one machine-access key
        payload:
          keys:
          - kid: ops-2026-10
            use: OPERATOR_SESSION
            alg: RS256
            publicKey: U0lHTkVELVBMQUNFSE9MREVSCg==
            validFrom: '2026-10-01T00:00:00Z'
            validUntil: '2026-11-15T00:00:00Z'
          - kid: machine-2026-10
            use: MACHINE_ACCESS
            alg: RS256
            publicKey: TUFDSElORS1QTEFDRUhPTERFUgo=
            validFrom: '2026-10-01T00:00:00Z'
            validUntil: '2026-11-15T00:00:00Z'

    AccessAlertRaised:
      name: com.dynokore.gst.access.AccessAlertRaised.v1
      title: AccessAlertRaised
      summary: AccessAlertRaised — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AccessAlertRaised (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: access-svc. Consumed by: notification-svc. Delivery: At-least-once.
        Payload (catalogue text): ACC code, scope. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/access-alert-raised-payload.schema.json'

    MessageRequested:
      name: com.dynokore.gst.access.MessageRequested.v1
      title: MessageRequested
      summary: MessageRequested — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event MessageRequested (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: access-svc, control-plane-svc. Consumed by: notification-svc. Delivery: At-least-once.
        Payload (catalogue text): template, recipients, channel (e-mail or SMS), link reference or sealed
        passcode (FR-AG.70) — never invoice content. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/message-requested-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.access.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
