components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    AuthoriseResponse:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ALLOW
          - DENY
        role:
          type: string
          maxLength: 64
        reasonCode:
          type: string
          maxLength: 16
    VerificationKeysResponse:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          maxItems: 10
          items:
            type: object
            required:
            - kid
            - alg
            - publicKey
            properties:
              kid:
                type: string
                maxLength: 32
              alg:
                type: string
                maxLength: 16
              publicKey:
                type: string
                maxLength: 8192
                format: byte
    GrantRequest:
      type: object
      required:
      - granteeKind
      - identityRef
      - role
      - scope
      - validFrom
      properties:
        granteeKind:
          type: string
          enum:
          - STAFF
          - EXTERNAL
          - CROSS_TENANT
        identityRef:
          type: string
          maxLength: 64
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    GrantResponse:
      type: object
      required:
      - grantRef
      - identityRef
      - role
      - scope
      - status
      properties:
        grantRef:
          type: string
          maxLength: 64
        identityRef:
          type: string
          maxLength: 64
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
          x-extensible-enum: true
    CreatePrincipalRequest:
      type: object
      required:
      - principalType
      - scope
      properties:
        principalType:
          type: string
          enum:
          - MACHINE_CLIENT
          - AP_CALLBACK
          - SCHEDULED_JOB
          - AGENT
          - SUPPORT_TOOL
          - INTEGRATION
        scope:
          type: string
          maxLength: 128
    PrincipalResponse:
      type: object
      required:
      - principalRef
      - principalType
      - status
      properties:
        principalRef:
          type: string
          maxLength: 64
        principalType:
          type: string
          maxLength: 32
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          x-extensible-enum: true
    RotatePrincipalRequest:
      type: object
      required:
      - overlapMinutes
      properties:
        overlapMinutes:
          type: integer
          minimum: 0
          maximum: 1440
    IdpGroupMappingRequest:
      type: object
      required:
      - idpGroup
      - role
      - scope
      properties:
        idpGroup:
          type: string
          maxLength: 128
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
    IdpGroupMappingResponse:
      type: object
      required:
      - mappingRef
      - idpGroup
      - role
      - scope
      properties:
        mappingRef:
          type: string
          maxLength: 64
        idpGroup:
          type: string
          maxLength: 128
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
    SoleOperatorAckRequest:
      type: object
      required:
      - tenantRef
      - compensatingControls
      properties:
        tenantRef:
          type: string
          maxLength: 64
        compensatingControls:
          type: string
          maxLength: 1000
    SoleOperatorAckResponse:
      type: object
      required:
      - ackRef
      - tenantRef
      - status
      properties:
        ackRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
          - ACTIVE
          - WITHDRAWN
          x-extensible-enum: true
    ElevationRequest:
      type: object
      required:
      - caseId
      - tenantRef
      - reason
      properties:
        caseId:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        reason:
          type: string
          maxLength: 1000
    ElevationResponse:
      type: object
      required:
      - requestRef
      - caseId
      - status
      properties:
        requestRef:
          type: string
          maxLength: 64
        caseId:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
          - PENDING
          - GRANTED
          - REFUSED
          - WITHDRAWN
          x-extensible-enum: true
    DecideElevationRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - GRANT
          - REFUSE
        validForMinutes:
          type: integer
          minimum: 1
          maximum: 1440
    DiagnosticInvitationRequest:
      type: object
      required:
      - installationRef
      - caseId
      properties:
        installationRef:
          type: string
          maxLength: 64
        caseId:
          type: string
          maxLength: 64
    DiagnosticInvitationResponse:
      type: object
      required:
      - invitationRef
      - installationRef
      - status
      properties:
        invitationRef:
          type: string
          maxLength: 64
        installationRef:
          type: string
