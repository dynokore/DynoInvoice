openapi: 3.1.0
info:
  title: access API
  version: 1.0.0
  description: 'Contract-first source of truth for access (API-01, STK-44), replacing the INV-T-2849 scaffold
    (INV-T-2857, T13). Internal API only (SDS/04-api-standards §1): who may do what, on whose authority.
    `authorise` and `getVerificationKeys` are queries, not FR-AC.1 operations (no persistent state change),
    called by every service and the gateway respectively; every other operation is a console command reached
    through console-bff. Several SDS §7 catalogue rows sharing one shape are consolidated onto one resource
    (noted per operation) to keep the surface small. The `access-contract` module generates its server
    interfaces and DTOs from this file (STK-46); a consumer generates its own client types from the same
    file (FR-AH.13, ARC-07).'
  contact:
    name: access (see CODEOWNERS)
servers:
- url: https://internal.invoice.internal
  description: Internal API (SDS/04-api-standards §1) — never routed by the gateway.
tags:
- name: authorise
  description: Live authorisation decisions and gateway key material.
- name: grants
  description: Identity, grant and invitation lifecycle (FR-P.2, FR-AF.15, FR-AF.20).
- name: principals
  description: Service principal lifecycle (§22.5, FR-P.10).
- name: identity-provider
  description: Identity-provider group-to-grant mapping (FR-P.12).
- name: separation-of-duty
  description: Sole-operator acknowledgement (FR-P.2).
- name: elevation
  description: Elevation requests and diagnostic invitations (FR-AF.12, FR-AF.10).
- name: signed-links
  description: Signed links for external actors (§34.8, §34.9).
- name: break-glass
  description: Break-glass access (§34.6, ACC-002).
- name: access-review
  description: Quarterly access review (FR-AF.16).
- name: consent
  description: Agent consent lifecycle and pack acknowledgement (FR-AF.34, FR-AB.8).
- name: access
  description: Deprecated placeholder tag (INV-T-2849); dropped with the placeholder operation.
paths:
  /internal/v1/access/authorise:
    get:
      operationId: authorise
      summary: Authorisation decision on role x permission x scope, evaluated live (SDS §28.16, FR-P.1,
        FR-Z.14)
      description: Called by every service (the fallback edge when a caller's authority replica lags beyond
        its bound, FR-Z.14). Always 200; the decision, not an HTTP error, carries a DENY.
      tags:
      - authorise
      x-principal: filing-workflow
      x-sync-edge: any->access-svc
      x-timeout: 500
      x-requirements:
      - FR-AC.1
      - FR-P.1
      - FR-Z.14
      x-error-codes: []
      parameters:
      - name: principalRef
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: permission
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: scope
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoriseResponse'
              examples:
                default:
                  value:
                    decision: ALLOW
                    role: tax.approver
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/verification-keys:
    get:
      operationId: getVerificationKeys
      summary: Token verification material for the gateway to verify tokens offline (SDS §28.16, §2.5)
      description: Token verification material for the gateway to verify tokens offline (SDS §28.16, §2.5).
      tags:
      - authorise
      x-principal: filing-workflow
      x-sync-edge: api-gateway->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      x-error-codes: []
      responses:
        "200":
          description: JWKS-style key set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationKeysResponse'
              examples:
                default:
                  value:
                    keys:
                    - kid: 2026-09
                      alg: RS256
                      publicKey: U0lHTkVELVBMQUNFSE9MREVSCg==
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/grants:
    post:
      operationId: grantRole
      summary: Grant a role x scope x validity, inviting the identity if it does not yet exist (SDS §7,
        SCR-24.1/24.2/24.4, §31.2)
      description: Covers grantRole, inviteUser and inviteExternalIdentity (cross-tenant, FR-AF.20) —
        one shape, discriminated by granteeKind. Emits AuthorityChanged.
      tags:
      - grants
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      - FR-AF.20
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Separation-of-duty rules are satisfied (FR-P.2)
        reversibility: UNDOABLE
        repeatKey: (identityRef, role, scope) — a repeat returns the original grant; revoke to undo
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
            examples:
              default:
                value:
                  granteeKind: STAFF
                  identityRef: IDN-0091
                  role: tax.approver
                  scope: entity:ENT-3F2A9C
                  validFrom: "2026-09-27"
                  validTo: "2027-09-27"
      responses:
        "201":
          description: Grant created (or pending invitation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
              examples:
                default:
                  value:
                    grantRef: GRT-00219
                    identityRef: IDN-0091
                    role: tax.approver
                    scope: entity:ENT-3F2A9C
                    status: ACTIVE
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/grants/{grantRef}:
    delete:
      operationId: revokeGrant
      summary: Revoke a grant or withdraw a pending invitation (undoes grantRole, SDS §7)
      description: Revoke a grant or withdraw a pending invitation (undoes grantRole, SDS §7).
      tags:
      - grants
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Grant exists
        reversibility: COMPENSABLE
        repeatKey: grantRef — re-grant compensates
      parameters:
      - name: grantRef
        in: path
        required: true
        description: The grant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: GRT-00219
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: 'Revoked (or already revoked: a no-op)'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals:
    post:
      operationId: createPrincipal
      summary: Create a service principal of a chosen type (SDS §7, SCR-17.6, §22.5)
      description: Create a service principal of a chosen type (SDS §7, SCR-17.6, §22.5).
      tags:
      - principals
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Principal type chosen
        reversibility: COMPENSABLE
        repeatKey: (principalType, scope) — revocation is immediate; a new credential is a new principal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalRequest'
            examples:
              default:
                value:
                  principalType: MACHINE_CLIENT
                  scope: entity:ENT-3F2A9C
      responses:
        "201":
          description: Principal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                default:
                  value:
                    principalRef: PRN-00088
                    principalType: MACHINE_CLIENT
                    status: ACTIVE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/{principalRef}/rotate:
    post:
      operationId: rotatePrincipal
      summary: Rotate a service principal's credential, with an overlap window (SDS §7, SCR-17.6)
      description: Rotate a service principal's credential, with an overlap window (SDS §7, SCR-17.6).
      tags:
      - principals
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Principal exists
        reversibility: COMPENSABLE
        repeatKey: principalRef + action=ROTATE
      parameters:
      - name: principalRef
        in: path
        required: true
        description: The service principal's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: PRN-00088
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotatePrincipalRequest'
            examples:
              default:
                value:
                  overlapMinutes: 60
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                default:
                  value:
                    principalRef: PRN-00088
                    principalType: MACHINE_CLIENT
                    status: ACTIVE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/{principalRef}/revoke:
    post:
      operationId: revokePrincipal
      summary: Revoke a service principal immediately (SDS §7, SCR-17.6)
      description: Revoke a service principal immediately (SDS §7, SCR-17.6).
      tags:
      - principals
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Principal exists
        reversibility: COMPENSABLE
        repeatKey: principalRef + action=REVOKE — no-op if already revoked
      parameters:
      - name: principalRef
        in: path
        required: true
        description: The service principal's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: PRN-00088
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                default:
                  value:
                    principalRef: PRN-00088
                    principalType: MACHINE_CLIENT
                    status: REVOKED
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/idp-group-mappings:
    post:
      operationId: mapIdpGroup
      summary: Map an identity-provider group to a role x scope grant (SDS §7, SCR-24.3, FR-P.12)
      description: Map an identity-provider group to a role x scope grant (SDS §7, SCR-24.3, FR-P.12).
      tags:
      - identity-provider
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.12
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Identity provider is connected
        reversibility: UNDOABLE
        repeatKey: (idpGroup, role, scope) — a repeat returns the original mapping
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpGroupMappingRequest'
            examples:
              default:
                value:
                  idpGroup: acme-tax-approvers
                  role: tax.approver
                  scope: tenant:TEN-7B1004
      responses:
        "201":
          description: Mapping recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpGroupMappingResponse'
              examples:
                default:
                  value:
                    mappingRef: IDPM-0012
                    idpGroup: acme-tax-approvers
                    role: tax.approver
                    scope: tenant:TEN-7B1004
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/idp-group-mappings/{mappingRef}:
    delete:
      operationId: unmapIdpGroup
      summary: Remove an identity-provider group mapping (undoes mapIdpGroup, SDS §7)
      description: Remove an identity-provider group mapping (undoes mapIdpGroup, SDS §7).
      tags:
      - identity-provider
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.12
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Mapping exists
        reversibility: UNDOABLE
        repeatKey: mappingRef — re-map to restore
      parameters:
      - name: mappingRef
        in: path
        required: true
        description: The IdP group-to-grant mapping's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: IDPM-0012
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: 'Removed (or already removed: a no-op)'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/sole-operator-acknowledgements:
    post:
      operationId: recordSoleOperator
      summary: Acknowledge a sole-operator conflict with compensating controls (SDS §7, SCR-24.5)
      description: Acknowledge a sole-operator conflict with compensating controls (SDS §7, SCR-24.5).
      tags:
      - separation-of-duty
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Only one person can hold the conflicting roles
        reversibility: COMPENSABLE
        repeatKey: tenantRef — withdraw when a second person joins
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoleOperatorAckRequest'
            examples:
              default:
                value:
                  tenantRef: TEN-7B1004
                  compensatingControls: Monthly review by an external accountant
      responses:
        "201":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoleOperatorAckResponse'
              examples:
                default:
                  value:
                    ackRef: SOA-0004
                    tenantRef: TEN-7B1004
                    status: ACTIVE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/sole-operator-acknowledgements/{ackRef}:
    delete:
      operationId: withdrawSoleOperatorAcknowledgement
      summary: Withdraw a sole-operator acknowledgement, a second person having joined (SDS §7)
      description: Withdraw a sole-operator acknowledgement, a second person having joined (SDS §7).
      tags:
      - separation-of-duty
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: A second person now holds one of the conflicting roles
        reversibility: UNDOABLE
        repeatKey: ackRef
      parameters:
      - name: ackRef
        in: path
        required: true
        description: The sole-operator acknowledgement's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: SOA-0004
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: Withdrawn
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/elevation-requests:
    post:
      operationId: requestElevation
      summary: Request time-boxed elevation or a diagnostic invitation to a tenant (SDS §7, SCR-39.2)
      description: Request time-boxed elevation or a diagnostic invitation to a tenant (SDS §7, SCR-39.2).
      tags:
      - elevation
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AF.12
      x-error-codes: []
      x-operation:
        role: platform.support
        scope: tenant
        precondition: A support case is open
        reversibility: UNDOABLE
        repeatKey: caseId — withdraw to cancel
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElevationRequest'
            examples:
              default:
                value:
                  caseId: CASE-5521
                  tenantRef: TEN-7B1004
                  reason: Investigate SUB-014 on behalf of the customer
      responses:
        "201":
          description: Pending request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElevationResponse'
              examples:
                default:
                  value:
                    requestRef: ELV-0031
                    caseId: CASE-5521
                    status: PENDING
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/elevation-requests/{requestRef}/decide:
    post:
      operationId: decideElevation
      summary: Decide a pending elevation or diagnostic-invitation request (SDS §7, SCR-25.2)
      description: Decide a pending elevation or diagnostic-invitation request (SDS §7, SCR-25.2).
      tags:
      - elevation
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AF.12
      x-error-codes: []
      x-operation:
        role: security.officer
        scope: tenant
        precondition: Request is pending
        reversibility: COMPENSABLE
        repeatKey: requestRef (ELV-* or DIAG-*) — revoke the grant early to compensate
      parameters:
      - name: requestRef
        in: path
        required: true
        description: The elevation request's or diagnostic invitation's opaque reference
          (ELV-* or DIAG-*).
        schema:
          type: string
          maxLength: 64
        example: ELV-0031
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideElevationRequest'
            examples:
              default:
                value:
                  decision: GRANT
                  validForMinutes: 120
      responses:
        "200":
          description: Time-boxed grant, or refusal recorded
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ElevationResponse'
                - $ref: '#/components/schemas/DiagnosticInvitationResponse'
              examples:
                elevation:
                  summary: An elevation request decided
                  value:
                    requestRef: ELV-0031
                    caseId: CASE-5521
                    status: GRANTED
                diagnosticInvitation:
                  summary: A diagnostic invitation decided
                  value:
                    invitationRef: DIAG-0007
                    installationRef: INST-0091
                    status: GRANTED
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/elevation-requests/{requestRef}:
    delete:
      operationId: withdrawElevationRequest
      summary: Withdraw a pending elevation request (SDS §7)
      description: Withdraw a pending elevation request (SDS §7).
      tags:
      - elevation
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AF.12
      x-error-codes: []
      x-operation:
        role: platform.support
        scope: tenant
        precondition: Request is still pending
        reversibility: UNDOABLE
        repeatKey: requestRef
      parameters:
      - name: requestRef
        in: path
        required: true
        description: The elevation or diagnostic-invitation request's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ELV-0031
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: Withdrawn
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/diagnostic-invitations:
    post:
      operationId: inviteDiagnostics
      summary: Invite a deployment operator to diagnostics, private form only (SDS §7, SCR-28.3)
      description: Invite a deployment operator to diagnostics, private form only (SDS §7, SCR-28.3).
      tags:
      - elevation
      x-principal: filing-workflow
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
