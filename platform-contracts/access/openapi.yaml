    post:
      operationId: reissueFirstAdministratorInvitation
      summary: Reissue the expired first tenant.admin invitation on the same pending grant (INV-Q-8232 A, INV-FLOW-227 alternate)
      description: 'Only the service principal of control-plane-svc calls it, compared by equality; every other caller, a person and the installer workload included, is refused with 403. It succeeds only when the tenant''s `tenant.admin` grants of status ACTIVE or PENDING are exactly one and it is PENDING and its invitation expiry is before the call instant (read from the service clock port; at the exact expiry instant the call is refused with 409). It then keeps the same grant, issues a new `invitationRef`, a new one-time `invitationCode` and the requested expiry, and the old invitation and code stop working. Every other state is refused with 409 and nothing is stored. A repeat with the same `Idempotency-Key` returns the original response. The 409 rule of `provisionFirstAdministrator` is not changed. The call is audit-logged.'
