openapi: 3.1.0
info:
  title: access API
  version: 1.12.0
  description: 'Contract-first source of truth for access (API-01, STK-44), replacing the INV-T-2849 scaffold
    (INV-T-2857, T13). Internal API only (SDS/04-api-standards §1): who may do what, on whose authority.
    `authorise`, `authenticatePrincipal`, `getVerificationKeys`, `getRevocationList` and `resolveLandingScreen` are queries, not FR-AC.1 operations (no persistent state change),
    called by every service and the gateway respectively; every other operation is a console command reached
    through console-bff. Several SDS §7 catalogue rows sharing one shape are consolidated onto one resource
    (noted per operation) to keep the surface small. The `access-contract` module generates its server
    interfaces and DTOs from this file (STK-46); a consumer generates its own client types from the same
    file (FR-AH.13, ARC-07).'
  contact:
    name: access (see CODEOWNERS)
servers:
- url: https://internal.invoice.internal
  description: Internal API (SDS/04-api-standards §1) — never routed by the gateway.
tags:
- name: authorise
  description: Live authorisation decisions and gateway key material.
- name: grants
  description: Identity, grant and invitation lifecycle (FR-P.2, FR-AF.15, FR-AF.20).
- name: principals
  description: Service principal lifecycle (§22.5, FR-P.10).
- name: identity-provider
  description: Identity-provider group-to-grant mapping (FR-P.12).
- name: separation-of-duty
  description: Sole-operator acknowledgement (FR-P.2).
- name: elevation
  description: Elevation requests, diagnostic invitations and operator sessions (FR-AF.12, FR-AF.10,
    FR-P.4).
- name: signed-links
  description: Signed links for external actors (§34.8, §34.9).
- name: break-glass
  description: Break-glass access (§34.6, ACC-002).
- name: access-review
  description: Quarterly access review (FR-AF.16).
- name: consent
  description: Agent consent lifecycle and pack acknowledgement (FR-AF.34, FR-AB.8).
- name: access
  description: Deprecated placeholder tag (INV-T-2849); dropped with the placeholder operation.
paths:
  /internal/v1/access/authorise:
    get:
      operationId: authorise
      summary: Authorisation decision on role x permission x scope, evaluated live (SDS §28.16, FR-P.1,
        FR-Z.14)
      description: Called by every service (the fallback edge when a caller's authority replica lags beyond
        its bound, FR-Z.14). Always 200; the decision, not an HTTP error, carries a DENY.
      tags:
      - authorise
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: any-except:tenancy-svc->access-svc
      x-timeout: 500
      x-requirements:
      - FR-AC.1
      - FR-P.1
      - FR-Z.14
      x-error-codes: []
      parameters:
      - name: principalRef
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: permission
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: scope
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoriseResponse'
              examples:
                default:
                  value:
                    decision: ALLOW
                    role: tax.approver
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/verification-keys:
    get:
      operationId: getVerificationKeys
      summary: Token verification material for the gateway to verify tokens offline (SDS §28.16, §2.5)
      description: Token verification material for the gateway to verify tokens offline (SDS §28.16, §2.5).
      tags:
      - authorise
      x-principal: workload
      x-caller-auth: service-job
      x-sync-edge: api-gateway->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      x-error-codes: []
      responses:
        "200":
          description: JWKS-style key set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationKeysResponse'
              examples:
                default:
                  value:
                    keys:
                    - kid: 2026-09
                      alg: RS256
                      publicKey: U0lHTkVELVBMQUNFSE9MREVSCg==
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/revocations:
    get:
      operationId: getRevocationList
      summary: The revocation list the API gateway refreshes every second (INV-API-4001, INV-Q-3973 A)
      description: 'Every service principal revoked by revokePrincipal and every user subject or token
        id that access-svc has revoked, each with its revocation time, and a monotonic list version.
        Grant revocations are not on it: they stay with the services'' authority replicas (INV-REQ-1214,
        INV-AC-2186). Called only by the API gateway, in the background, at least once a second with one
        request in flight; the gateway refuses a listed token on the request itself (INV-AC-936,
        INV-REQ-1202, INV-FLOW-248 step 2). Without sinceVersion the response is the full list of live
        entries (snapshot true). With sinceVersion it is every live entry whose version is above it
        (snapshot false), ordered by version, then entryId (API-18 total order). If sinceVersion is above
        the current version (for example after a restore), the response is a full snapshot (snapshot true)
        that replaces the caller''s list. A multi-page response is pinned by its cursor to the listVersion
        of its first page; the caller takes the listVersion of the last page as its next sinceVersion. An
        unchanged list returns 200 with no items and the same listVersion. An entry''s expiresAt is its
        revokedAt plus the longest access-token lifetime, 15 minutes (API-23); after expiresAt it is no
        longer returned and the caller drops it at the same instant, so deltas never carry removals. A
        PRINCIPAL or SUBJECT entry refuses tokens of that principal or subject with iat at or before
        revokedAt; a TOKEN entry refuses its jti (INV-Q-4008 A). The caller authenticates with its
        workload token only (x-principal workload; owner ruling INV-Q-4006 A); any identity other than
        the gateway service account named by the api-gateway->access-svc edge gets 403 SRT-004.
        Responses carry a strong ETag equal to the quoted listVersion and Cache-Control no-store; there
        is no conditional request and no 304. The caller treats every non-200 and every timeout as
        access-svc unreachable and keeps its cached list (INV-Q-3973 A, INV-Q-4021 A).'
      tags:
      - authorise
      x-principal: workload
      x-caller-auth: service-job
      x-sync-edge: api-gateway->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      - FR-AH.6
      x-error-codes: []
      parameters:
      - name: sinceVersion
        in: query
        required: false
        description: Return only entries added after this list version; absent returns a full snapshot.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      - name: cursor
        in: query
        required: false
        description: Opaque, integrity-protected cursor (API-18), pinned to the listVersion of the first page.
        schema:
          type: string
          maxLength: 512
      responses:
        "200":
          description: One page of the revocation list (snapshot or delta)
          headers:
            ETag:
              description: Strong ETag equal to the quoted listVersion.
              schema:
                type: string
                maxLength: 24
            Cache-Control:
              description: Always no-store, so no intermediary keeps security state.
              schema:
                type: string
                maxLength: 16
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationListResponse'
              examples:
                default:
                  value:
                    listVersion: 42
                    snapshot: true
                    items:
                    - entryId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      version: 41
                      kind: PRINCIPAL
                      principalRef: erp-ingest-01
                      revokedAt: '2026-10-12T08:00:00Z'
                      expiresAt: '2026-10-12T08:15:00Z'
                    - entryId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      version: 42
                      kind: TOKEN
                      tokenId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                      revokedAt: '2026-10-12T08:01:00Z'
                      expiresAt: '2026-10-12T08:16:00Z'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/grants:
    post:
      operationId: grantRole
      summary: Grant a role x scope x validity, inviting the identity if it does not yet exist (SDS §7,
        SCR-24.1/24.2/24.4, §31.2)
      description: Covers grantRole, inviteUser and inviteExternalIdentity (cross-tenant, FR-AF.20) —
        one shape, discriminated by granteeKind. Emits AuthorityChanged.
      tags:
      - grants
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      - FR-AF.20
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Separation-of-duty rules are satisfied (FR-P.2)
        reversibility: UNDOABLE
        repeatKey: (identityRef, role, scope) — a repeat returns the original grant; revoke to undo
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
            examples:
              default:
                value:
                  granteeKind: STAFF
                  identityRef: IDN-0091
                  role: tax.approver
                  scope: entity:ENT-3F2A9C
                  validFrom: "2026-09-27"
                  validTo: "2027-09-27"
      responses:
        "201":
          description: Grant created (or pending invitation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
              examples:
                default:
                  value:
                    grantRef: GRT-00219
                    identityRef: IDN-0091
                    role: tax.approver
                    scope: entity:ENT-3F2A9C
                    status: ACTIVE
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/grants/{grantRef}:
    delete:
      operationId: revokeGrant
      summary: Revoke a grant or withdraw a pending invitation (undoes grantRole, SDS §7)
      description: Revoke a grant or withdraw a pending invitation (undoes grantRole, SDS §7).
      tags:
      - grants
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.2
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Grant exists
        reversibility: COMPENSABLE
        repeatKey: grantRef — re-grant compensates
      parameters:
      - name: grantRef
        in: path
        required: true
        description: The grant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: GRT-00219
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: 'Revoked (or already revoked: a no-op)'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals:
    post:
      operationId: createPrincipal
      summary: Create a service principal of a chosen type (SDS §7, SCR-17.6, §22.5)
      description: >-
        Create a service principal of a chosen type (SDS §7, SCR-17.6, §22.5). Rules stated here and not in the schema
        (INV-REQ-587, ruling INV-Q-6252): access-svc requires callingSystem when principalType is FILING_WORKFLOW
        and refuses a missing value with 400; the repeat key is (principalType, scope, callingSystem), so two systems
        may each hold a FILING_WORKFLOW principal for one scope. Credential rules of access-svc that the schema cannot
        express (INV-REQ-880, INV-REQ-584): credentialMethod PRIVATE_KEY_JWT needs publicKeyJwk; MTLS needs
        certificateThumbprint; CLIENT_SECRET_BASIC takes no key material and is refused with 400 when the installation
        setting VP-77 (INV-REQ-2760) does not allow it; any other combination is 400. A request with none of
        credentialMethod, publicKeyJwk and certificateThumbprint creates the principal with no new credential, as before.
        The 201 carries credential.
      tags:
      - principals
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Principal type chosen
        reversibility: COMPENSABLE
        repeatKey: (principalType, scope, callingSystem) — revocation is immediate; a new credential is a new principal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrincipalRequest'
            examples:
              default:
                value:
                  principalType: MACHINE_CLIENT
                  scope: entity:ENT-3F2A9C
              filingWorkflow:
                value:
                  principalType: FILING_WORKFLOW
                  scope: tenant:TEN-7B1004
                  callingSystem: filing-orchestrator
              privateKeyJwt:
                value:
                  principalType: INGEST
                  scope: tenant:TEN-7B1004
                  credentialMethod: PRIVATE_KEY_JWT
                  publicKeyJwk:
                    kty: EC
                    kid: erp-2026-10
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
      responses:
        "201":
          description: Principal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                default:
                  value:
                    principalRef: PRN-00088
                    principalType: MACHINE_CLIENT
                    status: ACTIVE
                filingWorkflow:
                  value:
                    principalRef: PRN-00089
                    principalType: FILING_WORKFLOW
                    status: ACTIVE
                    callingSystem: filing-orchestrator
                withCredential:
                  value:
                    principalRef: PRN-00090
                    principalType: INGEST
                    status: ACTIVE
                    credential:
                      credentialRef: CRD-00001
                      method: PRIVATE_KEY_JWT
                      status: ACTIVE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/authenticate:
    post:
      operationId: authenticatePrincipal
      summary: Authenticate a service principal by the proof of one credential (INV-REQ-880, FR-P.10)
      description: >-
        Called by the API gateway. The call is a query like `authorise` and always answers 200; the decision carries the
        refusal. An unknown principal, a REVOKED principal, a credential that is WITHDRAWN or past its validUntil, a
        method that the credential does not have, and a proof that does not match are each REFUSED. AUTHENTICATED
        carries principalRef, principalType, scope and credentialRef. The operation mints no token (open question
        INV-Q-8809).
      tags:
      - principals
      x-principal: workload
      x-caller-auth: service-job
      x-sync-edge: api-gateway->access-svc
      x-timeout: 500
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: API gateway workload token
        scope: installation
        precondition: A principal reference and the proof of one credential are presented
        reversibility: UNDOABLE
        repeatKey: 'none: the call changes no state, so a repeat with the same input returns the same decision while the credential state is unchanged'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatePrincipalRequest'
            examples:
              default:
                value:
                  principalRef: PRN-00088
                  method: CLIENT_SECRET_BASIC
                  proof: example-secret
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatePrincipalResponse'
              examples:
                default:
                  value:
                    decision: AUTHENTICATED
                    principalRef: PRN-00088
                    principalType: INGEST
                    scope: tenant:TEN-7B1004
                    credentialRef: CRD-00001
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/token:
    post:
      operationId: issueAccessToken
      summary: Exchange the proof of one credential for a signed access token (INV-REQ-880, FR-P.10)
      description: >-
        Called by the API gateway. The call always answers 200 and the decision carries the refusal, like
        `authenticatePrincipal`. An unknown principal, a REVOKED principal, a credential that is WITHDRAWN or past its
        validUntil, a method that the credential does not have, and a proof that does not match are each REFUSED, so a
        revoked principal gets no token and the REFUSED body has no accessToken, expiresIn, keyId or tokenId. ISSUED
        carries all four. The token is a bearer JWT with header typ `at+jwt`, alg and kid, and verifies with the public
        key of `getVerificationKeys` whose kid equals keyId. The claim exp minus the claim iat equals expiresIn. The
        private signing key is used only by access-svc and appears in no response. The claims are `iss`, `sub`,
        `aud`, `scope`, `principal_scope`, `permissions`, `iat`, `exp`, `jti`, `client_id` and `tenant_id`. The claims
        sub and client_id equal the principalRef. The claim scope is exactly one of ingest, filing-workflow,
        ap-callback, reporting, monitoring and certification, the machine scope of the principal type. The claim
        principal_scope is the scope of the principal: entity:<ref>, tenant:<ref> or installation. The claim
        permissions is the permission set of the principal type, the keys of
        access/schemas/machine-principal-permissions.tsv. The claim tenant_id is present when the principal has a
        tenant. The claim aud contains the installation's public API.
      tags:
      - principals
      x-principal: workload
      x-caller-auth: service-job
      x-sync-edge: api-gateway->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: API gateway workload token
        scope: installation
        precondition: A principal reference and the proof of one credential are presented
        reversibility: UNDOABLE
        repeatKey: 'none: each call mints a new token with its own jti'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAccessTokenRequest'
            examples:
              default:
                value:
                  principalRef: PRN-00088
                  method: PRIVATE_KEY_JWT
                  proof: eyJhbGciOiJSUzI1NiJ9.e30.c2lnbmF0dXJl
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAccessTokenResponse'
              examples:
                default:
                  value:
                    decision: ISSUED
                    accessToken: eyJ0eXAiOiJhdCtqd3QifQ.e30.c2lnbmF0dXJl
                    expiresIn: 900
                    keyId: 2026-09
                    tokenId: 7d9f2c1e-0b44-4c55-9a53-2f6a1e0b9c11
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/{principalRef}/rotate:
    post:
      operationId: rotatePrincipal
      summary: Rotate a service principal's credential, with an overlap window (SDS §7, SCR-17.6)
      description: >-
        Rotate a service principal's credential, with an overlap window (SDS §7, SCR-17.6). Credential rules of
        access-svc that the schema cannot express (INV-REQ-880, INV-REQ-584): credentialMethod PRIVATE_KEY_JWT needs
        publicKeyJwk; MTLS needs certificateThumbprint; CLIENT_SECRET_BASIC takes no key material and is refused with
        400 when the installation setting VP-77 (INV-REQ-2760) does not allow it; any other combination is 400. A
        request with none of the three properties rotates with no new credential, as before. The 200 carries
        credential (the new one) and previousCredential (the old one, whose validUntil equals the instant of the
        rotation plus overlapMinutes minutes).
      tags:
      - principals
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Principal exists
        reversibility: COMPENSABLE
        repeatKey: principalRef + action=ROTATE
      parameters:
      - name: principalRef
        in: path
        required: true
        description: The service principal's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: PRN-00088
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotatePrincipalRequest'
            examples:
              default:
                value:
                  overlapMinutes: 60
              privateKeyJwt:
                value:
                  overlapMinutes: 60
                  credentialMethod: PRIVATE_KEY_JWT
                  publicKeyJwk:
                    kty: EC
                    kid: erp-2026-11
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                default:
                  value:
                    principalRef: PRN-00088
                    principalType: MACHINE_CLIENT
                    status: ACTIVE
                withCredentials:
                  value:
                    principalRef: PRN-00088
                    principalType: INGEST
                    status: ACTIVE
                    credential:
                      credentialRef: CRD-00002
                      method: PRIVATE_KEY_JWT
                      status: ACTIVE
                    previousCredential:
                      credentialRef: CRD-00001
                      method: PRIVATE_KEY_JWT
                      status: ACTIVE
                      validUntil: '2026-10-23T09:00:00Z'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/principals/{principalRef}/revoke:
    post:
      operationId: revokePrincipal
      summary: Revoke a service principal immediately (SDS §7, SCR-17.6)
      description: Revoke a service principal immediately (SDS §7, SCR-17.6). The 200 carries neither credential nor
