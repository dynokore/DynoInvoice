  /internal/v1/access/landing-choice:
    put:
      operationId: chooseLandingScreen
      summary: Choose the caller's own default landing screen among the roles they hold (INV-REQ-2756)
      description: The person is the authenticated subject of the call, never a request field. A role the caller does not hold is refused (403). A repeat with the same role changes nothing. The choice is a per-user setting, not the tenant role-precedence policy, and changes no permission of any role (INV-REQ-2756).
      tags:
      - grants
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - INV-REQ-2756
      x-error-codes: []
      x-operation:
        role: Any role the caller holds
        scope: own
        precondition: The caller holds the role named in the request
        reversibility: UNDOABLE
        repeatKey: The caller (the authenticated subject) — a repeat with the same role changes nothing; clearLandingChoice undoes it
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandingChoiceRequest'
            examples:
              default:
                value:
                  role: tax.approver
      responses:
        "200":
          description: Choice recorded (or unchanged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingScreenResponse'
              examples:
                default:
                  value:
                    role: tax.approver
                    source: PERSONAL_CHOICE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearLandingChoice
      summary: Remove the caller's own landing-screen choice (INV-REQ-2756)
      description: Removes only the caller's personal choice, so the tenant precedence or the preset role order applies again. No permission of any role changes. The person is the authenticated subject of the call.
      tags:
      - grants
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - INV-REQ-2756
      x-error-codes: []
      x-operation:
        role: Any role the caller holds
        scope: own
        precondition: A personal choice exists, or none (then nothing changes)
        reversibility: UNDOABLE
        repeatKey: The caller (the authenticated subject) — a repeat is a no-op; chooseLandingScreen sets it again
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: 'Choice removed (or none was set: a no-op)'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/access/landing-screen:
    get:
      operationId: resolveLandingScreen
      summary: Resolve the landing screen of the caller (INV-REQ-2756)
      description: 'Decides in this order: the personal choice of the caller, else the tenant role-precedence policy, else the preset role order of UI inventory section 4.1. Only roles the caller holds are candidates. The source of the decision is returned. A query: no persistent state change.'
      tags:
      - grants
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - INV-REQ-2756
      x-error-codes: []
      responses:
        "200":
          description: Landing screen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingScreenResponse'
              examples:
                default:
                  value:
                    role: tax.approver
                    source: TENANT_PRECEDENCE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    AuthoriseResponse:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ALLOW
          - DENY
        role:
          type: string
          maxLength: 64
        reasonCode:
          type: string
          maxLength: 16
    VerificationKeysResponse:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          maxItems: 10
          items:
            type: object
            required:
            - kid
            - alg
            - publicKey
            properties:
              kid:
                type: string
                maxLength: 32
              alg:
                type: string
                maxLength: 16
              publicKey:
                type: string
                maxLength: 8192
                format: byte
                description: The key's DER X.509 SubjectPublicKeyInfo (RFC 5280 section 4.1.2.7), standard base64
                  (RFC 4648 section 4), whatever the alg; the gateway decodes it with X509EncodedKeySpec (coordinator
                  ruling INV-Q-4079).
    RevocationListResponse:
      type: object
      required:
      - listVersion
      - snapshot
      - items
      properties:
        listVersion:
          type: integer
          format: int64
          minimum: 0
          description: The list version this response is complete up to.
        snapshot:
          type: boolean
          description: True when the response is a full list that replaces the caller's list.
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RevocationEntry'
        nextCursor:
          type: string
          maxLength: 512
          description: Omitted on the last page (API-14, API-18).
        warnings:
          type: array
          maxItems: 50
          description: API-10 warnings.
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                maxLength: 32
              field:
                type: string
                maxLength: 128
              message:
                type: string
                maxLength: 512
    RevocationEntry:
      type: object
      required:
      - entryId
      - version
      - kind
      - revokedAt
      - expiresAt
      properties:
        entryId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
          description: The list version at which the entry was added.
        kind:
          type: string
          enum:
          - PRINCIPAL
          - SUBJECT
          - TOKEN
          x-extensible-enum: true
          description: An unknown kind maps to UNKNOWN; the caller keeps the entry but matches nothing on it (API-09).
        principalRef:
          type: string
          maxLength: 64
          description: Kind PRINCIPAL; the revoked service principal, as in revokePrincipal.
        subject:
          type: string
          maxLength: 255
          description: Kind SUBJECT; the token's sub.
        tokenId:
          type: string
          maxLength: 128
          description: Kind TOKEN; the token's jti.
        revokedAt:
          type: string
          format: date-time
          description: RFC 3339 with Z (API-11).
        expiresAt:
          type: string
          format: date-time
          description: revokedAt plus the longest access-token lifetime, 15 minutes (API-23); RFC 3339 with Z.
    GrantRequest:
      type: object
      required:
      - granteeKind
      - identityRef
      - role
      - scope
      - validFrom
      properties:
        granteeKind:
          type: string
          enum:
          - STAFF
          - EXTERNAL
          - CROSS_TENANT
        identityRef:
          type: string
          maxLength: 64
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    AcceptFirstAdministratorInvitationResponse:
      type: object
      required:
      - grantRef
      - identityRef
      - role
      - scope
      - status
      properties:
        grantRef:
          type: string
          maxLength: 64
        identityRef:
          type: string
          maxLength: 64
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
          x-extensible-enum: true
        grantSource:
          type: string
          description: How the grant was provisioned (INV-REQ-1263); grantRole always answers BY_HAND.
          enum:
          - BY_HAND
          - DIRECTORY_GROUPS
          - SCIM
        sealingCredential:
          type: string
          minLength: 1
          maxLength: 256
          readOnly: true
          description: The new sealing credential. Present only on the response of the call that rotated it; absent on a repeat.
    GrantResponse:
      type: object
      required:
      - grantRef
      - identityRef
      - role
      - scope
      - status
      properties:
        grantRef:
          type: string
          maxLength: 64
        identityRef:
          type: string
          maxLength: 64
        role:
          type: string
          maxLength: 64
        scope:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
          x-extensible-enum: true
        grantSource:
          type: string
          description: How the grant was provisioned (INV-REQ-1263); grantRole always answers BY_HAND.
          enum:
          - BY_HAND
          - DIRECTORY_GROUPS
          - SCIM
          x-extensible-enum: true
    FirstAdministratorRequest:
      type: object
      additionalProperties: false
      required:
      - tenantRef
      - administratorEmail
      - invitationExpiresAt
      properties:
        tenantRef:
          type: string
          maxLength: 64
          description: The tenant reference control-plane-svc minted (INV-Q-3573).
        administratorEmail:
          type: string
          format: email
          maxLength: 254
        invitationExpiresAt:
          type: string
          format: date-time
    FirstAdministratorResponse:
      type: object
      required:
      - grantRef
      - status
      - invitationRef
      - invitationCode
      properties:
        grantRef:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
          - PENDING
        invitationRef:
          type: string
          maxLength: 64
        invitationCode:
          type: string
          maxLength: 128
          description: A one-time code the caller embeds in the signed invitation; access-svc stores only a digest of it.
    AcceptFirstAdministratorInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - invitationCode
      properties:
        invitationCode:
          type: string
          maxLength: 128
    ReissueFirstAdministratorInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - invitationExpiresAt
      properties:
        invitationExpiresAt:
          type: string
          format: date-time
    CreatePrincipalRequest:
      type: object
      required:
      - principalType
      - scope
      properties:
        principalType:
          type: string
          enum:
          - MACHINE_CLIENT
          - AP_CALLBACK
          - SCHEDULED_JOB
          - AGENT
          - SUPPORT_TOOL
          - INTEGRATION
          - INGEST
          - FILING_WORKFLOW
          - REPORTING
          - MONITORING
          - CERTIFICATION
          description: 'The six principal types of INV-REQ-584 are INGEST, FILING_WORKFLOW, AP_CALLBACK,
            REPORTING, MONITORING and CERTIFICATION. MACHINE_CLIENT, SCHEDULED_JOB, AGENT, SUPPORT_TOOL
            and INTEGRATION are reserved and not issuable (kept because removing a value is breaking).'
        scope:
          type: string
          maxLength: 128
          description: 'Rules of access-svc that the schema cannot express (INV-Q-8779): the scope of a MONITORING
            principal is exactly the literal installation; the scope of INGEST, FILING_WORKFLOW, REPORTING and
            CERTIFICATION principals is entity:<ref> or tenant:<ref>; AP_CALLBACK is unchanged; any other combination
            is refused with 400.'
        callingSystem:
          type: string
          minLength: 1
          maxLength: 64
          description: 'The name of the system that holds the credential, set by the tenant administrator when the
            principal is created (INV-REQ-587). Required by access-svc when principalType is FILING_WORKFLOW (a missing
            value is refused with 400); the schema cannot express that rule. Every audit entry written for a call by
            the principal carries it.'
        credentialMethod:
          type: string
          enum:
          - PRIVATE_KEY_JWT
          - MTLS
          - CLIENT_SECRET_BASIC
        publicKeyJwk:
          type: object
          required:
          - kty
          additionalProperties: false
          properties:
            kty:
              type: string
              maxLength: 1024
            kid:
              type: string
              maxLength: 1024
            use:
              type: string
              maxLength: 1024
            alg:
              type: string
              maxLength: 1024
            crv:
              type: string
              maxLength: 1024
            x:
              type: string
              maxLength: 1024
            y:
              type: string
              maxLength: 1024
            n:
              type: string
              maxLength: 1024
            e:
              type: string
              maxLength: 1024
        certificateThumbprint:
          type: string
          minLength: 1
          maxLength: 128
    PrincipalResponse:
      type: object
      required:
      - principalRef
      - principalType
      - status
      properties:
        principalRef:
          type: string
          maxLength: 64
        principalType:
          type: string
          maxLength: 32
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          x-extensible-enum: true
        callingSystem:
          type: string
          minLength: 1
          maxLength: 64
          description: 'The name of the system that holds the credential, set by the tenant administrator when the
            principal is created (INV-REQ-587). Present when the creating request carried it; required there when
            principalType is FILING_WORKFLOW (a missing value is refused with 400); the schema cannot express that
            rule. Every audit entry written for a call by the principal carries it.'
        credential:
          $ref: '#/components/schemas/CredentialInfo'
        previousCredential:
          $ref: '#/components/schemas/CredentialInfo'
    CredentialInfo:
      type: object
      description: 'One credential of a service principal (INV-REQ-880). clientSecret is present only in the response
        that creates or rotates a CLIENT_SECRET_BASIC credential, once, and never afterwards. No response carries a
        private key.'
      required:
      - credentialRef
      - method
      - status
      properties:
        credentialRef:
          type: string
          maxLength: 64
        method:
          type: string
          enum:
          - PRIVATE_KEY_JWT
          - MTLS
          - CLIENT_SECRET_BASIC
        status:
          type: string
          enum:
          - ACTIVE
          - WITHDRAWN
        validUntil:
          type: string
          format: date-time
        clientSecret:
          type: string
          minLength: 1
          maxLength: 256
          readOnly: true
    AuthenticatePrincipalRequest:
      type: object
      required:
      - principalRef
      - method
      - proof
      properties:
        principalRef:
          type: string
          maxLength: 64
        method:
          type: string
          enum:
          - PRIVATE_KEY_JWT
          - MTLS
          - CLIENT_SECRET_BASIC
        proof:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 'The secret for CLIENT_SECRET_BASIC, the signed client assertion for PRIVATE_KEY_JWT, the
            certificate thumbprint for MTLS.'
    AuthenticatePrincipalResponse:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - AUTHENTICATED
          - REFUSED
        principalRef:
          type: string
          maxLength: 64
        principalType:
          type: string
          maxLength: 32
        scope:
          type: string
          maxLength: 128
        credentialRef:
          type: string
          maxLength: 64
        reasonCode:
          type: string
          maxLength: 16
    IssueAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
      - principalRef
      - method
      - proof
      properties:
        principalRef:
          type: string
          maxLength: 64
        method:
          type: string
          enum:
          - PRIVATE_KEY_JWT
          - MTLS
          - CLIENT_SECRET_BASIC
        proof:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 'The secret for CLIENT_SECRET_BASIC, the signed client assertion for PRIVATE_KEY_JWT, the
            certificate thumbprint for MTLS.'
    IssueAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ISSUED
          - REFUSED
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
        expiresIn:
          type: integer
          minimum: 1
          maximum: 900
        keyId:
          type: string
          maxLength: 32
        tokenId:
          type: string
          maxLength: 128
        reasonCode:
          type: string
          maxLength: 16
    RotatePrincipalRequest:
      type: object
      required:
      - overlapMinutes
      properties:
        overlapMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        credentialMethod:
          type: string
          enum:
          - PRIVATE_KEY_JWT
          - MTLS
          - CLIENT_SECRET_BASIC
        publicKeyJwk:
          type: object
          required:
          - kty
          additionalProperties: false
          properties:
            kty:
              type: string
              maxLength: 1024
            kid:
              type: string
              maxLength: 1024
            use:
              type: string
              maxLength: 1024
            alg:
              type: string
              maxLength: 1024
            crv:
              type: string
              maxLength: 1024
            x:
              type: string
              maxLength: 1024
            y:
              type: string
              maxLength: 1024
            n:
