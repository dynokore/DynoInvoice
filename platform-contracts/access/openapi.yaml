  /internal/v1/access/operator-sessions:
    post:
      operationId: openOperatorSession
      summary: Open a tenant-scoped operator session for one tenant and one case (SCR-39, INV-REQ-862
        b4, owner ruling INV-Q-4119)
      description: |-
        A platform operator acts in one tenant only through a tenant-scoped operator session
        (INV-REQ-862 b4, INV-REQ-1202 b4, INV-ADR-3968 item 4a, owner ruling INV-Q-4119). In the
        support console (SCR-39) the operator picks the tenant and states a case reference;
        access-svc checks the operator's platform grant (platform.support or platform.engineer in
        SaaS, deployment.operator in a private installation) and issues an end-user token for that
        tenant.

        Token claims: `sub` is the operator; `tenant_id` is the chosen tenant; `act` is an object
        {`role`, `case`}, the operator's platform role and the case reference (RFC 8693 actor
        claim); `iat` is the issue time and `exp` is at most 15 minutes after `iat` (API-23). The
        token is signed with an access-svc operator-session key. access-svc publishes the public
        keys as the OperatorSessionKeysChanged event on its own topic
        gst.access.operator-session-keys-changed.v1 (access/asyncapi.yaml), subscribed by every
        service except access-svc, which uses its own key store (coordinator ruling INV-Q-4171);
        service-runtime verifies a token carrying `act` only against
        those replicated keys and refuses it (401) while its replica holds no valid key.
        getVerificationKeys and getRevocationList stay gateway-only (owner ruling INV-Q-4006 A;
        coordinator ruling INV-Q-4162). service-runtime binds the token like any tenant principal, so the framework tenant predicate, RLS and the guards apply
        unchanged. A platform-tenant binding never reads tenant rows.

        Permissions under the session come from the authority replica as for any principal: the
        operator's metadata permissions with content masked (INV-REQ-862 b1, b2), and invoice
        content and the evidence store only while an approved, unexpired elevation for that tenant
        exists (INV-REQ-862 b3). `contentMode` reports which applies when the session opens.

        Audit: issuing the session writes an audit entry under that tenant (actor, scope, reason =
        the case reference), visible to the tenant's security.officer (SCR-25), and raises the
        security event of NFR-S.11 (INV-REQ-1384); every read and action under the session is
        audited under that tenant the same way.

        Refusals: no platform grant gets 403 SRT-004; a tenant that does not exist or is retired
        gets 404 SRT-005, the same response for both. There is no suspended tenant state, and an
        entity's suspension (suspendEntity) does not affect the session (coordinator ruling
        INV-Q-4167). A case reference that is missing or blank, longer than 64 characters, or holds a ':' or an
        ISO control character (the caseId rule, INV-Q-4529) is a contract violation, 400 SRT-001. Closed service-runtime cases
        carry their SRT catalogue code, mapped once in ProblemMapper and not listed in
        x-error-codes (ARC-19, INV-REQ-827 b3, owner ruling INV-Q-3720).
      tags:
      - elevation
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->access-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-P.4
      - INV-REQ-862
      - INV-REQ-1202
      - INV-REQ-1384
      x-error-codes: []
      x-operation:
        role: platform.support or platform.engineer (SaaS), deployment.operator (private installation)
        scope: tenant
        precondition: The operator holds a platform grant; the tenant exists and is not retired; a
          case reference is stated
        reversibility: IRREVERSIBLE
        repeatKey: Idempotency-Key — a replay returns the same session; a new key opens a new
          session; the token expires within 15 minutes
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSessionRequest'
            examples:
              default:
                value:
                  tenantRef: TEN-7B1004
                  caseId: CASE-5521
                  reason: Investigate SUB-014 on behalf of the customer
      responses:
        "201":
          description: Operator session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSessionResponse'
              examples:
                default:
                  value:
                    token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMDkifQ.e30.c2lnbmF0dXJl
                    expiresAt: '2026-10-12T09:15:00Z'
                    contentMode: MASKED
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
