  /internal/v1/control-plane/licences/qualifications:
    post:
      operationId: recordQualification
      summary: Record a licence qualification outcome (SDS §7, SCR-38.4)
      description: Record a licence qualification outcome (SDS §7, SCR-38.4).
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AF.28
      x-error-codes: []
      x-operation:
        role: commercial.admin
        scope: installation
        precondition: Prerequisite report received
        reversibility: UNDOABLE
        repeatKey: (customerRef, installationRef)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordQualificationRequest'
            examples:
              default:
                value:
                  customerRef: CUST-0091
                  installationRef: INST-0091
                  outcome: QUALIFIED
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualificationResponse'
              examples:
                default:
                  value:
                    customerRef: CUST-0091
                    installationRef: INST-0091
                    outcome: QUALIFIED
        "400":
          $ref: '#/components/responses/Error'
