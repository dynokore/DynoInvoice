          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/tenant-provisioning-requests:
    post:
      operationId: provisionTenant
      summary: Provision a tenant from a signed contract (SDS §7, SCR-38.1)
      description: >-
        Creates the tenant in tenancy-svc (control-plane-svc->tenancy-svc) and invites the
        first administrator (access-svc, out of this operation's own response).


        Within console-bff's 2 s (INV-REQ-1204 b7, INV-Q-3476 (d)): the inline
        createTenant attempt is bounded by the propagated deadline (INV-REQ-1203).
        The 201 records the provisioning request and reports its status: CREATED
        when tenancy-svc created the tenant in time, PENDING when createTenant is
        still running under background retry, each attempt capped at 5 s, until the
        request reads CREATED with exactly one tenant (INV-AC-3485). It never reports
        a created tenant it has not created. PROVISIONED is kept in the enum (API-03).


        control-plane-svc mints tenantRef when it records the request, one per
        contractReference and unchanged on every repeat, so a PENDING response carries it
        too; it sends it to createTenant as CreateTenantRequest.tenantRef (INV-Q-3573). The
        201's Location points at getTenantProvisioningRequest, the request's status read, in
        which it reads PENDING and then CREATED. A replay of provisionTenant returns its
        original body (API-15), so it is not the status read.


        Data region (INV-REQ-1306 b1-b2, INV-FLOW-227 step 1, INV-Q-3590): SaaS form only
        (a private installation's region is where it is deployed, INV-REQ-1248 b2), the
        tenant's data region is elected here, in the required dataRegion, the key of an entry
        on control-plane-svc's region list (seeded with Singapore; INV-Q-3055, INV-Q-2322),
        with no default. It is fixed afterwards except through migration (UC-35); no operation
        changes it. A request without dataRegion fails validation with 400, and one naming a
        region not on the list is refused with 400 (API-20 envelope, errors[] with field
        /dataRegion, no catalogue code); in both cases no provisioning request or tenant is
        recorded (INV-AC-2293). The 201 and getTenantProvisioningRequest echo the elected
        dataRegion.
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AC.19
      - INV-REQ-1306
      x-error-codes: []
      x-operation:
        role: commercial.admin
        scope: platform
        precondition: A contract is on file
        reversibility: COMPENSABLE
        repeatKey: contractReference — a repeat returns the original request; offboard to reverse
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
            examples:
              default:
                value:
                  contractReference: CTR-2026-0091
                  legalName: Acme Holdings Pte Ltd
                  planRef: PLAN-STANDARD
                  firstAdministratorEmail: admin@acme.example
                  dataRegion: SG
      responses:
        "201":
          description: Tenant provisioning request recorded
          headers:
            Location:
              schema:
                type: string
              description: '`/internal/v1/control-plane/tenant-provisioning-requests/{contractReference}`,
                the request''s status read, getTenantProvisioningRequest (INV-Q-3573).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioningResponse'
              examples:
                default:
                  value:
                    contractReference: CTR-2026-0091
                    tenantRef: TEN-7B1004
                    status: CREATED
                    dataRegion: SG
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/tenant-provisioning-requests/{contractReference}:
    get:
      operationId: getTenantProvisioningRequest
      summary: Read a tenant provisioning request's current status (SCR-38.1)
      description: >-
        The status read of provisionTenant (INV-Q-3573, INV-AC-3485): returns the request's
        current TenantProvisioningResponse, PENDING while createTenant runs under background
        retry and CREATED once the tenant is created, with the tenantRef control-plane-svc
        minted when it recorded the request. The request itself is the status resource, as a
        batch is under API-17. Readable by commercial.admin in platform scope, as
        provisionTenant, re-checked by control-plane-svc. An unknown contractReference is 404.
        A replay of provisionTenant returns its original body (API-15), so this is the read
        in which the request reads CREATED.
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - INV-REQ-1204
      x-error-codes: []
      parameters:
      - name: contractReference
        in: path
        required: true
        description: The contract reference the provisioning request was recorded under.
        schema:
          type: string
          maxLength: 64
        example: CTR-2026-0091
      responses:
        "200":
          description: The provisioning request's current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProvisioningResponse'
              examples:
                default:
                  value:
                    contractReference: CTR-2026-0091
                    tenantRef: TEN-7B1004
                    status: PENDING
                    dataRegion: SG
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/packs/{packRef}:
