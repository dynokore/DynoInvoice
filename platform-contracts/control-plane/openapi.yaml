              examples:
                default:
                  value:
                    trainVersion: 2026.10.0
                    kind: TRAIN
                    status: AVAILABLE
                    releaseGateResult:
                      gates:
                      - gate: SCENARIOS
                        candidateResult: PASSED
                      - gate: SECURITY
                        candidateResult: FAILED
