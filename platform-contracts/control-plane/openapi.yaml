                    packRef: PACK-SCOPE-2026.3
                    packType: SCOPE
                    version: '2026.3'
                    status: SIGNED
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/licences/{licenceRef}:
    get:
      operationId: getLicence
      summary: Read a licence record (operator console read)
      description: Read a licence record (operator console read).
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      x-error-codes: []
      parameters:
      - name: licenceRef
        in: path
        required: true
        description: The licence's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: LIC-2026-04
      responses:
        "200":
          description: Licence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenceIssueResponse'
              examples:
                default:
                  value:
                    licenceRef: LIC-2026-04
                    installationRef: INST-0091
                    term: "2026-10-01/2027-09-30"
                    signedFile: U0lHTkVELVBMQUNFSE9MREVSCg==
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    AuthorPackRequest:
      type: object
      required:
      - packType
      - version
      - citations
      properties:
        packType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 16
        citations:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 300
    PackResponse:
      type: object
      required:
      - packRef
      - packType
      - version
      - status
      properties:
        packRef:
          type: string
          maxLength: 64
        packType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum:
          - DRAFT
          - SIGNED
          - PUBLISHED
          x-extensible-enum: true
    SignPackRequest:
      type: object
      required:
