        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/audit-purges:
    post:
      operationId: purgeAuditEntries
      summary: Purge audit entries older than a cut-off, never younger than the retention floor (INV-REQ-2588, INV-REQ-1378)
      description: 'The caller must hold the permission `audit-entry.purge`; SaaS only serves it. The purge records itself
        (one audit entry, committed with the delete) and deletes only entries recorded strictly before the cut-off; an entry
        recorded exactly at the cut-off is kept. The cut-off must be
        at or before now minus the floor, the longest retention the data regions report; a younger cut-off is refused with
        CPL-001 and a floor that cannot be determined (a region unreachable or returning no figure) with CPL-002, deleting
        nothing in both cases.'
      tags:
      - releases
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - INV-REQ-2588
      - INV-REQ-1378
      - INV-REQ-3767
      x-error-codes:
      - CPL-001
      - CPL-002
      x-operation:
        role: platform.engineer
        permission: audit-entry.purge
        scope: platform
        precondition: the floor can be determined and the cut-off is at or before now minus the floor (a cut-off exactly at now minus the floor is allowed; a younger one is refused with CPL-001)
        reversibility: IRREVERSIBLE
        repeatKey: 'cutOff: a repeat of a cut-off, or an earlier one, deletes zero rows and writes its own audit entry'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeAuditEntriesRequest'
            examples:
              default:
                value:
                  cutOff: '2016-04-27T00:00:00Z'
                  reason: Retention floor passed
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeAuditEntriesResponse'
              examples:
                default:
                  value:
                    purgeId: 3f2b8c1e-5d4a-4e7b-9a10-2c6d8e0f1a23
                    cutOff: '2016-04-27T00:00:00Z'
                    floor: P10Y
                    deletedCount: 1
                    auditEntryId: 7a9d1c44-0b2e-4f6a-8d35-5e1f2a3b4c5d
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/release-trains/{trainVersion}/gate-runs:
    post:
      operationId: recordGateRun
      summary: Record one gate result of a release train (INV-REQ-2657)
      description: 'Records one gate result of a release train, one record per (trainVersion, gate, environment), append-only.
        `environment` is required for the gates SCENARIOS and CERTIFICATION and absent for REGENERATION and SECURITY (the
        service answers 422 otherwise; a conditional schema is not used). `baselineResult` and `baselineFindings` are sent
        only for a failing gate re-run against the released version (INV-REQ-2657 behavior 4). A train already published
        refuses a new record with 409 (INV-REQ-909 behavior 1). An unbound or missing record holds `publishTrain` back.
        The gate values CORPUS and STAGING of `ReleaseGateResult` are not accepted: the service produces those two itself.'
      tags:
      - releases
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.10
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
        precondition: None
        reversibility: IRREVERSIBLE
        repeatKey: (trainVersion, gate, environment) — no-op if the same record is sent again; a different result for the same key is refused with 409
      parameters:
      - name: trainVersion
        in: path
        required: true
        description: The release train version the gate result belongs to.
        schema:
          type: string
          maxLength: 32
        example: 2026.10.0
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRunRequest'
            examples:
              default:
                value:
                  gate: SCENARIOS
                  environment: SAAS
                  candidateResult: PASSED
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateRunResponse'
              examples:
                default:
                  value:
                    trainVersion: 2026.10.0
                    gate: SCENARIOS
                    environment: SAAS
                    candidateResult: PASSED
                    recordedByRole: release.manager
                    recordedAt: '2026-10-12T08:45:00Z'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
