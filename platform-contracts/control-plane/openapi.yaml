openapi: 3.1.0
info:
  title: control-plane API
  version: 1.0.0
  description: 'Contract-first source of truth for control-plane (API-01, STK-44), replacing the INV-T-2849
    scaffold (INV-T-2857, T13). Internal API only (SDS/04-api-standards §1), SaaS-operator-only: the operator
    console for regulatory, release and commercial roles (regulatory pack authoring/signing/publication,
    release/patch-train publication, plans, licences, tenant provisioning). The signed pack feed control-plane-svc''s
    own `provides` also names is read by rules-svc through PackSource (AD-31), not a synchronous edge
    of sync-edges.yaml, so it is not an HTTP operation here. The `control-plane-contract` module generates
    its server interfaces and DTOs from this file (STK-46); a consumer generates its own client types
    from the same file (FR-AH.13, ARC-07).'
  contact:
    name: control-plane (see CODEOWNERS)
servers:
- url: https://internal.invoice.internal
  description: Internal API (SDS/04-api-standards §1) — never routed by the gateway.
tags:
- name: packs
  description: Regulatory pack authoring, signing and publication (FR-H.5).
- name: releases
  description: Release-train and patch-train publication, supported windows (§34.13).
- name: commercial
  description: Plans, entitlements, licences and tenant provisioning (§34.11).
- name: control-plane
  description: Deprecated placeholder tag (INV-T-2849); dropped with the placeholder operation.
paths:
  /internal/v1/control-plane/packs:
    post:
      operationId: authorRegulatoryPack
      summary: Author a regulatory pack draft (SDS §7, SCR-36.1)
      description: Creates a draft with citations. Undoable while still a draft.
      tags:
      - packs
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.5
      x-error-codes: []
      x-operation:
        role: regulatory.author
        scope: platform
        precondition: Publication identified
        reversibility: UNDOABLE
        repeatKey: (packType, version) — a repeat returns the original draft
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorPackRequest'
            examples:
              default:
                value:
                  packType: SCOPE
                  version: '2026.3'
                  citations:
                  - IRAS e-Tax Guide 2026-08
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
              examples:
                default:
                  value:
                    packRef: PACK-SCOPE-2026.3
                    packType: SCOPE
                    version: '2026.3'
                    status: DRAFT
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/packs/{packRef}/sign:
    post:
      operationId: signPack
      summary: Sign a pack whose corpus has passed (SDS §7, SCR-36.3)
      description: Sign a pack whose corpus has passed (SDS §7, SCR-36.3).
      tags:
      - packs
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.5
      x-error-codes: []
      x-operation:
        role: regulatory.approver
        scope: platform
        precondition: Corpus passes; the signer is not the draft's author
        reversibility: COMPENSABLE
        repeatKey: (pack_type, version) — no-op if already signed (INV-REQ-1010)
      parameters:
      - name: packRef
        in: path
        required: true
        description: The pack's opaque reference (pack type + version).
        schema:
          type: string
          maxLength: 64
        example: PACK-SCOPE-2026.3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignPackRequest'
            examples:
              default:
                value:
                  signingKeyRef: KEY-REG-01
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
              examples:
                default:
                  value:
                    packRef: PACK-SCOPE-2026.3
                    packType: SCOPE
                    version: '2026.3'
                    status: SIGNED
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/packs/{packRef}/publish:
    post:
      operationId: publishPack
      summary: Publish a signed pack to the feed and as a bundle (SDS §7, SCR-36.4)
      description: Read afterwards by rules-svc through PackSource (AD-31) — not a synchronous edge, so
        not modelled as its own operation here.
      tags:
      - packs
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.5
      - FR-H.7
      x-error-codes: []
      x-operation:
        role: regulatory.approver
        scope: platform
        precondition: Pack is signed
        reversibility: IRREVERSIBLE
        repeatKey: (pack_type, version) — no-op if already published; supersede, never unpublish
      parameters:
      - name: packRef
        in: path
        required: true
        description: The pack's opaque reference (pack type + version).
        schema:
          type: string
          maxLength: 64
        example: PACK-SCOPE-2026.3
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
              examples:
                default:
                  value:
                    packRef: PACK-SCOPE-2026.3
                    packType: SCOPE
                    version: '2026.3'
                    status: PUBLISHED
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/release-trains:
    post:
      operationId: publishTrain
      summary: Publish a release train, certified in both reference environments (SDS §7, SCR-37.2)
      description: Available to SaaS and private. A later train, or a patch train, supersedes it (§34.13).
      tags:
      - releases
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.10
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
        precondition: Certified in both reference environments
        reversibility: IRREVERSIBLE
        repeatKey: trainVersion — no-op if already published; supersede by a patch train
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTrainRequest'
            examples:
              default:
                value:
                  trainVersion: 2026.10.0
                  kind: TRAIN
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseTrainResponse'
              examples:
                default:
                  value:
                    trainVersion: 2026.10.0
                    kind: TRAIN
                    status: AVAILABLE
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/support-windows:
    post:
      operationId: setSupportWindow
      summary: Set the supported-version window (SDS §7, SCR-37.3)
      description: Set the supported-version window (SDS §7, SCR-37.3).
      tags:
      - releases
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.11
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
        precondition: None
        reversibility: UNDOABLE
        repeatKey: windowVersion — a repeat returns the original window
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSupportWindowRequest'
            examples:
              default:
                value:
                  windowVersion: '2026.2'
                  trainVersions:
                  - 2026.9.0
                  - 2026.10.0
      responses:
        "201":
          description: Window recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportWindowResponse'
              examples:
                default:
                  value:
                    windowVersion: '2026.2'
                    trainVersions:
                    - 2026.9.0
                    - 2026.10.0
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/plans:
    post:
      operationId: managePlan
      summary: Create or update a commercial plan and its entitlement definitions (SDS §7, SCR-38.2)
      description: 'Advisory only (AD-14): a plan limit never returns 429 at the gateway.'
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-H.12
      x-error-codes: []
      x-operation:
        role: commercial.admin
        scope: installation
        precondition: None
        reversibility: UNDOABLE
        repeatKey: (tenantRef, planVersion)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagePlanRequest'
            examples:
              default:
                value:
                  tenantRef: TEN-7B1004
                  planVersion: '2026.1'
                  entitlements:
                    maxEntities: 25
                    maxDocumentsPerMonth: 100000
      responses:
        "201":
          description: Plan and entitlements recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
              examples:
                default:
                  value:
                    tenantRef: TEN-7B1004
                    planVersion: '2026.1'
                    entitlements:
                      maxEntities: 25
                      maxDocumentsPerMonth: 100000
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/licences:
    post:
      operationId: issueLicence
      summary: Issue a signed licence file for an installation term (SDS §7, SCR-38.3)
      description: Issue a signed licence file for an installation term (SDS §7, SCR-38.3).
      tags:
      - commercial
      x-principal: filing-workflow
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AF.28
      x-error-codes: []
      x-operation:
        role: commercial.admin
        scope: installation
        precondition: Qualification recorded
        reversibility: COMPENSABLE
        repeatKey: (installationRef, term) — reissue to compensate
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLicenceRequest'
            examples:
