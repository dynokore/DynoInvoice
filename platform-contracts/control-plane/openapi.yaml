      description: >-
        Sends a new signed expiring invitation to the first administrator of an already
        provisioned tenant whose first invitation expired unused, by calling
        reissueFirstAdministratorInvitation on access-svc (control-plane-svc->access-svc, the only
        caller it allows). access-svc issues a new invitationRef, invitationCode and expiry on the
        same PENDING tenant.admin grant and invalidates the old code; control-plane-svc sends the
        new signed invitation to the first administrator.


        The response never carries the invitation code: the code travels only in the invitation
        message. Readable and callable by commercial.admin in platform scope, re-checked by
        control-plane-svc. An unknown contractReference is 404.


        409 when access-svc refuses the reissue (the grant is not a PENDING expired one) or the
        provisioning request does not read CREATED. The 409 rule of provisionFirstAdministrator is
        not changed.
