  /internal/v1/control-plane/accreditation-tasks:
    get:
      operationId: listAccreditationTasks
      summary: List the re-accreditation assessment tasks
      description: Lists the tracked re-accreditation assessment tasks (INV-REQ-1365, INV-AC-2340), sorted by
        `openedAt` descending then `taskRef` ascending, optionally filtered by `status`. Pages by cursor (API-18),
        `limit` defaults to 100 and is at least 1 and at most 500 (an invalid `limit`, including one outside 1 to 500,
        is refused with 400); `cursor` is opaque and integrity-protected, bound to the principal, filters and
        sort that produced it (a cursor from another query is refused with 400); `nextCursor` is omitted on the
        last page; there is no offset and no total count. A task never gates a release.
      tags:
      - releases
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1365
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
      parameters:
      - name: status
        in: query
        required: false
        description: Only the tasks in this status.
        schema:
          type: string
          enum:
          - OPEN
          - CONCLUDED
          x-extensible-enum: true
      - name: cursor
        in: query
        required: false
        description: The opaque `nextCursor` of the previous page.
        schema:
          type: string
          maxLength: 1024
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 100
          maximum: 500
      responses:
        "200":
          description: One page of re-accreditation assessment tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationTaskPage'
              examples:
                withCursor:
                  value:
                    items:
                    - taskRef: TASK-2026-0042
                      status: OPEN
                      reason: REASSESSMENT_NEEDED
                      openedAt: '2026-10-19T08:00:00Z'
                      alertRef: ALERT-2026-0042
                      releaseRef: TRAIN-2026.10.1
                    nextCursor: eyJvIjoiMjAyNi0xMC0xOVQwODowMDowMFoiLCJ0IjoiVEFTSy0yMDI2LTAwNDIifQ
                last:
                  value:
                    items:
                    - taskRef: TASK-2026-0041
                      status: CONCLUDED
                      reason: ACCREDITATION_LAPSED
                      openedAt: '2026-10-01T08:00:00Z'
                      alertRef: ALERT-2026-0041
                      concludedAt: '2026-10-05T09:30:00Z'
                      conclusion: Accreditation renewed by IMDA; no further assessment needed.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/accreditation-tasks/{taskRef}:
    get:
      operationId: getAccreditationTask
      summary: Read one re-accreditation assessment task
      description: Reads one tracked re-accreditation assessment task (INV-REQ-1365, INV-AC-2340). `concludedAt`
        and `conclusion` are present exactly when `status` is CONCLUDED.
      tags:
      - releases
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1365
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
      parameters:
      - $ref: '#/components/parameters/TaskRef'
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationTask'
              examples:
                open:
                  value:
                    taskRef: TASK-2026-0042
                    status: OPEN
                    reason: REASSESSMENT_NEEDED
                    openedAt: '2026-10-19T08:00:00Z'
                    alertRef: ALERT-2026-0042
                    releaseRef: TRAIN-2026.10.1
                concluded:
                  value:
                    taskRef: TASK-2026-0041
                    status: CONCLUDED
                    reason: ACCREDITATION_LAPSED
                    openedAt: '2026-10-01T08:00:00Z'
                    alertRef: ALERT-2026-0041
                    concludedAt: '2026-10-05T09:30:00Z'
                    conclusion: Accreditation renewed by IMDA; no further assessment needed.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/control-plane/accreditation-tasks/{taskRef}/conclusion:
    post:
      operationId: concludeAccreditationTask
      summary: Conclude a re-accreditation assessment task
      description: Concludes the task with the assessment's conclusion (INV-REQ-1365, INV-AC-2340); the task becomes
        CONCLUDED with `concludedAt` and `conclusion` set. Repeating it with the same `conclusion` is a no-op;
        a conclusion that differs from the recorded one on an already CONCLUDED task is refused with 409. The
        conclusion never gates a release.
      tags:
      - releases
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-sync-edge: console-bff->control-plane-svc
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1365
      x-error-codes: []
      x-operation:
        role: release.manager
        scope: platform
        precondition: Task exists
        reversibility: IRREVERSIBLE
        repeatKey: taskRef — no-op if already concluded with the same conclusion
      parameters:
      - $ref: '#/components/parameters/TaskRef'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcludeAccreditationTaskRequest'
            examples:
              default:
                value:
                  conclusion: Change reviewed against the accredited submission scope; no re-accreditation needed.
      responses:
        "200":
          description: Concluded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationTask'
              examples:
                default:
                  value:
                    taskRef: TASK-2026-0042
                    status: CONCLUDED
                    reason: REASSESSMENT_NEEDED
                    openedAt: '2026-10-19T08:00:00Z'
                    alertRef: ALERT-2026-0042
                    releaseRef: TRAIN-2026.10.1
                    concludedAt: '2026-10-20T09:00:00Z'
                    conclusion: Change reviewed against the accredited submission scope; no re-accreditation needed.
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    TaskRef:
      name: taskRef
      in: path
      required: true
      description: The re-accreditation assessment task's opaque reference.
      schema:
        type: string
        maxLength: 128
      example: TASK-2026-0042
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    AuthorPackRequest:
      type: object
      required:
      - packType
      - version
      - citations
      properties:
        packType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 16
        citations:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 300
        effectiveFrom:
          description: The date the pack version takes effect (INV-REQ-1077).
          type: string
          format: date
        contents:
          description: The pack contents (opaque to the envelope; interpreted only by the rule engine).
          type: object
          additionalProperties: true
    PackResponse:
      type: object
      required:
      - packRef
      - packType
      - version
      - status
      properties:
        packRef:
          type: string
          maxLength: 64
        packType:
          type: string
          maxLength: 32
        version:
          type: string
          maxLength: 16
        status:
          type: string
          enum:
          - DRAFT
          - SIGNED
          - PUBLISHED
          x-extensible-enum: true
        authors:
          description: Every identity that created or edited an entry of the version, recorded by the service from
            each authorRegulatoryPack call (INV-REQ-2590 b2). Never a request field.
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 128
        signer:
          description: The identity that signed the version, taken from the verified token; absent until signed.
          type: string
          maxLength: 128
        corpusResult:
          description: Result of the rule conformance corpus run (INV-REQ-2660); absent when no run.
          type: string
          enum:
          - PASSED
          - FAILED
          x-extensible-enum: true
        minEngineVersion:
          description: The release-train version this pack needs as a minimum (INV-REQ-1094 b1).
          type: string
          maxLength: 32
        exposureReducing:
          description: The pack only reduces exposure (INV-REQ-2590 b10).
          type: boolean
        stagingRecord:
          $ref: '#/components/schemas/PackStagingRecord'
        releaseGateResult:
          $ref: '#/components/schemas/ReleaseGateResult'
        effectiveFrom:
          description: The date the pack version takes effect, echoed from the request (INV-REQ-1077).
          type: string
          format: date
        supersedes:
          description: The packRef of the earlier published version of the same packType that this version supersedes;
            set by control-plane-svc when the version is published, never a request field; absent for a first version
            and before publication (INV-REQ-2590 b8).
          type: string
          maxLength: 64
    PackStagingRecord:
      type: object
      required:
      - packRef
      - outcome
      properties:
        packRef:
          type: string
          maxLength: 64
        outcome:
          description: PENDING means the IRAS sandbox is unavailable and staging is retried (INV-REQ-2662 b7).
          type: string
          enum:
          - PASSED
          - FAILED
          - PENDING
          x-extensible-enum: true
        target:
          type: string
          enum:
          - IRAS_SANDBOX
          - SIMULATOR
          x-extensible-enum: true
        evidenceRef:
          description: The sandbox acceptance evidence kept with the version.
          type: string
          maxLength: 256
        replayedPeriodRef:
          type: string
          maxLength: 32
        recordedAt:
          type: string
          format: date-time
    ReleaseGateResult:
      type: object
      properties:
        gates:
          type: array
          maxItems: 20
          items:
            type: object
            required:
            - gate
            - candidateResult
            properties:
              gate:
                type: string
                enum:
                - SCENARIOS
                - REGENERATION
                - SECURITY
                - CERTIFICATION
                - CORPUS
                - STAGING
                x-extensible-enum: true
              candidateResult:
                type: string
                enum:
                - PASSED
                - FAILED
                x-extensible-enum: true
              baselineResult:
                description: Only for a failing gate re-run against the released version (INV-REQ-2657 b4).
                type: string
                enum:
                - PASSED
                - FAILED
                x-extensible-enum: true
        exposureReducing:
          type: boolean
        classifiedByRole:
          type: string
          maxLength: 64
        accreditationCheck:
          description: The re-accreditation assessment declared for the release train, recorded with the release record (INV-REQ-1365, INV-REQ-909 behavior 4). It is a tracked task with an alert, never a release gate.
          type: object
          required:
          - assessmentNeeded
          properties:
            assessmentNeeded:
              description: Whether the release train changes what accreditation covered and so needs a re-accreditation assessment (INV-REQ-1365).
              type: boolean
            alertRef:
              description: Opaque reference to the alert (INV-REQ-1365); absent until control-plane-svc has raised the alert and opened the task.
              type: string
              maxLength: 128
            taskRef:
              description: Opaque reference to the tracked assessment task (INV-REQ-1365); absent until control-plane-svc has raised the alert and opened the task.
              type: string
              maxLength: 128
        recordedAt:
          type: string
          format: date-time
    SignPackRequest:
      type: object
      required:
      - signingKeyRef
      properties:
        signingKeyRef:
          type: string
          maxLength: 64
        minEngineVersion:
          type: string
          maxLength: 32
        exposureReducing:
          description: The pack only reduces exposure, which exempts it from the release gates (INV-REQ-909 behavior 4). Absent is read as false.
          type: boolean
        needsReAccreditationAssessment:
          description: Whether the pack changes what accreditation covered and so needs a re-accreditation assessment (INV-REQ-1365). Absent is read as true.
          type: boolean
    PublishTrainRequest:
      type: object
      required:
      - trainVersion
      - kind
      properties:
        trainVersion:
          type: string
          maxLength: 32
        kind:
          type: string
          enum:
          - TRAIN
          - PATCH
          x-extensible-enum: true
        exposureReducing:
          description: The train only reduces exposure, which exempts it from the release gates (INV-REQ-909 behavior 4). Absent is read as false.
          type: boolean
        needsReAccreditationAssessment:
          description: Whether the train changes what accreditation covered and so needs a re-accreditation assessment (INV-REQ-1365). Absent is read as true.
          type: boolean
    PurgeAuditEntriesRequest:
      type: object
      additionalProperties: false
      required:
      - cutOff
      properties:
        cutOff:
          type: string
          format: date-time
          description: Entries recorded strictly before this instant are deleted; an entry recorded exactly at this instant is kept. It must be at or before now minus the floor.
        reason:
          type: string
          maxLength: 500
          description: Free-text reason the operator gives; recorded in the audit entry.
    PurgeAuditEntriesResponse:
      type: object
      additionalProperties: false
      required:
      - purgeId
      - cutOff
      - floor
      - deletedCount
      - auditEntryId
      properties:
        purgeId:
          type: string
          format: uuid
        cutOff:
          type: string
          format: date-time
        floor:
          type: string
          format: duration
          description: The ISO-8601 duration of the floor used.
        deletedCount:
          type: integer
          minimum: 0
        auditEntryId:
          type: string
          format: uuid
    GateRunRequest:
      type: object
      required:
      - gate
      - candidateResult
      properties:
        gate:
          type: string
          enum:
          - SCENARIOS
          - REGENERATION
          - SECURITY
          - CERTIFICATION
          x-extensible-enum: true
        environment:
          type: string
          enum:
          - SAAS
          - PRIVATE_MINIMAL
          x-extensible-enum: true
        candidateResult:
          type: string
          enum:
          - PASSED
          - FAILED
          x-extensible-enum: true
        baselineResult:
          type: string
          enum:
          - PASSED
          - FAILED
          x-extensible-enum: true
        candidateFindings:
