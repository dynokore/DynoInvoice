asyncapi: 3.1.0
info:
  title: control-plane events
  version: 1.0.0
  description: >-
    Every event control-plane produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold; control-plane's own team (CODEOWNERS) replaces the
    placeholder event below as each real one lands.
  contact:
    name: control-plane (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  control-planeExampleHappened:
    address: 'gst.control-plane.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
  control-planeAccreditationAlertRaised:
    address: 'gst.control-plane.accreditation-alert-raised.v1'
    messages:
      AccreditationAlertRaised:
        $ref: '#/components/messages/AccreditationAlertRaised'
operations:
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/control-planeExampleHappened'
    messages:
      - $ref: '#/channels/control-planeExampleHappened/messages/ExampleHappened'
  publishAccreditationAlertRaised:
    action: send
    description: Publishes the alert raised with a re-accreditation assessment task (INV-REQ-1365, INV-Q-7316 A).
    channel:
      $ref: '#/channels/control-planeAccreditationAlertRaised'
    messages:
      - $ref: '#/channels/control-planeAccreditationAlertRaised/messages/AccreditationAlertRaised'
components:
  messages:
    ExampleHappened:
      name: com.dynokore.gst.control-plane.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
    AccreditationAlertRaised:
      name: com.dynokore.gst.control-plane.AccreditationAlertRaised.v1
      title: AccreditationAlertRaised
      summary: An alert was raised with a re-accreditation assessment task.
      description: >-
        An alert was raised for a re-accreditation assessment task (INV-REQ-1365, INV-AC-2340): the accreditation
        lapsed or a release train needs reassessment. Emitted by: control-plane-svc. Consumed by: notification-svc.
        Delivery is at-least-once; consumers deduplicate on `alertRef`. The event carries no invoice content.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/accreditation-alert-raised-payload.schema.json'
