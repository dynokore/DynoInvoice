        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        recordedAt: { type: string, format: date-time }
        testMode: { type: boolean }
      required: [aggregateId, entityRef, aggregateType, periodStart, periodEnd, recordedAt]
    DraftDocument:
      type: object
      properties:
        entityRef: { type: string, maxLength: 40 }
