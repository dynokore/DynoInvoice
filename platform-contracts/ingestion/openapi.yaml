    AdapterConfigResult:
      type: object
      properties:
        entityRef: { type: string }
        adapterRef: { type: string }
        sourceSystem: { type: string }
        feedType: { type: string, enum: [PULL, PUSH, FILE_DROP], x-extensible-enum: true }
