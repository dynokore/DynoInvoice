      required: [entityRef, adapterRef, rawPayload]
    TestEventResult:
      type: object
      properties:
        classification:
          type: string
          enum: [INVOICE, CREDIT_NOTE, DEBIT_NOTE, BILL_FOR_PAYMENT, UNCLASSIFIED]
          x-extensible-enum: true
        testMode:
          type: boolean
          const: true
        evaluatedAt: { type: string, format: date-time }
      required: [classification, testMode, evaluatedAt]
