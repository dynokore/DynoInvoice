          type: string
          maxLength: 20
          description: >-
            Reserved: the System decides the category code (INV-BR-1843), so a caller sends none. A non-empty value is
            refused with `400` and SRT-001. The line is identified by its internal `taxCode` (INV-REQ-812).
        taxCode: { type: string, maxLength: 10 }
        count: { type: integer, minimum: 0 }
