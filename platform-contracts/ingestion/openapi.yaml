          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        taxAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      required: [count, amountExcludingTax]
    AggregateRequest:
      type: object
      properties:
        entityRef: { type: string, maxLength: 40 }
        businessUnitRef: { type: string, maxLength: 40 }
        aggregateType:
          type: string
          enum: [POS, STI, PCP]
          description: model/architecture aggregation-svc's own three classes; anything else is ING-006.
        aggregateKind:
          type: string
          enum: [ORDINARY, REFUND, SUPPLEMENTARY]
          description: Absent means ORDINARY (API-14); refund and supplementary aggregates (services.yaml aggregation-svc `capabilities`).
        direction:
          type: string
          enum: [SALE, PURCHASE]
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        lines:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/AggregateLine' }
        description: { type: string, maxLength: 512 }
        subtotalsByTaxCode:
          type: array
          items: { $ref: '#/components/schemas/AggregateLine' }
        underlyingCount: { type: integer, minimum: 0 }
        underlyingRef:
          type: string
          maxLength: 256
          description: The batch that delivered the underlying transactions, which the System retains (INV-REQ-812).
      required: [entityRef, aggregateType, direction, periodStart, periodEnd, lines]
