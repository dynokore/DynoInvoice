          type: string
          enum: [INVOICE, CREDIT_NOTE, DEBIT_NOTE, BILL_FOR_PAYMENT]
        currency: { type: string, minLength: 3, maxLength: 3 }
        totalIncludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      required: [entityRef, currency, totalIncludingTax]
    PreIssuanceVerdict:
      type: object
      properties:
        verdict:
          type: string
          enum: [PASS, WARN, BLOCK]
          x-extensible-enum: true
        reasons:
          type: array
          items: { $ref: '#/components/schemas/ReasonItem' }
      required: [verdict, reasons]
    IssuanceRequest:
      allOf:
        - $ref: '#/components/schemas/TransactionRequest'
        - type: object
          properties:
            submissionType:
              type: string
              enum: [TYPE_1A, TYPE_1B, TYPE_2, TYPE_3]
              description: >-
                Reserved: the System decides the submission type (INV-BR-1843), so a caller sends none. A non-empty
                value is refused with `400` and SRT-001. The line is identified by its internal `taxCode`
                (INV-REQ-812). The values are model/architecture/submission-types.yaml's 1A/1B/2/3 (API-09
                UPPER_SNAKE_CASE).
