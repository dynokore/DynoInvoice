    AnonymisedSampleCopy:
      type: object
      properties:
        workspaceRef:
          type: string
          maxLength: 40
        sampleId:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [PENDING, LOADED]
          x-extensible-enum: true
      required: [workspaceRef, sampleId, status]
    CorrectPersonalDataRequest:
      type: object
      properties:
        field:
          type: string
          maxLength: 100
        correctedValue:
          type: string
          maxLength: 500
        reason:
          type: string
          maxLength: 500
      required: [field, correctedValue, reason]
    CorrectPersonalDataResult:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        field:
          type: string
        correctedValue:
          type: string
        correctedAt:
          type: string
          format: date-time
      required: [caseId, field, correctedValue, correctedAt]
    PromoteConfigurationRequest:
      type: object
      properties:
        bundleId:
          type: string
          maxLength: 64
        domain:
          type: string
          maxLength: 64
      required: [bundleId, domain]
    ConfigurationPromotion:
      type: object
      properties:
        bundleId:
          type: string
          maxLength: 64
        domain:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [PENDING, APPLIED]
          x-extensible-enum: true
      required: [bundleId, domain, status]
    DeferralTarget:
      type: object
      properties:
        kind:
          type: string
          enum: [DOCUMENT, GROUP]
          x-extensible-enum: true
        ref:
          type: string
          minLength: 1
          maxLength: 128
      required: [kind, ref]
    DeferDocumentRequest:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/DeferralTarget'
      required: [target]
    Deferral:
      type: object
      properties:
        deferralId:
          type: string
          format: uuid
        entityRef:
          type: string
          maxLength: 40
        target:
          $ref: '#/components/schemas/DeferralTarget'
        state:
          type: string
          enum: [DEFERRED, UNDONE]
          x-extensible-enum: true
        deferredBy:
          type: string
          maxLength: 128
          description: The acting user ID, never a role (INV-Q-10647).
        deferredAt:
          type: string
          format: date-time
      required: [deferralId, entityRef, target, state, deferredBy, deferredAt]
    SupportBundle:
      type: object
      properties:
        bundleRef:
          type: string
          maxLength: 64
        generatedAt:
          type: string
          format: date-time
      required: [bundleRef, generatedAt]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
