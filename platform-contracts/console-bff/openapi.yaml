        willTransmit:
          type: string
          minLength: 1
          maxLength: 1000
        residualRisk:
          type: string
          minLength: 1
          maxLength: 1000
      required: [exceptionId, docUuid, docVersion, code, requesterAuthority, approvalRule, willTransmit, residualRisk]
    CreateAuditPackExportRequest:
      type: object
      properties:
        periodRef:
          type: string
          maxLength: 20
      required: [periodRef]
    AuditPackExportJob:
      type: object
      properties:
        packId:
          type: string
          format: uuid
        entityRef:
          type: string
        periodRef:
          type: string
        status:
          type: string
          enum: [PENDING, READY, FAILED]
          x-extensible-enum: true
        requestedAt:
          type: string
          format: date-time
      required: [packId, entityRef, periodRef, status, requestedAt]
    CopyAnonymisedSampleRequest:
      type: object
      properties:
        sampleId:
          type: string
          minLength: 1
          maxLength: 64
