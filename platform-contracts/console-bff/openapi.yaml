openapi: 3.1.0
info:
  title: console-bff API
  version: 1.12.0
  description: >-
    Contract-first source of truth for console-bff (API-01, STK-44). The
    `console-bff-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Public API only, browser-facing (API standard §1, §15, §26):
    console-web is console-bff's only caller, through the gateway
    (sync-edges.yaml `console-web -> console-bff`), and console-bff itself
    sits outside the pipeline — it may call services, and no pipeline
    service calls it (FR-AF.3, `must_not` "be called by a pipeline
    service"). Every operation below is public: `/v1/exceptions` (an
    external-API-shaped read, also used by people through the console) and
    the two `/bff/…` operations (browser-session only, CSRF-checked,
    API-26), matching 04-api-standards.md §15's resource-catalogue rows
    exactly — no operation here is invented beyond what that catalogue
    lists (INV-T-2902, T14b scope decision below), except `getPortfolio`
    (`GET /v1/portfolio`), the one operation added by owner answer
    INV-Q-13373 option A (INV-REQ-904, INV-T-13557).


    Scope note for the reviewer: services.yaml's console-bff `provides`
    text — "The console API to console-web; the signed-link pages" — is
    far broader than what this file implements. T14b's declared scope is
    four files (evidence, reconciliation, notification, console-bff);
    within that, this file implements only the console-bff operations that
    route to those three sibling services and that 04-api-standards.md §15
    already catalogues: `getExceptions` (console-bff's own read model),
    `overrideException` (routes to the exception's owning service),
    `createAuditPackExport` (routes to evidence-svc's
    `createAuditPackExport`, evidence/openapi.yaml) and `correctPersonalData`
    (INV-NOTE-7 §7 SCR-32.3: a master-data change plus evidence annotation
    — it writes to evidence-svc's privacy case, one of this task's three
    sibling services, so it belongs in scope by the same test). console-bff's
    other capabilities — the document search
    index, job/connection status views, the signed-link pages, and the
    orchestrated multi-service flows (configuration export/promotion,
    support bundle assembly, backfill) — are NOT implemented here: none of
    them is catalogued in §15 today, none routes to
    evidence/reconciliation/notification, and services.yaml's generic
    "console API" phrase does not by itself license inventing their
    concrete shapes (T13b review correction: list as an architecture gap,
    do not add unlisted operations; `getPortfolio` is the one operation
    added since, INV-Q-13373 A, and the portfolio read model's other
    capabilities stay listed gaps). Flagged here as an architecture gap
    for the coordinator to schedule as its own task(s) and to add to
    services.yaml/04-api-standards.md §15 explicitly. No catalogue error
    code exists yet for console-bff (model/architecture/error-codes.yaml
    has no such prefix) — every operation below declares
    `x-error-codes: []`; also flagged as an architecture gap.
  contact:
    name: console-bff (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway routes only the operations of a published train (API-26).
tags:
  - name: portfolio
    description: The portfolio read model, one row per entity and one cell per open period (INV-REQ-904, SCR-08.1).
  - name: exceptions
    description: The exception read model and its override route (FR-AF.2, FR-7.10, §19.7).
  - name: evidence
    description: Operations console-bff routes to evidence-svc (§19.7, NFR-A.3).
  - name: privacy
    description: Privacy-request operations console-bff orchestrates against evidence-svc and masterdata-svc (§33.14, NFR-S.6).
  - name: workspaces
    description: Workspace operations console-bff orchestrates (INV-NOTE-7 §7, SCR-21.2).
  - name: support
    description: Support operations console-bff orchestrates (INV-NOTE-7 §7, SCR-28.2).
  - name: configuration
    description: Configuration promotion console-bff orchestrates (INV-NOTE-7 §7, SCR-21.4).
  - name: deferrals
    description: Shared deferral of a document or group, held in console-bff's exception read model (INV-REQ-960, SCR-01.5).
  - name: documents
    description: Document search across the entities in the caller's scope (INV-REQ-1037, SCR-03.1).
paths:
  /v1/exceptions:
    get:
      operationId: getExceptions
      summary: List exceptions from console-bff's read model
      description: >-
        The exception queue (04-api-standards.md §15; services.yaml
        console-bff capabilities "Exception read model"). Built from events,
        never queried live from an owning service (FR-AF.2). Offers a
        cross-entity mode over every entity or client in the caller's scope,
        with the entity as a column (FR-AF.27); authorisation is enforced by
        console-bff on this read (FR-AF.4). Served from at most one
        console-bff read model plus at most two synchronous calls
        (FR-AH.21) — this operation makes none. Each item carries the
        grouping key (`code`, `remediationOwner`), so console-web groups the
        queue without a further call (INV-REQ-1184).


        Deadline mode (INV-REQ-1019, INV-AC-15749) needs no switch from the
        user. The ranking and `deadlinePeriods` are computed by console-bff
        per read. A period is in deadline mode from the number of days before
        its filing due date that the entity's VP-19 value says (default 3,
        bounds 1 to 10, read from configuration, set by the permission key
        `vp-19.set` through `AuthorityReplica.decide`, never a role name).
        The items of periods in deadline mode come first; `rank` is then the
        1-based position of the item in the order the page lists. The
        auto-releasing groups are the items whose `disposition` equals
        AUTO_RELEASE, and the client collapses them. `hoursToFilingGate`
        counts whole hours, rounded down, from the moment of the read to the
        due instant minus the safety margin of the calendar pack, and
        `gatePassed` is true when that instant is not after the read.
        `entityRef` and `periodRef` of a `DeadlinePeriod` identify the
        readiness the header links to.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000).
      tags: [exceptions]
      x-principal: reporting
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-869, INV-REQ-871, INV-REQ-905, INV-REQ-1232]
      x-operation:
        kind: PERMISSION
        permission: exception.view
        permission-also: machine.status.read
      parameters:
        - name: entityRef
          in: query
          required: false
          description: Omitted for the cross-entity mode, over every entity in the caller's scope (FR-AF.27).
          schema:
            type: string
            maxLength: 40
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, RESOLVED, OVERRIDDEN]
            x-extensible-enum: true
        - name: deferred
          in: query
          required: false
          description: >-
            Default false: a deferred exception is left out of the list.
            True lists only the deferred ones (INV-REQ-960 behavior 4,
            INV-AC-13807).
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPage'
              examples:
                default:
                  value:
                    items:
                      - exceptionId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "E-001"
                        code: "ING-016"
                        docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        state: "OPEN"
                        raisedAt: "2026-04-01T01:00:00Z"
                        remediationOwner: "Finance"
                        disposition: "MANUAL"
                        docVersion: 1
                        documentNumber: "INV-2026-0042"
                        counterpartyName: "Acme Pte Ltd"
                        transactionDate: "2026-03-15"
                        dueDate: "2026-11-21"
                        taxableAmount: "100.00"
                        severity: "BLOCK"
                        inputKey: "internalTaxCode=SR-STD"
        default:
          $ref: '#/components/responses/Error'
  /v1/portfolio:
    get:
      operationId: getPortfolio
      summary: List the portfolio, one row per entity with one cell per open period
      description: >-
        The portfolio view (INV-REQ-904, FR-AF.26, SCR-08.1): one row per
        entity or client in the caller's grant scope, rows sorted by the
        nearest due date, and one cell per open period. Each cell holds the
        period state of INV-REQ-85 (`open`, `due`, `filed` or `late`), the
        extension-granted flag and, for a `filed` or `late` period that
        has been filed, the filing date. A `due` cell adds the readiness
        verdict (READY, BLOCKED with a count, or UNABLE_TO_DETERMINE). The
        rule "readiness is present exactly when periodState is due" is
        enforced in the PortfolioCell schema (if/then/else). There is no
        aggregate score, percentage or rating (INV-REQ-1030).


        Permission: access is decided per request by
        `AuthorityReplica.decide` on the key `period-readiness.view`. Rows
        are limited to the entities in the caller's grant scope; an empty
        scope gives 200 with no items. The operation carries that one
        permission key and no other.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000); this operation is served from the portfolio
        read model.
      tags: [portfolio]
      x-principal: reporting
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-904]
      x-operation:
        kind: PERMISSION
        permission: period-readiness.view
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of portfolio rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPage'
              examples:
                default:
                  value:
                    items:
                      - entityRef: "E-001"
                        nearestDueDate: "2026-11-30"
                        cells:
                          - periodRef: "2026-Q3"
                            periodState: "due"
                            dueDate: "2026-11-30"
                            extensionGranted: false
                            readiness:
                              kind: "BLOCKED"
                              blockedCount: 3
                    nextCursor: "eyJvZmZzZXQiOjEwMH0"
        default:
          $ref: '#/components/responses/Error'
  /bff/exceptions/{exceptionId}/decision-trace:
    get:
      operationId: getExceptionDecisionTrace
      summary: Open the decision trace behind one exception row
      description: >-
        From any queue row the user opens the decision trace: which rule
        fired, from which pack version, on which inputs (INV-REQ-942
        behavior 1). It changes no state. console-bff resolves the
        exception's document UUID and version from its read model and reads
        the trace from evidence-svc `getDecisionTrace`, which stays the
        system of record (INV-ADR-282); no copy is kept (INV-REQ-1182
        behavior 2). The response is the entry of the evidence trace whose
        `code` equals the exception's `code`. The caller is decided per
        request by the permission key `doc.view.content` through
        `AuthorityReplica.decide`, never by a role name (INV-Q-10027).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000).
      tags: [exceptions]
      x-principal: reporting
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: [SRT-004, SRT-005]
      x-requirements: [INV-REQ-942]
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The decision trace entry of the exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionDecisionTrace'
              examples:
                default:
                  value:
                    exceptionId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    code: "RUL-001"
                    ruleId: "R-114"
                    packVersions:
                      - packIdentifier: "mapping"
                        version: "2026.3"
                    inputs:
                      - name: "internalTaxCode"
                        value: "SR-STD"
        default:
          $ref: '#/components/responses/Error'
  /bff/exceptions/{id}/override:
    post:
      operationId: overrideException
      summary: Override an OVERRIDABLE blocking check on an exception, with a reason
      description: >-
        People, through console-bff only — not callable by a machine
        principal (04-api-standards.md §15, FR-7.10). console-bff routes
        the override to the exception's owning service (services.yaml
        console-bff `provides`, "Routing every command to the owning
        service"; FR-AF.4's write is re-checked by that owning service).
        Only an OVERRIDABLE block may be released this way; MANUAL and
        TERMINAL blocks are refused (INV-REQ-500). Operators cannot
        override; approvers can, only for OVERRIDABLE codes (INV-NOTE-7
        §7). Also permitted for `agent.operator` (INV-NOTE-7 §7 SCR-02.4);
        `x-operation.role` is a single string today, so only the primary
        actor is declared here — the multi-role format is tracked
        separately by the coordinator.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000): the one routed command.
      tags: [exceptions]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-500]
      x-operation:
        role: tax.approver
        scope: entity
        precondition: >-
          The exception is OPEN and its block's disposition is OVERRIDABLE
          (INV-REQ-500); a reason is supplied.
        reversibility: COMPENSABLE
        repeatKey: "(exceptionId, reason) — a repeat reports the existing override, unchanged."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
            examples:
              default:
                value:
                  reason: "Confirmed with customer: register lookup unavailable, manually verified"
      responses:
        '200':
          description: The exception was overridden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideResult'
              examples:
                default:
                  value:
                    exceptionId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    state: "OVERRIDDEN"
                    reason: "Confirmed with customer: register lookup unavailable, manually verified"
                    overriddenAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/exceptions/{id}/override-preview:
    get:
      operationId: getOverridePreview
      summary: Preview the authority, approval rule and consequence of an override
      description: >-
        People, through console-bff only. Answers, before `overrideException`
        is called, what the override dialogue shows (INV-REQ-943): the
        requesting user's authority, the approval rule that applies, and the
        plain-language consequence. It changes no state and writes no audit
        entry. It is offered only for an exception whose disposition is
        OVERRIDABLE and answers 409 otherwise (INV-REQ-1023: no override
        affordance on a TERMINAL error).


        The requesting user's authority is the permission key of the owning
        service's override operation together with the decision of
        `AuthorityReplica.decide` for it, never a role name. The texts
        `willTransmit` and `residualRisk` are supplied by the owning service
        in the routed read, and console-bff relays them unchanged.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000): the one routed read.
      tags: [exceptions]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: [SRT-004, SRT-005]
      x-requirements: [INV-REQ-943]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The authority, approval rule and consequence of overriding this exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverridePreview'
              examples:
                default:
                  value:
                    exceptionId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    docUuid: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    docVersion: 1
                    code: "MDM-003"
                    requesterAuthority:
                      permissionKey: "validation.override"
                      decision: "ALLOW"
                    approvalRule:
                      kind: "ONE_APPROVER"
                    willTransmit: "The invoice is transmitted with the buyer tax code as entered."
                    residualRisk: "The buyer register was not checked, so the receiving authority may reject the invoice."
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /bff/entities/{entityRef}/audit-pack-exports:
    post:
      operationId: createAuditPackExport
      summary: Start an audit-pack export for an entity's period
      description: >-
        People, through console-bff only — not callable by a machine
        principal (04-api-standards.md §15, NFR-A.3, API-17). console-bff
        routes this to evidence-svc's own `createAuditPackExport`
        (evidence/openapi.yaml `POST
        /internal/v1/evidence/entities/{entityRef}/periods/{periodRef}/audit-packs`),
        through which the auditor role uses the audit-pack resource
        (services.yaml evidence-svc `provides`). Returns immediately with
        the job accepted, within console-bff's 2s-per-call budget
        (sync-edges.yaml resilience_policy `console-bff -> any`); the
        caller polls the evidence-svc job for readiness.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s for an operation making at most one downstream
        call (x-timeout 3000): the one routed command.
      tags: [evidence]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-988, INV-REQ-989]
      x-operation:
        role: auditor
        scope: entity+period
        precondition: "The entity and period exist; no unresolved legal hold blocks reading the period's evidence."
        reversibility: COMPENSABLE
        repeatKey: "(entityRef, periodRef) — a repeat returns the existing pack job, unchanged (evidence-svc's own idempotency, relayed unchanged)."
      parameters:
        - name: entityRef
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditPackExportRequest'
            examples:
              default:
                value:
                  periodRef: "2026-Q1"
      responses:
        '202':
          description: The audit-pack export job was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPackExportJob'
              examples:
                default:
                  value:
                    packId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    status: "PENDING"
                    requestedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/privacy-cases/{caseId}/corrections:
    post:
      operationId: correctPersonalData
      summary: Correct personal data for an open privacy case
      description: >-
        People, through console-bff only — not callable by a machine
        principal (04-api-standards.md §15, NFR-S.6, §33.14). console-bff
        orchestrates a master-data change plus an evidence annotation
        (INV-NOTE-7 §7 SCR-32.3): it writes to masterdata-svc and appends
        the annotation on evidence-svc's privacy case; evidence itself is
        never modified (evidence-svc `must_not` "call a pipeline service —
        privacy corrections are orchestrated by console-bff").


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 5 s for two sequential downstream calls (x-timeout
        5000): masterdata-svc, then evidence-svc.
      tags: [privacy]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 5000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-1379]
      x-operation:
        role: security.officer
        scope: entity
        precondition: "The privacy case is OPEN."
        reversibility: COMPENSABLE
        repeatKey: "caseId — a further correction is a new call; a repeat with the same body returns the existing correction, unchanged."
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPersonalDataRequest'
            examples:
              default:
                value:
                  field: "counterpartyName"
                  correctedValue: "Acme Pte Ltd"
                  reason: "Subject-access request: name misspelled at onboarding"
      responses:
        '200':
          description: The correction was applied and annotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectPersonalDataResult'
              examples:
                default:
                  value:
                    caseId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    field: "counterpartyName"
                    correctedValue: "Acme Pte Ltd"
                    correctedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/workspaces/{workspaceRef}/anonymised-samples:
    post:
      operationId: copyAnonymisedSample
      summary: Copy anonymised sample documents into a workspace
      description: >-
        People, through console-bff only (INV-NOTE-7 §7 row
        copyAnonymisedSample, SCR-21.2). Loads anonymised documents into the
        workspace through the public API; the copy is undone by purging the
        workspace. The security.officer approval is a precondition, a
        business rule on top of the permission check.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000); the copy is accepted and
        completes asynchronously.
      tags: [workspaces]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-2588]
      x-operation:
        role: tenant.admin
        scope: workspace
        precondition: "The workspace exists; security.officer has approved the copy (INV-NOTE-7 §7 row copyAnonymisedSample)."
        reversibility: UNDOABLE
        repeatKey: "(workspaceRef, sampleId) — a repeat returns the existing copy unchanged."
      parameters:
        - name: workspaceRef
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAnonymisedSampleRequest'
            examples:
              default:
                value:
                  sampleId: "sample-2026-01"
      responses:
        '202':
          description: The anonymised sample copy was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymisedSampleCopy'
              examples:
                default:
                  value:
                    workspaceRef: "WS-001"
                    sampleId: "sample-2026-01"
                    status: "PENDING"
        default:
          $ref: '#/components/responses/Error'
  /bff/support-bundles:
    post:
      operationId: exportSupportBundle
      summary: Export a support bundle without invoice content
      description: >-
        People, through console-bff only (INV-NOTE-7 §7 row
        exportSupportBundle, SCR-28.2). Assembles logs, metrics and
        configuration; no invoice content is included. The operation changes
        no state, so its audit entry is written before the result returns
        (INV-REQ-2588 behavior 3).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000).
      tags: [support]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-2588]
      x-operation:
        role: deployment.operator
        scope: installation
        precondition: "None — logs, metrics and configuration are read; no invoice content is included (INV-NOTE-7 §7 row exportSupportBundle)."
        reversibility: UNDOABLE
        repeatKey: "None — a safe query with no persistent state change; a repeat has nothing to make safe (INV-REQ-2588 behavior 3)."
      responses:
        '200':
          description: The support bundle was assembled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundle'
              examples:
                default:
                  value:
                    bundleRef: "SB-2026-04-01-0001"
                    generatedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/configuration-promotions:
    post:
      operationId: promoteConfiguration
      summary: Promote an exported configuration bundle into production for one domain
      description: >-
        People, through console-bff only (INV-NOTE-7 §7 row
        promoteConfiguration, SCR-21.4). Each service imports its own domain
        after that domain's approval; the promotion is compensated by
        promoting the previous version. The approval of the domain's own
        approver is a precondition, a business rule on top of the permission
        check.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000); the promotion is accepted and
        completes asynchronously.
      tags: [configuration]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-2588]
      x-operation:
        role: tenant.admin
        scope: domain
        precondition: "A bundle was exported from a workspace; the approver of the domain has approved (INV-NOTE-7 §7 row promoteConfiguration)."
        reversibility: COMPENSABLE
        repeatKey: "(bundleId, domain) — a repeat returns the recorded promotion unchanged."
        compensationCost: "Compensated by promoting the previous version of the bundle for the domain (INV-NOTE-7 §7 row promoteConfiguration); both promotions remain in the audit trail."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteConfigurationRequest'
            examples:
              default:
                value:
                  bundleId: "bundle-2026-01"
                  domain: "policy"
      responses:
        '202':
          description: The configuration promotion was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPromotion'
              examples:
                default:
                  value:
                    bundleId: "bundle-2026-01"
                    domain: "policy"
                    status: "PENDING"
        default:
          $ref: '#/components/responses/Error'
  /bff/entities/{entityRef}/deferrals:
    post:
      operationId: deferDocument
      summary: Defer a document or group for later attention
      description: >-
        People, through console-bff only (INV-NOTE-7 §7 row deferDocument,
        SCR-01.5). A deferral only reorders attention: it is never a
        resolution, the due date is unaffected and the document still counts
        as unsubmitted in readiness (INV-REQ-960). The deferral is shared by
        every user of the entity: the document or group leaves every user's
        open list until the deferral ends, and any holder of the permission
        may undo it (INV-Q-13802, A). console-bff holds the marker in its own
        exception read model and calls no other service. The runtime check is
        the scoped permission key decided per request by
        AuthorityReplica.decide; `x-operation.role` is the published role
        text only.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000).
      tags: [deferrals]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-960]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: "The document or group exists and is in a non-terminal state."
        reversibility: UNDOABLE
        repeatKey: "(entityRef, target.kind, target.ref)"
      parameters:
        - name: entityRef
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferDocumentRequest'
            examples:
              default:
                value:
                  target:
                    kind: "DOCUMENT"
                    ref: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: The document or group is deferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deferral'
              examples:
                default:
                  value:
                    deferralId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    entityRef: "E-001"
                    target:
                      kind: "DOCUMENT"
                      ref: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    state: "DEFERRED"
                    deferredBy: "user-0001"
                    deferredAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/entities/{entityRef}/deferrals/{deferralId}/undo:
    post:
      operationId: undeferDocument
      summary: End a deferral so the document or group returns to the open list
      description: >-
        People, through console-bff only (INV-NOTE-7 §7 row deferDocument,
        SCR-01.5). Any holder of the permission may undo a deferral set by
        another user of the entity (INV-Q-13802, A). The marker is
        console-bff's own; no other service is called.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000).
      tags: [deferrals]
      x-principal: filing-workflow
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-960]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: "The deferral exists and its state equals DEFERRED."
        reversibility: UNDOABLE
        repeatKey: "(entityRef, deferralId)"
      parameters:
        - name: entityRef
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
        - name: deferralId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The deferral is undone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deferral'
              examples:
                default:
                  value:
                    deferralId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    entityRef: "E-001"
                    target:
                      kind: "DOCUMENT"
                      ref: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    state: "UNDONE"
                    deferredBy: "user-0001"
                    deferredAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /bff/document-search:
    get:
      operationId: searchDocuments
      summary: Search documents across the entities in the caller's scope
      description: >-
        Document search by document number, Doc UUID, Acknowledgement ID,
        counterparty name or UEN, amount range, date range, state, category
        code and error code (INV-REQ-1037, SCR-03.1, SCR-03.2). The page
        spans the entities in the caller's scope and no others: a hit of an
        entity outside the scope is never returned, and console-bff enforces
        authorisation on every read (INV-REQ-871). Without `entityRef` the
        search covers every entity in the caller's scope. Served from
        console-bff's search index of identifiers and searchable attributes,
        built from events.


        A criterion that matches invoice content (`counterparty`,
        `amountFrom`, `amountTo`) is accepted only when the caller's
        per-request decision for the permission key `doc.view.content` is
        allow, and `acknowledgementId` only when the decision for
        `enquiry-lookup.by-acknowledgement` is allow; both are decided by
        `AuthorityReplica.decide`, never by a role name (INV-Q-10027).
        Otherwise the answer is 403 and no hit.


        Results are paginated (`limit`, `cursor`) and exportable: JSON or
        CSV is chosen by the Accept header (`application/json` or
        `text/csv`), not by a parameter. The CSV answer carries the same hits
        for the same criteria.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `console-web ->
        console-bff`, 3 s (x-timeout 3000).
      tags: [documents]
      x-principal: reporting
      x-caller-auth: end-user
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-871, INV-REQ-1037]
      parameters:
        - name: entityRef
          in: query
          required: false
          description: Omitted means every entity in the caller's scope.
          schema:
            type: string
            maxLength: 40
        - name: documentNumber
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: docUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: acknowledgementId
          in: query
          required: false
          description: Accepted only when the decision for `enquiry-lookup.by-acknowledgement` is allow.
          schema:
            type: string
            maxLength: 64
        - name: counterparty
          in: query
          required: false
          description: A counterparty name or UEN. Accepted only when the decision for `doc.view.content` is allow.
          schema:
            type: string
            minLength: 1
            maxLength: 140
        - name: amountFrom
          in: query
          required: false
          description: Lower bound of the amount range, a decimal string (API-12). Accepted only when the decision for `doc.view.content` is allow.
          schema:
            type: string
            pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        - name: amountTo
          in: query
          required: false
          description: Upper bound of the amount range, a decimal string (API-12). Accepted only when the decision for `doc.view.content` is allow.
          schema:
            type: string
            pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: errorCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of hits, as JSON, or the same hits as CSV when the Accept header asks for text/csv.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchPage'
              examples:
                default:
                  value:
                    items:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "E-001"
                        documentNumber: "INV-2026-0042"
                        version: 1
                        state: "ACCEPTED"
                        acknowledgementId: "ACK-0001"
                        issueDate: "2026-03-15"
                    nextCursor: "c2"
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    Exception:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        entityRef:
          type: string
        code:
          type: string
        docUuid:
          type: string
          format: uuid
        state:
          type: string
          enum: [OPEN, RESOLVED, OVERRIDDEN]
          x-extensible-enum: true
        raisedAt:
          type: string
          format: date-time
        remediationOwner:
          type: string
          maxLength: 128
          description: >-
            The team that owns the group, the routing result of VP-33; by
            default the error catalogue owner of the code. console-web groups
            the queue by (`code`, `remediationOwner`) (INV-REQ-1184).
        disposition:
          type: string
          enum: [AUTO_RELEASE, AUTO_RETRY, MANUAL, OVERRIDABLE, TERMINAL]
          x-extensible-enum: true
          description: >-
            The base disposition of the code in the error catalogue. A client
            renders an override control only when the value equals
            OVERRIDABLE and renders none for any other or unknown value
            (INV-REQ-1023).
        deferralId:
          type: string
          format: uuid
          description: Present while the exception is deferred (INV-REQ-960); a deferral never makes the exception resolved.
        periodRef:
          type: string
          maxLength: 40
          description: The period the exception belongs to (INV-REQ-1019).
        rank:
          type: integer
          minimum: 1
          description: >-
            Present exactly when the page is in deadline order: the 1-based
            position of the item in the order the page lists (INV-REQ-1019).
        docVersion:
          type: integer
          minimum: 1
        documentNumber:
          type: string
          maxLength: 100
        counterpartyName:
          type: string
          maxLength: 200
        transactionDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: The due date the group sorts by (INV-REQ-940 behavior 3).
        taxableAmount:
          $ref: '#/components/schemas/Money'
        severity:
          type: string
          enum: [BLOCK, HOLD, WARN]
          x-extensible-enum: true
        inputKey:
          type: string
          maxLength: 200
          description: Items with the same value are one input (INV-REQ-940 behavior 2).
      required: [exceptionId, entityRef, code, state, raisedAt, remediationOwner, disposition]
    Money:
      type: string
      format: decimal
      pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      description: A decimal amount as a string, never a float (API-12).
    ExceptionDecisionTrace:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        code:
          type: string
        ruleId:
          type: string
        packVersions:
          type: array
          items:
            type: object
            properties:
              packIdentifier:
                type: string
              version:
                type: string
            required: [packIdentifier, version]
        inputs:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
              businessTermId:
                type: string
            required: [name, value]
      required: [exceptionId, code, ruleId, packVersions, inputs]
    ExceptionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
        nextCursor:
          type: string
        deadlinePeriods:
          type: array
          description: Periods in deadline mode; absent or empty when none is (INV-REQ-1019).
          items:
            $ref: '#/components/schemas/DeadlinePeriod'
      required: [items]
    DocumentSearchHit:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        entityRef:
          type: string
          maxLength: 40
        documentNumber:
          type: string
          maxLength: 64
        version:
          type: integer
          minimum: 1
        state:
          type: string
          maxLength: 40
        acknowledgementId:
          type: string
          maxLength: 64
        issueDate:
          type: string
          format: date
      required: [docUuid, entityRef, documentNumber, version, state]
    DocumentSearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSearchHit'
        nextCursor:
          type: string
      required: [items]
    DeadlinePeriod:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
          maxLength: 40
        filingDueDate:
          type: string
          format: date
        windowDays:
          type: integer
          minimum: 1
        countOutstanding:
          type: integer
          minimum: 0
        hoursToFilingGate:
          type: integer
          minimum: 0
        gatePassed:
          type: boolean
      required: [entityRef, periodRef, filingDueDate, windowDays, countOutstanding, hoursToFilingGate, gatePassed]
    PortfolioPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioRow'
        nextCursor:
          type: string
          description: Absent on the last page (API-18).
      required: [items]
    PortfolioRow:
      type: object
      additionalProperties: false
      description: One entity or client with one cell per open period; rows sort by nearestDueDate (INV-REQ-904).
      properties:
        entityRef:
          type: string
          maxLength: 40
        nearestDueDate:
          type: string
          format: date
        cells:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioCell'
      required: [entityRef, cells]
    PortfolioCell:
      type: object
      additionalProperties: false
      description: >-
        The period state of INV-REQ-85 for one open period. `readiness` is
        present exactly when `periodState` is `due`: it is required for a due
        cell and forbidden for any other state. No score, percentage or
        rating exists (INV-REQ-1030).
      properties:
        periodRef:
          type: string
          maxLength: 40
        periodState:
          type: string
          enum: [open, due, filed, late]
          x-enum-varnames: [OPEN, DUE, FILED, LATE]
        dueDate:
          type: string
          format: date
        filingDate:
          type: string
          format: date
        extensionGranted:
          type: boolean
        readiness:
          $ref: '#/components/schemas/PortfolioReadiness'
      required: [periodRef, periodState, extensionGranted]
      if:
        properties:
          periodState:
            const: due
        required: [periodState]
      then:
        required: [readiness]
      else:
        not:
          required: [readiness]
    PortfolioReadiness:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [READY, BLOCKED, UNABLE_TO_DETERMINE]
        blockedCount:
          type: integer
          minimum: 0
      required: [kind]
    OverrideRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required: [reason]
    OverrideResult:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [OVERRIDDEN]
          x-extensible-enum: true
        reason:
          type: string
        overriddenAt:
          type: string
          format: date-time
      required: [exceptionId, state, reason, overriddenAt]
    OverridePreview:
      type: object
      properties:
        exceptionId:
          type: string
          format: uuid
        docUuid:
          type: string
          format: uuid
        docVersion:
          type: integer
          minimum: 1
        code:
          type: string
        requesterAuthority:
          type: object
          properties:
            permissionKey:
              type: string
              pattern: '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*)+$'
            decision:
              type: string
              enum: [ALLOW, DENY]
              x-extensible-enum: true
          required: [permissionKey, decision]
        approvalRule:
          type: object
          properties:
            kind:
              type: string
              enum: [ONE_APPROVER, SECOND_APPROVER]
