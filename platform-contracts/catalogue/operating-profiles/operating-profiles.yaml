# Vendored, read-only snapshot of the Keel INV operating-profile rows PRF-1..PRF-7
# (INV-REQ-1252..INV-REQ-1258; STK-61, INV-Q-3233), never hand-edited.
#
# Each row's `profile` block is Keel's attrs.io_contract.profile, copied unedited:
# `version` (a whole number per profile, raised when its values change; INV-Q-3283 A),
# `status` (available or planned) and `values`, one per variation point the profile
# sets, keyed by VP id (INV-Q-3285 A): `option` (or `options` on a multi-select row) is
# an option key of catalogue/variation-points/variation-points.yaml, and `condition`,
# `otherwise_option`, `alternatives`, `adds`, `at_apply`, `typed_value`,
# `explicit_default` and `needs_acknowledgement` restate the row's own text. A value
# with `typed: false` is a marked gap Keel has not typed yet (it names its reason);
# pending-values.yaml names the open question that holds it, and nothing here supplies
# a value. `name` is the profile name in Keel's own row text after `#row:PRF-n`.
#
# Keel has no repository-wide commit, so each row pins to its own published
# entity_revision id (`revision`). To pick up a Keel change, run
# vendor-profiles.py --write (see README.md) in its own merge request (AGT-11): it keeps
# the replaced data as previous-snapshot.yaml, against which the generator checks the
# version rule (INV-Q-3283) and emits the per-profile difference (INV-REQ-1245 b4).
#
# Extracted: 2026-10-11, Keel project INV, 7 rows (PRF-1..PRF-7), by vendor-profiles.py:
#   select json_agg(json_build_object(
#       'k', e.key, 'src', e.source_ids, 'rev', r.id, 't', r.title, 'body', r.body,
#       'profile', r.attrs->'io_contract'->'profile'))
#   from entity e join entity_revision r on r.entity_id = e.id
#     and r.published_in is not null and r.superseded_in is null
#   where e.project_id = (select id from project where code = 'INV')
#     and e.type = 'requirement' and e.source_ids::text like '%PRF-%'
operating_profiles:
- id: PRF-1
  requirement: INV-REQ-1252
  revision: 292d63ca-3d4b-4372-8676-f1ff288a8144
  name: "Small business, one or two people"
  title: "The small-business profile fits one finance person with an external accountant and sets an external advisor or sole-operator approver, one attestation, daily despatch and activation at the effective date"
  profile:
    version: 1
    status: "available"
    basis: "Coordinator ruling (HIGH, owner rule 2026-10-11): INV-Q-3283 option A (version), INV-Q-3285 option A (typed values beside the unchanged behavior text, as io_contract.catalogue, INV-CS-3045); keys from the live VP catalogue; for INV-T-3277"
    values:
      VP-03:
        requirement: "INV-REQ-1264"
        text: "the external advisor as approver where the questionnaire answer is that an advisor approves mappings (INV-NOTE-3#row:OQ-2), the recommended value, otherwise the sole-operator option"
        option: "EXTERNAL_ADVISOR"
        condition: "where the questionnaire answer is that an advisor approves mappings (INV-NOTE-3#row:OQ-2)"
        recommended: true
        otherwise_option: "SOLE_OPERATOR_ACK"
        needs_acknowledgement:
          - "SOLE_OPERATOR_ACK"
      VP-20:
        requirement: "INV-REQ-1281"
        text: "daily batch"
        option: "DAILY_WINDOW"
      VP-39:
        requirement: "INV-REQ-1300"
        text: "activate at the effective date with notice"
        option: "ACTIVATE_WITH_NOTICE"
      VP-40:
        requirement: "INV-REQ-1301"
        text: "one attestation with acknowledgement"
        option: "SINGLE_ATTESTATION_SOLE_OPERATOR"
        needs_acknowledgement:
          - "SINGLE_ATTESTATION_SOLE_OPERATOR"
