- id: VP-08
  requirement: INV-REQ-1269
  revision: 1badf0c8-ab58-4d73-badb-c34f95ccde6d
  title: "Break-glass pairs deployment.operator or tenant.admin with tax.approver for 4 hours by default; other named pairs and 1 to 8 hours are possible, and it is always two people"
  class: CONTROL
  class_modifiers:
    - "non_waivable_in_part"
  scope:
