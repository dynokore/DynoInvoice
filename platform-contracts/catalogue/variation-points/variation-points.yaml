        kind: "FACT"
        rule: "Customer OIDC directory or both needs a customer OIDC directory connected and its configuration validated (INV-FLOW-229 step 1); applying PRF-2 without one leaves VP-01 at its default (INV-AC-2238)"
        source: "INV-REQ-1262 b4, io_contract.bounds, must_not_happen; INV-FLOW-229 step 1; INV-REQ-1253; INV-AC-2238; INV-Q-3612"
