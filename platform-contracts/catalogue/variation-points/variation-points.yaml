    - "tenant"
  owner: access-svc
  set_by:
    - "tenant.admin"
  must_be_elected: false
  default: "Platform identity with MFA (SaaS) or the bundled provider (private)"
  options:
    - "Platform identity with MFA (SaaS) or the bundled provider (private)"
    - "customer OIDC directory"
    - "both"
  bounds: "The break-glass account always exists (INV-REQ-896); customer OIDC directory or both only once a customer OIDC directory is connected and validated (owner ruling INV-Q-3612)"
  status: available
  status_note: "ruling INV-Q-2219; the register row still says planned"
  governs:
    - "INV-REQ-882"
  form_dependence: null
