# Vendored, read-only snapshot of the Keel INV variation-point requirements (STK-61,
# CS-28), never hand-edited.
#
# Unlike catalogue/errors/error-codes.yaml (T7), there is no invoice-docs git file to
# vendor from here: model/generated/policies.yaml (the design-phase VP register) was
# archived, not migrated, when invoice-docs' architecture moved to
# model/architecture/ (invoice-docs commit dcd475a1d6ceb2b19bf53afcdd563da589bb9faf,
# 2026-09-26) — the owner's own commit message gives the reason: "The generated YAML
# that duplicated Keel-mastered data is archived too." invoice-docs' model/README.md
# now says so directly ("Not here: requirements, waves, module ownership, variation
# points and questions. Keel project INV masters them. Read them from Keel, not from
# any file"), and STK-61 reads "VariationPoint from the Keel INV variation-point
# requirements" (not from a YAML path). catalogue/README.md named this exact gap as a
# follow-up before this task (INV-T-2852 / T8) closed it: "VariationPoint, generated
# from the Keel INV variation-point requirements, is not built yet."
#
# This copy is the generator's (catalogue/generator/) sole input for the gst-catalogue
# VariationPoint catalogue. To pick up a Keel change, re-run the extraction query
# below (read-only; the same kdb mechanism CODER-BRIEF documents) and re-vendor this
# file in its own merge request, naming what changed (AGT-11's pattern, mirrored from
# error-codes.yaml) — see catalogue/variation-points/README.md for the full procedure
# and the drift-check tool (not CI-wired yet; named there as a follow-up: unlike
# invoice-docs, which platform-contracts' CI can already clone with
# gitlab-ci-token:$CI_JOB_TOKEN, there is no established mechanism yet for a CI job to
# reach Keel's read-only database).
#
# Extracted: 2026-09-27, Keel project INV, 78 rows (VP-01..VP-78); re-extracted
# 2026-10-11 (INV-T-3000, Keel INV-CS-3045, INV-CS-3064, INV-CS-3071; snapshot 302) with check-drift.py --write, by:
#   select json_agg(json_build_object(
#     'k', e.key, 'src', e.source_ids, 'rev', r.id,
#     'io', r.attrs->'io_contract', 't', r.title, 'beh', r.attrs->>'behavior'))
#   from entity e join entity_revision r on r.entity_id = e.id
#     and r.published_in is not null and r.superseded_in is null
#   where e.project_id = (select id from project where code = 'INV')
#     and e.type = 'requirement' and e.source_ids::text like '%VP-%'
# Re-extracted 2026-10-11 (INV-T-3377, INV-Q-3320; 80 rows): VP-79 and VP-80 have no
# VP source id in Keel (source_ids is written only at creation, P57), so they are taken by
# the requirement that VP-57's and VP-67's own installation_parameter names, with that
# installation_parameter.row as their id (INV-Q-3202); see check-drift.py's docstring.
# Re-extracted 2026-10-11 (INV-T-3528; Keel INV-CS-3604, INV-CS-3619): typed constraint records
# in constraints, cross_row and cross_option (INV-Q-3526, INV-Q-3610, INV-Q-3614, INV-Q-3618); VP-64's
# note (INV-Q-3616); VP-08's cross_scope text (INV-Q-3548).
# Re-extracted 2026-10-11 (INV-T-3636; Keel INV-CS-3635): VP-01's typed FACT record
# VP-01.DIRECTORY_CONNECTED and bounds text (owner ruling INV-Q-3612 A).
# Re-extracted 2026-10-22 (INV-T-8291; Keel INV-CS-8286): adds VP-81, the sole-operator acknowledgement scope, as a planned row (INV-REQ-8287, owner answer INV-Q-8239); 81 rows.
#
# Keel has no single repository-wide commit the way invoice-docs does, so each row
# below pins to its own published entity_revision id (`revision`), not a shared SHA.
# `title`/`bounds`/`options`/etc. are each requirement's own `io_contract` attribute
# (INV-REQ-1239 behaviour #1's class/options/default/bounds/setting-role/scope/owner);
# `status`/`status_note` split a trailing parenthetical off `io_contract.status` (e.g.
# VP-01, VP-39: "available (ruling INV-Q-2219; the register row still says planned)");
# `must_be_elected` is derived from a `default` of "none: must be elected"; two rows
# (VP-30, VP-45) carry `form_dependence`, the only two INV-REQ-1248 behaviour #2 itself
# names as its own examples of an option that depends on a form.
#
# `catalogue` (INV-T-3000) is io_contract.catalogue, copied unedited: machine-readable
# scope levels, option keys in catalogue order (TPL-10), a strictness per option
# (STRICTER, DEFAULT, LOOSER, NEUTRAL; INV-Q-2936), typed values with bounds for
# PARAMETER and list rows (INV-Q-2934), and multi_select/exclusive_keys for set-valued
# rows. `catalogue: null` means Keel has no such field on that row yet: the row must
# then be retired or carry a pending marker naming its open question in
# pending-fields.yaml (never a value invented here).
