- id: VP-74
  requirement: INV-REQ-2757
  revision: 6083cbf2-b4ca-46d0-9bc8-a60642876c3d
  title: "Agent tenancy is available on in SaaS and off in a private installation by default, switchable per installation subject to live consents and the signed-link endpoint"
  class: POLICY
  class_modifiers: []
  scope:
    - "installation"
  owner: access-svc
  set_by:
    - "platform.engineer"
    - "deployment.operator"
  must_be_elected: false
  default: "On in SaaS, off in a private installation"
  options:
    - "On in SaaS, off in a private installation"
    - "the other value"
  bounds: "Client isolation and the consent rules of §9.4 are the same in both forms. Switching off is refused while any agent consent is live; clients are notified through the consent-withdrawal path (INV-REQ-955). Switching on in a private installation is refused unless the signed-link endpoint of INV-REQ-903 is exposed."
  status: available
  status_note: null
  governs:
    - "INV-REQ-853"
    - "INV-REQ-903"
  form_dependence: null
  catalogue:
    scope_levels:
      - "INSTALLATION"
    options:
      - key: "ON"
        strictness: "NEUTRAL"
      - key: "OFF"
        strictness: "NEUTRAL"
    cross_row:
      - id: "VP-74.OFF_NO_CLIENT_ENTITY_SCOPE"
        kind: "EXCLUDES"
        rows:
          - "VP-04"
          - "VP-10"
          - "VP-11"
          - "VP-12"
          - "VP-13"
          - "VP-62"
        rule: "The client-entity scope is a client entity under an agent consent (INV-REQ-1242 b1), and OFF cannot hold while any consent is live (b4), so with OFF none of these rows holds a value at CLIENT_ENTITY: VP-04 and VP-10 to VP-13 resolve to their default, VP-62 is held at ENTITY only"
        source: "INV-REQ-2757 row, b4; INV-REQ-853 b7; INV-REQ-1242 b1; INV-REQ-1265, 1271-1274, 1323 b1; INV-Q-3610"
        options:
          - "OFF"
        refused: "an agent consent, and so any client-entity value it carries, while VP-74 is OFF (access-svc)"
        scope_level: "CLIENT_ENTITY"
    note: "the default depends on the deployment form, so no single key is DEFAULT; refusals (switching off while an agent consent is live, switching on without the signed-link endpoint) are stated on ON/OFF"
    basis: "Owner ruling (2026-10-11) on INV-Q-3063, recommended option (A) accepted; INV-REQ-2757; conventions G1-G6 option A; INV-Q-2934, INV-Q-2936; for INV-T-3000; constraints: typed from the published text cited in each record's source, for INV-T-3528 (coordinator typing of published text, INV-Q-3526 A; tooling/vp-constraints-breakdown.md); cross_row (OFF excludes the CLIENT_ENTITY scope): coordinator ruling INV-Q-3610 (HIGH); for INV-T-3528"
    constraints:
      - id: "VP-74.ON_PRIVATE_ENDPOINT"
        fact:
          name: "signed_link_endpoint_exposed"
          holder: "INSTALLATION"
        kind: "FACT"
        rule: "Switching on in a private installation is refused unless the signed-link endpoint of INV-REQ-903 is exposed"
        forms:
          - "PRIVATE"
        source: "INV-REQ-2757 b5, io_contract.bounds; INV-REQ-903 b5; INV-REQ-853 b7"
        options:
          - "ON"
        refused: "setting ON in a private installation without the endpoint exposed (access-svc)"
      - id: "VP-74.OFF_NO_LIVE_CONSENT"
        fact:
          name: "no_live_agent_consent"
          holder: "INSTALLATION"
        kind: "FACT"
        rule: "Switching off is refused while any agent consent is live; affected clients are notified through the consent-withdrawal path (INV-REQ-955)"
        source: "INV-REQ-2757 b4, io_contract.bounds; INV-REQ-853 b7"
        options:
          - "OFF"
        refused: "setting OFF while any agent consent is live (access-svc)"
    default_by_form:
      SAAS: "ON"
      PRIVATE: "OFF"
- id: VP-75
  requirement: INV-REQ-2758
  revision: 571b40dc-6d73-40c1-9ad6-65317a79a287
  title: "A signed-link passcode reaches its recipient in a separate message — SMS if on file, else a second e-mail — by default, and up to five wrong entries invalidate the link, tighten-only"
  class: CONTROL
  class_modifiers:
    - "tighten_only"
  scope:
    - "installation"
  owner: access-svc
  set_by:
    - "platform.engineer"
    - "deployment.operator"
  must_be_elected: false
  default: "A separate message to the link's contact: SMS where a mobile number is on file, otherwise a second e-mail; five wrong entries invalidate the link"
  options:
    - "A separate message to the link's contact: SMS where a mobile number is on file, otherwise a second e-mail; five wrong entries invalidate the link"
    - "SMS only"
    - "fewer wrong entries"
  bounds: "No looser option: the passcode always travels apart from the link, and the limit never exceeds five. SMS only can be set only where an SMS gateway is bound to `MessageDelivery` (INV-REQ-817); under it a link is not issued to a contact without a mobile number, and an undeliverable SMS is not replaced by an e-mail. The sender may re-issue an invalidated link (INV-REQ-2762)."
  status: available
  status_note: null
  governs:
    - "INV-REQ-2762"
    - "INV-REQ-899"
    - "INV-REQ-901"
  form_dependence: null
  catalogue:
    scope_levels:
      - "INSTALLATION"
    multi_select: true
    exclusive_keys:
      - "SEPARATE_MESSAGE_5"
    options:
      - key: "SEPARATE_MESSAGE_5"
        strictness: "DEFAULT"
      - key: "SMS_ONLY"
        strictness: "STRICTER"
      - key: "FEWER_WRONG_ENTRIES"
        strictness: "STRICTER"
        typed_value:
          type: "int"
          unit: "wrong entries"
          min: 1
          max: 4
          direction: "DOWN_STRICTER"
    note: "delivery and the wrong-entry limit are set independently (INV-REQ-2758 b6), so SMS_ONLY and FEWER_WRONG_ENTRIES combine"
    basis: "Coordinator ruling (high confidence, delegated by owner 2026-10-11): INV-REQ-2758 b4/b6 (delivery and the wrong-entry limit set independently; fewer than five, never more), tighten-only; conventions G1-G6 option A; INV-Q-2934, INV-Q-2936; for INV-T-3000; constraints: typed from the published text cited in each record's source, for INV-T-3528 (coordinator typing of published text, INV-Q-3526 A; tooling/vp-constraints-breakdown.md)"
    constraints:
      - id: "VP-75.SMS_GATEWAY"
        fact:
          name: "sms_gateway_bound_to_message_delivery"
          holder: "INSTALLATION"
        kind: "FACT"
        rule: "SMS only may be set only where an SMS gateway is bound to MessageDelivery (INV-REQ-817; in SaaS the operator's gateway, in a private installation the customer's optional gateway, INV-REQ-817 b4)"
        source: "INV-REQ-2758 b3, io_contract.bounds, must_not_happen; INV-REQ-817 b4"
        options:
          - "SMS_ONLY"
        refused: "setting SMS_ONLY with no SMS gateway bound to MessageDelivery (access-svc)"
