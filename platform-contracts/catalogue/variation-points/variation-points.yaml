    - "other named pairs; 1 to 8 hours"
  bounds: "Always two people, a restricted action set and ACC-002 (INV-REQ-896, INV-REQ-897)"
  status: planned
  status_note: null
  governs:
    - "INV-REQ-896"
  form_dependence: null
  catalogue:
    scope_levels:
      - "INSTALLATION"
      - "TENANT"
    options:
      - key: "DEFAULT_PAIR_4H"
        strictness: "DEFAULT"
        typed_value:
          type: "record"
          fields:
            window:
              type: "duration"
              unit: "hours"
              min: 1
              max: 8
              default: 4
              direction: "DOWN_STRICTER"
      - key: "OTHER_NAMED_PAIR"
        strictness: "NEUTRAL"
        typed_value:
          type: "record"
          fields:
            pair:
              type: "list_ref"
              ref: "role pairs: two named roles, always two distinct people at unlock"
            window:
              type: "duration"
              unit: "hours"
              min: 1
              max: 8
              default: 4
              direction: "DOWN_STRICTER"
    cross_scope: "A tenant value may not exceed the installation value (tighten-only across scopes, INV-Q-2936); the 1 to 8 hour range is the row's bound, so nothing inside it needs an acknowledgement and nothing outside it is offered. Compared on fields with a direction (window); the pair is not compared (INV-Q-3204). At resolution a tenant window above the installation value in force on the date is capped at it, the stored value unchanged (INV-REQ-1242 b5, INV-Q-3206). The default pair's window is configurable from 1 to 8 hours like any pair's (INV-Q-3320). A DEFAULT_PAIR_4H value is written with its window: a write with no value or without the window is refused and nothing is stored (INV-Q-3167). Where nothing is set at a scope, the catalogue default DEFAULT_PAIR_4H applies with its default window of 4 hours, in resolution, in the cross-scope comparison and in the cap (INV-Q-3548)."
    basis: "Coordinator ruling (high confidence, delegated by owner 2026-10-11): INV-REQ-1269, INV-REQ-896 b2 (1 to 8 hours set by security.officer), INV-AC-2253 (only above 8 hours refused), INV-Q-2936 (non-waivable rows offer nothing looser; VP-08 tighten-only across scopes): the 1 to 8 h range is the row's bound, the installation value bounds the tenant's; conventions G1-G6 option A; INV-Q-2934, INV-Q-2936; for INV-T-3000; DEFAULT_PAIR_4H typed window fixed at 4 h, directed fields only compared across scopes: coordinator ruling INV-Q-3204; resolution cap: INV-Q-3206; for INV-T-3176; owner ruling INV-Q-3320 (A′, 2026-10-11): INV-REQ-1269 allows 1 to 8 hours for any pair, so DEFAULT_PAIR_4H's window is 1 to 8 h, default 4 (supersedes INV-Q-3204's fixed 4 h); the key is kept; a write without the window is refused and the default 4 h is the window of the catalogue default only: coordinator ruling INV-Q-3548 (HIGH, reconciling INV-Q-3167 and INV-Q-3320)"
