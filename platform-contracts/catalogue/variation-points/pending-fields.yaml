# per-option strictness, typed values; INV-Q-2934, INV-Q-2936) is not written yet
# because an owner question about it is still open.
#
# Repository-owned, hand-kept (like check-drift.py's FORM_DEPENDENCE), NOT vendored
# from Keel. variation-points.yaml stays a pure Keel copy, and this file is the
# only place a missing field may be excused. checkVariationPointFields fails the
# build if:
#   - a non-retired row has `catalogue: null` and is not listed here, or
#   - a row listed here already has a Keel `catalogue` (a stale marker), or
#   - a marker names anything other than an INV-Q-nnnn question key.
# Nothing here supplies a value: a pending row's option keys, strictness, scope levels
# and typed values are simply absent from the generated library until Keel carries
# them (re-vendor with check-drift.py --write, then delete the row's marker).
#
# Source: the questions' own text in Keel (each names its rows), as of 2026-10-11.
