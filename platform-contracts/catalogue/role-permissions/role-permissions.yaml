# The role-by-permission table of the gst-catalogue (STK-61, INV-T-7987, coordinator ruling INV-Q-7979 A).
#
# Hand-edited in this repository: there is no vendoring script. The text of record is the Keel note
# INV-NOTE-3 section 22.2 (role catalogue) and section 22.3 (permission matrix, with its amendment
# table of 24 Sep 2026) and requirement INV-REQ-999 (private form: import, verify and arm a
# regulatory pack). README.md says how the keys are named and how a change is made.
#
# roles:       key and belongs_to as in section 22.2; forms is the non-empty set of deployment forms
#              the role exists in (INV-REQ-876: deployment.operator is PRIVATE only; INV-REQ-888:
#              platform.support, platform.engineer, release.manager and commercial.admin are SAAS only).
# permissions: one key per function; kind is READ or WRITE; row is the label of the published row the
#              key transcribes, copied verbatim (markup removed). cells lists {role, form, allowance}:
#              PERMITTED is the published Y, WITHIN_SCOPE the published S. A cell that is not listed is
#              DENIED (the published dash, and every case the text does not state: fail closed).
#              The consent-item condition of the Agent scope paragraph is not a catalogue field
#              (INV-T-4939 owns it).


