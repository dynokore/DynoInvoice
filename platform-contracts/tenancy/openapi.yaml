  /internal/v1/tenancy/tenants:
    post:
      operationId: createTenant
      summary: Provision a tenant (SaaS only; called by control-plane-svc's provisionTenant, SDS §7 SCR-38.1)
      description: >-
        Tenant created in tenancy-svc; the first administrator is invited by access-svc separately.


        x-timeout 5000 is the per-attempt cap of control-plane-svc's background retries
        (INV-REQ-1204 b7, INV-Q-3476 (d)); the inline attempt inside provisionTenant is
        bounded by the propagated deadline (INV-REQ-1203).


        control-plane-svc always sends the tenantRef it minted when it recorded the
        provisioning request (CreateTenantRequest.tenantRef), and tenancy-svc records the
        tenant under it; a call without it mints one, as in 1.0.0 (INV-Q-3573).
      tags:
      - tenants
      x-principal: filing-workflow
      x-timeout: 5000
      x-requirements:
      - FR-AC.1
      - FR-G.11
      x-error-codes: []
