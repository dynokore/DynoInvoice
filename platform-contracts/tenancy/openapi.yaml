          - PARTIAL_EXEMPTION
          - OBLIGATION_START
        effectiveFrom:
          type: string
          format: date
        partiallyExempt:
          type: boolean
          description: Partial exemption flag in force from effectiveFrom (INV-REQ-331).
        excludedBusinessStatus:
          type: string
          enum:
          - NOT_EXCLUDED
          - OVERSEAS_S33_1
          - OVR
          - RC_ONLY
          description: Excluded Business determination in force from effectiveFrom (INV-REQ-331, INV-REQ-333).
        basis:
          type: string
          maxLength: 500
          description: The basis of the value set; required whenever partiallyExempt or excludedBusinessStatus is present (INV-REQ-331 b1).
        evidenceRef:
          type: string
          maxLength: 200
          description: Reference to the evidence of the Excluded Business determination; required whenever excludedBusinessStatus is present (INV-REQ-333 b1).
        obligationStartDate:
          type: string
          format: date
          description: The later of the registration start date and the implementation date (INV-REQ-335).
        obligationStartBasis:
          type: string
          enum:
          - MANDATORY_DATE
          - EARLIER_VOLUNTARY_DATE
          - IRAS_COMMUNICATED_DATE
          default: MANDATORY_DATE
          description: Basis of the implementation date behind obligationStartDate, the option keys of INV-REQ-1312 (INV-REQ-335 b1).
        irasReference:
          type: string
          maxLength: 100
          description: IRAS reference of a communicated date; required when obligationStartBasis is IRAS_COMMUNICATED_DATE (INV-REQ-335 b1).
        obligationStartOverride:
          type: boolean
          default: false
          description: True when a GST group or division overrides the computed date (INV-REQ-335, INV-REQ-717).
      allOf:
      - if:
          required:
          - partiallyExempt
        then:
          required:
          - basis
      - if:
          required:
          - excludedBusinessStatus
        then:
          required:
          - basis
          - evidenceRef
      - if:
          required:
          - obligationStartBasis
          properties:
            obligationStartBasis:
              const: IRAS_COMMUNICATED_DATE
        then:
          required:
          - irasReference
