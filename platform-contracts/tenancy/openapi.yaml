                    lifecycleState: RETIRED
                    node:
                      kind: BUSINESS_UNIT
                      parentRef: ENT-3F2A9C
                      retired: true
                      name: Orchard Road outlet
                      code: ORCH
                      profile: []
                      structureVersion: 4130
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
