    post:
      operationId: applyOperatingProfile
      summary: Preview, then apply, a versioned operating profile (INV-REQ-1245, FR-AI.7)
      description: >-
        Takes a profile id, its version and the profile's values. With apply false (the default) nothing
        is applied: the response lists every value that would change and every deviation shown against
        the profile. With apply true the same differences are applied and tenancy-svc records the profile
        and version applied. A new profile version is never applied silently: the same call with the new
        version shows its differences first. console-bff calls each owning service's setPolicy and owns
        no policy value (INV-REQ-1245 b2); a value owned by another setting role is counted as waiting
        and takes effect only when a holder of that role confirms it (INV-REQ-1245 b5).
      tags:
      - tenants
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
