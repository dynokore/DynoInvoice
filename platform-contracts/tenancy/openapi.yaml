components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    CreateEntityRequest:
      type: object
      required:
      - tenantRef
      - groupRef
      - legalName
      - constitution
      properties:
        tenantRef:
          type: string
          maxLength: 64
        groupRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        constitution:
          type: string
          enum:
          - PRIVATE_LIMITED
          - SOLE_PROPRIETOR
          - PARTNERSHIP
          - PUBLIC_LIMITED
          x-extensible-enum: true
        uen:
          type: string
          maxLength: 32
          description: The entity's own UEN (INV-REQ-652).
        gstn:
          type: string
          maxLength: 32
          description: The entity's own GSTN, when it has one.
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
          description: The entity's short code (INV-REQ-850 b7).
    CreateGroupRequest:
      type: object
      required:
      - tenantRef
      - name
      - groupKind
      properties:
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        groupKind:
          type: string
          description: A GST group or a divisional registration (INV-REQ-850 b3).
          enum:
          - GST_GROUP
          - DIVISIONAL
          x-extensible-enum: true
        gstn:
          type: string
          maxLength: 32
          description: The group's GSTN (INV-REQ-652).
    GroupResponse:
      type: object
      required:
      - groupRef
      - tenantRef
      - name
      - groupKind
      properties:
        groupRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        groupKind:
          type: string
          description: A GST group or a divisional registration (INV-REQ-850 b3).
          enum:
          - GST_GROUP
          - DIVISIONAL
          x-extensible-enum: true
        gstn:
          type: string
          maxLength: 32
    RegisterBusinessUnitRequest:
      type: object
      required:
      - tenantRef
      - entityRef
      - name
      - code
      properties:
        tenantRef:
          type: string
          maxLength: 64
        entityRef:
          type: string
          maxLength: 64
          description: The parent registered entity.
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
          description: The short code, entered when the unit is registered (INV-REQ-850 b7).
    BusinessUnitResponse:
      type: object
      required:
      - businessUnitRef
      - tenantRef
      - entityRef
      - name
      - code
      properties:
        businessUnitRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        entityRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
    MoveBusinessUnitRequest:
      type: object
      required:
      - toEntityRef
      properties:
        toEntityRef:
          type: string
          maxLength: 64
    UpdateBusinessUnitRequest:
      type: object
      required:
      - name
      - code
      properties:
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
    EntityResponse:
      type: object
      required:
      - entityRef
      - legalName
      - lifecycleState
      properties:
        entityRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        lifecycleState:
          type: string
          description: An entity's own lifecycle state. For a group, business unit or tenant
            (getEntityStructure only) LIVE, or RETIRED when retired; DEREGISTERED stays a GST
            registration term for entities only (INV-Q-3324).
          enum:
          - DRAFT
          - LIVE
          - SUSPENDED
          - DEREGISTERED
          - RETIRED
          x-extensible-enum: true
        node:
          $ref: '#/components/schemas/StructureNode'
    StructureNode:
      type: object
      description: A structure node's full state, the same node object OrganisationStructureChanged
        and EntityProfileChanged carry (INV-T-3298, INV-API-3329, INV-Q-3324 (a)).
      required:
      - kind
      - retired
      - name
      - profile
      - structureVersion
      properties:
        kind:
          type: string
          description: The node's level (INV-REQ-850). Authoritative.
          enum:
          - TENANT
          - GROUP
          - ENTITY
          - BUSINESS_UNIT
          x-extensible-enum: true
        parentRef:
          type: string
          maxLength: 64
          description: The node's parent; absent for a tenant.
        retired:
          type: boolean
          description: True once the node is retired. Authoritative for every kind.
        name:
          type: string
          maxLength: 200
          description: The node's name, an entity's or tenant's legal name, a group's or business
            unit's name.
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
          description: Short code of a registered entity or business unit (INV-REQ-850 b7); absent
            for a tenant or group.
        uen:
          type: string
          maxLength: 32
          description: An entity's own UEN. Absent for a tenant, group or business unit.
        gstn:
          type: string
          maxLength: 32
          description: An entity's own GSTN when it has one, or a group's GSTN. Absent for a tenant or business unit. An entity that has no gstn of its own is read with the gstn of its parent group (INV-NOTE-2 section 5.1, GST group member and divisional registration).
        profile:
          type: array
          description: The node's profile as effective-dated attribute entries (INV-REQ-323,
            INV-REQ-376, INV-REQ-852), every entry in force or scheduled; an attribute is served for
            a date by its effective date.
          items:
            type: object
            required:
            - attribute
            - value
            - effectiveDate
            properties:
              attribute:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
              effectiveDate:
                type: string
                format: date
        structureVersion:
          type: integer
          format: int64
          minimum: 1
          description: tenancy-svc's monotonic structure version of this node state, one sequence
            across both structure events and this response (TPL-05). The caller keeps whichever is
            newer, the fill or the state it holds.
    AssessPhaseRequest:
      type: object
      required:
      - box4Figures
      - asOfDate
      properties:
        box4Figures:
          type: string
          format: decimal
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        asOfDate:
          type: string
          format: date
    PhaseAssessmentResponse:
      type: object
      required:
      - entityRef
      - phase
      - implementationDate
      properties:
        entityRef:
          type: string
          maxLength: 64
        phase:
          type: string
          enum:
          - PHASE_1
          - PHASE_2
          - PHASE_3
          x-extensible-enum: true
        implementationDate:
          type: string
          format: date
    CertifySandboxRequest:
      type: object
      required:
      - outcome
      - suiteVersion
      properties:
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
        suiteVersion:
          type: string
          maxLength: 32
    CertificationResponse:
      type: object
      required:
      - entityRef
      - outcome
      - recordedAt
      properties:
        entityRef:
          type: string
