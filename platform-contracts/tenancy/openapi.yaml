      x-operation:
        role: control-plane-svc
        scope: platform
        precondition: A contract is on file
        reversibility: COMPENSABLE
        repeatKey: contractReference — a repeat returns the original tenant; offboard to reverse
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            examples:
              default:
                value:
                  contractReference: CTR-2026-0091
                  legalName: Acme Holdings Pte Ltd
                  planRef: PLAN-STANDARD
