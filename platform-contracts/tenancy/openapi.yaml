  /internal/v1/tenancy/installation-actions:
    post:
      operationId: recordInstallationAction
      summary: Record one installer run-record step and the installation facts it sets (INV-REQ-1101 b5, INV-REQ-861)
      description: 'Called by the installer sender (a Job under the chart-created installer service account), after
        every command and after a restore. In one transaction tenancy-svc stores the step, updates the installation
        facts it owns (release train and supported window; backup-target verification, INV-REQ-1107; heartbeat target
        or its absence, INV-REQ-1116) and writes AuditEntryRecorded under the reserved platform TenantId through its
        own outbox (INV-REQ-861; actor = runIdentity with the named deploymentOperator). Idempotent by (runId, step),
        permanently: a repeat returns the original acknowledgement, changes no fact and writes no second entry; a repeat
        with a different body also returns the original acknowledgement, applies nothing and raises the
        differing-repeat counter. Unknown request fields are ignored, never stored, and listed in warnings (API-10).
        A fact applies by occurredAt: an older step never overwrites a newer fact. Not in the console catalogue of
        INV-REQ-2588 (INV-REQ-1101 b5, INV-REQ-1108 b6). The scope and the prior state of the audit entry are not request fields:
        the scope is the installation, and tenancy-svc reads the prior state, the facts the step changes as they
        were, from its own installation facts (INV-Q-5498). The closed service-runtime refusals carry their SRT
        codes and are not listed in x-error-codes (INV-Q-5500, ARC-19): a call without a valid workload token is
        SRT-003; a call under any other identity is SRT-004.'
      tags:
      - installation
      x-principal: workload
      x-sync-edge: installer->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - INV-REQ-1101
      - INV-REQ-1107
      - INV-REQ-1116
      - INV-REQ-1108
      - INV-REQ-861
      x-error-codes: []
      x-operation:
        role: installer workload identity
        scope: installation
        precondition: tenancy-svc is healthy and the step is one of the object-locked run record
        reversibility: IRREVERSIBLE
        repeatKey: (runId, step), permanent - a repeat returns the original acknowledgement, changes no fact and writes no second entry
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInstallationActionRequest'
            examples:
              default:
                value:
                  runId: 0b0c9a3e-6d1f-4f0e-9a52-7a1d3c5e8f10
                  step: 1
                  command: INSTALL
                  stepName: verify-backup-target
                  outcome: SUCCEEDED
                  occurredAt: "2026-10-16T08:30:00Z"
                  runIdentity: cli:ops-lee
                  deploymentOperator: ops-lee
                  facts:
                    releaseTrain: "2026.10"
                    backupTarget:
                      verified: true
                      checkedAt: "2026-10-16T08:29:40Z"
      responses:
        "200":
          description: The step is recorded, or it was already recorded and the original acknowledgement is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationActionAck'
              examples:
                default:
                  value:
                    runId: 0b0c9a3e-6d1f-4f0e-9a52-7a1d3c5e8f10
                    step: 1
                    auditEntryId: 7f1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    recordedAt: "2026-10-16T08:30:01Z"
                    warnings: []
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
