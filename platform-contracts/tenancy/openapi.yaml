components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    CreateEntityRequest:
      type: object
      required:
      - tenantRef
      - groupRef
      - legalName
      - constitution
      properties:
        tenantRef:
          type: string
          maxLength: 64
        groupRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        constitution:
          type: string
          enum:
          - PRIVATE_LIMITED
          - SOLE_PROPRIETOR
          - PARTNERSHIP
          - PUBLIC_LIMITED
          x-extensible-enum: true
    EntityResponse:
      type: object
      required:
      - entityRef
      - legalName
      - lifecycleState
      properties:
        entityRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        lifecycleState:
          type: string
          enum:
          - DRAFT
          - LIVE
          - SUSPENDED
          - DEREGISTERED
          x-extensible-enum: true
    AssessPhaseRequest:
      type: object
      required:
      - box4Figures
      - asOfDate
      properties:
        box4Figures:
          type: string
          format: decimal
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        asOfDate:
          type: string
          format: date
    PhaseAssessmentResponse:
      type: object
      required:
      - entityRef
      - phase
      - implementationDate
      properties:
        entityRef:
          type: string
          maxLength: 64
        phase:
          type: string
          enum:
          - PHASE_1
          - PHASE_2
          - PHASE_3
          x-extensible-enum: true
        implementationDate:
          type: string
          format: date
    CertifySandboxRequest:
      type: object
      required:
      - outcome
      - suiteVersion
      properties:
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
        suiteVersion:
          type: string
          maxLength: 32
    CertificationResponse:
      type: object
      required:
      - entityRef
      - outcome
      - recordedAt
      properties:
        entityRef:
          type: string
          maxLength: 64
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
          x-extensible-enum: true
        recordedAt:
          type: string
          format: date-time
    GoLiveRequest:
      type: object
      required:
      - secondConfirmationBy
      properties:
        secondConfirmationBy:
          type: string
          maxLength: 128
    SuspendEntityRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 500
    DeregisterEntityRequest:
      type: object
      required:
      - registrationEndDate
      properties:
        registrationEndDate:
          type: string
          format: date
    QuestionnaireAnswersRequest:
      type: object
      required:
      - questionnaireVersion
      - answers
      properties:
        questionnaireVersion:
          type: string
          maxLength: 16
        answers:
          type: object
          additionalProperties:
            type: string
            maxLength: 200
    QuestionnaireAnswersResponse:
      type: object
      required:
      - tenantRef
      - recommendedProfile
      - reasons
      properties:
        tenantRef:
          type: string
          maxLength: 64
        recommendedProfile:
          type: string
          maxLength: 64
        reasons:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
    FilingFrequencyChangeRequest:
      type: object
      required:
      - newFrequency
      - effectiveFrom
      - irasApprovalReference
      properties:
        newFrequency:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
        irasApprovalReference:
          type: string
          maxLength: 64
    FilingFrequencyResponse:
      type: object
      required:
      - entityRef
      - frequency
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        frequency:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
    ConfirmPeriodRequest:
      type: object
      required:
      - periodRef
      - periodStart
      - periodEnd
      - kind
      properties:
        periodRef:
          type: string
          maxLength: 32
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        kind:
          type: string
          enum:
          - FIRST
          - FINAL
          - TRANSITIONAL
    PeriodResponse:
      type: object
      required:
      - entityRef
      - periodRef
      - periodStart
      - periodEnd
      properties:
        entityRef:
          type: string
          maxLength: 64
        periodRef:
          type: string
          maxLength: 32
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    CreateWorkspaceRequest:
      type: object
      required:
      - tenantRef
      - name
      properties:
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
    WorkspaceResponse:
      type: object
      required:
      - workspaceRef
      - tenantRef
      - name
      - environment
      properties:
        workspaceRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
        environment:
          type: string
          enum:
          - PRODUCTION
          - SANDBOX
          x-extensible-enum: true
    RateSourceElectionRequest:
      type: object
      required:
      - source
      - basis
      - effectiveFrom
      - approvedBy
      properties:
        source:
          type: string
          maxLength: 32
        basis:
          type: string
          enum:
          - DAILY
          - MONTHLY_AVERAGE
        effectiveFrom:
          type: string
          format: date
        approvedBy:
          type: string
          maxLength: 128
    RateSourceElectionResponse:
      type: object
      required:
      - entityRef
      - source
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        source:
          type: string
          maxLength: 32
        effectiveFrom:
          type: string
          format: date
    InstallLicenceRequest:
      type: object
      required:
      - licenceId
      - signedFile
      properties:
        licenceId:
          type: string
          maxLength: 64
        signedFile:
          type: string
          maxLength: 20000
          format: byte
    LicenceResponse:
      type: object
      required:
      - licenceId
      - status
      properties:
        licenceId:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          x-extensible-enum: true
        expiresAt:
          type: string
          format: date
    ElectionRequest:
      type: object
      required:
      - election
      - effectiveFrom
      - approvedBy
      properties:
        election:
          type: string
          maxLength: 64
        effectiveFrom:
          type: string
          format: date
        approvedBy:
          type: string
          maxLength: 128
    ElectionResponse:
      type: object
      required:
      - entityRef
      - election
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        election:
          type: string
          maxLength: 64
        effectiveFrom:
          type: string
          format: date
    PeriodExtensionRequest:
      type: object
      required:
      - newDueDate
      - irasReference
      - evidenceRef
      properties:
        newDueDate:
          type: string
          format: date
        irasReference:
          type: string
          maxLength: 64
        evidenceRef:
          type: string
          maxLength: 64
    PeriodExtensionResponse:
      type: object
      required:
      - entityRef
      - periodRef
      - newDueDate
      properties:
        entityRef:
          type: string
          maxLength: 64
        periodRef:
          type: string
          maxLength: 32
        newDueDate:
          type: string
          format: date
    RenditionResponsibilityRequest:
      type: object
      required:
      - documentClass
      - renderer
      - attestedBy
      properties:
        documentClass:
          type: string
          maxLength: 64
        renderer:
          type: string
          enum:
          - SELF
          - AGENT
          - AGGREGATOR
          x-extensible-enum: true
        attestedBy:
          type: string
          maxLength: 128
    RenditionResponsibilityResponse:
      type: object
      required:
      - entityRef
      - documentClass
      - renderer
      properties:
        entityRef:
          type: string
          maxLength: 64
        documentClass:
          type: string
          maxLength: 64
        renderer:
          type: string
          enum:
          - SELF
          - AGENT
          - AGGREGATOR
          x-extensible-enum: true
    SetEntityStatusRequest:
      type: object
      required:
      - statusKind
      - effectiveFrom
