        Fallback only, called by any service other than access-svc when its local structure
        replica misses (INV-REQ-1200 b2, INV-REQ-1199 b3). Node-generic (INV-T-3298, INV-API-3329,
        INV-Q-3324 (a)): the path reference may name any structure node, a registered entity, group,
        business unit or tenant. The response's node is the same full node object
        OrganisationStructureChanged and EntityProfileChanged carry, with its structureVersion; the
        caller keeps that version and keeps whichever is newer, the fill or the state it holds. For a
        group, business unit or tenant the required fields hold the node ref (entityRef), the node's
        name (legalName) and lifecycleState LIVE, or RETIRED when retired; node.kind and node.retired
        are authoritative. An unknown node returns 404, which the replica reads as absent. Caller
        budget: 500 ms (x-timeout) with one retry and a circuit breaker; on failure the replica serves
        its last state (INV-REQ-1200 b3).
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: any->tenancy-svc
      x-timeout: 500
      x-requirements:
      - FR-AC.1
      - FR-AH.4
      x-error-codes: []
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The structure node's opaque reference (a registered entity, group, business
          unit or tenant).
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      responses:
        "200":
          description: Structure node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    legalName: Acme Trading Pte Ltd
                    lifecycleState: LIVE
                    node:
                      kind: ENTITY
                      parentRef: GRP-19C2
                      retired: false
                      name: Acme Trading Pte Ltd
                      code: ACME01
                      profile:
                      - attribute: filingFrequency
                        value: QUARTERLY
                        effectiveDate: '2026-01-01'
                      - attribute: filingFrequency
                        value: MONTHLY
                        effectiveDate: '2027-01-01'
                      structureVersion: 4127
                businessUnit:
                  value:
                    entityRef: BU-7731
                    legalName: Orchard Road outlet
                    lifecycleState: RETIRED
                    node:
                      kind: BUSINESS_UNIT
                      parentRef: ENT-3F2A9C
                      retired: true
                      name: Orchard Road outlet
                      code: ORCH
                      profile: []
                      structureVersion: 4130
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/tenants/{tenantRef}/offboarding:
    post:
      operationId: offboardTenant
      summary: Offboard an entity or the tenant, with the export (INV-REQ-877, INV-REQ-956)
      description: >-
        Records the irreversible exit of one entity (scope ENTITY, entityRef present) or of the whole
        tenant (scope TENANT, entityRef absent): a retention custody holder is named and stored in the
        offboarding record with the handover statement, the full export is produced as a step of this
        operation and retention responsibility transfers (INV-REQ-877, INV-REQ-956). It is separate from
        deregisterEntity, the effective-dated registration end. Rules the service tests: the record state
        is COMPLETED only when export.state is READY and export.contents lists all six members
        (INV-REQ-877); a FAILED export leaves the entity or tenant open; the call is refused with 409
        while an in-scope document is unsubmitted and no unsubmittedOverride is given, while no holder is
        named, and for a range under DEP-007 (INV-REQ-662 b2); it fails closed naming the unavailable
        input when the count of unsubmitted documents cannot be read (INV-Q-4900). A repeat with the same
        Idempotency-Key returns the original record (API-15). A call with a new key while a record for the
        same tenant, scope and entity is REQUESTED or COMPLETED is refused with 409 and creates nothing. A
        call with a new key after a FAILED record is a new request: a new offboardingRef, every precondition
        evaluated afresh, nothing carried over; the FAILED record stays as history (INV-Q-5025).
        noticeWindowDays only lengthens the installation notice window (VP-66, INV-REQ-2462 b2).
      tags:
      - tenants
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-G.10
      - FR-AB.9
      - FR-AF.8
      x-error-codes:
      - DEP-007
      x-operation:
        role: entity.admin for scope ENTITY, tenant.admin for scope TENANT
        scope: tenant
        precondition: A retention custody holder is named and no in-scope document is unsubmitted, or an
          override acknowledgement is recorded (FR-AB.9)
        reversibility: IRREVERSIBLE
        repeatKey: (tenantRef, scope, entityRef)
      parameters:
      - name: tenantRef
        in: path
        required: true
        description: The tenant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: TEN-7B1004
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffboardTenantRequest'
            examples:
              default:
                value:
                  scope: TENANT
                  retentionCustodyHolder:
                    name: Ledger Custody Pte Ltd
                    contactEmail: custody@ledger.example
                  secondConfirmationBy: user-8841
      responses:
        "202":
          description: Offboarding accepted; the record carries the export manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffboardingRecordResponse'
              examples:
                default:
                  value:
                    offboardingRef: OFB-41D7
                    tenantRef: TEN-7B1004
                    scope: TENANT
                    state: REQUESTED
                    retentionCustodyHolder:
                      name: Ledger Custody Pte Ltd
                      contactEmail: custody@ledger.example
                    export:
                      exportRef: EXP-5C20
                      state: REQUESTED
                      contents:
                      - TRANSMITTED_XML
                      - ACKNOWLEDGEMENTS
                      - DECISION_TRACES
                      - RECONCILIATION_WORK_PAPERS
                      - SOURCE_DOCUMENT_REFERENCES
                      - AUDIT_LOG
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/tenants/{tenantRef}/operating-profile:
    post:
      operationId: recordAppliedOperatingProfile
      summary: Record the operating profile and version applied to a scope (INV-REQ-1245, FR-AI.7)
      description: >-
        Records, for the tenant or one of its entities, which operating profile and which version were
        applied: only the scope, the profile reference and the version. The profile reference is opaque;
        tenancy-svc does not check it against the catalogue and reads no profile content. console-bff
        previews the differences and calls each owning service's setPolicy; it calls this operation with
        what it applied, after its setPolicy calls have succeeded, so a failure part-way leaves no record of
        a profile that was not applied (INV-REQ-1245 b2). A call for a scope that already has a record
        replaces its profile reference and version.
      tags:
      - tenants
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AI.7
      x-error-codes: []
      x-operation:
        role: tenant.admin for scope TENANT, entity.admin for scope ENTITY
        scope: tenant
        precondition: The tenant (and the entity, for scope ENTITY) exists
        reversibility: COMPENSABLE
        repeatKey: (tenantRef, scope, entityRef, profileRef, profileVersion)
      parameters:
      - name: tenantRef
        in: path
        required: true
        description: The tenant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: TEN-7B1004
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAppliedOperatingProfileRequest'
            examples:
              default:
                value:
                  scope: TENANT
                  profileRef: PROF-SME-STANDARD
                  profileVersion: 3
      responses:
        "200":
          description: The record of that scope after the call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedOperatingProfileRecord'
              examples:
                default:
                  value:
                    tenantRef: TEN-7B1004
                    scope: TENANT
                    profileRef: PROF-SME-STANDARD
                    profileVersion: 3
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getAppliedOperatingProfile
      summary: Read the operating profile and version recorded for a scope (INV-REQ-1245, FR-AI.7)
      description: >-
        Returns the record of the scope named by the query: scope, and entityRef exactly when scope is
        ENTITY (400 for a missing or contradictory entityRef). 404 for an unknown tenant or entity, or a scope
        that has no record.
      tags:
      - tenants
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AI.7
      x-error-codes: []
      parameters:
      - name: tenantRef
        in: path
        required: true
        description: The tenant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: TEN-7B1004
      - name: scope
        in: query
        required: true
        description: The scope whose record is read.
        schema:
          type: string
          enum:
          - TENANT
          - ENTITY
      - name: entityRef
        in: query
        required: false
        description: The entity, present exactly when scope is ENTITY.
        schema:
          type: string
          maxLength: 64
      responses:
        "200":
          description: The recorded profile and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedOperatingProfileRecord'
              examples:
                default:
                  value:
                    tenantRef: TEN-7B1004
                    scope: ENTITY
                    entityRef: ENT-3F2A9C
                    profileRef: PROF-SME-STANDARD
                    profileVersion: 3
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/groups:
    post:
      operationId: createGroup
      summary: Create a group (GST group or divisional registration)
      description: Creates a group of the tenant, a GST group or a divisional registration (INV-REQ-850 b3). A GST group holds the group GSTN; its members keep their own UENs (INV-REQ-652). Emits OrganisationStructureChanged.
      tags:
