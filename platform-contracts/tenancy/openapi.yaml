        role: tenant.admin
        scope: tenant
        precondition: The profile id and version exist; with apply true the caller has seen the differences
        reversibility: COMPENSABLE
        repeatKey: (tenantRef, profileId, profileVersion) — a repeat of an applied version is a no-op
      parameters:
      - name: tenantRef
        in: path
        required: true
        description: The tenant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: TEN-7B1004
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyOperatingProfileRequest'
            examples:
              default:
                value:
                  profileId: PROF-SME-STANDARD
                  profileVersion: 3
                  values:
                  - variationPoint: VP-014
                    proposedValue: "30"
                  apply: false
      responses:
        "200":
          description: Differences the profile makes; applied is true only when apply was true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyOperatingProfileResponse'
              examples:
                default:
                  value:
                    tenantRef: TEN-7B1004
                    profileId: PROF-SME-STANDARD
                    profileVersion: 3
                    applied: false
                    differences:
                    - variationPoint: VP-014
                      change: CHANGED
                      currentValue: "14"
                      proposedValue: "30"
                    valuesWaiting: 0
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    CreateEntityRequest:
      type: object
      required:
      - tenantRef
      - groupRef
      - legalName
      - constitution
      properties:
        tenantRef:
          type: string
          maxLength: 64
        groupRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        constitution:
          type: string
          enum:
          - PRIVATE_LIMITED
          - SOLE_PROPRIETOR
          - PARTNERSHIP
          - PUBLIC_LIMITED
          x-extensible-enum: true
    EntityResponse:
      type: object
      required:
      - entityRef
      - legalName
      - lifecycleState
      properties:
        entityRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        lifecycleState:
          type: string
          description: An entity's own lifecycle state. For a group, business unit or tenant
            (getEntityStructure only) LIVE, or RETIRED when retired; DEREGISTERED stays a GST
            registration term for entities only (INV-Q-3324).
          enum:
          - DRAFT
          - LIVE
          - SUSPENDED
          - DEREGISTERED
          - RETIRED
          x-extensible-enum: true
        node:
          $ref: '#/components/schemas/StructureNode'
    StructureNode:
      type: object
      description: A structure node's full state, the same node object OrganisationStructureChanged
        and EntityProfileChanged carry (INV-T-3298, INV-API-3329, INV-Q-3324 (a)).
      required:
      - kind
      - retired
      - name
      - profile
      - structureVersion
      properties:
        kind:
          type: string
          description: The node's level (INV-REQ-850). Authoritative.
          enum:
          - TENANT
          - GROUP
          - ENTITY
          - BUSINESS_UNIT
          x-extensible-enum: true
        parentRef:
          type: string
          maxLength: 64
          description: The node's parent; absent for a tenant.
        retired:
          type: boolean
          description: True once the node is retired. Authoritative for every kind.
        name:
          type: string
          maxLength: 200
          description: The node's name, an entity's or tenant's legal name, a group's or business
            unit's name.
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{1,10}$
          description: Short code of a registered entity or business unit (INV-REQ-850 b7); absent
            for a tenant or group.
        profile:
          type: array
          description: The node's profile as effective-dated attribute entries (INV-REQ-323,
            INV-REQ-376, INV-REQ-852), every entry in force or scheduled; an attribute is served for
            a date by its effective date.
          items:
            type: object
            required:
            - attribute
            - value
            - effectiveDate
            properties:
              attribute:
                type: string
                maxLength: 100
              value:
                type: string
                maxLength: 1000
              effectiveDate:
                type: string
                format: date
        structureVersion:
          type: integer
          format: int64
          minimum: 1
          description: tenancy-svc's monotonic structure version of this node state, one sequence
            across both structure events and this response (TPL-05). The caller keeps whichever is
            newer, the fill or the state it holds.
    AssessPhaseRequest:
      type: object
      required:
      - box4Figures
      - asOfDate
      properties:
        box4Figures:
          type: string
          format: decimal
          pattern: ^-?\d{1,17}(\.\d{1,2})?$
        asOfDate:
          type: string
          format: date
    PhaseAssessmentResponse:
      type: object
      required:
      - entityRef
      - phase
      - implementationDate
      properties:
        entityRef:
          type: string
          maxLength: 64
        phase:
          type: string
          enum:
          - PHASE_1
          - PHASE_2
          - PHASE_3
          x-extensible-enum: true
        implementationDate:
          type: string
          format: date
    CertifySandboxRequest:
      type: object
      required:
      - outcome
      - suiteVersion
      properties:
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
        suiteVersion:
          type: string
          maxLength: 32
    CertificationResponse:
      type: object
      required:
      - entityRef
      - outcome
      - recordedAt
      properties:
        entityRef:
          type: string
          maxLength: 64
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
          x-extensible-enum: true
        recordedAt:
          type: string
          format: date-time
    GoLiveRequest:
      type: object
      required:
      - secondConfirmationBy
      properties:
        secondConfirmationBy:
          type: string
          maxLength: 128
    SuspendEntityRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 500
    DeregisterEntityRequest:
      type: object
      required:
      - registrationEndDate
      properties:
        registrationEndDate:
          type: string
          format: date
        retentionCustodyHolder:
          $ref: '#/components/schemas/RetentionCustodyHolder'
        unsubmittedOverride:
          $ref: '#/components/schemas/UnsubmittedOverrideAcknowledgement'
        secondConfirmationBy:
          type: string
          maxLength: 128
          description: The second confirmation of an irreversible offboarding (INV-REQ-875, INV-REQ-956).
    RetentionCustodyHolder:
      type: object
      required:
      - name
      - contactEmail
      properties:
        name:
          type: string
          maxLength: 200
          description: The named retention custody holder, stored in the offboarding record (INV-REQ-956).
        contactEmail:
          type: string
          maxLength: 254
          description: Where the holder is notified at retention end (INV-REQ-956 b4).
    UnsubmittedOverrideAcknowledgement:
      type: object
      required:
      - acknowledgedBy
      - statement
      properties:
        acknowledgedBy:
          type: string
          maxLength: 128
        statement:
          type: string
          maxLength: 1000
          description: The recorded acknowledgement that overrides the block on unsubmitted in-scope documents (INV-AC-2056).
    QuestionnaireAnswersRequest:
      type: object
      required:
      - questionnaireVersion
      - answers
      properties:
        questionnaireVersion:
          type: string
          maxLength: 16
        answers:
          type: object
          additionalProperties:
            type: string
            maxLength: 200
    QuestionnaireAnswersResponse:
      type: object
      required:
      - tenantRef
      - recommendedProfile
      - reasons
      properties:
        tenantRef:
          type: string
          maxLength: 64
        recommendedProfile:
          type: string
          maxLength: 64
        reasons:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
    FilingFrequencyChangeRequest:
      type: object
      required:
      - newFrequency
      - effectiveFrom
      - irasApprovalReference
      properties:
        newFrequency:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
        irasApprovalReference:
          type: string
          maxLength: 64
    FilingFrequencyResponse:
      type: object
      required:
      - entityRef
      - frequency
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        frequency:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
    ConfirmPeriodRequest:
      type: object
      required:
      - periodRef
      - periodStart
      - periodEnd
      - kind
      properties:
        periodRef:
          type: string
          maxLength: 32
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        kind:
          type: string
          enum:
          - FIRST
          - FINAL
          - TRANSITIONAL
    PeriodResponse:
      type: object
      required:
      - entityRef
      - periodRef
      - periodStart
      - periodEnd
      properties:
        entityRef:
          type: string
          maxLength: 64
        periodRef:
          type: string
          maxLength: 32
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    CreateWorkspaceRequest:
      type: object
      required:
      - tenantRef
      - name
      properties:
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
    WorkspaceResponse:
      type: object
      required:
      - workspaceRef
      - tenantRef
      - name
      - environment
      properties:
        workspaceRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
        environment:
          type: string
          enum:
          - PRODUCTION
          - SANDBOX
          x-extensible-enum: true
    RateSourceElectionRequest:
      type: object
      required:
      - source
      - basis
      - effectiveFrom
      - approvedBy
      properties:
        source:
          type: string
          maxLength: 32
        basis:
          type: string
          enum:
          - DAILY
          - MONTHLY_AVERAGE
        effectiveFrom:
          type: string
          format: date
        approvedBy:
          type: string
          maxLength: 128
    RateSourceElectionResponse:
      type: object
      required:
      - entityRef
      - source
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        source:
          type: string
          maxLength: 32
        effectiveFrom:
          type: string
          format: date
    InstallLicenceRequest:
      type: object
      required:
      - licenceId
      - signedFile
      properties:
        licenceId:
          type: string
          maxLength: 64
        signedFile:
          type: string
          maxLength: 20000
          format: byte
    LicenceResponse:
      type: object
      required:
      - licenceId
      - status
      properties:
        licenceId:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          x-extensible-enum: true
        expiresAt:
          type: string
          format: date
    ElectionRequest:
      type: object
      required:
      - election
      - effectiveFrom
      - approvedBy
      properties:
        election:
          type: string
          maxLength: 64
        effectiveFrom:
          type: string
          format: date
        approvedBy:
          type: string
          maxLength: 128
    ElectionResponse:
      type: object
      required:
      - entityRef
      - election
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        election:
          type: string
          maxLength: 64
        effectiveFrom:
          type: string
          format: date
    PeriodExtensionRequest:
      type: object
      required:
      - newDueDate
      - irasReference
      - evidenceRef
      properties:
        newDueDate:
          type: string
          format: date
        irasReference:
          type: string
          maxLength: 64
        evidenceRef:
          type: string
          maxLength: 64
    PeriodExtensionResponse:
      type: object
      required:
      - entityRef
      - periodRef
      - newDueDate
      properties:
        entityRef:
          type: string
          maxLength: 64
        periodRef:
          type: string
          maxLength: 32
        newDueDate:
          type: string
          format: date
    RenditionResponsibilityRequest:
      type: object
      required:
      - documentClass
      - renderer
      - attestedBy
      properties:
        documentClass:
          type: string
          maxLength: 64
        renderer:
          type: string
          enum:
          - SELF
          - AGENT
          - AGGREGATOR
          x-extensible-enum: true
        attestedBy:
          type: string
          maxLength: 128
    RenditionResponsibilityResponse:
      type: object
      required:
      - entityRef
      - documentClass
      - renderer
      properties:
        entityRef:
          type: string
          maxLength: 64
        documentClass:
          type: string
          maxLength: 64
        renderer:
          type: string
          enum:
          - SELF
          - AGENT
          - AGGREGATOR
          x-extensible-enum: true
    SetEntityStatusRequest:
      type: object
      required:
      - statusKind
      - effectiveFrom
      properties:
        statusKind:
          type: string
          enum:
          - EXCLUDED_BUSINESS
          - PARTIAL_EXEMPTION
          - OBLIGATION_START
        effectiveFrom:
          type: string
          format: date
        partiallyExempt:
          type: boolean
          description: Partial exemption flag in force from effectiveFrom (INV-REQ-331).
        excludedBusinessStatus:
          type: string
          enum:
          - NOT_EXCLUDED
          - OVERSEAS_S33_1
          - OVR
          - RC_ONLY
          description: Excluded Business determination in force from effectiveFrom (INV-REQ-331, INV-REQ-333).
        basis:
          type: string
          maxLength: 500
          description: The basis of the value set, recorded with it (INV-REQ-331).
        evidenceRef:
          type: string
          maxLength: 200
          description: Evidence of the Excluded Business determination, recorded at onboarding (INV-REQ-333).
        obligationStartDate:
          type: string
          format: date
          description: The later of the registration start date and the implementation date (INV-REQ-335).
        obligationStartBasis:
          type: string
          enum:
          - MANDATORY_DATE
          - VOLUNTARY_ACTIVATION
          - IRAS_COMMUNICATED
          default: MANDATORY_DATE
          description: Basis of the implementation date (INV-REQ-335 b1, INV-REQ-1312).
        irasReference:
          type: string
          maxLength: 100
          description: IRAS reference of a communicated date (basis IRAS_COMMUNICATED).
        obligationStartOverride:
          type: boolean
          default: false
          description: True when a GST group or division overrides the computed date (INV-REQ-335, INV-REQ-717).
    EntityStatusResponse:
      type: object
      required:
      - entityRef
      - statusKind
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        statusKind:
          type: string
          enum:
          - EXCLUDED_BUSINESS
          - PARTIAL_EXEMPTION
          - OBLIGATION_START
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
        partiallyExempt:
          type: boolean
        excludedBusinessStatus:
          type: string
          enum:
          - NOT_EXCLUDED
          - OVERSEAS_S33_1
          - OVR
          - RC_ONLY
          x-extensible-enum: true
        basis:
          type: string
          maxLength: 500
        evidenceRef:
          type: string
          maxLength: 200
        obligationStartDate:
          type: string
          format: date
        obligationStartBasis:
          type: string
          enum:
          - MANDATORY_DATE
          - VOLUNTARY_ACTIVATION
          - IRAS_COMMUNICATED
          x-extensible-enum: true
        irasReference:
          type: string
          maxLength: 100
        obligationStartOverride:
          type: boolean
    SetIssuanceModeRequest:
      type: object
      required:
      - mode
      - effectiveFrom
      - secondConfirmationBy
      properties:
        mode:
          type: string
          enum:
          - RELAY
          - OBSERVE
          - NONE
        effectiveFrom:
          type: string
          format: date
        secondConfirmationBy:
          type: string
          maxLength: 128
    IssuanceModeResponse:
      type: object
      required:
      - entityRef
      - mode
      - effectiveFrom
      properties:
        entityRef:
          type: string
          maxLength: 64
        mode:
          type: string
          enum:
          - RELAY
          - OBSERVE
          - NONE
          x-extensible-enum: true
        effectiveFrom:
          type: string
          format: date
    CreateTenantRequest:
      type: object
      required:
      - contractReference
      - legalName
      - planRef
      properties:
        contractReference:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        planRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
          description: Optional. The tenantRef control-plane-svc minted for the provisioning request;
            tenancy-svc records the tenant under it, and mints one when it is absent, as in 1.0.0
            (INV-Q-3573).
    TenantResponse:
      type: object
      required:
      - tenantRef
      - legalName
      - planRef
      properties:
        tenantRef:
          type: string
          maxLength: 64
        legalName:
          type: string
          maxLength: 200
        planRef:
          type: string
          maxLength: 64
    UsageCountersResponse:
      type: object
      required:
      - tenantRef
      - documentsThisPeriod
      - activeEntities
      properties:
        tenantRef:
          type: string
          maxLength: 64
        documentsThisPeriod:
          type: integer
          minimum: 0
        activeEntities:
          type: integer
          minimum: 0
    ExportTenantDataRequest:
      type: object
      required:
      - secondConfirmationBy
      properties:
        secondConfirmationBy:
          type: string
          maxLength: 128
          description: The second confirmation of an irreversible operation (INV-REQ-875).
    TenantExportResponse:
      type: object
      required:
      - exportRef
      - tenantRef
      - state
      - contents
      properties:
        exportRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
          - REQUESTED
          - READY
          - FAILED
          x-extensible-enum: true
        contents:
          type: array
          items:
            type: string
            enum:
            - TRANSMITTED_XML
            - ACKNOWLEDGEMENTS
            - DECISION_TRACES
            - RECONCILIATION_WORK_PAPERS
            - SOURCE_DOCUMENT_REFERENCES
            x-extensible-enum: true
    RecordRetentionHoldRequest:
      type: object
      required:
      - requestedBy
      properties:
        requestedBy:
          type: string
          maxLength: 200
          description: The retention custody holder who requested the hold.
        reason:
          type: string
          maxLength: 500
    RetentionHoldResponse:
      type: object
      required:
      - holdRef
      - tenantRef
      - state
      - requestedBy
      properties:
        holdRef:
          type: string
          maxLength: 64
        tenantRef:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
          - PLACED
          x-extensible-enum: true
        requestedBy:
          type: string
          maxLength: 200
    OperatingProfileValue:
      type: object
      required:
      - variationPoint
      - proposedValue
      properties:
        variationPoint:
          type: string
          maxLength: 64
        proposedValue:
          type: string
          maxLength: 500
    ApplyOperatingProfileRequest:
      type: object
      required:
      - profileId
      - profileVersion
      - values
      properties:
        profileId:
          type: string
          maxLength: 64
        profileVersion:
          type: integer
          minimum: 1
        values:
          type: array
          items:
            $ref: '#/components/schemas/OperatingProfileValue'
        apply:
          type: boolean
          default: false
          description: False (the default) previews only; nothing is applied.
    OperatingProfileDifference:
      type: object
      required:
      - variationPoint
      - change
      - proposedValue
      properties:
        variationPoint:
          type: string
          maxLength: 64
        change:
          type: string
          enum:
          - ADDED
          - CHANGED
          - DEVIATION
          x-extensible-enum: true
          description: DEVIATION is a tenant value that differs from the profile, shown against it.
        currentValue:
          type: string
          maxLength: 500
        proposedValue:
          type: string
          maxLength: 500
    ApplyOperatingProfileResponse:
      type: object
      required:
      - tenantRef
      - profileId
      - profileVersion
      - applied
      - differences
      properties:
        tenantRef:
          type: string
          maxLength: 64
        profileId:
          type: string
          maxLength: 64
        profileVersion:
          type: integer
          minimum: 1
        applied:
          type: boolean
        differences:
          type: array
          items:
            $ref: '#/components/schemas/OperatingProfileDifference'
        valuesWaiting:
          type: integer
          minimum: 0
          description: Values held as waiting for another setting role (INV-REQ-1245 b5).
    PeriodRecord:
      type: object
      required:
      - periodRef
      - periodStart
      - periodEnd
      - position
      - state
      - filingDueDate
      - extensionGranted
      properties:
        periodRef:
          type: string
          maxLength: 64
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        position:
          type: string
          enum:
          - PAST
          - CURRENT
          - NEXT
          x-extensible-enum: true
        state:
          type: string
          enum:
          - OPEN
          - DUE
          - FILED
          - LATE
          x-extensible-enum: true
        filingDueDate:
          type: string
          format: date
        filedOn:
          type: string
          format: date
          description: The filing date; present when a filing fact is recorded, also on a late period.
        extensionGranted:
          type: boolean
          description: A flag that combines with any state, not a fifth state (INV-REQ-85 b4).
    PeriodRecordListResponse:
      type: object
      required:
      - entityRef
      - periods
      properties:
        entityRef:
          type: string
          maxLength: 64
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PeriodRecord'
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: ../service-runtime/schemas/error-envelope.schema.json
          examples:
            default:
              value:
                type: about:blank
                title: Example error (illustrates the envelope shape only)
                status: 400
                code: EXAMPLE-000
                correlationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6

