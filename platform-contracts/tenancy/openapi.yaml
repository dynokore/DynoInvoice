openapi: 3.1.0
info:
  title: tenancy API
  version: 1.1.0
  description: 'Contract-first source of truth for tenancy (API-01, STK-44), replacing the INV-T-2849
    scaffold (INV-T-2857, T13). Internal API only (SDS/04-api-standards §1): organisation structure and
    each entity''s regulatory profile, called by console-bff (commands), control-plane-svc (tenant provisioning
    and usage counters, SaaS only) and, as a replica-cache-miss fallback, any other service. The `tenancy-contract`
    module generates its server interfaces and DTOs from this file (STK-46); a consumer generates its
    own client types from the same file (FR-AH.13, ARC-07).'
  contact:
    name: tenancy (see CODEOWNERS)
servers:
- url: https://internal.invoice.internal
  description: Internal API (SDS/04-api-standards §1) — never routed by the gateway.
tags:
- name: entities
  description: Registered entities and their lifecycle, profile and regulatory facts.
- name: tenants
  description: 'Tenants: provisioning, questionnaire, usage counters.'
- name: periods
  description: Period records and recorded extensions.
- name: workspaces
  description: Sandbox workspaces and their pairing (§35.5).
- name: installation
  description: Installation-wide facts (licence status).
- name: tenancy
  description: Deprecated placeholder tag (INV-T-2849); dropped with the placeholder operation.
paths:
  /internal/v1/tenancy/entities:
    post:
      operationId: createEntity
      summary: Create a registered entity (SDS §31.2.4)
      description: Creates a business unit's registered-entity record under a group. Emits OrganisationStructureChanged.
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-G.1
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: tenant
        precondition: The containing group exists within the caller's tenant scope
        reversibility: UNDOABLE
        repeatKey: (tenantRef, groupRef, legalName) — a repeat while still DRAFT returns the original
          entity
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
            examples:
              default:
                value:
                  tenantRef: TEN-7B1004
                  groupRef: GRP-01
                  legalName: Acme Trading Pte Ltd
                  constitution: PRIVATE_LIMITED
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    legalName: Acme Trading Pte Ltd
                    lifecycleState: DRAFT
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/phase-assessments:
    post:
      operationId: assessPhase
      summary: Compute and record the entity's InvoiceNow implementation phase (SDS §31.2.4)
      description: Computes the implementation date from Box 4 figures and records its basis. Recomputable.
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AA.5
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: Box 4 figures are available for the entity
        reversibility: UNDOABLE
        repeatKey: entityRef — a repeat recomputes and overwrites the prior assessment
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessPhaseRequest'
            examples:
              default:
                value:
                  box4Figures: '1250000.00'
                  asOfDate: "2026-01-01"
      responses:
        "200":
          description: Phase recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseAssessmentResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    phase: PHASE_2
                    implementationDate: "2026-11-01"
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/certifications:
    post:
      operationId: certifySandbox
      summary: Record the certification acceptance-suite result (SDS §31.2.4, FR-AG.47)
      description: Records the outcome of the certification kit run through the public API (UI-F4).
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AG.13
      x-error-codes: []
      x-operation:
        role: integration.engineer
        scope: entity
        precondition: Configuration is complete
        reversibility: UNDOABLE
        repeatKey: (entityRef, suiteVersion) — repeatable, each run is its own record
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertifySandboxRequest'
            examples:
              default:
                value:
                  outcome: PASSED
                  suiteVersion: '2026.1'
      responses:
        "201":
          description: Certification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    outcome: PASSED
                    recordedAt: "2026-09-27T02:00:00Z"
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/go-live:
    post:
      operationId: goLive
      summary: Activate submission for the entity (SDS §31.2.4, FR-Q.16, FR-AC.7)
      description: 'The last reversible moment in onboarding (FR-AC.7): once documents transmit, IRAS
        holds them. Requires a second confirmation (FR-AF.8, carried in the request, not modelled here
        as a separate call).'
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AC.19
      - FR-Q.16
      - FR-AC.7
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: Coverage complete and certification passed (FR-Q.16 gate)
        reversibility: IRREVERSIBLE
        repeatKey: entity — no-op if already live (INV-REQ-1010)
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoLiveRequest'
            examples:
              default:
                value:
                  secondConfirmationBy: identity:USR-004
      responses:
        "200":
          description: 'Live (or already live: a no-op, FR-AC.19)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    legalName: Acme Trading Pte Ltd
                    lifecycleState: LIVE
        "422":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/suspend:
    post:
      operationId: suspendEntity
      summary: Stop submission for a live entity; ingestion continues (SDS §31.2.4)
      description: Stop submission for a live entity; ingestion continues (SDS §31.2.4).
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AC.7
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: Entity is LIVE
        reversibility: UNDOABLE
        repeatKey: entity — no-op if already suspended
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendEntityRequest'
            examples:
              default:
                value:
                  reason: Voluntary deregistration in progress
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    legalName: Acme Trading Pte Ltd
                    lifecycleState: SUSPENDED
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/deregister:
    post:
      operationId: deregisterEntity
      summary: Set the entity's registration end (SDS §31.2.4, FR-AB.9)
      description: Documents after the registration end fall out of scope. The offboarding checks of FR-AB.9
        are evaluated as this operation's own precondition.
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-X.5
      - FR-AB.9
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: GST registration has ended; the offboarding checks (FR-AB.9) pass
        reversibility: COMPENSABLE
        repeatKey: (entityRef, registrationEndDate) — effective-dated, a repeat with the same date is
          a no-op
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeregisterEntityRequest'
            examples:
              default:
                value:
                  registrationEndDate: "2026-12-31"
      responses:
        "200":
          description: Registration end recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    legalName: Acme Trading Pte Ltd
                    lifecycleState: DEREGISTERED
        "409":
          $ref: '#/components/responses/Error'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/tenants/{tenantRef}/questionnaire-answers:
    post:
      operationId: answerQuestionnaire
      summary: Record onboarding questionnaire answers and the recommended operating profile (SDS §7,
        SCR-40.1)
      description: Nothing is applied yet; the recommendation is surfaced with its reasons (PG-7, FR-AI.7,
        FR-AI.8).
      tags:
      - tenants
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AI.7
      - FR-AI.8
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: None
        reversibility: UNDOABLE
        repeatKey: (tenantRef, questionnaireVersion) — answer again to replace
      parameters:
      - name: tenantRef
        in: path
        required: true
        description: The tenant's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: TEN-7B1004
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireAnswersRequest'
            examples:
              default:
                value:
                  questionnaireVersion: '2026.1'
                  answers:
                    OQ-1: 'YES'
                    OQ-2: 'NO'
      responses:
        "201":
          description: Answers recorded with a recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireAnswersResponse'
              examples:
                default:
                  value:
                    tenantRef: TEN-7B1004
                    recommendedProfile: STANDARD
                    reasons:
                    - OQ-1=YES selects STANDARD
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/filing-frequency:
    post:
      operationId: changeFilingFrequency
      summary: Record an IRAS-approved filing-frequency change (SDS §7, SCR-16.3, FR-AA.6)
      description: Effective-dated; computes the transitional period. Emits FilingFrequencyChanged.
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-AA.6
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: IRAS has approved the new frequency
        reversibility: COMPENSABLE
        repeatKey: (entityRef, effectiveFrom) — an effective-dated reversal supersedes
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilingFrequencyChangeRequest'
            examples:
              default:
                value:
                  newFrequency: MONTHLY
                  effectiveFrom: "2026-10-01"
                  irasApprovalReference: IRAS-2026-441
      responses:
        "201":
          description: Change recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingFrequencyResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    frequency: MONTHLY
                    effectiveFrom: "2026-10-01"
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/periods:
    post:
      operationId: confirmPeriods
      summary: Confirm an irregular period with explicit dates (SDS §7, SCR-07.2)
      description: First, final or transitional period, proposed then confirmed with explicit dates.
      tags:
      - periods
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-7.12
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: An irregular period (first, final or transitional) is proposed
        reversibility: COMPENSABLE
        repeatKey: (entityRef, periodRef) — a superseding record replaces it
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPeriodRequest'
            examples:
              default:
                value:
                  periodRef: 2026Q1
                  periodStart: "2026-01-01"
                  periodEnd: "2026-03-31"
                  kind: FIRST
      responses:
        "201":
          description: Period record confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    periodRef: 2026Q1
                    periodStart: "2026-01-01"
                    periodEnd: "2026-03-31"
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listPeriodRecords
      summary: List an entity's period records with state and due date (INV-REQ-85, SCR-07)
      description: >-
        The filing calendar read (INV-REQ-85, FR-AG.15): the entity's past, current and next periods, each
        with its one state (precedence late, filed, due, open), its filing due date and the extension flag.
        A late period that has been filed also carries its filing date. console-bff renders the calendar
        from these records and the cross-entity portfolio view reads the same records.
      tags:
      - periods
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AG.15
      x-error-codes: []
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      responses:
        "200":
          description: Period records, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodRecordListResponse'
              examples:
                default:
                  value:
                    entityRef: ENT-3F2A9C
                    periods:
                    - periodRef: 2026Q1
                      periodStart: "2026-01-01"
                      periodEnd: "2026-03-31"
                      position: PAST
                      state: LATE
                      filingDueDate: "2026-04-30"
                      filedOn: "2026-05-06"
                      extensionGranted: false
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a sandbox workspace, paired with its production sibling (SDS §7, SCR-21.1, §35.5)
      description: A sibling tenant (SaaS) or namespace (private) with environment = SANDBOX.
      tags:
      - workspaces
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-D.9
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: The tenant's plan allows a workspace
        reversibility: UNDOABLE
        repeatKey: (tenantRef, name) — a repeat returns the original workspace
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            examples:
              default:
                value:
                  tenantRef: TEN-7B1004
                  name: pre-prod
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
              examples:
                default:
                  value:
                    workspaceRef: WS-AA10
                    tenantRef: TEN-7B1004
                    name: pre-prod
                    environment: SANDBOX
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/workspaces/{workspaceRef}:
    delete:
      operationId: archiveWorkspace
      summary: Archive a workspace (undoes createWorkspace, SDS §7, SCR-21.1)
      description: Archive a workspace (undoes createWorkspace, SDS §7, SCR-21.1).
      tags:
      - workspaces
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-D.10
      x-error-codes: []
      x-operation:
        role: tenant.admin
        scope: tenant
        precondition: Workspace exists
        reversibility: UNDOABLE
        repeatKey: workspaceRef — no-op if already archived
      parameters:
      - name: workspaceRef
        in: path
        required: true
        description: The workspace's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: WS-AA10
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "204":
          description: 'Archived (or already archived: a no-op)'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/tenancy/entities/{entityRef}/rate-source-elections:
    post:
      operationId: electRateSource
      summary: Elect the exchange-rate source and basis from a date (SDS §7, SCR-13.2)
      description: Elect the exchange-rate source and basis from a date (SDS §7, SCR-13.2).
      tags:
      - entities
      x-principal: filing-workflow
      x-sync-edge: console-bff->tenancy-svc
      x-timeout: 2000
      x-requirements:
      - FR-AC.1
      - FR-6.13
      x-error-codes: []
      x-operation:
        role: entity.admin
        scope: entity
        precondition: The source is approved in the scope pack (approved by tax.approver)
        reversibility: COMPENSABLE
        repeatKey: (entityRef, effectiveFrom) — effective-dated
      parameters:
      - name: entityRef
        in: path
        required: true
        description: The registered entity's opaque reference.
        schema:
          type: string
          maxLength: 64
        example: ENT-3F2A9C
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
