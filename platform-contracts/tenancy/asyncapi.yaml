asyncapi: 3.1.0
info:
  title: tenancy events
  version: 1.2.0
  description: >-
    Every event tenancy produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added tenancy's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: tenancy (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  tenancyOrganisationStructureChanged:
    address: 'gst.tenancy.organisation-structure-changed.v1'
    messages:
      OrganisationStructureChanged:
        $ref: '#/components/messages/OrganisationStructureChanged'

  tenancyEntityProfileChanged:
    address: 'gst.tenancy.entity-profile-changed.v1'
    messages:
      EntityProfileChanged:
        $ref: '#/components/messages/EntityProfileChanged'

  tenancyFilingFrequencyChanged:
    address: 'gst.tenancy.filing-frequency-changed.v1'
    messages:
      FilingFrequencyChanged:
        $ref: '#/components/messages/FilingFrequencyChanged'

  tenancyPeriodExtended:
    address: 'gst.tenancy.period-extended.v1'
    messages:
      PeriodExtended:
        $ref: '#/components/messages/PeriodExtended'

  tenancyPeriodDueDateChanged:
    address: 'gst.tenancy.period-due-date-changed.v1'
    messages:
      PeriodDueDateChanged:
        $ref: '#/components/messages/PeriodDueDateChanged'

  tenancyInstallationStatusChanged:
    address: 'gst.tenancy.installation-status-changed.v1'
    messages:
      InstallationStatusChanged:
        $ref: '#/components/messages/InstallationStatusChanged'
  tenancyExampleHappened:
    address: 'gst.tenancy.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishOrganisationStructureChanged:
    action: send
    description: OrganisationStructureChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyOrganisationStructureChanged'
    messages:
      - $ref: '#/channels/tenancyOrganisationStructureChanged/messages/OrganisationStructureChanged'

  publishEntityProfileChanged:
    action: send
    description: EntityProfileChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyEntityProfileChanged'
    messages:
      - $ref: '#/channels/tenancyEntityProfileChanged/messages/EntityProfileChanged'

  publishFilingFrequencyChanged:
    action: send
    description: FilingFrequencyChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyFilingFrequencyChanged'
    messages:
      - $ref: '#/channels/tenancyFilingFrequencyChanged/messages/FilingFrequencyChanged'

  publishPeriodExtended:
    action: send
    description: PeriodExtended — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyPeriodExtended'
    messages:
      - $ref: '#/channels/tenancyPeriodExtended/messages/PeriodExtended'

  publishPeriodDueDateChanged:
    action: send
    description: PeriodDueDateChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyPeriodDueDateChanged'
    messages:
      - $ref: '#/channels/tenancyPeriodDueDateChanged/messages/PeriodDueDateChanged'

  publishInstallationStatusChanged:
    action: send
    description: InstallationStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/tenancyInstallationStatusChanged'
    messages:
      - $ref: '#/channels/tenancyInstallationStatusChanged/messages/InstallationStatusChanged'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/tenancyExampleHappened'
    messages:
      - $ref: '#/channels/tenancyExampleHappened/messages/ExampleHappened'
components:
  messages:
    OrganisationStructureChanged:
      name: com.dynokore.gst.tenancy.OrganisationStructureChanged.v1
      title: OrganisationStructureChanged
      summary: OrganisationStructureChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event OrganisationStructureChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: tenancy-svc. Consumed by: access-svc, aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, transport-svc. Delivery: At-least-once. Payload (catalogue text): tenant, group, entity or
        business unit created, moved or retired. Authored by INV-T-2853 (T9). INV-T-3298
        (INV-API-3327, INV-Q-3324 (a), INV-Q-3337 (a)) adds, additively, the node's full state
        after the change with its structureVersion, and changeType UPDATED (a rename, code change
        or other attribute change of a business unit, group or tenant; INV-AC-2186), changeType now
        being an extensible enum. Every service's structure replica is fed from this topic
        (INV-REQ-1200, INV-ADR-284). tenancy-svc, the source, does not subscribe: it owns the structure (INV-Q-8996).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/organisation-structure-changed-payload.schema.json'

    EntityProfileChanged:
      name: com.dynokore.gst.tenancy.EntityProfileChanged.v1
      title: EntityProfileChanged
      summary: EntityProfileChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event EntityProfileChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: tenancy-svc. Consumed by: access-svc, aggregation-svc, canonical-svc, console-bff, control-plane-svc, evidence-svc, ingestion-svc, masterdata-svc, notification-svc, payload-svc, reconciliation-svc, rules-svc, submission-svc, transport-svc. Delivery: At-least-once. Payload (catalogue text): entityRef, changed
        attributes, effective date. Authored by INV-T-2853 (T9). INV-T-3298 (INV-API-3327,
        INV-Q-3324 (a)) adds, additively, the node's full state after the change, its profile as
        effective-dated attribute entries, with its structureVersion (one sequence shared with
        OrganisationStructureChanged). Every service's structure replica is fed from this topic
        (INV-REQ-1200, INV-ADR-284). tenancy-svc, the source, does not subscribe: it owns the structure (INV-Q-8996).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/entity-profile-changed-payload.schema.json'

    FilingFrequencyChanged:
      name: com.dynokore.gst.tenancy.FilingFrequencyChanged.v1
      title: FilingFrequencyChanged
      summary: FilingFrequencyChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event FilingFrequencyChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: tenancy-svc. Consumed by: canonical-svc. Delivery:
        At-least-once. Payload (catalogue text): entityRef, old and new frequency, affected span. Authored
        by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/filing-frequency-changed-payload.schema.json'

    PeriodExtended:
      name: com.dynokore.gst.tenancy.PeriodExtended.v1
      title: PeriodExtended
      summary: PeriodExtended — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PeriodExtended (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: tenancy-svc. Consumed by: console-bff, submission-svc. Delivery:
        At-least-once. Payload (catalogue text): entityRef, period, target (filing due date, submission due
        date or both), new absolute dates, scope (period, or a document set or date range), IRAS reference.
        Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/period-extended-payload.schema.json'

    PeriodDueDateChanged:
      name: com.dynokore.gst.tenancy.PeriodDueDateChanged.v1
      title: PeriodDueDateChanged
      summary: PeriodDueDateChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event PeriodDueDateChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: tenancy-svc. Consumed by: console-bff, submission-svc.
        Delivery: At-least-once. Payload (catalogue text): entityRef, period, old and new filing due date,
        cause (calendar pack and version, or VP-62 change and effective date). Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/period-due-date-changed-payload.schema.json'

    InstallationStatusChanged:
      name: com.dynokore.gst.tenancy.InstallationStatusChanged.v1
      title: InstallationStatusChanged
      summary: InstallationStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event InstallationStatusChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: tenancy-svc. Consumed by: console-bff, notification-svc,
        submission-svc. Delivery: At-least-once. Payload (catalogue text): entityRef or the installation,
        DEP code (DEP-004 to DEP-006), raised or cleared, cause. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/installation-status-changed-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.tenancy.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
