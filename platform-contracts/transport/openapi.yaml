openapi: 3.1.0
info:
  title: transport API
  version: 1.0.0
  description: >-
    Contract-first source of truth for transport (API-01, STK-44). The
    `transport-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07). Replaces the INV-T-2849 scaffold
    (INV-T-2901, T13b).


    Public and internal APIs (API standard §1 and §15). `receiveApNotification`
    is the one resource the §15 catalogue lists for transport-svc
    (`POST /v1/ap/{adapterId}/notifications`, principal `ap-callback`,
    §33.6). `submitPayload` and `sendNetworkDocument` are `/internal/v1/…`,
    serving the synchronous edge of model/architecture/sync-edges.yaml
    (`submission-svc -> transport-svc`, "needs the outcome to advance
    state").


    invoice-docs commit 15e0e94 (2026-09-27) gave services.yaml's
    transport-svc entry a console-bff surface — "AP adapter administration
    (failover, credential rotation, connection test) to console-bff
    (INV-NOTE-7 §7; added 27 Sep 2026)" — and added the
    `console-bff -> transport-svc` sync-edge (kind `console`), closing the
    gap this file previously flagged. `rotateCredential` and `testConnection`
    below are `/internal/v1/…` operations on that edge, with role,
    precondition, reversibility and repeat key exactly as INV-NOTE-7 §7's
    "Operations introduced" table states them for `transport-svc`.
    `failoverAdapter`, the third operation §7's own commit message names, is
    NOT in that table (checked directly: absent from every `transport-svc` /
    `masterdata-svc` row of §7). It appears only in §3's screen inventory
    (SCR-18.4, SCR-39.3), both of which point its full definition to the
    original design catalogue, SDS §31.2.6 — archived, out of bounds for a
    coding agent (coder brief). Left out of this file rather than invented;
    flagged for the coordinator in this MR. Neither new operation has a
    matching code in the vendored gst-catalogue (`catalogue/errors/error-codes.yaml`
    has no transport-admin prefix); `x-error-codes: []` below, also flagged
    as a catalogue gap in the MR rather than invented.
  contact:
    name: transport (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway routes only the operations of a published train (API-26) for receiveApNotification; the other four are never routed (API-01 scope table).
tags:
  - name: despatch
    description: Submission to IRAS through the AP, and Relay-mode network issuance (§33.1).
  - name: notifications
    description: Inbound AP acknowledgements, delivery status and network documents (§33.6).
  - name: administration
    description: >-
      AP adapter administration to console-bff — credential rotation and
      connection test (services.yaml transport-svc `provides`;
      sync-edges.yaml `console-bff -> transport-svc`, kind console;
      INV-NOTE-7 §7).
paths:
  /internal/v1/transport/payloads:
    post:
      operationId: submitPayload
      summary: Submit a payload for a Doc UUID and version to IRAS through the AP
      description: >-
        The submit API to submission-svc (services.yaml transport-svc
        `provides`; sync-edges.yaml `submission-svc -> transport-svc`).
        The internal transport interface expresses only: submit a payload
        for a Doc UUID and version, and return accepted with acknowledgement,
        rejected with reasons, or transient failure (FR-E.1); everything
        AP-specific sits behind it, including which of the (at most two
        concurrent, FR-E.2) adapters is used. transport-svc never decides
        which document to send, when, or under which Doc UUID
        (transport-svc `must_not`) — that is submission-svc's. Every
        transmission to a third party is irreversible (§31.3, FR-AC.9).
      tags: [despatch]
      x-principal: filing-workflow
      x-timeout: 30000
      x-sync-edge: submission-svc->transport-svc
      x-error-codes: [SUB-001, SUB-002, SUB-003]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-E.1, FR-E.2, FR-E.4]
      x-operation:
        role: filing-workflow
        scope: entity
        precondition: "The payload is built and validated for this Doc UUID and version (submission-svc's own precondition)."
        reversibility: IRREVERSIBLE
        repeatKey: "(docUuid, version) — a repeat returns the original transport outcome."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPayloadRequest'
            examples:
              default:
                value:
                  docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  version: 1
                  adapterRef: "AP-PRIMARY"
                  payloadRef: "PAY-9001"
      responses:
        '202':
          description: The transport outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportOutcome'
              examples:
                default:
                  value: { docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6", version: 1, outcome: "ACCEPTED" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/transport/network-documents:
    post:
      operationId: sendNetworkDocument
      summary: Send a Relay-mode Type 1A document directly on the Peppol network
      description: >-
        The send API to submission-svc (services.yaml transport-svc
        `provides`; sync-edges.yaml `submission-svc -> transport-svc`,
        §33.1). Relay-mode Type 1A network issuance, distinct from
        `submitPayload`'s AP-mediated filing despatch. Irreversible: once
        sent, the network document is at the counterparty and cannot be
        recalled (§31.3, FR-AC.9).
      tags: [despatch]
      x-principal: filing-workflow
      x-timeout: 30000
      x-sync-edge: submission-svc->transport-svc
      x-error-codes: [SUB-001, SUB-002, SUB-003]
      x-requirements: [INV-REQ-957, INV-REQ-1010, "§33.1"]
      x-operation:
        role: filing-workflow
        scope: entity
        precondition: "The document's issuanceMode is RELAY and it is Type 1A."
        reversibility: IRREVERSIBLE
        repeatKey: "(docUuid, version) — a repeat returns the original transport outcome."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNetworkDocumentRequest'
            examples:
              default:
                value:
                  docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  version: 1
                  adapterRef: "AP-PRIMARY"
                  peppolRecipientId: "0195:201954321B"
      responses:
        '202':
          description: The transport outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportOutcome'
              examples:
                default:
                  value: { docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6", version: 1, outcome: "ACCEPTED" }
        default:
          $ref: '#/components/responses/Error'
  /v1/ap/{adapterId}/notifications:
    post:
      operationId: receiveApNotification
      summary: Receive an AP notification — acknowledgement, delivery status or inbound network document
      description: >-
        The notification endpoint, through the gateway, to `ap-callback`
        principals (services.yaml transport-svc `provides`; resource
        catalogue §15, §33.6). Also polled where the AP offers only
        polling, using the same shape. Idempotent on the AP's own
        notification ID (API-15, API-27); recorded in the notification
        de-duplication ledger before `AcknowledgementReceived` or
        `NetworkDocumentReceived` is emitted. transport-svc never interprets
        the content of an inbound document (transport-svc `must_not`).
      tags: [notifications]
      x-principal: ap-callback
      x-timeout: 5000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, "§33.6"]
      x-operation:
        role: ap-callback
        scope: entity
        precondition: "The AP notification ID has not already been recorded (API-15, API-27)."
        reversibility: IRREVERSIBLE
        repeatKey: "The AP notification ID — a repeat returns the original recorded outcome (API-15, API-27)."
      parameters:
        - name: adapterId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApNotification'
            examples:
              default:
                value:
                  apNotificationId: "APN-55210"
                  kind: "ACKNOWLEDGEMENT"
                  docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  version: 1
      responses:
        '200':
          description: Recorded (or already recorded — a no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApNotificationResult'
              examples:
                default:
                  value: { apNotificationId: "APN-55210", recorded: true }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/transport/adapters/{adapterRef}/credential-rotations:
    post:
      operationId: rotateCredential
      summary: Rotate an AP adapter's credential, with an overlap window
      description: >-
        Console command to console-bff (services.yaml transport-svc
        `provides`; sync-edges.yaml `console-bff -> transport-svc`, kind
        console; INV-NOTE-7 §7 "Operations introduced", joint
        `transport-svc`/`masterdata-svc` row). The replacement credential is
        already held in the vault (SCR-18.3); this operation starts the
        overlap window, after which the old credential is refused. Never
        the credential material itself in the schema — only its vault
        reference (services.yaml transport-svc `owns`: "Credentials live in
        the vault, never in the schema").
      tags: [administration]
      x-principal: filing-workflow
      x-timeout: 5000
      x-sync-edge: console-bff->transport-svc
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, "INV-NOTE-7 §7"]
      x-operation:
        role: "tenant.admin, platform.engineer"
        scope: entity
        precondition: "A replacement credential is already held (in the vault) for this adapter (INV-NOTE-7 §7)."
        reversibility: COMPENSABLE
        repeatKey: "(adapterRef, credentialId) — a repeat returns the original rotation outcome; the same credential id is not rotated in twice (INV-NOTE-7 §7)."
      parameters:
        - name: adapterRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateCredentialRequest'
            examples:
              default:
                value:
                  credentialId: "VAULT-CRED-2214"
      responses:
        '200':
          description: The adapter's credential state after starting the rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRotationResult'
              examples:
                default:
                  value: { adapterRef: "AP-PRIMARY", credentialId: "VAULT-CRED-2214", overlapActive: true, rotatedAt: "2026-09-27T03:15:00Z" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/transport/adapters/{adapterRef}/connection-tests:
    post:
      operationId: testConnection
      summary: Test an AP adapter's connection
      description: >-
        Console command to console-bff (services.yaml transport-svc
        `provides`; sync-edges.yaml `console-bff -> transport-svc`, kind
        console; INV-NOTE-7 §7 "Operations introduced", joint
        `transport-svc`/`masterdata-svc` row; SCR-18.2). Result only;
        publishes `ConnectionStatusChanged` (already the shared
        `service-runtime` platform-event payload, INV-T-2855/T11 —
        out of this file's scope) only where the result differs from the
        adapter's stored status (INV-NOTE-7 §7).
      tags: [administration]
      x-principal: filing-workflow
      x-timeout: 5000
      x-sync-edge: console-bff->transport-svc
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, "INV-NOTE-7 §7"]
      x-operation:
        role: "integration.engineer, deployment.operator"
        scope: entity
        precondition: "The adapter is configured (INV-NOTE-7 §7)."
        reversibility: UNDOABLE
        repeatKey: "None — a read; a repeat returns the current result and persists nothing beyond the status it already stores (INV-NOTE-7 §7: Idempotency key \"—\")."
      parameters:
        - name: adapterRef
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
              examples:
                default:
                  value: { adapterRef: "AP-PRIMARY", state: "UP", checkedAt: "2026-09-27T03:15:00Z" }
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    SubmitPayloadRequest:
      type: object
      properties:
        docUuid: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        adapterRef: { type: string, maxLength: 40 }
        payloadRef: { type: string, maxLength: 100 }
      required: [docUuid, version, adapterRef, payloadRef]
    SendNetworkDocumentRequest:
      type: object
      properties:
        docUuid: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        adapterRef: { type: string, maxLength: 40 }
        peppolRecipientId: { type: string, maxLength: 64 }
      required: [docUuid, version, adapterRef, peppolRecipientId]
    TransportOutcome:
      type: object
      properties:
        docUuid: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        outcome:
          type: string
          enum: [ACCEPTED, REJECTED, TRANSIENT_FAILURE]
          x-extensible-enum: true
        reasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string, pattern: '^[A-Z]{2,10}-[0-9]{3}$' }
              field: { type: string }
              message: { type: string }
            required: [code, message]
      required: [docUuid, version, outcome]
    ApNotification:
      type: object
      properties:
        apNotificationId: { type: string, maxLength: 100 }
        kind:
          type: string
          enum: [ACKNOWLEDGEMENT, DELIVERY_STATUS, INBOUND_NETWORK_DOCUMENT]
          x-extensible-enum: true
        docUuid: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        peppolMessageId: { type: string, maxLength: 100 }
        documentReference: { type: string, maxLength: 256 }
      required: [apNotificationId, kind]
    ApNotificationResult:
      type: object
      properties:
        apNotificationId: { type: string, maxLength: 100 }
        recorded: { type: boolean }
      required: [apNotificationId, recorded]
    RotateCredentialRequest:
      type: object
      description: >-
        The replacement credential is already held in the vault (INV-NOTE-7
        §7 precondition); this carries only its vault reference, never the
        credential material (services.yaml transport-svc `owns`).
      properties:
        credentialId: { type: string, maxLength: 100 }
      required: [credentialId]
    CredentialRotationResult:
      type: object
      properties:
        adapterRef: { type: string, maxLength: 40 }
        credentialId: { type: string, maxLength: 100 }
        overlapActive:
          type: boolean
          description: 'true during the overlap window; false once the old credential is refused (INV-NOTE-7 §7).'
        rotatedAt: { type: string, format: date-time }
      required: [adapterRef, credentialId, overlapActive]
    ConnectionTestResult:
      type: object
      properties:
        adapterRef: { type: string, maxLength: 40 }
        state:
          type: string
          description: 'Connection health state (this producer''s own vocabulary, service-runtime ConnectionStatusChangedPayload).'
          enum: [UP, DOWN, DEGRADED]
          x-extensible-enum: true
        checkedAt: { type: string, format: date-time }
      required: [adapterRef, state]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
