asyncapi: 3.1.0
info:
  title: transport events
  version: 1.0.0
  description: >-
    Every event transport produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added transport's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: transport (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  transportAcknowledgementReceived:
    address: 'gst.transport.acknowledgement-received.v1'
    messages:
      AcknowledgementReceived:
        $ref: '#/components/messages/AcknowledgementReceived'

  transportNetworkDocumentReceived:
    address: 'gst.transport.network-document-received.v1'
    messages:
      NetworkDocumentReceived:
        $ref: '#/components/messages/NetworkDocumentReceived'

  transportConnectionStatusChanged:
    address: 'gst.transport.connection-status-changed.v1'
    messages:
      ConnectionStatusChanged:
        $ref: '#/components/messages/ConnectionStatusChanged'
  transportExampleHappened:
    address: 'gst.transport.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishAcknowledgementReceived:
    action: send
    description: AcknowledgementReceived — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/transportAcknowledgementReceived'
    messages:
      - $ref: '#/channels/transportAcknowledgementReceived/messages/AcknowledgementReceived'

  publishNetworkDocumentReceived:
    action: send
    description: NetworkDocumentReceived — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/transportNetworkDocumentReceived'
    messages:
      - $ref: '#/channels/transportNetworkDocumentReceived/messages/NetworkDocumentReceived'

  publishConnectionStatusChanged:
    action: send
    description: ConnectionStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/transportConnectionStatusChanged'
    messages:
      - $ref: '#/channels/transportConnectionStatusChanged/messages/ConnectionStatusChanged'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/transportExampleHappened'
    messages:
      - $ref: '#/channels/transportExampleHappened/messages/ExampleHappened'
components:
  messages:
    AcknowledgementReceived:
      name: com.dynokore.gst.transport.AcknowledgementReceived.v1
      title: AcknowledgementReceived
      summary: AcknowledgementReceived — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AcknowledgementReceived (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: transport-svc. Consumed by: submission-svc. Delivery:
        At-least-once. Payload (catalogue text): adapter, AP notification ID, docUuid, version,
        acknowledgementId. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/acknowledgement-received-payload.schema.json'

    NetworkDocumentReceived:
      name: com.dynokore.gst.transport.NetworkDocumentReceived.v1
      title: NetworkDocumentReceived
      summary: NetworkDocumentReceived — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event NetworkDocumentReceived (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: transport-svc. Consumed by: ingestion-svc. Delivery:
        At-least-once. Payload (catalogue text): adapter, peppolMessageId, supplierDocUuid, document
        reference. Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/network-document-received-payload.schema.json'

    ConnectionStatusChanged:
      name: com.dynokore.gst.platform.ConnectionStatusChanged.v1
      title: ConnectionStatusChanged
      summary: ConnectionStatusChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ConnectionStatusChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: platform). Emitted by: access-svc, evidence-svc, ingestion-svc, masterdata-svc,
        notification-svc, rules-svc, tenancy-svc, transport-svc. Consumed by: console-bff, notification-svc.
        Delivery: At-least-once — platform event (AD-27). Payload (catalogue text): connection, state, last
        failure. This is a platform event (class: platform, AD-27/AD-24 convention: type uses the shared
        `com.dynokore.gst.platform.<EventName>.v1` name so every producer's instances are one consumer
        subscription). Per invoice-docs standards/02-layered-architecture.md's table ("A new platform event
        ... service-runtime owns the schema"), this payload schema's canonical home is
        `service-runtime/schemas/`; service-runtime/ is outside INV-T-2853's declared scope (only the
        producer's own asyncapi.yaml/schemas/ directories), so this producer carries its own copy for now,
        byte-identical to every other producer's copy of the same event — named as a follow-up in the merge
        request, not silently left unaddressed (AGT-24). Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/connection-status-changed-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.transport.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
