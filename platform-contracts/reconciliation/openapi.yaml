openapi: 3.1.0
info:
  title: reconciliation API
  version: 1.1.0
  description: >-
    Contract-first source of truth for reconciliation (API-01, STK-44). The
    `reconciliation-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Public and internal APIs (API standard §1 and §15): reconciliation-svc
    has no synchronous callee edge in model/architecture/sync-edges.yaml —
    it builds its read model from events alone (`consumes`; FR-K.10,
    FR-Z.16) and never queries canonical-svc or submission-svc directly
    (`must_not`). The two public operations below are `/v1/…`, routed by
    the gateway to `filing-workflow` (return upload) and `reporting`
    (reconciliation data) principals, per 04-api-standards.md §15. The
    run and work-paper queries are `/internal/v1/…`, reached only by
    console-bff, covered by sync-edges.yaml's generic `console-bff -> any`
    policy edge ("console reads", INV-T-2902, T14b).


    Scope note for the reviewer: services.yaml's reconciliation-svc
    `provides` text maps to this file's operations as follows — "Return
    upload, through the gateway, to filing-workflow principals and to
    console-bff" is `uploadGstReturn`; "Run … queries" is `listRuns` /
    `getRun`; "work-paper queries" is `getWorkPaper`. The public
    reconciliation-data query of 04-api-standards.md §15
    (`GET /v1/entities/{entityRef}/periods/{periodRef}/reconciliation`) is
    `getReconciliation`, the capabilities-list item "Reconciliation data for
    the reporting principal", distinct from the internal run/work-paper
    queries. Variance annotation (FR-9.8) and work-paper attestation
    (INV-REQ-947, "reconciliation-svc builds, attests and owns the
    work-paper") are real write operations, not read-only fields of
    `getWorkPaper`'s response: `annotateVariance` (INV-NOTE-7 §7 SCR-10.3)
    and `attestWorkPaper` (SCR-10.4), reconciliation-svc's own `provides`
    capability. PDF/spreadsheet export (FR-Q.11) is left as a read field of
    `getWorkPaper`; no separate export operation is catalogued for it. No
    catalogue error code exists yet under a REC- prefix
    (model/architecture/error-codes.yaml has no such prefix) — every
    operation below declares `x-error-codes: []`; also flagged as an
    architecture gap.
  contact:
    name: reconciliation (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway routes only the operations of a published train (API-26).
tags:
  - name: returns
    description: Filed-return intake and versioning (§33.10, FR-9.16).
  - name: reconciliation
    description: Box comparison, variance classification and the unexplained residual (FR-9.5–9.8).
  - name: runs
    description: Reconciliation runs and their work-papers (FR-Q.9, FR-Q.11).
paths:
  /v1/entities/{entityRef}/periods/{periodRef}/gst-return:
    put:
      operationId: uploadGstReturn
      summary: Upload a filed GST return for Box reconciliation, creating a new version
      description: >-
        Filed-return intake and versioning (services.yaml reconciliation-svc
        `provides`, "Return upload"; §33.10, FR-9.16, INV-REQ-651). Received
        with its form, Box figures and filing date for Box reconciliation
        and the actual filing date. A higher version supersedes; the
        version is never updated in place (FR-D.2's same "new version, not
        in place" pattern applied here).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries the
        same PUT of the same version, the operation's repeatKey
        (INV-REQ-1204 b7, INV-Q-3571).


        The filing acknowledgement and `filedAt` are required from every
        caller (INV-REQ-653 behavior 2). The schema keeps
        `filingAcknowledgement` optional only so that a 1.0 client
        validates; an upload without it is refused with `422` and PER-014
        and nothing is recorded (INV-AC-1715). Each accepted upload is a new
        immutable version, and an F7 supersedes, for reconciliation, the F5
        named by `amends` (INV-REQ-653, INV-REQ-655).
      tags: [returns]
      x-principal: filing-workflow
      x-timeout: 3000
      x-error-codes: [PER-014]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-651, INV-REQ-653, INV-REQ-655]
      x-operation:
        role: filing-workflow
        scope: entity+period
        precondition: >-
          The uploaded version is not lower than any version already
          recorded for this (entityRef, periodRef); checked against recorded
          state, never against screen context.
        reversibility: COMPENSABLE
        repeatKey: "(entityRef, periodRef, version) — a repeat of the same version returns the original result, unchanged."
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadGstReturnRequest'
            examples:
              default:
                value:
                  version: 1
                  formType: "F5"
                  filedAt: "2026-04-28T09:00:00Z"
                  filingAcknowledgement: "IRAS-ACK-2026-0001"
                  preparer: "Jane Tan"
                  boxes:
                    - box: "1"
                      description: "Total value of standard-rated supplies"
                      amount: "500000.00"
                    - box: "6"
                      description: "Output tax due"
                      amount: "45000.00"
      responses:
        '201':
          description: The filed return was recorded as a new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstReturnRecord'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    version: 1
                    form: "F5"
                    formType: "F5"
                    filedAt: "2026-04-28T09:00:00Z"
                    filingReference: "IRAS-REF-0001"
                    preparer: "Jane Tan"
                    recordedAt: "2026-04-28T09:05:00Z"
        '200':
          description: Idempotent replay of the same version — the original result, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GstReturnRecord'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    version: 1
                    form: "F5"
                    formType: "F5"
                    filedAt: "2026-04-28T09:00:00Z"
                    filingReference: "IRAS-REF-0001"
                    preparer: "Jane Tan"
                    recordedAt: "2026-04-28T09:05:00Z"
        '422':
          description: The upload carries no filing acknowledgement (PER-014); nothing is recorded.
          content:
            application/problem+json:
              schema:
                $ref: '../service-runtime/schemas/error-envelope.schema.json'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/reconciliation:
    get:
      operationId: getReconciliation
      summary: Read the Box-by-Box reconciliation of submitted data against the filed return
      description: >-
        Reconciliation data for the reporting principal (services.yaml
        reconciliation-svc capabilities; 04-api-standards.md §15). Box
        comparison under the return-mapping pack, variance classification
        against the taxonomy, and the unexplained residual (FR-9.5–9.7).
        Classified variances are shown as expected and resolved, never as
        outstanding issues (FR-Q.10).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).


        A period with no uploaded return answers `200` with an empty
        `boxes`, `unexplainedResidual` "0.00" and `reasons` holding PER-008;
        no Box is ever compared against zero (INV-REQ-657, INV-AC-669). A
        new return version triggers a new run without a request, and earlier
        runs and their work-papers remain immutable (INV-REQ-656,
        INV-AC-668); `returnVersion` and `returnForm` name the return the
        reconciliation is against.
      tags: [reconciliation]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: [PER-008]
      x-requirements: [INV-REQ-631, INV-REQ-632, INV-REQ-633, INV-REQ-981, INV-REQ-656, INV-REQ-657]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '200':
          description: The period's Box-by-Box reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    boxes:
                      - box: "6"
                        submittedAmount: "44950.00"
                        filedAmount: "45000.00"
                        variance: "50.00"
                        varianceClass: "TIMING_DIFFERENCE"
                    unexplainedResidual: "0.00"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/entities/{entityRef}/periods/{periodRef}/runs:
    get:
      operationId: listRuns
      summary: List reconciliation runs for a period
      description: >-
        Run queries (services.yaml reconciliation-svc `provides`, "Run …
        queries"). Cursor pagination (API-18); no offset and no total count.
      tags: [runs]
      x-principal: reporting
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: []
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of reconciliation runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
              examples:
                default:
                  value:
                    items:
                      - runId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "E-001"
                        periodRef: "2026-Q1"
                        completedAt: "2026-04-28T09:10:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/runs/{runId}:
    get:
      operationId: getRun
      summary: Read one reconciliation run
      description: Run queries (services.yaml reconciliation-svc `provides`, "Run … queries").
      tags: [runs]
      x-principal: reporting
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The reconciliation run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                default:
                  value:
                    runId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    completedAt: "2026-04-28T09:10:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/runs/{runId}/work-paper:
    get:
      operationId: getWorkPaper
      summary: Read a reconciliation run's work-paper
      description: >-
        Work-paper queries (services.yaml reconciliation-svc `provides`,
        "work-paper queries"). Structured as an audit work-paper: header,
        Box comparison, classified variances, unexplained residual and
        attestation (INV-REQ-947), with the supporting document list intact
        (FR-Q.11).
      tags: [runs]
      x-principal: reporting
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-947, INV-REQ-982, INV-REQ-634]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's work-paper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPaper'
              examples:
                default:
                  value:
                    runId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    header:
                      entityRef: "E-001"
                      periodRef: "2026-Q1"
                      preparedAt: "2026-04-28T09:10:00Z"
                    boxes:
                      - box: "6"
                        submittedAmount: "44950.00"
                        filedAmount: "45000.00"
                        variance: "50.00"
                        varianceClass: "TIMING_DIFFERENCE"
                    unexplainedResidual: "0.00"
                    supportingDocuments: ["s3://reconciliation/E-001/2026-Q1/schedule.pdf"]
                    attestation:
                      attestedBy: "tax.approver:jane.tan"
                      attestedAt: "2026-04-28T09:30:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/runs/{runId}/work-paper/export:
    get:
      operationId: exportWorkPaper
      summary: Export a reconciliation run's work-paper to PDF or spreadsheet
      description: >-
        Work-paper export (INV-REQ-982, INV-REQ-634, INV-AC-680): produces
        the PDF or the spreadsheet from an existing reconciliation run. It is
        a read and is audit-logged. Both formats keep the supporting document
        list of each variance, itemise each reconciling item per Box with its
        evidence references, list every relaxed control for the period and
        name the return version the run reconciles to. `auditor` may call it
        as `tax.approver` does. `getWorkPaper` keeps its shape.
      tags: [runs]
      x-principal: reporting
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-982, INV-REQ-634]
      x-operation:
        role: tax.approver
        scope: entity
        reversibility: UNDOABLE
        repeatKey: "(runId, format) — a repeat returns the same export of the same run."
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [PDF, SPREADSHEET]
            x-extensible-enum: true
      responses:
        '200':
          description: The exported work-paper.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/runs/{runId}/boxes/{box}/annotation:
    put:
      operationId: annotateVariance
      summary: Annotate a Box variance with supporting references
      description: >-
        Variance annotation (services.yaml reconciliation-svc `provides`,
        "work-paper queries" capability; INV-NOTE-7 §7 SCR-10.3, FR-9.8).
        Undoable until the run is attested, after which the work-paper is
        immutable and a further correction requires a new run.
      tags: [reconciliation]
      x-principal: filing-workflow
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010]
      x-operation:
        role: tax.approver
        scope: entity+period
        precondition: "The reconciliation run exists and is not yet attested."
        reversibility: UNDOABLE
        repeatKey: "(runId, box) — a repeat with the same body returns the existing annotation, unchanged."
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: box
          in: path
          required: true
          schema:
            type: string
            maxLength: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotateVarianceRequest'
            examples:
              default:
                value:
                  varianceClass: "TIMING_DIFFERENCE"
                  references: ["s3://reconciliation/E-001/2026-Q1/schedule.pdf"]
      responses:
        '200':
          description: The variance annotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VarianceAnnotation'
              examples:
                default:
                  value:
                    runId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    box: "6"
                    varianceClass: "TIMING_DIFFERENCE"
                    references: ["s3://reconciliation/E-001/2026-Q1/schedule.pdf"]
                    annotatedAt: "2026-04-28T09:20:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/reconciliation/runs/{runId}/attestation:
    post:
      operationId: attestWorkPaper
      summary: Attest a reconciliation run's work-paper as preparer and approver
      description: >-
        Work-paper attestation (services.yaml reconciliation-svc `provides`,
        "work-paper queries" capability; INV-REQ-947, INV-NOTE-7 §7
        SCR-10.4). Preparer and approver attestation, or one person with
        acknowledgement where VP-40 allows.
      tags: [runs]
      x-principal: filing-workflow
      x-sync-edge: console-bff->reconciliation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-947, INV-REQ-957, INV-REQ-1010]
      x-operation:
        role: tax.approver
        scope: entity+period
        precondition: "Every variance in the run is classified or annotated."
        reversibility: COMPENSABLE
        repeatKey: "runId — a new run and attestation supersede a repeat; the same run's attestation is returned unchanged."
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestWorkPaperRequest'
            examples:
              default:
                value:
                  soleAttesterAcknowledgement: false
      responses:
        '200':
          description: The run's attestation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attestation'
              examples:
                default:
                  value:
                    attestedBy: "tax.approver:jane.tan"
                    attestedAt: "2026-04-28T09:30:00Z"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    PeriodRef:
      name: periodRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
        description: Opaque, calendar-issued (API-11); clients never construct it.
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    GstReturnBox:
      type: object
      properties:
        box:
          type: string
          maxLength: 10
        description:
          type: string
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string, decimal(19,2) (API-12).
      required: [box, amount]
    UploadGstReturnRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        form:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
        formType:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
          description: The return form; exactly one of `form` and `formType` is present (INV-REQ-653).
        filedAt:
          type: string
          format: date-time
        filingAcknowledgement:
          type: string
          maxLength: 128
          description: The IRAS filing acknowledgement; required from every caller (PER-014 when missing), optional in the schema only so a 1.0 client validates.
        filingReference:
          type: string
          maxLength: 64
          description: The IRAS filing reference, where shown.
        preparer:
          type: string
          maxLength: 100
        amends:
          type: integer
          minimum: 1
          description: The version of the return an F7 amends.
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/GstReturnBox'
      required: [version, filedAt, boxes]
      oneOf:
        - required: [form]
        - required: [formType]
    GstReturnRecord:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        version:
          type: integer
        form:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
        formType:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
        filedAt:
          type: string
          format: date-time
        filingReference:
          type: string
          maxLength: 64
        preparer:
          type: string
          maxLength: 100
        amends:
          type: integer
          minimum: 1
        recordedAt:
          type: string
          format: date-time
      required: [entityRef, periodRef, version, form, filedAt, recordedAt]
    BoxComparison:
      type: object
      properties:
        box:
          type: string
        submittedAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        filedAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        variance:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        varianceClass:
          type: string
          maxLength: 60
          description: A first-class category of amendment-taxonomy.yaml's variance classification, or UNEXPLAINED.
      required: [box, submittedAmount, filedAmount, variance]
    Reconciliation:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/BoxComparison'
        unexplainedResidual:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        returnVersion:
          type: integer
          minimum: 1
          description: The return version this reconciliation reconciles to. A new return version triggers a new run without a request; earlier runs and their work-papers remain immutable (INV-REQ-656, INV-AC-668).
        returnForm:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
        reasons:
          type: array
          description: Why no Box comparison is produced; PER-008 for a period with no uploaded return (INV-REQ-657, INV-AC-669).
          items:
            $ref: '#/components/schemas/ReconciliationReason'
      required: [entityRef, periodRef, boxes, unexplainedResidual]
    ReconciliationReason:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
      required: [code, message]
    Run:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        entityRef:
          type: string
        periodRef:
          type: string
        completedAt:
          type: string
          format: date-time
        returnVersion:
          type: integer
          minimum: 1
          description: The return version this run reconciles to. A new return version triggers a new run without a request; earlier runs and their work-papers remain immutable (INV-REQ-656, INV-AC-668).
        returnForm:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
      required: [runId, entityRef, periodRef, completedAt]
    RunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        nextCursor:
          type: string
      required: [items]
    WorkPaperHeader:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        preparedAt:
          type: string
          format: date-time
        returnVersion:
          type: integer
          minimum: 1
          description: The return version this work-paper reconciles to. A new return version triggers a new run without a request; earlier runs and their work-papers remain immutable (INV-REQ-656, INV-AC-668).
        returnForm:
          type: string
          enum: [F5, F7, F8]
          x-extensible-enum: true
      required: [entityRef, periodRef, preparedAt]
    Attestation:
      type: object
      properties:
        attestedBy:
          type: string
        attestedAt:
          type: string
          format: date-time
      required: [attestedBy, attestedAt]
    WorkPaper:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        header:
          $ref: '#/components/schemas/WorkPaperHeader'
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/BoxComparison'
        unexplainedResidual:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        supportingDocuments:
          type: array
          items:
            type: string
        attestation:
          $ref: '#/components/schemas/Attestation'
      required: [runId, header, boxes, unexplainedResidual, supportingDocuments]
    AnnotateVarianceRequest:
      type: object
      properties:
        varianceClass:
          type: string
          maxLength: 60
          description: A first-class category of amendment-taxonomy.yaml's variance classification, or UNEXPLAINED.
        references:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 200
      required: [references]
    VarianceAnnotation:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        box:
          type: string
        varianceClass:
          type: string
        references:
          type: array
          items:
            type: string
        annotatedAt:
          type: string
          format: date-time
      required: [runId, box, references, annotatedAt]
    AttestWorkPaperRequest:
      type: object
      properties:
        soleAttesterAcknowledgement:
          type: boolean
          description: Recorded when one person attests as both preparer and approver (VP-40).
      required: [soleAttesterAcknowledgement]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
