asyncapi: 3.1.0
info:
  title: aggregation events
  version: 1.1.0
  description: >-
    Every event aggregation produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2853 (T9) added aggregation's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T9's
    declared scope (spectral/ is not in it), named in the INV-T-2853 MR.
  contact:
    name: aggregation (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  aggregationAggregateReady:
    address: 'gst.aggregation.aggregate-ready.v1'
    messages:
      AggregateReady:
        $ref: '#/components/messages/AggregateReady'

  aggregationAggregateWindowChanged:
    address: 'gst.aggregation.aggregate-window-changed.v1'
    messages:
      AggregateWindowChanged:
        $ref: '#/components/messages/AggregateWindowChanged'
  aggregationShortCodeUsed:
    address: 'gst.aggregation.short-code-used.v1'
    messages:
      ShortCodeUsed:
        $ref: '#/components/messages/ShortCodeUsed'
  aggregationExampleHappened:
    address: 'gst.aggregation.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishAggregateReady:
    action: send
    description: AggregateReady — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/aggregationAggregateReady'
    messages:
      - $ref: '#/channels/aggregationAggregateReady/messages/AggregateReady'

  publishAggregateWindowChanged:
    action: send
    description: AggregateWindowChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/aggregationAggregateWindowChanged'
    messages:
      - $ref: '#/channels/aggregationAggregateWindowChanged/messages/AggregateWindowChanged'
  publishShortCodeUsed:
    action: send
    description: ShortCodeUsed — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/aggregationShortCodeUsed'
    messages:
      - $ref: '#/channels/aggregationShortCodeUsed/messages/ShortCodeUsed'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/aggregationExampleHappened'
    messages:
      - $ref: '#/channels/aggregationExampleHappened/messages/ExampleHappened'
components:
  messages:
    AggregateReady:
      name: com.dynokore.gst.aggregation.AggregateReady.v1
      title: AggregateReady
      summary: AggregateReady — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AggregateReady (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: aggregation-svc. Consumed by: canonical-svc. Delivery: At-least-once.
        Payload (catalogue text): aggregateId, entityRef, aggregateType, window, lines by internal tax code,
        underlyingRef. Authored by INV-T-2853 (T9).
      # INV-T-3386 (owner ruling INV-Q-3249, coordinator decision on review of !24): this event
      # carries invoice content, so its topic keeps the content window (INV-ADR-2772), not the
      # event-log retention. Copied into event-log/topics.yaml as content_topic by generate-topics.py.
      x-invoice-content: true
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/aggregate-ready-payload.schema.json'

    AggregateWindowChanged:
      name: com.dynokore.gst.aggregation.AggregateWindowChanged.v1
      title: AggregateWindowChanged
      summary: AggregateWindowChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event AggregateWindowChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: aggregation-svc. Consumed by: console-bff, submission-svc.
        Delivery: At-least-once. Payload (catalogue text): entityRef, prescribed period, window, state
        (open, closed or late), aggregateId where closed. Added 25 Sep 2026: a completeness input to period
        readiness (FR-A.5). Authored by INV-T-2853 (T9).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/aggregate-window-changed-payload.schema.json'
    ShortCodeUsed:
      name: com.dynokore.gst.aggregation.ShortCodeUsed.v1
      title: ShortCodeUsed
      summary: ShortCodeUsed — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ShortCodeUsed (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-436; class: domain). Emitted by: aggregation-svc. Consumed by: tenancy-svc.
        Delivery: At-least-once. Payload (catalogue text): code, nodeKind (ENTITY or BUSINESS_UNIT),
        nodeRef (the entityRef or businessUnitRef that holds the code), aggregateId, documentNumber.
        Emitted by aggregation-svc once per tenant and code, at the first aggregate number that carries the code, in the transaction that stores the aggregate; tenancy-svc then sets the flag used_in_aggregate_number once, so the code can no longer change (INV-REQ-436 item 3, INV-AC-2779, INV-Q-11266). Authored by INV-T-11277.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/short-code-used-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.aggregation.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
