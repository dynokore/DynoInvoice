openapi: 3.1.0
info:
  title: aggregation API
  version: 1.2.0
  description: >-
    Contract-first source of truth for aggregation (API-01, STK-44). The
    `aggregation-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07). Replaces the INV-T-2849 scaffold
    (INV-T-2901, T13b).


    Internal API only (API standard §1 and §15): aggregation-svc owns no
    resource in the §15 public catalogue. ingestion-svc's own public
    `POST /v1/batches` and `POST /v1/aggregates` (§15) hand transaction-level
    and pre-aggregated POS/STI/PCP data to aggregation-svc through the one
    operation below, on the synchronous edge of
    model/architecture/sync-edges.yaml (`ingestion-svc -> aggregation-svc`,
    "aggregate intake; the caller needs the aggregate receipt"). The second
    operation is the drill-down query services.yaml's aggregation-svc entry
    lists under `provides`, reached through console-bff (API-25).
  contact:
    name: aggregation (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: intake
    description: POS, STI and PCP transaction and pre-aggregated intake (FR-4.5, §33.9).
  - name: drill-down
    description: Underlying-transaction drill-down for console-bff (§33.14).
paths:
  /internal/v1/aggregation/batches:
    post:
      operationId: intakeAggregationBatch
      summary: Accept a batch of POS, STI or PCP transactions, or a pre-aggregated call, into the current window
      description: >-
        The aggregate intake API to ingestion-svc (services.yaml
        aggregation-svc `provides`; sync-edges.yaml `ingestion-svc ->
        aggregation-svc`). Covers both channels: transaction-level POS and
        expense feeds accumulate directly (FR-4.5), and a pre-aggregated
        call's own totals per internal tax code carry an `underlyingRef` to
        the batch that delivered its supporting detail (FR-4.9, FR-4.10);
        either way the detail is retained, minimised (FR-4.9, §33.9,
        §33.14). Never aggregates outside POS, STI or PCP, or across a
        prescribed-period boundary (aggregation-svc `must_not`, FR-4.5,
        FR-4.14). Closes windows on the configured cadence (VP-55), one line
        per category-code group, with refund and supplementary aggregates
        and STI exclusion by receipt number, then hands the closed aggregate
        to canonical-svc for recording (AD-22) and emits `AggregateReady`.
      tags: [intake]
      x-principal: ingest
      x-timeout: 2000
      x-sync-edge: ingestion-svc->aggregation-svc
      x-error-codes: [ING-018]
      x-requirements: [INV-REQ-957, INV-REQ-1010, FR-4.5, FR-4.8, FR-4.9, FR-4.14, FR-10.15, "C-3", "C-8", FR-AE.73]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          aggregateType is POS, STI or PCP and does not contradict direction
          (C-3); the transaction's date falls within the entity's open
          window, never spanning a prescribed period (FR-4.14).
        reversibility: COMPENSABLE
        repeatKey: >-
          (entityRef, businessUnitRef, aggregateType, periodStart,
          periodEnd) — a repeat is idempotent on the same window (API-15).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregationBatchRequest'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  businessUnitRef: "BU-01"
                  aggregateType: "POS"
                  periodStart: "2026-03-20"
                  periodEnd: "2026-03-20"
                  underlyingRef: "BATCH-9001"
                  linesByInternalTaxCode:
                    - internalTaxCode: "SR-STD"
                      amount: "1500.00"
      responses:
        '202':
          description: Accepted into the open window; the aggregate receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationReceipt'
              examples:
                default:
                  value: { entityRef: "E-001", aggregateType: "POS", windowState: "OPEN" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/aggregation/underlying-transactions:
    get:
      operationId: getAggregateDrillDown
      summary: Drill down from an aggregate line to its retained underlying transactions
      description: >-
        Drill-down query to console-bff (services.yaml aggregation-svc
        `provides`). Reads the underlying detail retained for audit,
        minimised, against the aggregate's `underlyingRef` (FR-4.9, §33.9,
        §33.14); claimant references only, never names (FR-AE.73).

        Paged by cursor (API-18, INV-REQ-826). `limit` defaults to 100 and
        its maximum is 500 (a larger value is refused with 400). `cursor` is
        opaque and integrity-protected, bound to the principal, filters and
        sort that produced it, and valid for at least 24 hours (another
        filter, another principal or an expired cursor is refused with 400).
        The order is total: the documented sort is `underlyingRef` ascending
        and then `transactionRef` ascending; `transactionRef` is unique
        within the aggregate and is the identifier that breaks ties, so no
        two items compare equal. `nextCursor` is omitted on the last page;
        there is no offset and no total count. `underlyingCount` is the
        declared number of retained transactions across all pages, and the
        retained list is checked against it after the last page.
      tags: [drill-down]
      x-principal: filing-workflow
      x-sync-edge: console-bff->aggregation-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [FR-4.9, FR-AE.73, "§33.9", "§33.14"]
      parameters:
        - name: aggregateId
          in: query
          required: true
          schema: { type: string, maxLength: 40 }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of the aggregate's underlying transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnderlyingTransactionPage'
              examples:
                default:
                  value:
                    aggregateId: "AGG-4471"
                    items:
                      - underlyingRef: "BATCH-9001"
                        claimantReference: "POS-TERM-04"
                        amount: "1500.00"
                        transactionRef: "TXN-0001"
                    nextCursor: "c2VlbjoyMA"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
      schema:
        type: string
        format: uuid
  schemas:
    AggregationBatchRequest:
      type: object
      properties:
        entityRef: { type: string, maxLength: 40 }
        businessUnitRef: { type: string, maxLength: 40 }
        aggregateType:
          type: string
          enum: [POS, STI, PCP]
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        underlyingRef:
          type: string
          maxLength: 256
          description: Reference to the batch that delivered the underlying transactions (FR-4.9).
        linesByInternalTaxCode:
          type: array
          items:
            type: object
            properties:
              internalTaxCode: { type: string, maxLength: 40 }
              amount:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
            required: [internalTaxCode, amount]
        claimantReference:
          type: string
          maxLength: 100
          description: Reference of the expense claimant, never a name; names stay in the source expense system (INV-REQ-884).
      required: [entityRef, businessUnitRef, aggregateType, periodStart, periodEnd, underlyingRef, linesByInternalTaxCode]
    AggregationReceipt:
      type: object
      properties:
        entityRef: { type: string, maxLength: 40 }
        aggregateType:
          type: string
          enum: [POS, STI, PCP]
        aggregateId: { type: string, maxLength: 40 }
        windowState:
          type: string
          enum: [OPEN, CLOSED, LATE]
          x-extensible-enum: true
        underlyingCount:
          type: integer
          minimum: 0
          description: Declared number of retained underlying transactions; the retained list is checked against it (INV-REQ-414).
        isCreditNote:
          type: boolean
          description: True for a credit-note aggregate, document type 381; absent means false (INV-REQ-438).
        isSupplementary:
          type: boolean
          description: True for a supplementary aggregate; absent means false. Both flags true is a refund arriving after its window was transmitted (INV-REQ-439).
        subtotalsByTaxCode:
          type: array
          description: Per internal tax code group subtotals; for a PCP aggregate the claimable input tax claimed per group (INV-REQ-441).
          items:
            type: object
            properties:
              internalTaxCode: { type: string, maxLength: 40 }
              amount:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
            required: [internalTaxCode, amount]
        replacesReceiptNumber:
          type: string
          maxLength: 100
          description: Receipt number of the STI receipt a full tax invoice replaces; the receipt is excluded from any aggregate not yet transmitted (INV-REQ-440).
      required: [entityRef, aggregateType, windowState]
    UnderlyingTransactionPage:
      type: object
      properties:
        aggregateId: { type: string, maxLength: 40 }
        underlyingCount:
          type: integer
          minimum: 0
          description: Declared number of retained underlying transactions across all pages; the retained list is checked against it after the last page (INV-REQ-414).
        isCreditNote:
          type: boolean
          description: True for a credit-note aggregate, document type 381; absent means false (INV-REQ-438).
        isSupplementary:
          type: boolean
          description: True for a supplementary aggregate; absent means false. Both flags true is a refund arriving after its window was transmitted (INV-REQ-439).
        subtotalsByTaxCode:
          type: array
          description: Per internal tax code group subtotals; for a PCP aggregate the claimable input tax claimed per group (INV-REQ-441).
          items:
            type: object
            properties:
              internalTaxCode: { type: string, maxLength: 40 }
              amount:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
            required: [internalTaxCode, amount]
        replacesReceiptNumber:
          type: string
          maxLength: 100
          description: Receipt number of the STI receipt a full tax invoice replaces; the receipt is excluded from any aggregate not yet transmitted (INV-REQ-440).
        items:
          type: array
          items:
            type: object
            properties:
              underlyingRef: { type: string, maxLength: 256 }
              claimantReference: { type: string, maxLength: 100 }
              transactionRef:
                type: string
                maxLength: 256
                description: The reference of one retained underlying transaction, unique within the aggregate; the tie-breaker of the page order.
              amount:
                type: string
                format: decimal
                pattern: '^-?\d{1,17}(\.\d{1,2})?$'
                description: Money as a decimal string (API-12).
            required: [underlyingRef, amount, transactionRef]
        nextCursor:
          type: string
          description: Opaque cursor of the next page (API-18); omitted on the last page.
      required: [aggregateId, items]
  responses:
    Error:
      description: Error (API-20 envelope)
      content:
        application/problem+json:
          schema:
            $ref: '../service-runtime/schemas/error-envelope.schema.json'
          examples:
            default:
              value:
                type: "about:blank"
                title: "Example error"
                status: 400
                code: "EXAMPLE-000"
                correlationId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
