asyncapi: 3.1.0
info:
  title: submission events
  version: 1.0.0
  description: >-
    Every event submission produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2854 (T10) added submission's real §19.8 events
    below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T10's
    declared scope (spectral/ is not in it), named in the INV-T-2854 MR.
  contact:
    name: submission (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  submissionSubmissionDespatched:
    address: 'gst.submission.submission-despatched.v1'
    messages:
      SubmissionDespatched:
        $ref: '#/components/messages/SubmissionDespatched'

  submissionSubmissionAcknowledged:
    address: 'gst.submission.submission-acknowledged.v1'
    messages:
      SubmissionAcknowledged:
        $ref: '#/components/messages/SubmissionAcknowledged'

  submissionSubmissionFailed:
    address: 'gst.submission.submission-failed.v1'
    messages:
      SubmissionFailed:
        $ref: '#/components/messages/SubmissionFailed'

  submissionReadinessChanged:
    address: 'gst.submission.readiness-changed.v1'
    messages:
      ReadinessChanged:
        $ref: '#/components/messages/ReadinessChanged'
  submissionExampleHappened:
    address: 'gst.submission.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishSubmissionDespatched:
    action: send
    description: SubmissionDespatched — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/submissionSubmissionDespatched'
    messages:
      - $ref: '#/channels/submissionSubmissionDespatched/messages/SubmissionDespatched'

  publishSubmissionAcknowledged:
    action: send
    description: SubmissionAcknowledged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/submissionSubmissionAcknowledged'
    messages:
      - $ref: '#/channels/submissionSubmissionAcknowledged/messages/SubmissionAcknowledged'

  publishSubmissionFailed:
    action: send
    description: SubmissionFailed — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/submissionSubmissionFailed'
    messages:
      - $ref: '#/channels/submissionSubmissionFailed/messages/SubmissionFailed'

  publishReadinessChanged:
    action: send
    description: ReadinessChanged — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/submissionReadinessChanged'
    messages:
      - $ref: '#/channels/submissionReadinessChanged/messages/ReadinessChanged'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/submissionExampleHappened'
    messages:
      - $ref: '#/channels/submissionExampleHappened/messages/ExampleHappened'
components:
  messages:
    SubmissionDespatched:
      name: com.dynokore.gst.submission.SubmissionDespatched.v1
      title: SubmissionDespatched
      summary: SubmissionDespatched — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event SubmissionDespatched (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: submission-svc. Consumed by: aggregation-svc, console-bff,
        evidence-svc. Delivery: At-least-once. Payload (catalogue text): docUuid, version, attempt number,
        payload SHA-256. Authored by INV-T-2854 (T10).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/submission-despatched-payload.schema.json'

    SubmissionAcknowledged:
      name: com.dynokore.gst.submission.SubmissionAcknowledged.v1
      title: SubmissionAcknowledged
      summary: SubmissionAcknowledged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event SubmissionAcknowledged (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: submission-svc. Consumed by: canonical-svc, console-bff,
        evidence-svc, notification-svc, reconciliation-svc, tenancy-svc. Delivery: At-least-once. Payload
        (catalogue text): docUuid, version, acknowledgementId, timestamp. Authored by INV-T-2854 (T10).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/submission-acknowledged-payload.schema.json'

    SubmissionFailed:
      name: com.dynokore.gst.submission.SubmissionFailed.v1
      title: SubmissionFailed
      summary: SubmissionFailed — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event SubmissionFailed (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: submission-svc. Consumed by: console-bff, notification-svc. Delivery:
        At-least-once. Payload (catalogue text): docUuid, version, failure class, retry disposition.
        Authored by INV-T-2854 (T10).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/submission-failed-payload.schema.json'

    ReadinessChanged:
      name: com.dynokore.gst.submission.ReadinessChanged.v1
      title: ReadinessChanged
      summary: ReadinessChanged — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event ReadinessChanged (model/architecture/events.yaml, INV-NOTE-3 §19.8, INV-REQ-815;
        class: domain). Emitted by: submission-svc. Consumed by: console-bff, notification-svc. Delivery:
        At-least-once. Payload (catalogue text): entityRef, period, verdict, counts by state, filing fact
        (filedAt, filing reference, recorder, conflict flag). Authored by INV-T-2854 (T10).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/readiness-changed-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.submission.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
