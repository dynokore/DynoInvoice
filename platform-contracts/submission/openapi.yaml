openapi: 3.1.0
info:
  title: submission API
  version: 1.3.0
  description: >-
    Contract-first source of truth for submission (API-01, STK-44). The
    `submission-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Public and internal APIs (API standard §1 and §15): submission-svc has
    no synchronous callee edge in model/architecture/sync-edges.yaml (it is
    only a caller, to transport-svc). The five public operations below are
    `/v1/…`, routed by the gateway to the `filing-workflow` and `reporting`
    principals. Three further `reporting` operations (getSubmissionSummary,
    getSubmissionReconciliation, exportSubmissions) complete the submission
    list in 1.1.0 (INV-REQ-629, INV-REQ-975 to INV-REQ-979); the list itself
    has no total count (API-18), so the filtered row count and totals live in
    getSubmissionSummary. 1.2.0 completes readiness, drain and filing
    (INV-REQ-554, INV-REQ-814, INV-REQ-914, INV-REQ-917, INV-REQ-951,
    INV-REQ-961, INV-REQ-1250) and adds the `filing-workflow` operation
    listReadinessChecks; every property it adds is optional, and the service
    always sends it. Two additional operations (withdrawSubmission, replaySubmissions)
    are `/internal/v1/…`, reachable only by console-bff on a person's behalf
    (API-25 — the callee re-checks writes), rather than through the public
    `/v1/…` surface (INV-REQ-568, INV-REQ-575, INV-REQ-581, INV-T-2858, T14).
    1.3.0 adds the internal read checkSubmissionBoundary (INV-REQ-959,
    INV-REQ-1005, INV-REQ-1018, INV-Q-6216); it is additive.
  contact:
    name: submission (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway routes only the operations of a published train (API-26).
tags:
  - name: readiness
    description: Period readiness, drain and filing confirmation (§33.2, FR-C.8, FR-C.9).
  - name: transactions
    description: A submission's transmission state, combined with its canonical facts (§19.7, FR-K.9).
paths:
  /v1/entities/{entityRef}/periods/{periodRef}/readiness:
    get:
      operationId: getReadiness
      summary: Read a period's readiness verdict
      description: >-
        The readiness gate is callable both interactively and as an API
        (INV-REQ-555, FR-C.9). Includes the completeness inputs
        FeedHealthChanged and AggregateWindowChanged and shows DEP-006 from
        InstallationStatusChanged (services.yaml submission-svc capabilities).


        The call of both a person and the `filing-workflow` principal
        (INV-REQ-555, INV-REQ-814). A `filing-workflow` principal is refused
        for an entity it is not named for (INV-AC-2037): the response is
        `403` (SRT-004); an `ingest` principal is refused the same way
        (INV-AC-1868).


        The service always sends `outcomeValues` (INV-REQ-1250): the filer of
        record, the filing gate, the readiness strictness, the override
        approval, the amendment route and every relaxed control, by default
        and not on request. Each `optionKey` is a `key` of the named variation
        point in the variation-point catalogue; this contract copies no value
        set. The service always sends `checkId` too: each invocation appends
        one record (INV-REQ-951), read through listReadinessChecks.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [readiness]
      x-principal: filing-workflow
      x-timeout: 3000
      x-error-codes: [SRT-004]
      x-requirements: [INV-REQ-555, INV-REQ-1168, INV-REQ-814, INV-REQ-951, INV-REQ-1250]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '200':
          description: The period's readiness verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    ready: false
                    tiers:
                      - tier: 1
                        description: "Held documents awaiting masterdata or rules resolution"
                        blockedCount: 2
                      - tier: 2
                        description: "Queued items awaiting transport"
                        blockedCount: 0
                      - tier: 3
                        description: "Dead-lettered versions awaiting replay"
                        blockedCount: 0
                    dueDate: "2026-04-30"
                    computedAt: "2026-03-20T03:15:22Z"
                    checkId: "chk-2026Q1-0001"
                    outcomeValues:
                      filerOfRecord:
                        partyRef: "P-001"
                        optionKey: "DERIVED"
                      filingGate:
                        variationPoint: "VP-14"
                        optionKey: "BLOCKING"
                      readinessStrictness:
                        variationPoint: "VP-15"
                        optionKey: "BLOCK_ONLY"
                      overrideApproval:
                        variationPoint: "VP-32"
                        optionKey: "ONE_TAX_APPROVER"
                      amendmentRoute:
                        variationPoint: "VP-31"
                        optionKey: "ASK_APPROVER"
                      relaxedControls:
                        - variationPoint: "VP-15"
                          optionKey: "ADD_WARN_CODES"
                          acknowledgedBy: "P-002"
                          acknowledgedAt: "2026-03-01T09:00:00Z"
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/drain:
    post:
      operationId: drainPeriod
      summary: Drain a period's backlog in priority-tier order, and report what cannot be drained
      description: >-
        The period readiness check drains the backlog in three priority
        tiers, then reports what cannot be drained (INV-REQ-554, FR-C.8).
        Never reports readiness without draining first (submission-svc
        `must_not`).


        Despatch order has three tiers (INV-REQ-554): any document already
        inside its own safety-margin window goes first, whatever its period;
        then the backlog of the period being drained; then routine traffic, by
        days to due date. A drain never delays a tier 1 document. `remaining`
        and `drainedCount` keep their meaning; the service always sends
        `drainedByTier` (the count despatched per tier), `residualItems` (each
        document that could not be drained, with its blocking reason code, a
        code of the error catalogue, INV-AC-1773) and `checkId` (the record
        this invocation appends, INV-REQ-951).


        The call of both a person and the `filing-workflow` principal
        (INV-REQ-555, INV-REQ-814). A `filing-workflow` principal is refused
        for an entity it is not named for (INV-AC-2037): the response is
        `403` (SRT-004).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries the
        same request on the same (entityRef, periodRef), the operation's
        repeatKey, with no Idempotency-Key header (INV-REQ-1204 b7,
        INV-Q-3571). This departs from API-15, which requires the header
        on every other POST: 1.0.0 declares no key, and requiring one
        would break 1.0.0 callers (API-03), as INV-Q-3551 ruled for
        deleteAtRetentionEnd.
      tags: [readiness]
      x-principal: filing-workflow
      x-timeout: 3000
      x-error-codes: [SRT-004]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-554, INV-REQ-555, INV-REQ-814, INV-REQ-951]
      x-operation:
        role: filing-workflow
        scope: filing-workflow
        precondition: The entity and period exist and have queued or held items to attempt (FR-C.8).
        reversibility: COMPENSABLE
        repeatKey: >-
          (entityRef, periodRef) — a repeat re-attempts whatever remains
          queued or held; nothing already drained is repeated (INV-REQ-554).
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '200':
          description: The drain outcome, including what could not be drained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrainResult'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    drainedCount: 5
                    remaining:
                      - tier: 1
                        description: "Held documents awaiting masterdata or rules resolution"
                        blockedCount: 2
                    completedAt: "2026-03-20T03:16:00Z"
                    drainedByTier:
                      - tier: 1
                        tierCode: "SAFETY_MARGIN"
                        drainedCount: 1
                      - tier: 2
                        tierCode: "PERIOD_BACKLOG"
                        drainedCount: 3
                      - tier: 3
                        tierCode: "ROUTINE"
                        drainedCount: 1
                    residualItems:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        version: 1
                        tier: 2
                        blockingReasonCode: "MDM-001"
                    checkId: "chk-2026Q1-0002"
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/readiness/checks:
    get:
      operationId: listReadinessChecks
      summary: List the recorded readiness checks of a period, newest first
      description: >-
        Every readiness check records its verdict, its timestamp and the
        approver (INV-REQ-951, INV-AC-1043). Each `getReadiness` and
        `drainPeriod` invocation appends one record. A record is never
        changed or deleted: two runs of one period return two records,
        unchanged (INV-AC-2055). The `approver` is the verified caller
        identity, a person reference or the `filing-workflow` principal
        reference, and never a request field. Cursor pagination (API-18),
        newest first; no offset and no total count.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [readiness]
      x-principal: filing-workflow
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-951]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of readiness check records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessCheckPage'
              examples:
                default:
                  value:
                    items:
                      - checkId: "chk-2026Q1-0002"
                        verdict: "NOT_READY"
                        checkedAt: "2026-03-20T03:16:00Z"
                        approver: "filing-workflow"
                      - checkId: "chk-2026Q1-0001"
                        verdict: "READY"
                        checkedAt: "2026-03-20T03:15:22Z"
                        approver: "P-002"
                    nextCursor: "eyJvIjoxMDB9"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/filing:
    post:
      operationId: confirmFiling
      summary: Confirm the actual filing date and evidence for a period's GST return
      description: >-
        The actual filing date is derivable from an uploaded return's
        filedAt in one call (INV-REQ-655, FR-AE.58). confirmFiling always
        carries IRAS filing evidence — the myTax Portal acknowledgement, and
        its reference where shown — with filedAt (INV-REQ-914, FR-AF.36).
        Never changes a due date ad hoc; the due-date snapshot recomputes
        only on its own triggers (submission-svc `must_not`, §7.7).


        `irasAcknowledgementReference` is required and is the acknowledgement;
        `portalReference` is optional and is the reference number where the
        acknowledgement shows one (INV-Q-5948). A call without the
        acknowledgement is refused with `400` and nothing is recorded, from a
        user and from the `filing-workflow` principal alike (INV-AC-930); a
        call with the acknowledgement and `filedAt` and no `portalReference`
        is recorded (INV-AC-2784).


        A call with a `filedAt` that differs from the recorded filing fact of
        the original return is recorded as a second fact, raises PER-010 and
        does not replace the first; only a call with `correction` true
        resolves it (INV-REQ-917, INV-AC-931). `governingFiledAt` is the
        earlier date until a correction, the default of VP-13. The documents
        of the period still unsubmitted when the call is made are already
        late and raise SUB-010 immediately (INV-REQ-961, INV-AC-1054). The
        service always sends `governingFiledAt` and `lateDocuments`, and
        sends `conflict` while two facts disagree.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries the
        same request on the same (entityRef, periodRef), the operation's
        repeatKey, with no Idempotency-Key header (INV-REQ-1204 b7,
        INV-Q-3571). This departs from API-15, which requires the header
        on every other POST: 1.0.0 declares no key, and requiring one
        would break 1.0.0 callers (API-03), as INV-Q-3551 ruled for
        deleteAtRetentionEnd.
      tags: [readiness]
      x-principal: filing-workflow
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-655, INV-REQ-914, INV-REQ-917, INV-REQ-961]
      x-operation:
        role: filing-workflow
        scope: filing-workflow
        precondition: >-
          Readiness has been checked for the period (INV-REQ-555); a filedAt
          that differs from the recorded filing fact of the original return
          is recorded as a second fact, raises PER-010 and does not replace
          the first; only a call with correction true resolves it
          (INV-REQ-917).
        reversibility: COMPENSABLE
        repeatKey: >-
          (entityRef, periodRef) — a repeat with the same filedAt and
          evidence reference reports the existing confirmation, unchanged.
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmFilingRequest'
            examples:
              default:
                value:
                  filedAt: "2026-04-28T09:00:00Z"
                  irasAcknowledgementReference: "IRAS-ACK-2026Q1-E001"
      responses:
        '200':
          description: The filing confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingConfirmation'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    filedAt: "2026-04-28T09:00:00Z"
                    irasAcknowledgementReference: "IRAS-ACK-2026Q1-E001"
                    confirmedAt: "2026-04-28T09:01:00Z"
                    governingFiledAt: "2026-04-28T09:00:00Z"
                    lateDocuments:
                      code: "SUB-010"
                      count: 1
                      docUuids: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/submissions:
    get:
      operationId: listSubmissions
      summary: List submissions for a period, with tracking status
      description: >-
        Submission list and tracking reports (services.yaml submission-svc
        capabilities, §35.1). Cursor pagination (API-18); no offset and no
        total count in the list.


        One row per submitted version (INV-REQ-975); a superseded version is
        included and marked by state SUPERSEDED. The optional filters
        (INV-REQ-977) all combine with AND, and a cursor is bound to the
        filters that produced it (API-18): a cursor sent with different
        filters is rejected. The filtered row count and totals are read from
        getSubmissionSummary with the same filters; the `bucket` filter is the
        drill-down of each count of getSubmissionReconciliation (INV-REQ-976).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [transactions]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-1168, INV-REQ-629, INV-REQ-975, INV-REQ-977, INV-REQ-979]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
        - $ref: '#/components/parameters/FilterDirection'
        - $ref: '#/components/parameters/FilterSubmissionType'
        - $ref: '#/components/parameters/FilterState'
        - $ref: '#/components/parameters/FilterCategoryCode'
        - $ref: '#/components/parameters/FilterCounterparty'
        - $ref: '#/components/parameters/FilterAmountMin'
        - $ref: '#/components/parameters/FilterAmountMax'
        - $ref: '#/components/parameters/FilterAcknowledged'
        - $ref: '#/components/parameters/FilterBucket'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            pattern: '^-?(dueDate|transactionDate)$'
            description: >-
              field,-field over dueDate or transactionDate (API-19). A
              regex, not an enum, so the leading "-" for descending order
              does not trip API-09's UPPER_SNAKE_CASE rule.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
              examples:
                default:
                  value:
                    items:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        version: 2
                        submissionType: "TYPE_1A"
                        state: "ACKNOWLEDGED"
                        dueDate: "2026-04-30"
                        totalAmount: "1090.00"
                        documentNumber: "INV-2026-0042"
                        documentTypeCode: "380"
                        direction: "SALE"
                        counterpartyName: "Acme Pte Ltd"
                        counterpartyUen: "201912345A"
                        transactionDate: "2026-03-20"
                        taxableAmount: "1000.00"
                        gstAmount: "90.00"
                        submittedAt: "2026-03-20T03:10:00Z"
                        acknowledgedAt: "2026-04-20T03:15:21Z"
                        acknowledgementId: "ACK-0001"
                    nextCursor: "eyJvIjoxMDB9"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/submissions/summary:
    get:
      operationId: getSubmissionSummary
      summary: Read the row count and totals of the submission list for a filter
      description: >-
        The row count and the taxable and GST totals of all rows that match
        the filters, not of one page (INV-REQ-977, INV-REQ-978, INV-AC-2006).
        The filters are those of listSubmissions and combine with AND. The
        count lives in this separate resource so that the list keeps API-18's
        "no total count in the list".


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [transactions]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-977, INV-REQ-978]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
        - $ref: '#/components/parameters/FilterDirection'
        - $ref: '#/components/parameters/FilterSubmissionType'
        - $ref: '#/components/parameters/FilterState'
        - $ref: '#/components/parameters/FilterCategoryCode'
        - $ref: '#/components/parameters/FilterCounterparty'
        - $ref: '#/components/parameters/FilterAmountMin'
        - $ref: '#/components/parameters/FilterAmountMax'
        - $ref: '#/components/parameters/FilterAcknowledged'
        - $ref: '#/components/parameters/FilterBucket'
      responses:
        '200':
          description: The row count and totals for the filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSummaryTotals'
              examples:
                default:
                  value:
                    rowCount: 12
                    totalTaxableAmount: "12000.00"
                    totalGstAmount: "1080.00"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/submissions/reconciliation:
    get:
      operationId: getSubmissionReconciliation
      summary: Read the sent-versus-acknowledged view of a period
      description: >-
        Counts and amounts of the documents of the period in five classes
        (INV-REQ-629, INV-REQ-976): SENT_ACKNOWLEDGED, SENT_NOT_ACKNOWLEDGED
        (sent without acknowledgement beyond the threshold, SUB-005),
        REJECTED, DEAD_LETTERED and NEVER_SENT (in scope but never sent).
        Each class is present once in a response. A document in
        SENT_NOT_ACKNOWLEDGED is not counted as submitted (INV-AC-672). Each
        count drills down to the rows behind it through the `bucket` filter of
        listSubmissions.


        Classification of a document that has an ACKNOWLEDGED version and a
        later version in flight: the default of the open owner question
        INV-Q-5944 is that the document counts in SENT_ACKNOWLEDGED while an
        earlier version is ACKNOWLEDGED. The service task revises this if the
        owner answers otherwise; the response shape does not change with the
        answer.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [transactions]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-629, INV-REQ-976]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '200':
          description: The five classes with their counts and amounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentVersusAcknowledgedView'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    buckets:
                      - { bucket: "SENT_ACKNOWLEDGED", count: 40, totalAmount: "43600.00" }
                      - { bucket: "SENT_NOT_ACKNOWLEDGED", count: 1, totalAmount: "1090.00" }
                      - { bucket: "REJECTED", count: 0, totalAmount: "0.00" }
                      - { bucket: "DEAD_LETTERED", count: 0, totalAmount: "0.00" }
                      - { bucket: "NEVER_SENT", count: 2, totalAmount: "2180.00" }
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/entities/{entityRef}/periods/{periodRef}/submissions/export:
    get:
      operationId: exportSubmissions
      summary: Export the submission list for a filter as CSV, XLSX or PDF
      description: >-
        CSV and XLSX for analysis, PDF for filing (INV-REQ-978). Every export
        starts with the header block of SubmissionExportHeader (entity, GSTN,
        period, generated-at, generated-by, filter) and carries a row count
        and totals that tie back to the screen: the response headers
        `X-Export-Row-Count`, `X-Export-Total-Taxable-Amount` and
        `X-Export-Total-Gst-Amount` equal the rowCount, totalTaxableAmount
        and totalGstAmount that getSubmissionSummary returns for the same
        filters. CSV, XLSX and PDF of one filter carry equal values there
        (INV-AC-673). The filters are those of listSubmissions and combine
        with AND.


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [transactions]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-978]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [CSV, XLSX, PDF]
            x-extensible-enum: true
        - $ref: '#/components/parameters/FilterDirection'
        - $ref: '#/components/parameters/FilterSubmissionType'
        - $ref: '#/components/parameters/FilterState'
        - $ref: '#/components/parameters/FilterCategoryCode'
        - $ref: '#/components/parameters/FilterCounterparty'
        - $ref: '#/components/parameters/FilterAmountMin'
        - $ref: '#/components/parameters/FilterAmountMax'
        - $ref: '#/components/parameters/FilterAcknowledged'
        - $ref: '#/components/parameters/FilterBucket'
      responses:
        '200':
          description: The export file.
          x-header-block:
            $ref: '#/components/schemas/SubmissionExportHeader'
          headers:
            X-Export-Row-Count:
              required: true
              schema:
                type: integer
                minimum: 0
            X-Export-Total-Taxable-Amount:
              required: true
              schema:
                $ref: '#/components/schemas/Money'
            X-Export-Total-Gst-Amount:
              required: true
              schema:
                $ref: '#/components/schemas/Money'
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: "entityRef,gstn,periodRef,generatedAt,generatedBy,filter,rowCount\nE-001,M00000000X,2026-Q1,2026-04-21T01:00:00Z,user-17,direction=PURCHASE,12\n"
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
              example: "(binary XLSX workbook)"
            application/pdf:
              schema:
                type: string
                format: binary
              example: "(binary PDF document)"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions/{docUuid}:
    get:
      operationId: getTransaction
      summary: Read a transaction's combined canonical and submission status
      description: >-
        Combines canonical and submission facts, served from a read model
        submission-svc maintains from CanonicalVersionCreated, so no call
        fans out across services at request time (API standard §15
        footnote, FR-K.9, INV-REQ-1168).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries by a
        re-read (a safe GET; INV-REQ-1204 b7, INV-Q-3571).
      tags: [transactions]
      x-principal: reporting
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
      responses:
        '200':
          description: The transaction's combined status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatus'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    documentFunction: "INVOICE"
                    transactionDate: "2026-03-20"
                    scopeVerdict: "SUBMITTABLE"
                    totalAmount: "1090.00"
                    currency: "SGD"
                    submissionType: "TYPE_1A"
                    state: "ACKNOWLEDGED"
                    dueDate: "2026-04-30"
                    acknowledgedAt: "2026-04-20T03:15:21Z"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/transactions/{docUuid}/withdraw:
    post:
      operationId: withdrawSubmission
      summary: Withdraw a document with no version yet transmitted
      description: >-
        A document with no version yet transmitted MAY be withdrawn by
        tax.approver with a reason, where the upstream system reversed it
        before issue (INV-REQ-568, INV-REQ-581, FR-8.22, FR-AE.20). A Type
        1A document can never be withdrawn once issued, because IRAS already
        holds it. Called by console-bff on behalf of an operator (INV-T-2858,
        T14).
      tags: [transactions]
      x-principal: filing-workflow
      x-sync-edge: console-bff->submission-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-568, INV-REQ-581]
      x-operation:
        role: tax.approver
        scope: entity
        precondition: >-
          No version of this Doc UUID has ever been transmitted; a Type 1A
          document once issued can never be withdrawn (FR-8.22, FR-AE.20).
        reversibility: COMPENSABLE
        repeatKey: "docUuid — no-op; the document is already withdrawn."
      parameters:
        - $ref: '#/components/parameters/DocUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
            examples:
              default:
                value: { reason: "Upstream ERP reversed the document before issue" }
      responses:
        '200':
          description: The document's withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResult'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    state: "WITHDRAWN"
                    reason: "Upstream ERP reversed the document before issue"
                    withdrawnAt: "2026-03-20T03:20:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/submission/boundary-checks:
    post:
      operationId: checkSubmissionBoundary
      summary: Count how many documents of a group have already been submitted
      description: >-
        The submission boundary of a group of documents, read before a bulk
        correction is previewed or applied (INV-REQ-959, INV-REQ-1005,
        INV-REQ-1018, INV-Q-6216). A document counts as submitted when any of
        its versions is in a `state` of `BoundaryMember`; READY,
        AWAITING_PRECEDING, QUEUED, CANCELLED and WITHDRAWN do not count; a
        docUuid with no version record counts as not submitted. `checkedCount`
        is the number of distinct docUuids in the request; `submittedCount`
        equals the length of `submittedMembers`. At most 5,000 documents per
        call (API-49); a larger request is refused with `413` (API-20
        envelope). The read changes nothing. Called by console-bff on behalf
        of an operator.
      tags: [transactions]
      x-principal: filing-workflow
      x-sync-edge: console-bff->submission-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-959, INV-REQ-1005, INV-REQ-1018]
      x-operation:
        role: tax.operator
        scope: entity
        precondition: >-
          The request names between 1 and 5,000 Doc UUIDs; a Doc UUID with no
          version record is counted as not submitted.
        reversibility: UNDOABLE
        repeatKey: "none — a read-only call; it changes nothing and may be repeated."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoundaryCheckRequest'
            examples:
              default:
                value: { docUuids: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"] }
      responses:
        '200':
          description: The submission boundary of the group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoundaryCheckResult'
              examples:
                default:
                  value:
                    checkedCount: 1
                    submittedCount: 1
                    submittedMembers:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        state: "SENT"
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/transactions/{docUuid}/versions/{version}/replay:
    post:
      operationId: replaySubmissions
      summary: Replay a dead-lettered version on its own priority lane
      description: >-
        A DEAD_LETTERED version is replayable; replay returns the version to
        QUEUED (INV-REQ-575, FR-AE.14). Runs on its own priority lane, never
        mixed with ordinary queue processing (services.yaml submission-svc
        capabilities, FR-C.8). Never allows two in-flight versions of one
        Doc UUID (submission-svc `must_not`, FR-C.2). Called by console-bff
        on behalf of an operator holding the "Replay a failed submission"
        grant (INV-T-2858, T14).
      tags: [transactions]
      x-principal: filing-workflow
      x-sync-edge: console-bff->submission-svc
      x-timeout: 2000
      x-error-codes: [SUB-008]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-575]
      x-operation:
        role: operator
        scope: entity
        precondition: >-
          The version is DEAD_LETTERED (INV-REQ-575); no other version of the
          same Doc UUID is currently in flight (FR-C.2, SUB-008).
        reversibility: COMPENSABLE
        repeatKey: >-
          (docUuid, version) — the repeat overwrites itself at IRAS
          (INV-REQ-1010 behaviour #3).
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The version was returned to QUEUED on the replay lane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    state: "QUEUED"
                    replayedAt: "2026-03-20T03:21:00Z"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    PeriodRef:
      name: periodRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
        description: Opaque, calendar-issued (API-11); clients never construct it.
    DocUuid:
      name: docUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FilterDirection:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [SALE, PURCHASE]
        x-extensible-enum: true
    FilterSubmissionType:
      name: submissionType
      in: query
      required: false
      schema:
        type: string
        enum: [TYPE_1A, TYPE_1B, TYPE_2, TYPE_3]
        x-extensible-enum: true
    FilterState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          [READY, AWAITING_PRECEDING, QUEUED, SENT, SENT_UNCONFIRMED, RETRY, DEAD_LETTERED, REJECTED, CANCELLED,
            ACKNOWLEDGED, SUPERSEDED, NETWORK_ISSUED, EXTERNALLY_SUBMITTED, WITHDRAWN]
    FilterCategoryCode:
      name: categoryCode
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    FilterCounterparty:
      name: counterparty
      in: query
      required: false
      description: Matches a row whose counterpartyUen equals it or whose counterpartyName equals it ignoring case.
      schema:
        type: string
        maxLength: 140
    FilterAmountMin:
      name: amountMin
      in: query
      required: false
      description: Lower bound, compared with taxableAmount.
      schema:
        $ref: '#/components/schemas/Money'
    FilterAmountMax:
      name: amountMax
      in: query
      required: false
      description: Upper bound, compared with taxableAmount.
      schema:
        $ref: '#/components/schemas/Money'
    FilterAcknowledged:
      name: acknowledged
      in: query
      required: false
      schema:
        type: boolean
    FilterBucket:
      name: bucket
      in: query
      required: false
      description: The drill-down of a count of getSubmissionReconciliation (INV-REQ-976).
      schema:
        $ref: '#/components/schemas/ReconciliationBucket'
  schemas:
    Money:
      type: string
      format: decimal
      pattern: '^-?\d{1,17}(\.\d{1,2})?$'
      description: Money as a decimal string, SGD (API-12).
    ReconciliationBucket:
      type: string
      enum: [SENT_ACKNOWLEDGED, SENT_NOT_ACKNOWLEDGED, REJECTED, DEAD_LETTERED, NEVER_SENT]
      x-extensible-enum: true
      description: >-
        The five classes of INV-REQ-976. SENT_NOT_ACKNOWLEDGED is sent without
        acknowledgement beyond the threshold (SUB-005).
    ReadinessTier:
      type: object
      properties:
        tier:
          type: integer
        description:
          type: string
        blockedCount:
          type: integer
      required: [tier, blockedCount]
    OutcomeValue:
      type: object
      description: The option in force for one variation point, by its key in the variation-point catalogue.
      properties:
        variationPoint:
          type: string
          pattern: '^VP-[0-9]+$'
        optionKey:
          type: string
          minLength: 1
      required: [variationPoint, optionKey]
    OutcomeValues:
      type: object
      description: >-
        The values that change a compliance outcome (INV-REQ-1250). Each
        optionKey is a key of the named variation point; no value set is
        copied here.
      properties:
        filerOfRecord:
          type: object
          properties:
            partyRef:
              type: string
            optionKey:
              type: string
              description: The option key of VP-11.
          required: [partyRef, optionKey]
        filingGate:
          allOf:
            - $ref: '#/components/schemas/OutcomeValue'
            - properties:
                variationPoint:
                  const: VP-14
        readinessStrictness:
          allOf:
            - $ref: '#/components/schemas/OutcomeValue'
            - properties:
                variationPoint:
                  const: VP-15
        overrideApproval:
          allOf:
            - $ref: '#/components/schemas/OutcomeValue'
            - properties:
                variationPoint:
                  const: VP-32
        amendmentRoute:
          allOf:
            - $ref: '#/components/schemas/OutcomeValue'
            - properties:
                variationPoint:
                  const: VP-31
        relaxedControls:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              variationPoint:
                type: string
                pattern: '^VP-[0-9]+$'
              optionKey:
                type: string
                minLength: 1
              acknowledgedBy:
                type: string
              acknowledgedAt:
                type: string
                format: date-time
            required: [variationPoint, optionKey, acknowledgedBy, acknowledgedAt]
      required: [filerOfRecord, filingGate, readinessStrictness, overrideApproval, amendmentRoute, relaxedControls]
    ReadinessCheckRecord:
      type: object
      properties:
        checkId:
          type: string
          minLength: 1
        verdict:
          type: string
          enum: [READY, NOT_READY]
          x-extensible-enum: true
        checkedAt:
          type: string
          format: date-time
        approver:
          type: string
          description: The verified caller identity; never a request field.
        outcomeValues:
          $ref: '#/components/schemas/OutcomeValues'
      required: [checkId, verdict, checkedAt, approver]
    ReadinessCheckPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheckRecord'
        nextCursor:
          type: string
      required: [items]
    ReadinessStatus:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        ready:
          type: boolean
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessTier'
        dueDate:
          type: string
          format: date
        computedAt:
          type: string
          format: date-time
        checkId:
          type: string
          minLength: 1
        outcomeValues:
          $ref: '#/components/schemas/OutcomeValues'
      required: [entityRef, periodRef, ready, tiers, computedAt]
    DrainResult:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        drainedCount:
          type: integer
        remaining:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessTier'
        completedAt:
          type: string
          format: date-time
        drainedByTier:
          type: array
          items:
            type: object
            properties:
              tier:
                type: integer
                minimum: 1
                maximum: 3
              tierCode:
                type: string
                enum: [SAFETY_MARGIN, PERIOD_BACKLOG, ROUTINE]
                x-extensible-enum: true
                description: SAFETY_MARGIN for tier 1, PERIOD_BACKLOG for tier 2, ROUTINE for tier 3.
              drainedCount:
                type: integer
                minimum: 0
            required: [tier, tierCode, drainedCount]
        residualItems:
          type: array
          items:
            type: object
            properties:
              docUuid:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 1
              tier:
                type: integer
                minimum: 1
                maximum: 3
              blockingReasonCode:
                type: string
                pattern: '^[A-Z]{3}-[0-9]{3}$'
                description: A code of catalogue/errors/error-codes.yaml.
            required: [docUuid, version, tier, blockingReasonCode]
        checkId:
          type: string
          minLength: 1
      required: [entityRef, periodRef, drainedCount, remaining, completedAt]
    ConfirmFilingRequest:
      type: object
      properties:
        filedAt:
          type: string
          format: date-time
        irasAcknowledgementReference:
          type: string
          maxLength: 100
        portalReference:
          type: string
          maxLength: 100
        correction:
          type: boolean
          default: false
      required: [filedAt, irasAcknowledgementReference]
    FilingConfirmation:
      type: object
      properties:
        entityRef:
          type: string
        periodRef:
          type: string
        filedAt:
          type: string
          format: date-time
        irasAcknowledgementReference:
          type: string
        portalReference:
          type: string
        confirmedAt:
          type: string
          format: date-time
        governingFiledAt:
          type: string
          format: date-time
          description: The earlier date until a correction, the default of VP-13.
        conflict:
          type: object
          description: Present only while two filing facts disagree.
          properties:
            code:
              const: PER-010
            otherFiledAt:
              type: string
              format: date-time
          required: [code, otherFiledAt]
        lateDocuments:
          type: object
          properties:
            code:
              const: SUB-010
            count:
              type: integer
              minimum: 0
            docUuids:
              type: array
              maxItems: 500
              items:
                type: string
                format: uuid
          required: [code, count, docUuids]
      required: [entityRef, periodRef, filedAt, irasAcknowledgementReference, confirmedAt]
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required: [reason]
    BoundaryCheckRequest:
      type: object
      properties:
        docUuids:
          type: array
          minItems: 1
          maxItems: 5000
          description: >-
            At most 5,000 documents per call (API-49); a larger request is
            refused with `413`.
          items: { type: string, format: uuid }
      required: [docUuids]
    BoundaryCheckResult:
      type: object
      properties:
        checkedCount: { type: integer, minimum: 0 }
        submittedCount: { type: integer, minimum: 0 }
        submittedMembers:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/BoundaryMember'
      required: [checkedCount, submittedCount, submittedMembers]
    BoundaryMember:
      type: object
      properties:
        docUuid: { type: string, format: uuid }
        state:
          type: string
          enum: [SENT, SENT_UNCONFIRMED, RETRY, DEAD_LETTERED, REJECTED, ACKNOWLEDGED, SUPERSEDED, NETWORK_ISSUED, EXTERNALLY_SUBMITTED]
      required: [docUuid, state]
    WithdrawResult:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        state:
          type: string
          enum: [WITHDRAWN]
          x-extensible-enum: true
        reason:
          type: string
        withdrawnAt:
          type: string
          format: date-time
      required: [docUuid, state, reason, withdrawnAt]
    ReplayResult:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum: [QUEUED]
          x-extensible-enum: true
        replayedAt:
          type: string
          format: date-time
      required: [docUuid, version, state, replayedAt]
    SubmissionSummary:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        submissionType:
          type: string
          enum: [TYPE_1A, TYPE_1B, TYPE_2, TYPE_3]
          description: model/architecture/submission-types.yaml's 1A/1B/2/3 (API-09 UPPER_SNAKE_CASE).
          x-extensible-enum: true
        state:
          type: string
          enum:
            [READY, AWAITING_PRECEDING, QUEUED, SENT, SENT_UNCONFIRMED, RETRY, DEAD_LETTERED, REJECTED, CANCELLED,
              ACKNOWLEDGED, SUPERSEDED, NETWORK_ISSUED, EXTERNALLY_SUBMITTED, WITHDRAWN]
          x-extensible-enum: true
        dueDate:
          type: string
          format: date
        totalAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string (API-12).
        documentNumber:
          type: string
        documentTypeCode:
          type: string
          maxLength: 3
          pattern: '^38[01]$'
          description: >-
            The UNCL1001 document type code: 380 (invoice) or 381 (credit
            note). A pattern, not an enum, as in rules/openapi.yaml: API-09
            forbids numeric enum members (INV-T-5946 reports this to the owner).
        direction:
          type: string
          enum: [SALE, PURCHASE]
          x-extensible-enum: true
        counterpartyName:
          type: string
        counterpartyUen:
          type: string
        transactionDate:
          type: string
          format: date
        taxableAmount:
          $ref: '#/components/schemas/Money'
        gstAmount:
          $ref: '#/components/schemas/Money'
        submittedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgementId:
          type: string
      required: [docUuid, version, submissionType, state, dueDate]
    SubmissionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        nextCursor:
          type: string
      required: [items]
    SubmissionSummaryTotals:
      type: object
      properties:
        rowCount:
          type: integer
          minimum: 0
        totalTaxableAmount:
          $ref: '#/components/schemas/Money'
        totalGstAmount:
          $ref: '#/components/schemas/Money'
      required: [rowCount, totalTaxableAmount, totalGstAmount]
    ReconciliationBucketTotal:
      type: object
      properties:
        bucket:
          $ref: '#/components/schemas/ReconciliationBucket'
        count:
          type: integer
          minimum: 0
