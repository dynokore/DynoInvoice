asyncapi: 3.1.0
info:
  title: evidence events
  version: 1.2.0
  description: >-
    Every event evidence produces or consumes (API-43, STK-45), wrapped at
    publish time in the CloudEvents 1.0.2 envelope every service shares
    (API-40, ../service-runtime/schemas/cloud-event-envelope.schema.json) —
    each message below declares only its own `data` payload schema. This is an
    INV-T-2849 scaffold. INV-T-2854 (T10) added evidence's real §19.8 domain
    event below, from model/architecture/events.yaml's checklist; the
    ExampleHappened placeholder stays only because removing it is a
    breaking structural change under this repository's additive-only
    asyncapi-breaking-gate — its removal is a follow-up outside T10's
    declared scope (spectral/ is not in it), named in the INV-T-2854 MR.
    evidence-svc also produces the platform event ConnectionStatusChanged
    (model/architecture/events.yaml); that is authored once under
    service-runtime/ by T11 (STK-61), not here (T9's review, !3, rejected
    copying platform events into a producer directory).
  contact:
    name: evidence (see CODEOWNERS)
  license:
    name: Proprietary
defaultContentType: application/json
servers:
  production:
    host: 'event-log.invoice.internal'
    protocol: kafka
    description: Placeholder — the platform component event-log (SDS §18.14).
channels:
  evidenceEvidenceIntegrityFailed:
    address: 'gst.evidence.evidence-integrity-failed.v1'
    messages:
      EvidenceIntegrityFailed:
        $ref: '#/components/messages/EvidenceIntegrityFailed'
  evidencePriorSubmissionEvidenceImported:
    address: 'gst.evidence.prior-submission-evidence-imported.v1'
    messages:
      PriorSubmissionEvidenceImported:
        $ref: '#/components/messages/PriorSubmissionEvidenceImported'
  evidenceArchiveVolumeMeasured:
    address: 'gst.evidence.archive-volume-measured.v1'
    messages:
      ArchiveVolumeMeasured:
        $ref: '#/components/messages/ArchiveVolumeMeasured'
  evidenceExampleHappened:
    address: 'gst.evidence.example-happened.v1'
    messages:
      ExampleHappened:
        $ref: '#/components/messages/ExampleHappened'
operations:
  publishEvidenceIntegrityFailed:
    action: send
    description: EvidenceIntegrityFailed — catalogued in model/architecture/events.yaml (§19.8).
    channel:
      $ref: '#/channels/evidenceEvidenceIntegrityFailed'
    messages:
      - $ref: '#/channels/evidenceEvidenceIntegrityFailed/messages/EvidenceIntegrityFailed'
  publishPriorSubmissionEvidenceImported:
    action: send
    description: PriorSubmissionEvidenceImported — one event per record newly imported by importPriorEvidence (INV-REQ-1109).
    channel:
      $ref: '#/channels/evidencePriorSubmissionEvidenceImported'
    messages:
      - $ref: '#/channels/evidencePriorSubmissionEvidenceImported/messages/PriorSubmissionEvidenceImported'
  publishArchiveVolumeMeasured:
    action: send
    description: ArchiveVolumeMeasured — one event per entity once per UTC day (INV-REQ-878).
    channel:
      $ref: '#/channels/evidenceArchiveVolumeMeasured'
    messages:
      - $ref: '#/channels/evidenceArchiveVolumeMeasured/messages/ArchiveVolumeMeasured'
  publishExampleHappened:
    action: send
    description: Placeholder operation (INV-T-2849 scaffold) — replace with a real one.
    channel:
      $ref: '#/channels/evidenceExampleHappened'
    messages:
      - $ref: '#/channels/evidenceExampleHappened/messages/ExampleHappened'
components:
  messages:
    EvidenceIntegrityFailed:
      name: com.dynokore.gst.evidence.EvidenceIntegrityFailed.v1
      title: EvidenceIntegrityFailed
      summary: EvidenceIntegrityFailed — catalogued in model/architecture/events.yaml (§19.8).
      description: >-
        Catalogued event EvidenceIntegrityFailed (model/architecture/events.yaml, INV-NOTE-3 §19.8,
        INV-REQ-815; class: domain). Emitted by: evidence-svc. Consumed by: console-bff, notification-svc.
        Delivery: At-least-once. Payload (catalogue text): range, failing record. Authored by INV-T-2854
        (T10).
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/evidence-integrity-failed-payload.schema.json'
    PriorSubmissionEvidenceImported:
      name: com.dynokore.gst.evidence.PriorSubmissionEvidenceImported.v1
      title: PriorSubmissionEvidenceImported
      summary: A record of prior submission evidence was newly imported (INV-REQ-1109).
      description: >-
        Event PriorSubmissionEvidenceImported (INV-REQ-1109; class: domain). Emitted by: evidence-svc. Consumed by: submission-svc.
        Delivery: At-least-once. One event per record newly imported by importPriorEvidence, written in the
        transaction that stores the record, with the record's entity; none for a record that was already imported.
        The payload holds no personal data and no Doc UUID. submission-svc keeps (entityRef, documentNumber,
        transactionDate) in its own read model to decide the match of INV-REQ-1109 behavior 3.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/prior-submission-evidence-imported-payload.schema.json'
    ArchiveVolumeMeasured:
      name: com.dynokore.gst.evidence.ArchiveVolumeMeasured.v1
      title: ArchiveVolumeMeasured
      summary: The retained archive volume of an entity was measured (INV-REQ-878).
      description: >-
        Event ArchiveVolumeMeasured (INV-REQ-878; class: domain). Emitted by: evidence-svc. Consumed by: tenancy-svc.
        Delivery: At-least-once. One event is published per entity once per UTC day, carrying the size in bytes of
        everything evidence-svc retains for the entity at measuredAt. tenancy-svc consumes it into its metering
        counters, which getUsageCounters returns as archiveVolumeBytes. The payload holds no personal data.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/archive-volume-measured-payload.schema.json'
    ExampleHappened:
      name: com.dynokore.gst.evidence.ExampleHappened.v1
      title: ExampleHappened
      summary: Placeholder event (INV-T-2849 scaffold) — replace with a real one.
      contentType: application/cloudevents+json
      payload:
        $ref: './schemas/example-happened-payload.schema.json'
