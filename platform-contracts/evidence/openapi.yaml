      description: >-
        The internal half of the audit-pack resource of §19.7 (services.yaml
        evidence-svc `provides`; NFR-A.3), called by console-bff after
        routing the public `POST /bff/entities/{entityRef}/audit-pack-exports`
        (console-bff/openapi.yaml). A complete audit pack for the prescribed
        accounting period: submitted XML, acknowledgements, reconciliation
        work-paper and source references (NFR-A.3); `contents` lists them,
        with the verification report (INV-AC-676). Returns immediately with
        the job accepted (console-bff's 2s-per-call budget,
        sync-edges.yaml resilience_policy `console-bff -> any`); the caller
        polls `getAuditPackExport` for readiness.
      tags: [exports]
      x-principal: filing-workflow
      x-sync-edge: console-bff->evidence-svc
