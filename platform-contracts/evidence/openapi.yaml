components:
  parameters:
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 40
    PeriodRef:
      name: periodRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
        description: Opaque, calendar-issued (API-11); clients never construct it.
  schemas:
    CertificationReportRequest:
      type: object
      properties:
        entityRef:
          type: string
          maxLength: 40
        reportType:
          type: string
          maxLength: 60
        runReference:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 2000
      required: [entityRef, reportType, runReference]
    CertificationReportResponse:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
        entityRef:
          type: string
        reportType:
          type: string
        receivedAt:
          type: string
          format: date-time
      required: [reportId, entityRef, reportType, receivedAt]
    EvidenceChainItem:
      type: object
      properties:
        kind:
          type: string
          enum: [PAYLOAD, ACKNOWLEDGEMENT, DECISION_TRACE, AUDIT_ENTRY, CANONICAL_VERSION, SOURCE_DOCUMENT_REFERENCE]
          x-extensible-enum: true
        recordedAt:
          type: string
          format: date-time
        reference:
          type: string
          maxLength: 200
        packVersions:
          type: array
          description: >-
            The pack identifier and version applied by the decision, present on the
            DECISION_TRACE item (INV-REQ-691). The service always sends it on that item.
          items:
            $ref: '#/components/schemas/PackVersion'
      required: [kind, recordedAt, reference]
    PackVersion:
      type: object
      properties:
        packIdentifier:
          type: string
          maxLength: 100
        version:
          type: string
          maxLength: 40
      required: [packIdentifier, version]
    ChainReproduction:
      type: object
      description: The versions applied to the submission, recorded so it can be regenerated byte-identically (INV-REQ-1345).
      properties:
        mappingTableVersion:
          type: string
          maxLength: 40
        scopeRulesVersion:
          type: string
          maxLength: 40
        schematronVersion:
          type: string
          maxLength: 40
        overrideReleasedBy:
          type: string
          maxLength: 100
          description: The operator who released an override; present when an override was released.
      required: [mappingTableVersion, scopeRulesVersion, schematronVersion]
    IntegrityResult:
      type: string
      enum: [VERIFIED, FAILED, NEVER_RUN]
      x-extensible-enum: true
      description: Result of the last chain verification run for an entity and period (INV-REQ-661).
    IntegrityStatus:
      type: object
      description: 'Per entity and period: last verification run, result, chain length, period digest (INV-REQ-661).'
      properties:
        entityRef:
          type: string
          maxLength: 40
        periodRef:
          type: string
          maxLength: 20
        result:
          $ref: '#/components/schemas/IntegrityResult'
        lastRunAt:
          type: string
          format: date-time
          description: Absent when `result` is NEVER_RUN.
        chainLength:
          type: integer
          minimum: 0
        periodDigest:
          type: string
          maxLength: 200
          description: Absent when `result` is NEVER_RUN.
      required: [entityRef, periodRef, result, chainLength]
    RetrievalPending:
      type: object
      description: The 202 body of a lookup whose evidence is in a slow storage tier (INV-REQ-664, INV-Q-5954).
      properties:
        retrievalId:
          type: string
          format: uuid
        expectedRetrievalSeconds:
          type: integer
          minimum: 1
        storageTier:
          type: string
          maxLength: 40
      required: [retrievalId, expectedRetrievalSeconds, storageTier]
    RetrievalStatus:
      type: object
      properties:
        retrievalId:
          type: string
          format: uuid
        state:
          type: string
          enum: [PENDING, READY, FAILED]
          x-extensible-enum: true
        expectedRetrievalSeconds:
          type: integer
          minimum: 0
        completedAt:
          type: string
          format: date-time
      required: [retrievalId, state, expectedRetrievalSeconds]
    EvidenceChain:
      type: object
      properties:
        ackId:
          type: string
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        imported:
          type: boolean
          description: Evidence imported from a prior solution, marked as such in every enquiry response (FR-AB.7).
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceChainItem'
        reproduction:
          $ref: '#/components/schemas/ChainReproduction'
          description: Recorded versions applied (INV-REQ-1345). The service always sends it.
        integrityStatus:
          $ref: '#/components/schemas/IntegrityResult'
          description: Integrity status of the chain's entity and period (DEP-007). The service always sends it.
      required: [ackId, docUuid, version, imported, items]
    ReverseLookupItem:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        ackId:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
        state:
          type: string
          maxLength: 40
      required: [docUuid, version, state]
    ReverseLookupPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReverseLookupItem'
        nextCursor:
          type: string
        integrityStatus:
          $ref: '#/components/schemas/IntegrityResult'
          description: Integrity status of the evidence the page was read from (DEP-007). The service always sends it.
      required: [items]
    ExportManifest:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [OFFBOARDING]
          x-extensible-enum: true
        generatedAt:
          type: string
          format: date-time
        manifestUri:
          type: string
        itemCount:
          type: integer
      required: [tenantId, kind, generatedAt, manifestUri, itemCount]
    IntegrityReport:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        chainValid:
          type: boolean
        brokenLinks:
          type: array
          items:
            type: string
      required: [tenantId, generatedAt, chainValid, brokenLinks]
    SubjectAccessExport:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        manifestUri:
          type: string
      required: [generatedAt, manifestUri]
    PrivacyCase:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        subjectRef:
          type: string
          maxLength: 60
        status:
          type: string
          enum: [OPEN, EXPORT_READY, CLOSED]
          x-extensible-enum: true
        openedAt:
          type: string
          format: date-time
        subjectAccessExport:
          $ref: '#/components/schemas/SubjectAccessExport'
      required: [caseId, subjectRef, status, openedAt]
    PlaceLegalHoldRequest:
      type: object
      properties:
        entityRef:
          type: string
          maxLength: 40
        periodRef:
          type: string
          maxLength: 20
        reason:
          type: string
          maxLength: 500
      required: [entityRef, periodRef, reason]
    LegalHold:
      type: object
      properties:
        holdId:
          type: string
          format: uuid
        entityRef:
          type: string
        periodRef:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, RELEASED]
          x-extensible-enum: true
        placedAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          description: Present exactly when status is RELEASED.
        releasedBy:
          type: string
          maxLength: 128
          description: The identity of the caller that released the hold. Present exactly when status is RELEASED.
        releaseConfirmedBy:
          type: string
          maxLength: 128
          description: >-
            The confirming identity (the second `security.officer`). Present
            only when status is RELEASED and the hold is a closed tenant's.
      required: [holdId, entityRef, periodRef, reason, status, placedAt]
    ReleaseLegalHoldRequest:
      type: object
      properties:
        secondConfirmationBy:
          type: string
          maxLength: 128
          description: >-
            The second `security.officer`, a different person from the
            caller, who confirms the release of a closed tenant's hold
            (INV-Q-5082 A). Same name, type and length as the offboarding
            request's `secondConfirmationBy` (INV-REQ-875).
    AuditPackExport:
      type: object
      properties:
        packId:
          type: string
          format: uuid
        entityRef:
          type: string
        periodRef:
          type: string
        status:
          type: string
          enum: [PENDING, READY, FAILED]
          x-extensible-enum: true
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        downloadUri:
          type: string
        contents:
          type: array
          description: What the pack holds; present when `status` is READY. The service always sends it.
          items:
            type: string
            enum: [SUBMITTED_XML, ACKNOWLEDGEMENTS, RECONCILIATION_WORK_PAPER, SOURCE_REFERENCES, VERIFICATION_REPORT]
            x-extensible-enum: true
        integrityStatus:
          $ref: '#/components/schemas/IntegrityResult'
          description: Integrity status of the pack's entity and period (DEP-007). The service always sends it.
        expectedRetrievalSeconds:
          type: integer
          minimum: 0
          description: Expected retrieval time when the evidence is in a slow tier (INV-REQ-664). The service always sends it.
      required: [packId, entityRef, periodRef, status, requestedAt]
    DeletionResult:
      type: object
      properties:
        partitionId:
          type: string
        status:
          type: string
          enum: [DELETED]
          x-extensible-enum: true
        deletedAt:
          type: string
          format: date-time
      required: [partitionId, status, deletedAt]
    DeletionStatus:
      type: object
      description: >-
        Status resource of deleteAtRetentionEnd (API-17, INV-Q-3466 A); also
