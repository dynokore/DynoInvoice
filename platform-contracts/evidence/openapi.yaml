openapi: 3.1.0
info:
  title: evidence API
  version: 1.2.0
  description: >-
    Contract-first source of truth for evidence (API-01, STK-44). The
    `evidence-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Public and internal APIs (API standard §1 and §15): evidence-svc has no
    synchronous callee edge in model/architecture/sync-edges.yaml — every
    caller reaches it either through the public gateway or as console-bff's
    read/command surface, covered by sync-edges.yaml's generic
    `console-bff -> any` policy edge ("console reads", INV-T-2902, T14b).
    `POST /v1/certification-reports` is public (04-api-standards.md §15,
    `certification` principal). Every other operation is `/internal/v1/…`,
    reached only by console-bff, through which the auditor role and other
    permitted roles use it (services.yaml evidence-svc `provides`). Most
    writes (acknowledgements, decision traces, the audit log) arrive by
    event consumption, not this API (services.yaml evidence-svc `consumes`)
    — evidence-svc never calls a pipeline service to fetch them (`must_not`).


    Scope note for the reviewer: services.yaml's evidence-svc `provides`
    text maps to this file's operations as follows — "Lookup … queries" is
    `getAcknowledgementChain` and `reverseLookup`; "export … queries" is
    `getEvidenceExport` (offboarding); "verification … queries" is
    `getIntegrityReport`; "privacy … queries" is `getCase`; "retention …
    commands" is `deleteAtRetentionEnd` (the INV-REQ-1010 named operation)
    and `setRetentionJustification` (INV-NOTE-7 §7 SCR-30.4); "legal-hold
    commands" is `placeLegalHold` / `releaseLegalHold`; "the audit-pack
    resource of §19.7" is `createAuditPackExport` / `getAuditPackExport`,
    the internal half of the public
    `POST /bff/entities/{entityRef}/audit-pack-exports` that console-bff/openapi.yaml
    exposes; "certification-report intake" is `intakeCertificationReport`.
    `recordSecurityCase` (INV-REQ-880, INV-AC-1410, SCR-31.2) is a real
    write operation, not an architecture gap: it records the conclusion of
    a credential-compromise review as a security case, on the same case
    mechanism as the privacy cases `getCase` reads (services.yaml
    evidence-svc capabilities, "Security case records concluding a
    credential-compromise review"). No catalogue error code exists yet
    under an EVI- prefix
    (model/architecture/error-codes.yaml has no such prefix) — every
    operation below declares `x-error-codes: []`; also flagged as an
    architecture gap.
  contact:
    name: evidence (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway routes only the operations of a published train (API-26).
tags:
  - name: certification
    description: Certification-report intake from the certification runner (§28.9, §35.8).
  - name: lookup
    description: Acknowledgement-ID and reverse lookup (FR-AA.12–AA.15, FR-X.9–X.11).
  - name: exports
    description: Offboarding export and the audit-pack resource (§19.7, NFR-A.3, FR-Q.17).
  - name: verification
    description: Hash-chain verification and the integrity report (§35.11).
  - name: privacy
    description: Privacy case records and subject-access exports (§33.14, NFR-S.6).
  - name: retention
    description: Legal hold and controlled deletion at retention end (FR-D.1–D.4, INV-REQ-1010, INV-REQ-1011).
paths:
  /v1/certification-reports:
    post:
      operationId: intakeCertificationReport
      summary: Record a certification report from the certification runner
      description: >-
        Certification-report intake as the `certification` principal
        (services.yaml evidence-svc `provides`; §28.9, §35.8, §22.5). Public,
        non-production workspace only (NFR-S.4, same principal restriction
        as the ingestion-svc catalogue rows of 04-api-standards.md §15).


        Timeout class (INV-REQ-1204 b7, INV-Q-3476): `API gateway -> any
        other service's public /v1 operation`, 3 s (x-timeout 3000).
        When the gateway's circuit breaker for this service is open, or
        the call times out, the gateway answers `503` with the API-20
        envelope; the `503` is retryable, and the client retries with
        the same Idempotency-Key (API-15, INV-Q-3571).
      tags: [certification]
      x-principal: certification
      x-timeout: 3000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010]
      x-operation:
        role: certification
        scope: entity
        precondition: >-
          The calling workspace is a non-production certification workspace
          (NFR-S.4); no report already recorded for the same (entityRef,
          reportType, runReference).
        reversibility: IRREVERSIBLE
        repeatKey: "(entityRef, reportType, runReference) — a repeat returns the original result unchanged."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationReportRequest'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  reportType: "SCHEMATRON_CONFORMANCE"
                  runReference: "CERT-RUN-2026-04-01"
                  summary: "All sample documents passed Schematron validation"
      responses:
        '201':
          description: The certification report was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationReportResponse'
              examples:
                default:
                  value:
                    reportId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    reportType: "SCHEMATRON_CONFORMANCE"
                    receivedAt: "2026-04-01T02:00:00Z"
        '200':
          description: Idempotent replay — the original result, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationReportResponse'
              examples:
                default:
                  value:
                    reportId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    reportType: "SCHEMATRON_CONFORMANCE"
                    receivedAt: "2026-04-01T02:00:00Z"
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/acknowledgements/{ackId}:
    get:
      operationId: getAcknowledgementChain
      summary: Look up the complete evidence chain of a submission by Acknowledgement ID
      description: >-
        Lookup by Acknowledgement ID, the auditor role's own resource
        (services.yaml evidence-svc `provides`, capabilities "Enquiry
        lookups"; FR-AA.12, FR-X.9). Returns the complete chain — payload,
        acknowledgement, decision trace and audit entries — for that
        submission. Usable by the auditor role alone; every lookup is
        audit-logged and changes no state (FR-X.11, FR-AA.14, INV-REQ-958).
        Queries only the evidence store's own indexes, never another
        service (FR-AA.15). The chain also holds the canonical version and
        the source document reference, the decision trace carries its
        pack versions, and the recorded versions are in `reproduction`
        (INV-REQ-691, INV-REQ-1345). The `auditor` role alone may call it
        and each lookup is itself audit-logged (INV-REQ-711, INV-REQ-725).
        Answers 202 when the evidence is in a tier whose expected retrieval
        time exceeds the interactive limit and 200 otherwise; the client
        polls `getEvidenceRetrieval` and repeats the lookup when it is READY
        (INV-REQ-664).
      tags: [lookup]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-691, INV-REQ-723, INV-REQ-711, INV-REQ-725, INV-REQ-726, INV-REQ-1345, INV-REQ-664]
      parameters:
        - name: ackId
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: The submission's complete evidence chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChain'
              examples:
                default:
                  value:
                    ackId: "IRAS-ACK-2026Q1-E001"
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    imported: false
                    items:
                      - kind: PAYLOAD
                        recordedAt: "2026-03-20T03:10:00Z"
                        reference: "payload/3fa85f64.../v2.xml"
                      - kind: ACKNOWLEDGEMENT
                        recordedAt: "2026-03-20T03:15:21Z"
                        reference: "IRAS-ACK-2026Q1-E001"
                      - kind: DECISION_TRACE
                        recordedAt: "2026-03-20T03:14:50Z"
                        reference: "trace/3fa85f64.../v2"
        '202':
          description: The evidence is in a slow storage tier; poll getEvidenceRetrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalPending'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/lookup:
    get:
      operationId: reverseLookup
      summary: Reverse-lookup submissions by counterparty, date range or document number
      description: >-
        Reverse lookup (services.yaml evidence-svc `provides`, capabilities
        "Enquiry lookups"; FR-AA.13, FR-X.10). Returns every related
        submission with its acknowledgement state. Auditor role only,
        audit-logged, changes no state (FR-X.11, INV-REQ-958). The `auditor`
        role alone may call it and each lookup is itself audit-logged
        (INV-REQ-711, INV-REQ-725). Parameters combine with AND: `docUuid`,
        `documentNumber`, `counterparty`, `dateFrom`/`dateTo`, `periodRef`
        and `categoryCode` index the archive (INV-REQ-650). Answers 202 when
        the evidence is in a tier whose expected retrieval time exceeds the
        interactive limit and 200 otherwise; the client polls
        `getEvidenceRetrieval` and repeats the lookup when it is READY
        (INV-REQ-664).
      tags: [lookup]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-710, INV-REQ-724, INV-REQ-711, INV-REQ-725, INV-REQ-650, INV-REQ-664]
      parameters:
        - name: counterparty
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: documentNumber
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - name: docUuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: periodRef
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of matching submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseLookupPage'
              examples:
                default:
                  value:
                    items:
                      - docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        version: 2
                        ackId: "IRAS-ACK-2026Q1-E001"
                        acknowledgedAt: "2026-03-20T03:15:21Z"
                        state: "ACKNOWLEDGED"
        '202':
          description: The evidence is in a slow storage tier; poll getEvidenceRetrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalPending'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/exports:
    get:
      operationId: getEvidenceExport
      summary: Read the tenant's offboarding export manifest
      description: >-
        Offboarding export (services.yaml evidence-svc `provides`, "export …
        queries"; capabilities "Audit pack and offboarding export"). A
        self-describing, bulk-exportable manifest scoped to the tenant
        (FR-9.15, FR-D.7). Changes no state (INV-REQ-958). Blocked with
        DEP-007 when evidence chain verification has failed for the range
        (INV-NOTE-3 §21.2 raising points; INV-REQ-662) — this is the
        offboarding export the condition names, including an
        `exportAuditPack` call made as part of offboarding.
      tags: [exports]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: [DEP-007]
      x-requirements: [INV-REQ-650, INV-REQ-642, INV-REQ-662]
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The offboarding export manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportManifest'
              examples:
                default:
                  value:
                    tenantId: "5e0b8a0e-2c4d-4b8f-9a61-0d3c7f1e2b44"
                    kind: "OFFBOARDING"
                    generatedAt: "2026-04-01T02:00:00Z"
                    manifestUri: "s3://evidence-exports/offboarding/5e0b8a0e.../manifest.json"
                    itemCount: 18422
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/integrity-report:
    get:
      operationId: getIntegrityReport
      summary: Read the hash-chain integrity report
      description: >-
        Verification queries (services.yaml evidence-svc `provides`;
        capabilities "routine verification and the integrity report",
        §35.11). Changes no state (INV-REQ-958).
      tags: [verification]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The most recent integrity report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityReport'
              examples:
                default:
                  value:
                    tenantId: "5e0b8a0e-2c4d-4b8f-9a61-0d3c7f1e2b44"
                    generatedAt: "2026-04-01T01:00:00Z"
                    chainValid: true
                    brokenLinks: []
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/cases/{caseId}:
    get:
      operationId: getCase
      summary: Read a privacy case record and its subject-access export, if any
      description: >-
        Privacy queries (services.yaml evidence-svc `provides`; capabilities
        "Privacy case records and subject-access exports", §33.14). Served
        without modifying submitted evidence: a scoped export only
        (NFR-S.6). The correction itself — a master-data change with an
        appended annotation — is orchestrated by console-bff and lands on
        masterdata-svc and the evidence annotation, neither of which this
        operation performs (FR-AE.75; evidence-svc `must_not` call a
        pipeline service).
      tags: [privacy]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1379]
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The case record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyCase'
              examples:
                default:
                  value:
                    caseId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    subjectRef: "SUBJ-88213"
                    status: "EXPORT_READY"
                    openedAt: "2026-03-15T09:00:00Z"
                    subjectAccessExport:
                      generatedAt: "2026-03-16T09:00:00Z"
                      manifestUri: "s3://evidence-exports/privacy/3fa85f64.../manifest.json"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/legal-holds:
    post:
      operationId: placeLegalHold
      summary: Place a legal hold over an entity's period, blocking retention deletion
      description: >-
        Legal-hold commands (services.yaml evidence-svc `provides`). A
        legal hold stops the controlled deletion operation at retention end
        (FR-D.4). Keel's operation catalogue (INV-NOTE-7 §7 SCR-30.3)
        assigns `placeLegalHold` to `tax.approver`. `tax.approver` places the
        hold while the tenant is live; the operator's `security.officer`
        places it for a tenant that has closed, for a hold the custody holder
        requested through a signed link issued by access-svc inside the
        notice window (INV-REQ-639 behavior 3). The signed-link request is
        access-svc's record and is not a property of this request.
      tags: [retention]
      x-principal: filing-workflow
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-639]
      x-operation:
        role: tax.approver, security.officer
        scope: entity+period
        precondition: >-
          No active legal hold already covers the same (entityRef, periodRef).
          `tax.approver` places the hold while the tenant is live (INV-REQ-639
          behavior 2); the operator's `security.officer` places it for a
          tenant that has closed, for a hold the custody holder requested
          through a signed link issued by access-svc inside the notice window
          (INV-REQ-639 behavior 3, INV-AC-1808, INV-Q-1707).
        reversibility: COMPENSABLE
        repeatKey: "(entityRef, periodRef, reason) — a repeat returns the existing active hold, unchanged."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'API-15: a UUID, deduplicating an exact request replay for at least 24h.'
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceLegalHoldRequest'
            examples:
              default:
                value:
                  entityRef: "E-001"
                  periodRef: "2026-Q1"
                  reason: "Regulator inquiry INV-2026-0113"
      responses:
        '201':
          description: The legal hold was placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
              examples:
                default:
                  value:
                    holdId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    reason: "Regulator inquiry INV-2026-0113"
                    status: "ACTIVE"
                    placedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/legal-holds/{holdId}/release:
    post:
      operationId: releaseLegalHold
      summary: Release a legal hold
      description: >-
        Legal-hold commands (services.yaml evidence-svc `provides`; FR-D.4).
        Once released, a due retention deletion for the covered partitions
        may proceed on its own schedule. The same role reverses its own
        placement (INV-NOTE-7 §7 SCR-30.3): `tax.approver`. While the tenant
        is live only `tax.approver` releases the hold; the hold of a closed
        tenant is released only by the operator's `security.officer`, with a
        second `security.officer`, a different person from the caller, named
        in `secondConfirmationBy` (INV-Q-5082 A). The closed-tenant rule is
        enforced by evidence-svc, not by the schema, because the body is
        optional so that live-tenant callers are unchanged: for a closed
        tenant's hold a missing `secondConfirmationBy` answers 400 SRT-001,
        and a caller without `security.officer`, a confirmer who does not
        hold `security.officer`, or a confirmer equal to the caller answers
        403 SRT-004; the hold stays ACTIVE in every refusal. evidence-svc
        writes one audit-log entry naming `holdId`, the releasing identity
        and, for a closed tenant, the confirming identity, in the same
        transaction as the status change and before the response, so a
        failed audit write leaves the hold ACTIVE (the pattern of
        INV-REQ-639 behavior 5).
      tags: [retention]
      x-principal: filing-workflow
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-639]
      x-operation:
        role: tax.approver, security.officer
        scope: entity+period
        precondition: >-
          The hold is ACTIVE. While the tenant is live only `tax.approver`
          releases the hold (INV-REQ-639 behavior 2); the hold of a closed
          tenant is released only by the operator's `security.officer`, and a
          second `security.officer`, a different person from the caller,
          confirms it in `secondConfirmationBy` (INV-Q-5082 A); there is no
          sole-operator path for this release, so an operator with one
          `security.officer` cannot release it.
        reversibility: COMPENSABLE
        repeatKey: "holdId — no-op; the hold is already released."
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseLegalHoldRequest'
            examples:
              closedTenant:
                value:
                  secondConfirmationBy: "identity:USR-004"
      responses:
        '200':
          description: The hold's release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
              examples:
                default:
                  value:
                    holdId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    reason: "Regulator inquiry INV-2026-0113"
                    status: "RELEASED"
                    placedAt: "2026-04-01T02:00:00Z"
                    releasedAt: "2026-06-01T02:00:00Z"
                    releasedBy: "identity:USR-002"
                closedTenant:
                  value:
                    holdId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    reason: "Regulator inquiry INV-2026-0113"
                    status: "RELEASED"
                    placedAt: "2026-04-01T02:00:00Z"
                    releasedAt: "2026-06-01T02:00:00Z"
                    releasedBy: "identity:USR-003"
                    releaseConfirmedBy: "identity:USR-004"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/entities/{entityRef}/periods/{periodRef}/integrity-status:
    get:
      operationId: getIntegrityStatus
      summary: Read the evidence integrity status of an entity's period
      description: >-
        Per entity and period: last verification run, result, chain length,
        period digest (INV-REQ-661). Changes no state.
      tags: [verification]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-661]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '200':
          description: The integrity status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityStatus'
              examples:
                default:
                  value:
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    result: "VERIFIED"
                    lastRunAt: "2026-04-01T01:00:00Z"
                    chainLength: 1204
                    periodDigest: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/retrievals/{retrievalId}:
    get:
      operationId: getEvidenceRetrieval
      summary: Read the progress of a cold-tier evidence retrieval
      description: >-
        Progress of the retrieval a lookup answered 202 for (INV-REQ-664,
        INV-Q-5954). The client repeats the lookup when the state is READY.
        404 for an unknown id.
      tags: [lookup]
      x-principal: reporting
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-664]
      parameters:
        - name: retrievalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
