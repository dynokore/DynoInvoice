                $ref: '#/components/schemas/SecurityCase'
              examples:
                default:
                  value:
                    caseId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    reviewReference: "REVIEW-2026-0142"
                    auditLogEntryIds: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                    outcome: "CREDENTIALS_ROTATED"
                    breachAssessmentOpened: false
                    recordedAt: "2026-04-01T02:00:00Z"
        '200':
          description: Idempotent replay — the original result, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCase'
              examples:
                default:
                  value:
                    caseId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    reviewReference: "REVIEW-2026-0142"
                    auditLogEntryIds: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                    outcome: "CREDENTIALS_ROTATED"
                    breachAssessmentOpened: false
                    recordedAt: "2026-04-01T02:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/tenants/{tenantId}/retention-justification:
