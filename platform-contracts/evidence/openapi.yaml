  /internal/v1/evidence/partitions/{partitionId}/deletions:
    post:
      operationId: deleteAtRetentionEnd
      summary: Delete a retention partition at the end of its retention period
      description: >-
        Retention commands (services.yaml evidence-svc `provides`). The
        named `deleteAtRetentionEnd` operation of INV-REQ-1010 behaviour #7:
        deliberate, co-approved and audited, stopped by a legal hold
        (FR-D.4). A repeat on the same partition fails loudly rather than
        silently no-op'ing, since a second deletion attempt after the first
        succeeded indicates a defect worth surfacing (INV-REQ-1011). Blocked
        with DEP-007 when evidence chain verification has failed for the
        range (INV-NOTE-3 §21.2 raising points; INV-REQ-662).


        Long command (INV-Q-3438 A, INV-Q-3466 A, API-17): a deletion
        finished within x-timeout returns `200` with `DeletionResult`; one
        that is not returns `202` with `Location` and `Retry-After` pointing
        at its own status resource, `getPartitionDeletion`
        (`/internal/v1/evidence/partitions/{partitionId}/deletion`), and the
        `DeletionStatus` body with state RUNNING.


        The server is single-flight on the natural key `partitionId`
        (INV-Q-3551), with or without an Idempotency-Key: while a deletion of
        the partition is RUNNING, a call with a new key or with no key
        returns `409` and starts nothing; once the partition is DELETED, any
        repeat, keyed or keyless, fails loudly with the same explicit error
        and deletes nothing (INV-REQ-1011, INV-AC-666); no call ever starts a
        second deletion of a partition. The key only adds API-15's replay: a
        repeat with the same key replays the stored `202`. Departure from
        API-15: a keyless call never gets API-15's missing-key `400`,
        because the 1.0.0 contract declared no Idempotency-Key and requiring
        one now would break existing callers (API-03); API-15 already keys
        some operations on a natural key (sourceKey + sourceRevision,
        batchId, the AP notification ID). console-bff still always sends a
        key.
      tags: [retention]
      x-principal: filing-workflow
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: [DEP-007]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-1011, INV-REQ-639, INV-REQ-662]
      x-operation:
        role: security.officer, tax.approver
        scope: entity+period
        precondition: >-
          The partition's retention period has elapsed; no active legal
          hold covers it; both required approvals are recorded — security.officer
          in SaaS (FR-D.4), tax.approver in a private installation
          (evidence-svc `forms_text`).
        reversibility: IRREVERSIBLE
        repeatKey: "partitionId — a repeat FAILS LOUDLY (INV-REQ-1011), unlike every other operation's safe repeat."
      parameters:
        - name: partitionId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: 'API-15: a UUID; a repeat with the same key replays the stored 202 (INV-Q-3438). Optional because requiring it would break 1.0.0 callers (API-03); without it the server stays single-flight on partitionId (409 while RUNNING, loud failure after DELETED) and never returns 400 (INV-Q-3551).'
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The partition was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResult'
              examples:
                default:
                  value:
                    partitionId: "PART-2019-Q1"
                    status: "DELETED"
                    deletedAt: "2026-04-01T02:00:00Z"
        '202':
          description: >-
            The deletion did not finish within x-timeout and continues
            asynchronously (API-17, INV-Q-3438 A); poll the status resource.
          headers:
            Location:
              schema: { type: string }
              description: '`/internal/v1/evidence/partitions/{partitionId}/deletion` (API-17).'
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before polling the status resource (API-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
              examples:
                default:
                  value:
                    partitionId: "PART-2019-Q1"
                    state: "RUNNING"
                    startedAt: "2026-04-01T02:00:00Z"
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/partitions/{partitionId}/deletion:
    get:
      operationId: getPartitionDeletion
      summary: Read the status of a partition's deletion at retention end
      description: >-
        The status resource of `deleteAtRetentionEnd` (API-17, INV-Q-3438 A,
        INV-Q-3466 A), the operation's own record, as the batch and
        audit-pack resources are. `state` is RUNNING, SUCCEEDED or FAILED;
        `result` is the `DeletionResult` only when SUCCEEDED and `error` the
        API-20 envelope only when FAILED. Readable only by the principal
        that started the deletion, and kept at least 7 days (API-17).
      tags: [retention]
      x-principal: filing-workflow
      x-sync-edge: console-bff->evidence-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1010, INV-REQ-1011, INV-REQ-1232]
      parameters:
        - name: partitionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The deletion's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
              examples:
                default:
                  value:
                    partitionId: "PART-2019-Q1"
                    state: "SUCCEEDED"
                    startedAt: "2026-04-01T02:00:00Z"
                    completedAt: "2026-04-01T02:41:10Z"
                    result:
                      partitionId: "PART-2019-Q1"
                      status: "DELETED"
                      deletedAt: "2026-04-01T02:41:10Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/evidence/security-cases:
