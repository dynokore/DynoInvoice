      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/PeriodRef'
      responses:
        '202':
          description: The audit-pack export job was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPackExport'
              examples:
                default:
                  value:
                    packId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    periodRef: "2026-Q1"
                    status: "PENDING"
                    requestedAt: "2026-04-01T02:00:00Z"
        default:
