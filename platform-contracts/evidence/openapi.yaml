                    receivedOn: "2026-03-01"
                    responseDeadline: "2026-03-31"
                    deadlinePeriodDays: 30
        '200':
          description: The `requestReference` is held by a case with the same `subjectRef`, `requestKind` and `receivedOn` — the original case, unchanged.
          content:
