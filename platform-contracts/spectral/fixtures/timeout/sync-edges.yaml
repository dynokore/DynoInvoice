# Fixture for spectral/self-test-timeouts.sh: rows in the shape of invoice-docs
# model/architecture/sync-edges.yaml resilience_policy (INV-NOTE-3 §36.6 values).
resilience_policy:
- edge: payload-svc → masterdata-svc
  timeout_or_budget: 80 ms budget (pre-issuance), 1 s otherwise
- edge: Any → tenancy-svc (fallback)
  timeout_or_budget: 500 ms
- edge: Any → access-svc (fallback)
  timeout_or_budget: 500 ms
- edge: control-plane-svc → tenancy-svc
  timeout_or_budget: Per §13.7
- edge: console-bff → any
  timeout_or_budget: 2 s per call, at most 2 calls per view
- edge: Gateway → ingestion-svc
  timeout_or_budget: 10 s (batch), 3 s (transaction), 300 ms P95 (pre-issuance total)
- edge: API gateway → ingestion-svc requestIssuance
  timeout_or_budget: 5 s (issuance class)
- edge: API gateway → any other service's public /v1 operation
  timeout_or_budget: 3 s; 10 s for request bodies above 1 MB
- edge: console-web → console-bff
  timeout_or_budget: 3 s for an operation making at most one downstream call, 5 s for two sequential downstream calls
