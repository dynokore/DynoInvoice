openapi: 3.1.0
info: {title: fixture, version: 1.0.0}
paths:
  /v1/things:
    post:
      operationId: postThing
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ThingRequest'}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThingResponse'}
components:
  schemas:
    ThingRequest:
      type: object
      properties:
        documentFunction:
          type: string
          enum: [INVOICE, CREDIT_NOTE, DEBIT_NOTE, BILL_FOR_PAYMENT]
    ThingResponse:
      type: object
      properties:
        linkRef: {type: string}
