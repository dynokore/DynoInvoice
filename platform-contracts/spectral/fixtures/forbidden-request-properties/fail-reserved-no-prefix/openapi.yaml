openapi: 3.1.0
info: {title: fixture, version: 1.0.0}
paths:
  /v1/things:
    post:
      operationId: postThing
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AggregateLine'}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ThingResponse'}
components:
  schemas:
    AggregateLine:
      type: object
      properties:
        categoryCode:
          type: string
          description: 'The System decides it.'
    ThingResponse:
      type: object
      properties:
        linkRef: {type: string}
