# spectral/ruleset.yaml — INV-T-2849 (T5)
#
# Encodes invoice-docs/standards/04-api-standards.md (API) as machine-checked
# rules. Each rule that implements a specific API-nn row is named `inv-api-nn`
# per API-02's own instruction ("A rule of this standard enforced by Spectral
# names its ruleset rule inv-api-nn"). `formats:` scopes a rule to OpenAPI
# (oas3_1) or AsyncAPI (aas3) documents, since one ruleset lints both
# (ci/`spectral-lint` in .gitlab-ci.yml runs it against every directory's
# openapi.yaml and asyncapi.yaml).
#
# Not exhaustive: this is the scaffold (INV-T-2849) that gives every service
# directory a starting ruleset. A service adds a rule here in its own change
# when a real operation needs a check this file doesn't yet have.
extends:
  - spectral:oas
  - spectral:asyncapi
rules:
  # --- API-01: contract-first, one directory per service ----------------------
  # Enforced by repository layout and CODEOWNERS, not lintable per-document.

  # --- API-02: operationId, one tag, x-principal, x-error-codes, x-timeout,
  # x-requirements --------------------------------------------------------------
  inv-api-02-operation-id:
    description: API-02 — every operation has an operationId in lowerCamelCase.
    message: "{{property}} operationId must be lowerCamelCase (API-02)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: operationId
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*$"

  inv-api-02-one-tag:
    description: API-02 — every operation has at least one tag (one per resource).
    message: "operation must have at least one tag (API-02)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: tags
      function: length
      functionOptions:
        min: 1

  inv-api-02-x-principal:
    description: >-
      API-02, API-23 — every operation declares exactly one principal scope, or
      `workload` on an installer-only operation or on a gateway key-material query
      on access-svc (API-23/API-25 workload note; owner rulings INV-Q-3826 A,
      INV-Q-4006 A; INV-T-3836, INV-T-4030).
    message: "x-principal must be one of the API-23 scopes, or `workload` on an installer-only operation or an api-gateway->access-svc operation (API-02, API-23/API-25 workload note)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-principal
      function: enumeration
      functionOptions:
        values: ["ingest", "filing-workflow", "ap-callback", "reporting", "monitoring", "certification", "workload"]

  inv-api-02-x-principal-workload-restricted:
    description: >-
      API-23/API-25 workload note — no other operation may use `workload`: an
      operation declaring x-principal `workload` must be an internal operation
      served on an installer edge (x-sync-edge 'installer-><callee>', today
      recordInstallationAction; owner ruling INV-Q-3826 A, INV-T-3836) or an
      access-svc operation on the API gateway's edge (x-sync-edge
      'api-gateway->access-svc': getVerificationKeys, getRevocationList; owner
      ruling INV-Q-4006 A, INV-T-4030). Self-test: self-test-workload-rule.sh.
    message: "x-principal `workload` is only for installer-only operations (x-sync-edge installer-><callee>) and the gateway's access-svc key-material queries (x-sync-edge api-gateway->access-svc) (API-23/API-25 workload note)"
    given: "$.paths[*][?(@property.match(/^(get|post|put|delete|patch)$/) && @['x-principal'] === 'workload')]"
    severity: error
    formats: ["oas3_1"]
    then:
      - field: x-sync-edge
        function: defined
      - field: x-sync-edge
        function: pattern
        functionOptions:
          match: "^(installer->[a-z0-9-]+|api-gateway->access-svc)$"

  inv-api-02-x-error-codes:
    description: API-02 — every operation declares x-error-codes (every catalogue code it can return).
    message: "x-error-codes must be present (API-02)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-error-codes
      function: defined

  inv-api-02-x-timeout:
    description: API-02 — every operation declares x-timeout, from SDS §36.6.
    message: "x-timeout must be a number of milliseconds (API-02)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-timeout
      function: schema
      functionOptions:
        schema:
          type: number
          exclusiveMinimum: 0

  inv-api-02-x-requirements:
    description: API-02 — every operation declares the requirement keys it implements.
    message: "x-requirements must be present, even if empty (API-02)"
    given: "$.paths[*][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-requirements
      function: defined

  # API-08: every operation under /internal/v1 carries x-sync-edge '<caller>-><callee>'.
  # INV-T-2850 follow-up: the previous rule selected only operations that already
  # carried x-sync-edge (so a missing one never fired) and its pattern required a
  # caller ending in "svc" (so console-bff never matched). It now selects every
  # internal operation and requires the field. That the edge is in the allowlist
  # (invoice-docs model/architecture/sync-edges.yaml; callers 'Any except X' and
  # 'API gateway' are written `any` and `api-gateway`) and that the callee is the
  # owning service is checked by spectral/check-sync-edges.py (CI job
  # sync-edge-allowlist-check); Spectral cannot read that file.
  inv-api-08-x-sync-edge:
    description: API-08 — every /internal/v1 operation carries x-sync-edge '<caller>-><callee>'.
    message: "internal operation must carry x-sync-edge: <caller>-><callee> (API-08): {{error}}"
    given: "$.paths[?(@property.startsWith('/internal/v1/'))][get,post,put,delete,patch]"
    severity: error
    formats: ["oas3_1"]
    then:
      - field: x-sync-edge
        function: defined
      - field: x-sync-edge
        function: pattern
        functionOptions:
          # console-bff->* is the shared runtime contract's edge (INV-T-3007, INV-Q-3425 A);
          # check-sync-edges.py accepts it only in service-runtime/.
          match: "^([a-z][a-z0-9-]*->[a-z][a-z0-9-]*-(svc|bff)|console-bff->\\*)$"

  # --- FR-AC.1 / FR-AC.19: the per-operation extension -------------------------
  # A state-changing or third-party-transmitting operation (FR-AC.1's own
  # definition — never a GET) declares its role/scope, precondition,
  # reversibility and repeat key together, as one object.
  inv-fr-ac1-x-operation-required:
    description: FR-AC.1, FR-AC.19 — a state-changing operation declares x-operation.
    message: "x-operation must be present on a state-changing operation (FR-AC.1)"
    given: "$.paths[*][post,put,delete]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-operation
      function: defined

  inv-fr-ac1-x-operation-shape:
    description: FR-AC.1, FR-AC.19 — x-operation carries all four declared properties.
    message: "x-operation is incomplete: {{error}} (FR-AC.1, FR-AC.19)"
    given: "$.paths[*][post,put,delete].x-operation"
    severity: error
    formats: ["oas3_1"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            role: { type: string, minLength: 1 }
            scope: { type: string, minLength: 1 }
            precondition: { type: string, minLength: 1 }
            repeatKey: { type: string, minLength: 1 }
            reversibility: { enum: ["UNDOABLE", "COMPENSABLE", "IRREVERSIBLE"] }
          required: ["role", "scope", "precondition", "repeatKey", "reversibility"]

  # --- API-05, API-06, API-07: paths and methods -------------------------------
  inv-api-05-path-kebab-case:
    description: API-05 — path segments are kebab-case (a path parameter is exempt).
    message: "path segment '{{value}}' must be kebab-case (API-05)"
    given: "$.paths[*]~"
    severity: error
    formats: ["oas3_1"]
    then:
      function: pattern
      functionOptions:
        match: "^(/[a-z][a-z0-9-]*|/\\{[a-zA-Z][a-zA-Z0-9]*\\})*$"

  inv-api-07-no-patch:
    description: API-07 — PATCH is not used.
    message: "PATCH is not used (API-07); PUT replaces, POST commands"
    given: "$.paths[*]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: patch
      function: undefined

  # --- API-09: casing, extensible enums -----------------------------------------
  inv-api-09-enum-casing:
    description: API-09 — enum values are UPPER_SNAKE_CASE.
    message: "enum value '{{value}}' must be UPPER_SNAKE_CASE (API-09)"
    given: "$..[?(@.enum)].enum[*]"
    severity: error
    formats: ["oas3_1"]
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][A-Z0-9_]*$"

  inv-api-09-field-casing:
    description: API-09 — field names are camelCase.
    message: "field name '{{property}}' must be camelCase (API-09)"
    given: "$..properties"
    severity: error
    formats: ["oas3_1"]
    then:
      function: casing
      functionOptions:
        type: camel

  # --- API-12: money fields ------------------------------------------------------
  # Checks OpenAPI (oas3_1), AsyncAPI (aas3) and a standalone event JSON Schema
  # document alike (json-schema-2020-12, STK-74's own draft) — not OpenAPI only.
  # An AsyncAPI message's payload is usually an external $ref
  # (schemas/*.schema.json); `aas3` alone already reaches a money field inside
  # it once spectral resolves the ref while linting the asyncapi.yaml that
  # holds it (verified: a fixture money field typed `number` there is
  # rejected). `json-schema-2020-12` is kept too so the same field is also
  # caught if a schema file is ever linted on its own (INV-T-2855, T11,
  # coordinator-authorised scope extension — T10 slipped a `number`-typed
  # money field past CI this way; see
  # spectral/self-test-money-rule.sh and money-rule-self-test in
  # .gitlab-ci.yml for the regression proof).
  inv-api-12-money-format:
    description: API-12 — a money field (name ends Amount/Price/Total) is a decimal-pattern string.
    message: "money field '{{property}}' must be a string with format decimal and a scale pattern (API-12)"
    given: "$..properties[?(@property.match(/(Amount|Price|Total)$/))]"
    severity: error
    formats: ["oas3_1", "aas3", "json-schema-2020-12"]
    then:
      - field: type
        function: enumeration
        functionOptions:
          values: ["string"]
      - field: pattern
        function: truthy

  # --- API-13: identifiers ---------------------------------------------------
  inv-api-13-id-max-length:
    description: API-13 — a caller-supplied key (sourceKey) is at most 128 characters.
    message: "sourceKey must declare maxLength (API-13)"
    given: "$..properties.sourceKey"
    severity: error
    formats: ["oas3_1"]
    then:
      field: maxLength
      function: truthy

  # --- API-14: absent optional fields, not null --------------------------------
  inv-api-14-no-nullable:
    description: API-14 — a field's absence means "not sent"; the legacy nullable keyword is not used.
    message: "nullable is not used — omit the field instead (API-14)"
    given: "$..[?(@.nullable)]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: nullable
      function: falsy

  # --- API-31: deprecation headers -----------------------------------------------
  inv-api-31-deprecation-sunset:
    description: API-31 — a deprecated operation declares x-sunset.
    message: "a deprecated operation must declare x-sunset (API-31)"
    given: "$.paths[*][get,post,put,delete][?(@.deprecated)]"
    severity: error
    formats: ["oas3_1"]
    then:
      field: x-sunset
      function: truthy

  # --- API-04: examples --------------------------------------------------------
  inv-api-04-examples:
    description: API-04 — every response media type declares an example.
    message: "response content must declare examples or an example (API-04)"
    given: "$.paths[*][get,post,put,delete].responses[*].content[*]"
    severity: warn
    formats: ["oas3_1"]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: ["example"]
            - required: ["examples"]

  # --- API-40, API-41: events (AsyncAPI) ----------------------------------------
  inv-api-40-event-type-pattern:
    description: API-40 — an event's name matches com.dynokore.gst.<service>.<EventName>.v<major>.
    message: "message name '{{value}}' must match com.dynokore.gst.<service>.<EventName>.v<n> (API-40)"
    given: "$.components.messages[*].name"
    severity: error
    formats: ["aas3"]
    then:
      function: pattern
      functionOptions:
        match: "^com\\.dynokore\\.gst\\.[a-z-]+\\.[A-Za-z]+\\.v[0-9]+$"

  inv-api-41-additional-properties:
    description: API-41 — a payload schema never closes additionalProperties (so a consumer tolerates unknown fields).
    message: "additionalProperties must not be false (API-41, FR-K.4)"
    given: "$..[?(@.additionalProperties == false)]"
    severity: error
    formats: ["aas3"]
    then:
      field: additionalProperties
      function: falsy

  # --- T6 (INV-T-2850): every message references the shared envelope ----------
  # TPL-13's own convention (invoice-docs standards/05-code-templates.md): a
  # message wrapped in the CloudEvents envelope of API-40 declares
  # `contentType: application/cloudevents+json` at message level (its
  # `payload` stays the inner `data` schema only — API-40's envelope wraps it
  # at publish time, service-runtime's publisher, not this document). A
  # placeholder message scaffolded by INV-T-2849 predates this rule and does
  # not yet comply; replacing the placeholder with a real event is exactly
  # where a service sets this (named as a fast-follow, CS-50's spirit — not
  # silently loosened here).
  inv-api-40-message-references-envelope:
    description: API-40 — every message is wrapped in the shared CloudEvents envelope, declared as its contentType.
    message: "message must declare contentType: application/cloudevents+json to reference the shared envelope (API-40, service-runtime/schemas/cloud-event-envelope.schema.json)"
    given: "$.components.messages[*]"
    severity: error
    formats: ["aas3"]
    then:
      - field: contentType
        function: defined
      - field: contentType
        function: pattern
        functionOptions:
          match: "^application/cloudevents\\+json$"
