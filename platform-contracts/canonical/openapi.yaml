          type: string
          format: date
        prescribedPeriodRef:
          type: string
        totals:
          $ref: '#/components/schemas/Totals'
        docUuidSource:
          type: string
          enum: [SYSTEM, ISSUER, SUPPLIER]
          x-extensible-enum: true
          description: >-
            Where the Doc UUID came from: ISSUER when `networkIssuance.issuedDocUuid` was bound (INV-AC-1769),
            SUPPLIER when the pack rule `inboundDocUuidRule` is ADOPT_SUPPLIER and the supplier's UUID was bound,
            SYSTEM when the System generated one (INV-AC-1433). Optional so an older consumer validates (INV-REQ-431).
        documentNumber:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The document number issued to the customer, the number payload-svc transmits as IBT-001 (INV-REQ-714,
            INV-AC-766). Optional. Never the `sourceKey` or the internal accounting reference.
        notSubmittableReason:
          type: string
          enum: [BUYER_REJECTED, ISSUANCE_REFUSED, NETTED_INTO_REVISION]
          x-extensible-enum: true
          description: >-
            Set by canonical-svc when `scopeVerdict` is NOT_SUBMITTABLE for one of these three causes: BUYER_REJECTED,
            ISSUANCE_REFUSED or NETTED_INTO_REVISION (INV-REQ-432). BUYER_REJECTED is set when a received document's
            `buyerDisposition` is REJECTED. Other causes keep their `reasons` items and set none. Optional so an
            older consumer validates.
        precedingDocUuid:
          type: string
          format: uuid
          description: >-
            Set by canonical-svc only on a credit note whose `precedingDocumentNumber` is populated and which resolved to exactly one document of the same entity, direction and issuer, with that number and, when `precedingDocumentDate` is populated, that transaction date. Absent when none or several match, and on a credit note with blank preceding fields. Read by submission-svc for the credit-note hold (INV-REQ-709, INV-Q-6311). Optional so an older consumer validates.
        nettedCreditNoteKeys:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Echo of the request's `nettedCreditNoteKeys`, the `sourceKey` values of the credit notes, posted by the same `entityRef` and `sourceSystem`, that this revised invoice nets (INV-Q-6614, INV-REQ-558). Optional so an older consumer validates.
        nettedCreditNoteDocUuids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: >-
            Set by canonical-svc on the version of a revised invoice for the keys of `nettedCreditNoteKeys` that already name a recorded credit note of the same entity. Written only when the version is created (a version is never edited), so it may be absent. Read by submission-svc for the decision of INV-Q-6623 and INV-Q-6614 (INV-REQ-558). Optional so an older consumer validates.
        nettedByDocUuid:
          type: string
          format: uuid
          description: >-
            Set by canonical-svc on the version of a credit note when a recorded revised invoice whose current version lists the credit note's `sourceKey` exists. Written only when the version is created (a version is never edited), so it may be absent. Read by submission-svc for the decision of INV-Q-6623 and INV-Q-6614 (INV-REQ-558). Optional so an older consumer validates.
        gstNotAdjusted:
          type: boolean
          description: >-
            The caller's declaration that supplier and customer agreed not to adjust the GST charged on the original invoice and the conditions for doing so are met. Allowed only when documentFunction is CREDIT_NOTE; any other combination is a contract violation, refused with 400 and SRT-001. Absent means false. The System does not verify the conditions and never infers the marker (INV-REQ-693, INV-Q-6639).
