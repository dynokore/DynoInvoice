openapi: 3.1.0
info:
  title: canonical API
  version: 1.6.0
  description: >-
    Contract-first source of truth for canonical (API-01, STK-44). The
    `canonical-contract` module generates its server interfaces and DTOs
    from this file (STK-46); a consumer generates its own client types from
    the same file (FR-AH.13, ARC-07).


    Internal API only (API standard §1): canonical-svc has no public,
    gateway-routed surface. Every operation below is `/internal/v1/…`,
    reached only on the synchronous edges of model/architecture/sync-edges.yaml
    (ingestion-svc, recording) and by console-bff's read queries (INV-T-2858,
    T14) — `payload-svc` instead receives the canonical version through the
    `CanonicalVersionCreated` event (canonical/asyncapi.yaml, AD-30), which is
    asynchronous and therefore out of this file's scope.
  contact:
    name: canonical (see CODEOWNERS)
servers:
  - url: 'https://api.invoice.internal'
    description: Placeholder — the gateway never routes /internal/v1/… (API-01 scope table); resolved service-to-service.
tags:
  - name: documents
    description: The canonical document and its immutable versions (services.yaml canonical-svc).
  - name: reassignments
    description: Prepared period reassignments after a filing frequency change (INV-REQ-706, INV-REQ-708).
paths:
  /internal/v1/canonical/documents:
    post:
      operationId: recordDocument
      summary: Record a source event as a canonical document version, assigning or binding the Doc UUID
      description: >-
        The record API to ingestion-svc (services.yaml canonical-svc
        `provides`; sync-edges.yaml `ingestion-svc -> canonical-svc`,
        "Recording and de-duplication are one decision owned by canonical-svc;
        the caller needs the Doc UUID or the replay outcome", FR-Z.4 to
        FR-Z.6). Assigns or binds the Doc UUID inside the same transaction
        (INV-REQ-547) and derives period assignment and the scope verdict
        (§20.6). A repeat of the same idempotency pair returns the original
        result unchanged (INV-REQ-806); a higher sourceRevision for the same
        sourceKey amends the same Doc UUID. Never mutates a version in place
        and never regenerates a Doc UUID on retry (canonical-svc `must_not`).


        With `networkIssuance.issuedDocUuid` the UUID is bound in the recording
        transaction instead of a generated one, and a UUID already bound to a
        different commercial document is rejected with ING-011 (two postings
        are the same document when source system and source key are equal,
        INV-REQ-327). A receipt (`networkReceipt`) carrying a `supplierDocUuid`
        already bound for the entity becomes a new version of that document
        (INV-REQ-430); a receipt that carries `PENDING` returns it to a hold
        with ING-013. A `networkReceipt` whose `buyerDisposition` is REJECTED is
        answered with `scopeVerdict` NOT_SUBMITTABLE and `notSubmittableReason`
        BUYER_REJECTED, and a later credit note or revised invoice follows
        INV-REQ-557 (INV-REQ-432). A fallback match of more than one document is held with
        ING-017. The same source key with a higher `sourceRevision` is an
        amendment under the same Doc UUID, a lower one is `409` with ING-002,
        and a change of direction, document type or entity is ING-012
        (INV-REQ-793). A replay answers `200` with the original body,
        produced by canonical-svc (INV-REQ-1192).
      tags: [documents]
      x-principal: ingest
      x-timeout: 2000
      x-sync-edge: ingestion-svc->canonical-svc
      x-error-codes: [ING-002, ING-005, ING-011, ING-012, ING-016, ING-019, ING-013, ING-017]
      x-requirements: [INV-REQ-957, INV-REQ-1010, INV-REQ-547, INV-REQ-806, INV-REQ-327, INV-REQ-430, INV-REQ-431, INV-REQ-793, INV-REQ-1192, INV-REQ-714, INV-REQ-432]
      x-operation:
        role: ingest
        scope: entity
        precondition: >-
          sourceRevision for this (tenantId, sourceSystem, sourceKey) is not
          lower than any already recorded (FR-C.1, ING-002); an amendment does
          not change direction, document type or entity (ING-012). Checked
          against recorded state, never against screen context.
        reversibility: IRREVERSIBLE
        repeatKey: >-
          (tenantId, sourceSystem, sourceKey, sourceRevision) — a repeat
          returns the original result unchanged, with the original Doc UUID
          (FR-M.3, INV-REQ-806, INV-REQ-1010 behaviour #1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDocumentRequest'
            examples:
              default:
                value:
                  tenantId: "5e0b8a0e-2c4d-4b8f-9a61-0d3c7f1e2b44"
                  entityRef: "E-001"
                  sourceSystem: "erp-acme"
                  sourceKey: "ERP-DOC-884213"
                  documentNumber: "INV-2026-000123"
                  sourceRevision: 1
                  documentFunction: "INVOICE"
                  transactionDate: "2026-03-20"
                  currency: "SGD"
                  parties:
                    supplier: { identifierScheme: "UEN", identifierValue: "201912345A" }
                    buyer: { identifierScheme: "UEN", identifierValue: "201954321B" }
                  lines:
                    - lineNumber: 1
                      description: "Consulting services"
                      quantity: 1
                      unitPrice: "1000.00"
                      lineAmount: "1000.00"
                      taxCode: "SR"
                      taxAmount: "90.00"
                  declaredTotals:
                    totalExcludingTax: "1000.00"
                    totalTax: "90.00"
                    totalIncludingTax: "1090.00"
      responses:
        '201':
          description: Recorded as a new document or a new version (API-21 §10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDocumentResponse'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 1
                    scopeVerdict: "SUBMITTABLE"
                    transactionDate: "2026-03-20"
                    prescribedPeriodRef: "2026-Q1"
        '200':
          description: Idempotent replay — the original result, unchanged (FR-M.3, API-15's pattern).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDocumentResponse'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 1
                    scopeVerdict: "SUBMITTABLE"
                    transactionDate: "2026-03-20"
                    prescribedPeriodRef: "2026-Q1"
        '202':
          description: >-
            Recorded but held (FR-M.4, API-21) — rules-svc or masterdata-svc
            was unavailable (ING-016) and derivation is incomplete, a network
            receipt awaits buyer acceptance (ING-013), or a fallback match of
            more than one document needs a decision (ING-017); released
            automatically on recovery (ING-016) or on acceptance (ING-013).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDocumentResponse'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 1
                    scopeVerdict: "SUBMITTABLE"
                    transactionDate: "2026-03-20"
                    prescribedPeriodRef: "2026-Q1"
                    reasons: [{ code: "ING-016", field: "/", message: "Derivation incomplete; masterdata-svc unavailable" }]
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/canonical/documents/{docUuid}:
    get:
      operationId: getDocument
      summary: Read a canonical document's identity and current version summary
      description: >-
        Document query API to console-bff (services.yaml canonical-svc
        `provides`). A bounded synchronous query the consumer needs for its
        own view (INV-REQ-1168) — never a fan-out at request time.
      tags: [documents]
      x-principal: reporting
      x-sync-edge: console-bff->canonical-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
      responses:
        '200':
          description: The document's identity and current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    currentVersion: 2
                    documentFunction: "INVOICE"
                    scopeVerdict: "SUBMITTABLE"
                    transactionDate: "2026-03-20"
                    prescribedPeriodRef: "2026-Q1"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/canonical/documents/{docUuid}/versions/{version}:
    get:
      operationId: getDocumentVersion
      summary: Read one immutable version of a canonical document
      description: >-
        Version query API to console-bff (services.yaml canonical-svc
        `provides`; INV-REQ-1168). A version is never mutated in place —
        each version is its own immutable record (canonical-svc `must_not`).
      tags: [documents]
      x-principal: reporting
      x-sync-edge: console-bff->canonical-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-1168]
      parameters:
        - $ref: '#/components/parameters/DocUuid'
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
              examples:
                default:
                  value:
                    docUuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    version: 2
                    docsequence: 2
                    documentFunction: "INVOICE"
                    scopeVerdict: "SUBMITTABLE"
                    transactionDate: "2026-03-20"
                    prescribedPeriodRef: "2026-Q1"
                    documentNumber: "INV-2026-000123"
                    totals: { totalExcludingTax: "1000.00", totalTax: "90.00", totalIncludingTax: "1090.00" }
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/canonical/entities/{entityRef}/prepared-reassignments:
    get:
      operationId: listPreparedReassignments
      summary: List the prepared period recomputations of an entity
      description: >-
        Lists the prepared recomputations of the entity, one per affected span
        after a filing frequency change (INV-REQ-708, INV-REQ-687). Cursor
        pagination (API-18); no offset and no total count. A prepared
        recomputation changes no document.
      tags: [reassignments]
      x-principal: reporting
      x-sync-edge: console-bff->canonical-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-708, INV-REQ-687]
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of prepared reassignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedReassignmentPage'
              examples:
                default:
                  value:
                    items:
                      - reassignmentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        entityRef: "E-001"
                        spanStart: "2026-04-01"
                        spanEnd: "2026-06-30"
                        reassignmentStatus: PREPARED
                        affectedCount: 12
                        reasonCodes: [PER-004]
                        preparedAt: "2026-04-02T08:00:00Z"
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/canonical/entities/{entityRef}/prepared-reassignments/{reassignmentId}/confirmation:
    post:
      operationId: confirmPeriodReassignment
      summary: Confirm a prepared period reassignment, applying the recomputation
      description: >-
        On confirmation canonical-svc recomputes `prescribedPeriodRef` for every
        unsubmitted document whose transaction date falls in the span, creates
        no new canonical version, does not recompute a document already
        acknowledged (INV-REQ-706) and emits PeriodReassigned. Before the
        confirmation nothing is applied and PeriodReassigned is not emitted
        (INV-REQ-708, INV-AC-750). `submission-svc` recomputes `dueDate` on
        consuming the event.
      tags: [reassignments]
      x-principal: filing-workflow
      x-sync-edge: console-bff->canonical-svc
      x-timeout: 2000
      x-error-codes: []
      x-requirements: [INV-REQ-706, INV-REQ-687, INV-REQ-708]
      x-operation:
        role: tax.approver
        scope: entity
        precondition: The reassignment is PREPARED.
        reversibility: IRREVERSIBLE
        repeatKey: "(entityRef, reassignmentId) — a repeat returns the recorded confirmation unchanged."
      parameters:
        - $ref: '#/components/parameters/EntityRef'
        - $ref: '#/components/parameters/ReassignmentId'
      responses:
        '200':
          description: The confirmed reassignment (`reassignmentStatus` CONFIRMED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedReassignment'
              examples:
                default:
                  value:
                    reassignmentId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    entityRef: "E-001"
                    spanStart: "2026-04-01"
                    spanEnd: "2026-06-30"
                    reassignmentStatus: CONFIRMED
                    affectedCount: 12
                    reasonCodes: [PER-004, PER-005]
                    preparedAt: "2026-04-02T08:00:00Z"
                    confirmedAt: "2026-04-03T09:30:00Z"
                    confirmedBy: "approver-01"
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    DocUuid:
      name: docUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityRef:
      name: entityRef
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ReassignmentId:
      name: reassignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Party:
      type: object
      properties:
        identifierScheme:
          type: string
          maxLength: 20
        identifierValue:
          type: string
          maxLength: 60
      required: [identifierScheme, identifierValue]
    Line:
      type: object
      properties:
        lineNumber:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 500
        quantity:
          type: number
        unitPrice:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,6})?$'
          description: Money as a decimal string, up to 6 places (API-12).
        lineAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string, decimal(19,2) (API-12).
        taxCode:
          type: string
          maxLength: 10
        taxAmount:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: Money as a decimal string, decimal(19,2) (API-12).
      required: [lineNumber, lineAmount]
    Totals:
      type: object
      properties:
        totalExcludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        totalTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        totalIncludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
        sgdTotalExcludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: >-
            Total excluding tax in SGD, stated by the caller; validated, never recomputed (FR-M.7). Required with
            the other SGD totals and exchangeRate when the currency is not SGD (INV-REQ-466).
        sgdTotalTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: >-
            Total tax (GST) in SGD, stated by the caller; validated, never recomputed (FR-M.7). Required when the
            currency is not SGD (INV-REQ-466).
        sgdTotalIncludingTax:
          type: string
          format: decimal
          pattern: '^-?\d{1,17}(\.\d{1,2})?$'
          description: >-
            Total including tax in SGD, stated by the caller; validated, never recomputed (FR-M.7). Required when
            the currency is not SGD (INV-REQ-466).
        exchangeRate:
          type: string
          format: decimal
          pattern: '^\d{1,11}(\.\d{1,8})?$'
          description: >-
            Exchange rate applied to convert to SGD, decimal(19,8) (INV-NOTE-3 section 20.2). Required when the
            currency is not SGD (INV-REQ-466).
        exchangeRateSource:
          type: string
          maxLength: 64
          description: Source of the exchange rate, recorded with the rate for audit (INV-REQ-467).
      required: [totalExcludingTax, totalTax, totalIncludingTax]
    RecordDocumentRequest:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        entityRef:
          type: string
          maxLength: 40
        sourceSystem:
          type: string
          maxLength: 60
        sourceKey:
          type: string
          maxLength: 128
        sourceRevision:
          type: integer
          minimum: 1
        documentNumber:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The document number issued to the customer; payload-svc builds IBT-001 from it and the internal
            accounting reference is never used as the number (INV-REQ-714, INV-AC-766). Optional: this contract does
            not refuse its absence, and a document that builds into an invoice or a credit note without one is stopped
            downstream by PAY-001 (Mandatory Data Element absent). `sourceKey` and `sourceRevision` keep their meaning
            (the identity of the source record and its revision) and are never the number.
        documentFunction:
          type: string
          enum: [INVOICE, CREDIT_NOTE, DEBIT_NOTE, BILL_FOR_PAYMENT]
        transactionDate:
          type: string
          format: date
        currency:
          type: string
          maxLength: 3
        parties:
          type: object
          properties:
            supplier:
              $ref: '#/components/schemas/Party'
            buyer:
              $ref: '#/components/schemas/Party'
          required: [supplier, buyer]
        lines:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Line'
        declaredTotals:
          $ref: '#/components/schemas/Totals'
        precedingDocumentNumber:
          type: string
          maxLength: 64
          description: >-
            Preceding Invoice Number (IBT-025) of the invoice a credit note corrects, where known
            (INV-REQ-560, INV-TERM-302). Mirrors TransactionRequest. A number without a date is valid
            (INV-REQ-701). On a credit note with neither preceding field, precedingBlankJustification and
            evidenceRef are required (ING-019).
        precedingDocumentDate:
          type: string
          format: date
          description: >-
            Preceding Invoice Date (IBT-026) of the invoice a credit note corrects, where known
            (INV-REQ-560, INV-TERM-302). Mirrors TransactionRequest. On a credit note with neither preceding
            field, precedingBlankJustification and evidenceRef are required (ING-019).
        precedingBlankJustification:
          type: string
          maxLength: 512
          description: >-
            Justification for a credit note sent with neither preceding field (INV-REQ-561,
            INV-TERM-302).
            Required, together with evidenceRef, when documentFunction is CREDIT_NOTE and neither
            precedingDocumentNumber nor precedingDocumentDate is present; otherwise optional (INV-REQ-561,
            INV-Q-1677, INV-Q-3450, INV-Q-3488); refused with ING-019. Enforced by canonical-svc, not by
            this schema (as for TransactionRequest).
        evidenceRef:
          type: string
          maxLength: 256
          description: >-
            Reference to the documentary evidence that GST was accounted for on the original supplies,
            for a blank-linked credit note (INV-REQ-561).
            Required, together with precedingBlankJustification, when documentFunction is CREDIT_NOTE and neither
            precedingDocumentNumber nor precedingDocumentDate is present; otherwise optional (INV-REQ-561,
            INV-Q-1677, INV-Q-3450, INV-Q-3488); refused with ING-019. Enforced by canonical-svc, not by
            this schema (as for TransactionRequest).
        nettedCreditNoteKeys:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            The `sourceKey` values of the credit notes, posted by the same `entityRef` and `sourceSystem`, that this revised invoice nets. Allowed only when `documentFunction` is INVOICE (stated here as for the other conditional rules; a request that breaks it is refused with `400` and SRT-001 by ingestion-svc). The System never infers a netting: the ERP declares it. It has an effect only while the original has not been transmitted (INV-Q-6614, INV-REQ-558).
        gstNotAdjusted:
          type: boolean
          description: >-
            The caller's declaration that supplier and customer agreed not to adjust the GST charged on the original invoice and the conditions for doing so are met. Allowed only when documentFunction is CREDIT_NOTE; any other combination is a contract violation, refused with 400 and SRT-001. Absent means false. The System does not verify the conditions and never infers the marker (INV-REQ-693, INV-Q-6639).
        direction:
          type: string
          enum: [SALE, PURCHASE]
          description: >-
            Direction of the document for the entity; absent means SALE. Doc UUID uniqueness is scoped by
            (entity, direction) (INV-REQ-431, INV-REQ-739). An amendment that changes it is refused with
            ING-012 (INV-REQ-793).
        networkIssuance:
          type: object
          description: >-
            Present on an issued document posted in Observe mode; when `issuedDocUuid` is present it is bound
            as the Doc UUID instead of a generated one (INV-REQ-327). Same shape as TransactionRequest.
          properties:
            issuedDocUuid:
              type: string
              format: uuid
              description: The issuer's own Doc UUID (BT-SG 003), bound in the recording transaction; a collision with a different commercial document is ING-011 (INV-REQ-327).
            apMessageId:
              type: string
              description: Access Point message id of the hand-off (INV-REQ-327).
            handoffAt:
              type: string
              format: date-time
              description: When the issuer handed the document to the network (INV-REQ-327).
            customizationId:
              type: string
              description: Customization id of the issued document (INV-REQ-327).
        networkReceipt:
          type: object
          description: >-
            Present on a document received from the network (INV-REQ-327, INV-REQ-428). A `supplierDocUuid`
            already bound for the entity makes the receipt a new version of that document (INV-REQ-430).
            Same shape as TransactionRequest.
          properties:
            peppolMessageId:
              type: string
            receivedAt:
              type: string
              format: date-time
            supplierEndpointId:
              type: string
            supplierDocumentNumber:
              type: string
            buyerDisposition:
              type: string
              enum: [PENDING, ACCEPTED, REJECTED]
              description: >-
                The buyer's disposition as published in INV-REQ-428. PENDING holds the document with ING-013
                until the buyer accepts again (INV-REQ-430).
            supplierDocUuid:
              type: string
              format: uuid
              description: The supplier's Doc UUID; bound as the Doc UUID when the pack rule `inboundDocUuidRule` is ADOPT_SUPPLIER (INV-REQ-431).
          required: [peppolMessageId, receivedAt, supplierEndpointId, supplierDocumentNumber, buyerDisposition]
      required:
        [tenantId, entityRef, sourceSystem, sourceKey, sourceRevision, documentFunction, transactionDate, currency, lines]
    RecordDocumentResponse:
      type: object
      properties:
        docUuid:
          type: string
          format: uuid
        version:
          type: integer
        scopeVerdict:
          type: string
          enum: [SUBMITTABLE, NOT_SUBMITTABLE, PRE_OBLIGATION]
          x-extensible-enum: true
        transactionDate:
          type: string
          format: date
        prescribedPeriodRef:
          type: string
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonItem'
        docUuidSource:
          type: string
          enum: [SYSTEM, ISSUER, SUPPLIER]
          x-extensible-enum: true
          description: >-
            Where the Doc UUID came from: ISSUER when `networkIssuance.issuedDocUuid` was bound (INV-AC-1769),
            SUPPLIER when the pack rule `inboundDocUuidRule` is ADOPT_SUPPLIER and the supplier's UUID was bound,
            SYSTEM when the System generated one (INV-AC-1433). Optional so an older consumer validates (INV-REQ-431).
        notSubmittableReason:
          type: string
          enum: [BUYER_REJECTED, ISSUANCE_REFUSED, NETTED_INTO_REVISION]
          x-extensible-enum: true
          description: >-
            Set by canonical-svc when `scopeVerdict` is NOT_SUBMITTABLE for one of these three causes: BUYER_REJECTED,
            ISSUANCE_REFUSED or NETTED_INTO_REVISION (INV-REQ-432). BUYER_REJECTED is set when a received document's
            `buyerDisposition` is REJECTED. Other causes keep their `reasons` items and set none. Optional so an
            older consumer validates.
      required: [docUuid, version, scopeVerdict, transactionDate, prescribedPeriodRef]
    ReasonItem:
      type: object
      properties:
        code:
          type: string
        field:
