# service-runtime-defaults.properties — sane defaults every service's own
# application.yaml may still override (TPL-16). Loaded by
# `ServiceRuntimeConfiguration`'s `@PropertySource` at the lowest precedence
# (Spring adds `@PropertySource` entries last), so a service's own
# configuration always wins.
#
# STK-35: ECS structured logs to stdout.
logging.structured.format.console=ecs

# FR-AH.17: DEGRADED is not a built-in Boot status; ordered between UP and
# UNKNOWN so it is worse than up but better than truly down, and mapped to
# HTTP 200 so a client sees a normal response body carrying the degraded state,
# not a transport-level failure (TPL-16).
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200
# A configured mapping replaces Spring Boot's own (DOWN and OUT_OF_SERVICE to 503),
# so both are restated: without them a DOWN readiness answers 200 and the kubelet's
# readiness probe never fails (FR-AH.17: a cold start with the vault down fails visibly).
management.endpoint.health.status.http-mapping.DOWN=503
management.endpoint.health.status.http-mapping.OUT_OF_SERVICE=503

# API-33, owner ruling INV-Q-4103 A: health, metrics and the FR-AE.82 diagnostics
# endpoint are served only on Spring Boot's separate management server, port 8081
# (container port `management`): no workload token (WorkloadTokenAuthenticationFilter
# is registered on the application port only), not in the Kubernetes Service, never
# routed by the API gateway. A service may change this port number in its own
# configuration, but start-up fails when it equals server.port (ManagementPortGuard),
# so the endpoints never move back onto the application port.
management.server.port=8081
management.endpoints.web.base-path=/

# FR-AH.17: readiness needs only this service's own schema and event log, never a
# domain dependency. API-33's paths on the management port: the endpoints sit at its
# root, so a group's name is its path: /health/live and /health/ready (UP, DEGRADED
# or DOWN). Spring Boot serves a group only at /health/<group> (an additional path
# has one segment), so the groups are named live and ready (formerly liveness and
# readiness; same members).
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState,vault

# FR-AE.82: the uniform diagnostic endpoint (/diagnostics), alongside health and
# Prometheus; API-33's /metrics is the Prometheus endpoint.
management.endpoints.web.exposure.include=health,prometheus,diagnostics
management.endpoints.web.path-mapping.prometheus=metrics

# INV-REQ-1200, INV-REQ-1201 (INV-NOTE-3 §36.6): the replica fallbacks to tenancy-svc
# and access-svc, 500 ms timeout and one retry (two attempts). Reads, so retry-safe.
service-runtime.resilience.edges.tenancy-svc.timeout=500ms
service-runtime.resilience.edges.tenancy-svc.retry.max-attempts=2
service-runtime.resilience.edges.access-svc.timeout=500ms
service-runtime.resilience.edges.access-svc.retry.max-attempts=2
# INV-REQ-1201: lag at most one second is decided locally.
service-runtime.replica.authority-lag-bound=1s

# INV-T-2875: this instance, stamped on the envelopes and audit entries the composition root writes.
gst.instance-id=${HOSTNAME:}
