# service-runtime-defaults.properties — sane defaults every service's own
# application.yaml may still override (TPL-16). Loaded by
# `ServiceRuntimeConfiguration`'s `@PropertySource` at the lowest precedence
# (Spring adds `@PropertySource` entries last), so a service's own
# configuration always wins.
#
# STK-35: ECS structured logs to stdout.
logging.structured.format.console=ecs

# FR-AH.17: DEGRADED is not a built-in Boot status; ordered between UP and
# UNKNOWN so it is worse than up but better than truly down, and mapped to
# HTTP 200 so a client sees a normal response body carrying the degraded state,
# not a transport-level failure (TPL-16).
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200

# API-33: /health/live and /health/ready are internal; FR-AH.17: readiness needs
# only this service's own schema and event log, never a domain dependency.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,vault

# FR-AE.82: the uniform diagnostic endpoint, alongside health and Prometheus.
management.endpoints.web.exposure.include=health,prometheus,diagnostics

# INV-REQ-1200, INV-REQ-1201 (INV-NOTE-3 §36.6): the replica fallbacks to tenancy-svc
# and access-svc, 500 ms timeout and one retry (two attempts). Reads, so retry-safe.
service-runtime.resilience.edges.tenancy-svc.timeout=500ms
service-runtime.resilience.edges.tenancy-svc.retry.max-attempts=2
service-runtime.resilience.edges.access-svc.timeout=500ms
service-runtime.resilience.edges.access-svc.retry.max-attempts=2
# INV-REQ-1201: lag at most one second is decided locally.
service-runtime.replica.authority-lag-bound=1s
