# service-runtime-security-events-defaults.properties — the defaults of gst.security-events.* (INV-REQ-1384,
# INV-Q-10939, INV-T-10969). Loaded by SecurityEventsConfiguration's @PropertySource at the lowest precedence, so a
# service's own configuration wins. Owner 2026-10-26: these are configuration, never literals in code.
gst.security-events.class-attribute=gst.security.class
gst.security-events.allowed-attributes=gst.security.class,user.id,gst.tenant.id
gst.security-events.queue-capacity=1000
gst.security-events.retry-max-attempts=3
gst.security-events.retry-backoff-millis=1000

# The exact audit action to the class wire value (INV-Q-11054). A service's own entries merge with this one by key.
gst.security-events.mapping[acknowledgeControlRelaxation]=control_relaxation
