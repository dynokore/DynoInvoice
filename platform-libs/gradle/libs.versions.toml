# gradle/libs.versions.toml — platform-libs' own version catalogue (STK-01 §1).
#
# platform-build's own gradle/libs.versions.toml is internal to its build (its
# `build-logic`, STK-59); it is not a shared catalogue other repositories import.
# Every consuming repository keeps its own, the way TPL-01 assumes
# (`libs.versions.platformBuild`, `libs.platform.*`) — gst.kotlin-base's
# `checkDependencyCatalogUsage` (STK §1b(a)) enforces that every dependency here
# goes through an alias, never a literal coordinate.

[versions]
# The gst.* convention plugins and platform-build's shared Konsist rule set ship
# together as one train (konsist-rules/build.gradle.kts); pinned to match the
# sibling checkout's current version until STK-71's registry takes cross-project
# publish/consume (settings.gradle.kts, ci/README.md's "package registry" note).
platformBuild = "0.2.0"
junit = "6.1.3"
# tenancy-kernel (INV-T-2861 / T17): RLS proved against real PostgreSQL
# (STK-14, STK-15) via Testcontainers, never H2 (banned-dependencies.yaml).
postgresql = "42.7.4"
testcontainers = "1.21.4"
slf4jSimple = "2.0.16"
# STK-24 (adapter-runtime, INV-T-2862 / T18): Resilience4j core, 2.4.x
resilience4j = "2.4.0"
# STK-37 / STK-38 (adapter-runtime T18, rulepack-kernel T22): Kotest assertions
# and property testing, MockK for ports.
kotest = "6.2.5"
mockk = "1.14.11"
# TPL-14's own property-test idiom (`runTest { checkAll(...) }`) needs a coroutine
# builder for kotest-property's suspend `checkAll`; test scope only (CS-32 is a
# production-code rule).
kotlinxCoroutinesTest = "1.11.0"
# rulepack-kernel (INV-T-2866 / T22): detached CMS signature verification (STK-13);
# BC 1.8x latest patch (catalogue) at the time of writing.
bouncycastle = "1.86"
# STK-08: Jackson 3 (`tools.jackson`), one JSON library platform-wide.
jackson = "3.2.3"
# evidence-store (INV-T-2863 / T19): kotest-property for the chain-integrity
# property tests (STK-38), the AWS SDK v2 S3 client for the ObjectStore port
# (STK-20 — never io.minio, banned-dependencies.yaml), and MinIO in
# Testcontainers as the object-lock simulator stand-in (done-when: "the
# object-lock simulator image once available, else MinIO in Testcontainers").
kotestProperty = "6.2.5"
kotlinxCoroutines = "1.11.0"
awssdk = "2.55.6"
# STK-05 (service-runtime, INV-T-2871 / T27): Spring Boot 4.1.x application
# framework — bootstrap auto-configuration, Actuator health/diagnostics,
# Micrometer. First module in this repository to need it; every other
# `implImplementation` dependency version below it comes from this one BOM
# (`platform(libs.springBoot.dependencies)`), never pinned separately.
springBoot = "4.1.1"
# CVE-2026-65182, CVE-2026-65905, CVE-2026-68525: Spring Boot 4.1.1's managed
# Tomcat is tomcat-embed-core/-el/-websocket 11.0.24, which carries all three
# CRITICAL CVEs; certification-kit already had to patch this exact version
# (MR !1, commit 0ae3d40). service-runtime itself only adds
# spring-boot-starter-actuator, not a web starter, so this version alone never
# resolves here — the alias exists so `platform-libs-bom`'s constraint (below)
# reaches the first module, or first consuming service's `bootstrap`, that adds
# spring-boot-starter-web through this same BOM.
tomcatEmbed = "11.0.25"

[libraries]
springBoot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
springBoot-starterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# STK-23 (service-runtime, INV-T-2872 / T28): the generated ARC-08 client's own
# `RestClient`/`ClientHttpRequestInterceptor` — client-side only, never
# `spring-webmvc` or a servlet container (this module ships no web starter,
# tomcatEmbed's own comment below still holds). Version managed by the Spring
# Boot BOM.
springWeb = { module = "org.springframework:spring-web" }
# API-29/STK-26 server-side filters (`DeadlineServerFilter`,
# `WorkloadTokenAuthenticationFilter`): the servlet API only, not an embedded
# container — a consuming service's own `bootstrap` module supplies the
# container via its own `spring-boot-starter-web`. Version managed by the
# Spring Boot BOM.
jakarta-servletApi = { module = "jakarta.servlet:jakarta.servlet-api" }
# STK-26: verifies a workload token the same Nimbus-based way STK-27's future
# end-user resource-server configuration verifies one, pointed at the cluster's
# own service-account issuer instead. Version managed by the Spring Boot BOM
# (Spring Security 7, STK-27).
springSecurity-oauth2Jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
# `ApplicationContextRunner`, for the auto-configuration wiring test (implTest only).
springBoot-test = { module = "org.springframework.boot:spring-boot-test" }
# `ApplicationContextRunner`'s own `AssertableApplicationContext` extends AssertJ's
# `AssertProvider`; version managed by the Spring Boot BOM (implTest only, STK-37
# still prefers Kotest for this module's own assertions).
assertj-core = { module = "org.assertj:assertj-core" }
platform-konsistRules = { module = "com.dynokore.gst.build:konsist-rules", version.ref = "platformBuild" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-minio = { module = "org.testcontainers:minio", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry" }
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter" }
kotest-runnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-propertyEvidence = { module = "io.kotest:kotest-property", version.ref = "kotestProperty" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
tomcatEmbed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcatEmbed" }
tomcatEmbed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcatEmbed" }
tomcatEmbed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcatEmbed" }
