# gradle/libs.versions.toml — platform-libs' own version catalogue (STK-01 §1).
#
# platform-build's own gradle/libs.versions.toml is internal to its build (its
# `build-logic`, STK-59); it is not a shared catalogue other repositories import.
# Every consuming repository keeps its own, the way TPL-01 assumes
# (`libs.versions.platformBuild`, `libs.platform.*`) — gst.kotlin-base's
# `checkDependencyCatalogUsage` (STK §1b(a)) enforces that every dependency here
# goes through an alias, never a literal coordinate.

[versions]
# The gst.* convention plugins and platform-build's shared Konsist rule set ship
# together as one train (konsist-rules/build.gradle.kts); pinned to match the
# sibling checkout's current version until STK-71's registry takes cross-project
# publish/consume (settings.gradle.kts, ci/README.md's "package registry" note).
platformBuild = "0.2.0"
junit = "6.1.3"
# tenancy-kernel (INV-T-2861 / T17): RLS proved against real PostgreSQL
# (STK-14, STK-15) via Testcontainers, never H2 (banned-dependencies.yaml).
postgresql = "42.7.4"
testcontainers = "1.21.4"
slf4jSimple = "2.0.16"
# STK-24 (adapter-runtime, INV-T-2862 / T18): Resilience4j core, 2.4.x
resilience4j = "2.4.0"
# STK-37 / STK-38 (adapter-runtime T18, rulepack-kernel T22): Kotest assertions
# and property testing, MockK for ports.
kotest = "6.2.5"
mockk = "1.14.11"
# TPL-14's own property-test idiom (`runTest { checkAll(...) }`) needs a coroutine
# builder for kotest-property's suspend `checkAll`; test scope only (CS-32 is a
# production-code rule).
kotlinxCoroutinesTest = "1.11.0"
# rulepack-kernel (INV-T-2866 / T22): detached CMS signature verification (STK-13);
# BC 1.8x latest patch (catalogue) at the time of writing.
bouncycastle = "1.86"
# STK-08: Jackson 3 (`tools.jackson`), one JSON library platform-wide.
jackson = "3.2.3"

[libraries]
platform-konsistRules = { module = "com.dynokore.gst.build:konsist-rules", version.ref = "platformBuild" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }
resilience4j-bom = { module = "io.github.resilience4j:resilience4j-bom", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry" }
resilience4j-bulkhead = { module = "io.github.resilience4j:resilience4j-bulkhead" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter" }
kotest-runnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
