# .gitlab-ci.yml — platform-libs (INV-T-2860 / T16).
#
# Uses platform-build's shared CI templates (ci/README.md). Two additions on top
# of the plain include:
#
# 1. `platform-build`'s convention plugins and shared Konsist rule set are consumed as
#    published artefacts from platform-build's package registry (project 225) at the
#    catalogue's `platformBuild` version, by `settings.gradle.kts` with the job token (no
#    sibling checkout, so a build cannot float to an unreleased platform-build, P11).
#    `.gst-changed-modules` replaces `.gradle-job`'s own `before_script`
#    (ci/stages.gitlab-ci.yml) to define the same `gst_run_if_task_exists` helper, print
#    the registry read check and compute the changed-module set.
#
# 2. A `build-changed-modules` job (done-when, INV-T-2860): computes the modules
#    this change touches plus every module downstream of them (a module whose
#    build.gradle.kts has `project(":<changed module>")`), from the diff against
#    the merge-request base (or the previous commit on a `main` pipeline), and
#    compiles + tests only that set — the generic `compile`/`unit-test` jobs
#    below are overridden the same way, to actually save the CI time this is
#    for, rather than running twice.

include:
  - project: 'invoice/platform-build'
    ref: main
    file:
      - 'ci/stages.gitlab-ci.yml'   # always first: stages, workflow rules, shared variables
      - 'ci/build.gitlab-ci.yml'    # compile, unit tests, lint, Semgrep, Trivy
      - 'ci/image.gitlab-ci.yml'    # unused here (no IMAGE_NAME) but harmless to include (ci/README.md)
      - 'ci/publish.gitlab-ci.yml'  # Maven publish

variables:
  MAVEN_PUBLISH: "true"
  # IMAGE_NAME, HELM_CHART_NAME stay unset: platform-libs ships jars, not a
  # bootable service or a Helm chart.

.gst-changed-modules:
  before_script:
    - |
      # P6 proof that CI reads platform-build's registry with the job token: the platformBuild
      # version's konsist-rules pom must answer 200 (the Gradle resolution below needs it too).
      pb_version="$(sed -n 's/^platformBuild *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)"
      code=$(curl -s -o /dev/null -w '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/225/packages/maven/com/dynokore/gst/build/konsist-rules/${pb_version}/konsist-rules-${pb_version}.pom")
      echo "gst-ci: platform-build registry read, konsist-rules ${pb_version}: HTTP ${code}"
      test "$code" = "200"
    - |
      gst_run_if_task_exists() {
        task_name="$1"; shift
        if ./gradlew -p "$GRADLE_PROJECT_DIR" help --task "$task_name" >/tmp/gst-task-probe.log 2>&1; then
          ./gradlew -p "$GRADLE_PROJECT_DIR" "$task_name" "$@"
        else
          echo "gst-ci: '$task_name' is not a Gradle task in '$GRADLE_PROJECT_DIR' yet — skipping this step for this repository."
        fi
      }
    - |
      # Every module directory that is its own Gradle project (STK-60, one per
      # Wave 1 module), for the changed + downstream computation done-when
      # asks for. A downstream module is one whose build.gradle.kts contains
      # `project(":<changed module>")` — read from the real dependency
      # declarations, not a hand-kept list, so this keeps working as real
      # module dependencies are added.
      #
      # `platform-libs-bom` is excluded here: it is a `java-platform` module
      # (no Kotlin plugin, review finding on !1) and so never has a
      # compileKotlin/compileTestKotlin/test task to run — permanently, not
      # just today, since a BOM publishes only dependency-management metadata.
      # It still gets its own `check`/`publish` from the generic templates
      # (ci/build.gitlab-ci.yml, ci/publish.gitlab-ci.yml), unaffected by this
      # job's module-scoped compile/test tasks.
      # The tested set a BOM version stands for (STK-60, INV-T-2877, INV-Q-3261): this pipeline reached the
      # job only after the required contract-tests job passed (stage test), so the BOM version ci/bom-version.sh
      # decided, the gst-catalogue version the suite ran against, the pipeline and the commit are printed and
      # kept as a dotenv report (build/tested-set.env) for the done evidence.
      gst_tested_set() {
        gst_catalogue="$(sed -n 's/^gstCatalogue *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)"
        printf 'BOM_VERSION=%s\nBOM_ACTION=%s\nGST_CATALOGUE_VERSION=%s\nTESTED_PIPELINE=%s\nTESTED_COMMIT=%s\n' \
          "$BOM_VERSION" "$BOM_ACTION" "$gst_catalogue" "${CI_PIPELINE_ID:-local}" "${CI_COMMIT_SHA:-local}" \
          > build/tested-set.env
        echo "gst-ci: tested set: platform-libs-bom ${BOM_VERSION} (${BOM_ACTION}), gst-catalogue ${gst_catalogue}," \
          "contract-tests green in pipeline ${CI_PIPELINE_ID:-local}, commit ${CI_COMMIT_SHA:-local}"
      }
      gst_all_modules() {
        for f in */build.gradle.kts; do
          m=$(dirname "$f")
          [ "$m" = "platform-libs-bom" ] && continue
          echo "$m"
        done
      }
      gst_changed_downstream_modules() {
        base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
        if [ -z "$base" ]; then
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "HEAD")
        fi
        changed_files=$(git diff --name-only "${base}" HEAD 2>/dev/null || true)
        all_modules=$(gst_all_modules)
        if echo "$changed_files" | grep -qE '^(settings\.gradle\.kts|build\.gradle\.kts|gradle/libs\.versions\.toml)$'; then
          echo "$all_modules" | tr '\n' ' '
          return
        fi
        changed=""
        for m in $all_modules; do
          if echo "$changed_files" | grep -q "^$m/"; then
            changed="$changed $m"
          fi
        done
        if [ -z "$(echo "$changed" | tr -d '[:space:]')" ]; then
          return
        fi
        result="$changed"
        frontier="$changed"
        while [ -n "$(echo "$frontier" | tr -d '[:space:]')" ]; do
          next=""
          for x in $frontier; do
            for m in $all_modules; do
              case " $result " in *" $m "*) continue ;; esac
              # Strips full-line `//` comments first: a worked example in a
              # comment (e.g. platform-libs-bom/build.gradle.kts's constraint
              # template) must never be read as a real project dependency.
              if grep -v '^[[:space:]]*//' "$m/build.gradle.kts" 2>/dev/null | grep -q "project(\":$x\")"; then
                result="$result $m"
                next="$next $m"
              fi
            done
          done
          frontier="$next"
        done
        echo "$result" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' '
      }

compile:
  extends: [.gradle-job, .gst-changed-modules]
  stage: build
  script:
    - MODULES="$(gst_changed_downstream_modules)"
    - |
      if [ -z "$(echo "$MODULES" | tr -d '[:space:]')" ]; then
        echo "gst-ci: no module changed against the base — nothing to build."
      else
        echo "gst-ci: compiling changed + downstream modules: $MODULES"
        TASKS=""
        for m in $MODULES; do TASKS="$TASKS :$m:compileKotlin :$m:compileTestKotlin"; done
        ./gradlew -p "$GRADLE_PROJECT_DIR" $TASKS --stacktrace
      fi

unit-test:
  extends: [.gradle-job, .gst-changed-modules]
  stage: test
  script:
    - MODULES="$(gst_changed_downstream_modules)"
    - |
      if [ -z "$(echo "$MODULES" | tr -d '[:space:]')" ]; then
        echo "gst-ci: no module changed against the base — nothing to test."
      else
        echo "gst-ci: testing changed + downstream modules: $MODULES"
        TASKS=""
        for m in $MODULES; do
          TASKS="$TASKS :$m:test"
          # implTest (STK-37/STK-38/STK-41, TPL-14) is a second, hand-registered Test
          # task (service-runtime, adapter-runtime) that plain `test` never runs and
          # `check` is never invoked here to run for us (review finding on !7): probed
          # per module, the same guarded pattern as `gst_run_if_task_exists`, since not
          # every module has it yet.
          if ./gradlew -p "$GRADLE_PROJECT_DIR" help --task ":$m:implTest" >/tmp/gst-impltest-probe.log 2>&1; then
            TASKS="$TASKS :$m:implTest"
          fi
        done
        ./gradlew -p "$GRADLE_PROJECT_DIR" $TASKS --stacktrace
      fi
    - gst_run_if_task_exists checkDependencyCatalogUsage --stacktrace
    - gst_run_if_task_exists verifyBannedDependencies --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        # Widened from `test-results/test/` (review finding on !7): implTest's own
        # results land in `test-results/implTest/`, one directory per Test task.
        - "**/build/test-results/*/TEST-*.xml"
    expire_in: 1 week

lint:
  extends: [.gradle-job, .gst-changed-modules]
  stage: verify
  script:
    - gst_run_if_task_exists spotlessCheck --stacktrace
    - gst_run_if_task_exists detekt --stacktrace
  artifacts:
    when: on_failure
    paths:
      - "**/build/reports/detekt/"
    expire_in: 1 week

# The consumer-driven contract suite of every Wave 1 module (INV-T-2877; FR-AH.14, INV-REQ-1225; coordinator ruling
# INV-Q-3925): a required job on every merge-request and main pipeline, whatever changed (not limited to changed
# modules). `:contract-tests:check` runs the Pact consumer tests (HTTP: product-runtime's tenancy-svc and access-svc
# fallback clients; message: OrganisationStructureChanged, EntityProfileChanged, AuthorityChanged, PolicyChanged, each
# payload validated against its pinned schema), config-resolver's provider verification of the PolicyChanged pact
# against its real policy writer (with the broken-writer fixture that must fail it), and the L1 modules' module-API
# consumer contract tests. It then publishes the pacts to the Pact Broker (gst.pact; INV-Q-3305, INV-T-3373: consumer
# version = commit SHA, branch = ref) and verifies config-resolver's pacts from the broker, publishing the result.
# maven-publish (stage publish) runs only after this job passed, so the BOM a main pipeline publishes is the set this
# suite tested (STK-60, INV-Q-3261).
contract-tests:
  extends: [.gradle-job, .gst-changed-modules]
  stage: test
  script:
    - ./gradlew -p "$GRADLE_PROJECT_DIR" :contract-tests:check --stacktrace
    - |
      if [ -z "${PACT_BROKER_BASE_URL:-}" ]; then
        echo "gst-ci: PACT_BROKER_BASE_URL is not set: the pacts cannot be published (INV-REQ-1225 b1, INV-Q-3305)"
        exit 1
      fi
    - ./gradlew -p "$GRADLE_PROJECT_DIR" :contract-tests:pactPublish -Dpact.broker.url="$PACT_BROKER_BASE_URL" --stacktrace
    - ./gradlew -p "$GRADLE_PROJECT_DIR" :contract-tests:pactBrokerVerify --stacktrace
  artifacts:
    when: always
    paths:
      - contract-tests/build/pacts/
    reports:
      junit:
        - "contract-tests/build/test-results/*/TEST-*.xml"
    expire_in: 1 week

# INV-T-3937 (coordinator ruling INV-Q-3929): every module that publishes an api and an impl publication must publish
# two different jars, the api one holding exactly its `main` classes (root build.gradle.kts, `verifySplitJars`, which
# `check` runs too). A required job on every merge-request and main pipeline, over every split module, whatever changed.
# Its negative test points service-runtime's `implJar` back at build/libs (the defect of service-runtime 1.2.0-3.3.0)
# and must see the check fail with its own message; a pass, or a failure for any other reason, fails this job.
split-jars:
  extends: [.gradle-job, .gst-changed-modules]
  stage: test
  script:
    - ./gradlew -p "$GRADLE_PROJECT_DIR" verifySplitJars --continue --stacktrace
    - |
      mkdir -p build
      if ./gradlew -p "$GRADLE_PROJECT_DIR" :service-runtime:verifySplitJars -PsplitJarsFault=service-runtime \
          > build/split-jars-negative.log 2>&1; then
        echo "gst-ci: negative test: verifySplitJars passed with service-runtime's implJar writing to build/libs"
        exit 1
      fi
      if ! grep -q "verifySplitJars: :service-runtime (INV-T-3937)" build/split-jars-negative.log; then
        tail -40 build/split-jars-negative.log
        echo "gst-ci: negative test: the build failed, but not on verifySplitJars"
        exit 1
      fi
      grep -E "^ +- " build/split-jars-negative.log | cut -c1-200
      echo "gst-ci: negative test: verifySplitJars fails when an implJar writes to build/libs, as it must"

# The shared template's pact-publish runs `pactPublish` in a job of its own, where no pact file exists (the pacts are
# written by the contract-tests job above, which publishes them itself, before verifying from the broker).
pact-publish:
  rules:
    - when: never

# Publishes every module and platform-libs-bom to this project's own package registry
# (not platform-build's, which the shared template defaults to), then fails the job
# unless every module's artifact with its version is actually in the registry. The
# shared template's script is replaced on purpose: it uses `gst_run_if_task_exists`,
# which silently skips when there is nothing to publish (P20/P28).
maven-publish:
  extends: [.gradle-job, .gst-changed-modules]
  variables:
    MAVEN_REGISTRY_PROJECT_ID: "$CI_PROJECT_ID"
  # Two main pipelines never decide the BOM version at the same time.
  resource_group: platform-libs-bom-version
  # Main only: the shared template also runs on tags, but a tag pipeline must not version the BOM.
  rules:
    - if: '$MAVEN_PUBLISH != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ci/bom-version.sh
    - |
      # platform-libs-bom is versioned here, not by a file: BOM_VERSION is the latest published
      # one (constraint set unchanged: its upload is skipped below) or latest minor + 1.
      . build/bom.env
      gst_tested_set
      bom_args="-PbomVersion=${BOM_VERSION}"
      if [ "$BOM_ACTION" = "publish" ]; then bom_args="$bom_args -PbomChangelog=$PWD/build/bom-changelog.txt"; fi
    - >
      ./gradlew listPublications $bom_args --stacktrace
    - |
      # Re-runs on main are safe: a publication whose .pom is already in the registry is
      # skipped (GitLab may reject a duplicate upload), but it is still verified below.
      grep -q . build/publications.txt || { echo "gst-ci: no publications listed (P20/P28)"; exit 1; }
      registry="${CI_API_V4_URL}/projects/${MAVEN_REGISTRY_PROJECT_ID}/packages/maven/com/dynokore/platform"
      pom_status() { curl -s -o /dev/null -w '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${registry}/$1/$2/$1-$2.pom"; }
      tasks=""
      while read -r path pub artifact version; do
        if [ "$(pom_status "$artifact" "$version")" = "200" ]; then
          echo "gst-ci: ${artifact}:${version} already in the registry, skipping its upload"
        else
          cap="$(printf '%s' "$pub" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$pub" | cut -c2-)"
          tasks="$tasks ${path}:publish${cap}PublicationToGstMavenRepository"
        fi
      done < build/publications.txt
      if [ -n "$tasks" ]; then
        ./gradlew $tasks $bom_args \
          -PgstMavenUrl="${CI_API_V4_URL}/projects/${MAVEN_REGISTRY_PROJECT_ID}/packages/maven" \
          -PgstMavenUser=gitlab-ci-token -PgstMavenPassword="${CI_JOB_TOKEN}" --stacktrace
      fi
      missing=0
      while read -r path pub artifact version; do
        code=$(pom_status "$artifact" "$version")
        if [ "$code" = "200" ]; then
          echo "gst-ci: published ${artifact}:${version}"
        else
          echo "gst-ci: NOT in the registry: ${artifact}:${version} (HTTP ${code})"
          missing=1
        fi
      done < build/publications.txt
      [ "$missing" = 0 ] || exit 1
    - |
      # INV-T-3937 (INV-Q-3929): each api and impl pair published above is read back from the registry. The two jars
      # must differ and the api jar must hold classes; an identical pair or an api jar without classes fails the job,
      # and a jar that cannot be downloaded fails it too: never skipped (P20/P28).
      registry="${CI_API_V4_URL}/projects/${MAVEN_REGISTRY_PROJECT_ID}/packages/maven/com/dynokore/platform"
      mkdir -p build/registry-jars
      fetch_jar() {
        out="build/registry-jars/$1-$2.jar"
        code=$(curl -s -o "$out" -w '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${registry}/$1/$2/$1-$2.jar")
        [ "$code" = "200" ] || { echo "gst-ci: cannot download $1-$2.jar from the registry (HTTP ${code})" >&2; return 1; }
        echo "$out"
      }
      pairs=0; bad=0
      for path in $(awk '$2 == "api" { print $1 }' build/publications.txt); do
        api_line=$(awk -v p="$path" '$1 == p && $2 == "api"' build/publications.txt)
        impl_line=$(awk -v p="$path" '$1 == p && $2 == "impl"' build/publications.txt)
        [ -n "$impl_line" ] || continue
        set -- $api_line; api_artifact=$3; api_version=$4
        set -- $impl_line; impl_artifact=$3; impl_version=$4
        pairs=$((pairs + 1))
        api_jar=$(fetch_jar "$api_artifact" "$api_version") || { bad=1; continue; }
        impl_jar=$(fetch_jar "$impl_artifact" "$impl_version") || { bad=1; continue; }
        api_sha=$(sha256sum "$api_jar" | cut -d' ' -f1)
        impl_sha=$(sha256sum "$impl_jar" | cut -d' ' -f1)
        api_classes=$(unzip -Z1 "$api_jar" | grep -c '\.class$' || true)
        impl_classes=$(unzip -Z1 "$impl_jar" | grep -c '\.class$' || true)
        if [ "$api_sha" = "$impl_sha" ]; then
          echo "gst-ci: ${api_artifact}:${api_version} and ${impl_artifact}:${impl_version} are the same jar in the registry (sha256 ${api_sha})"
          bad=1
        elif [ "$api_classes" -eq 0 ]; then
          echo "gst-ci: ${api_artifact}:${api_version} in the registry holds no class"
          bad=1
        else
          echo "gst-ci: registry pair ok: ${api_artifact}:${api_version} (${api_classes} classes) differs from ${impl_artifact}:${impl_version} (${impl_classes} classes)"
        fi
      done
      [ "$pairs" -gt 0 ] || { echo "gst-ci: no api and impl pair listed (P20/P28)"; exit 1; }
      exit $bad
  artifacts:
    when: always
    paths:
      - build/tested-set.env
    reports:
      dotenv: build/tested-set.env
    expire_in: 1 year

# Merge requests verify that the BOM resolves and report what the main pipeline would do,
# but never publish (a merge request never publishes, ci/publish.gitlab-ci.yml). A module
# merge request does not edit the BOM's version or changelog: the main pipeline's
# maven-publish job versions the BOM (ci/bom-version.sh).
bom-verify:
  extends: [.gradle-job, .gst-changed-modules]
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - ci/bom-version.sh
    - |
      . build/bom.env
      echo "gst-ci: on main this change would ${BOM_ACTION} platform-libs-bom ${BOM_VERSION}"
      gst_tested_set
  artifacts:
    when: always
    paths:
      - build/tested-set.env
    reports:
      dotenv: build/tested-set.env
    expire_in: 1 week
