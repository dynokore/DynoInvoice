# Excerpt of platform-contracts event-log/topics.yaml (710bed2): the entries these tests use. Regenerate by copying entries, never hand-edit. The RulePackStaged entry carries the retained_while_resolvable marker as INV-T-6287 writes it (INV-Q-6281).
topics:
