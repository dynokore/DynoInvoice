org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g

# INV-T-5597: run independent module tasks in parallel Gradle workers; at most 4 workers
# (inv-runner: 12 CPUs, concurrent = 6). The forks per test task are set in build.gradle.kts.
org.gradle.parallel=true
org.gradle.workers.max=4
