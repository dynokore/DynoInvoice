# tenancy-bootstrap/src/main/resources/application.yaml — TPL-16 (INV-T-4925)
spring:
  threads.virtual.enabled: true                     # STK-03
  main.lazy-initialization: false                   # STK-06
  # One DataSource, declared only here and in the Helm values: Spring Boot's `dataSource`, the service's one bounded,
  # elastic HikariCP pool (STK-17). No code names or builds a DataSource; service-runtime serves every platform-libs
  # adapter from it
  datasource:
    username: tenancy_runtime                        # the one runtime LOGIN: NOSUPERUSER, NOBYPASSRLS, owns no table (CS-19)
    hikari:                                         # maximum-pool-size is not set: service-runtime sizes the pool as the sum of the lanes
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
  flyway:
    schemas: tenancy
    default-schema: tenancy
    user: tenancy_migrate                            # read only by the migration Job's MigrationRunner (TPL-12, ARC-20)
service-runtime:
  modules.schema: tenancy
  workload-identity.audience: tenancy-svc
  pool:
    runs-reprocessing: false                        # tenancy-svc runs no pack-activation reprocessing (INV-Q-4485)
  datasource.credential: db/tenancy_runtime          # the runtime login only; read through SecretStore on every new connection
management:
  server.port: 8081                                 # API-33: health, metrics and diagnostics only on the management port
  endpoints.web:
    base-path: /
    exposure.include: health,prometheus,diagnostics
    path-mapping.prometheus: metrics
  endpoint.health:
    status.order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
    status.http-mapping: { DEGRADED: 200, DOWN: 503, OUT_OF_SERVICE: 503 }
    group:
      live.include: livenessState
      ready.include: readinessState,vault,db,eventLoops   # own schema, event loops and vault only (FR-AH.17)
logging.structured.format.console: ecs             # STK-35
gst:
  service: tenancy-svc
  db.event-log-url: ${GST_EVENT_LOG_DB_URL:}
inv:
  tenancy:
    # the installation facts hold no tenant data; their migration carries the comment 'platform-scoped: no tenant data'
    # (TableClasses.verify, INV-ADR-3968 item 4a). The binding key table is installed by tenancy-kernel, not generated.
    platform-scoped-tables:
      - tenancy.installation_fact
