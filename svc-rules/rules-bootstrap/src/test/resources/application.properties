# The required base URL of access-svc (TPL-16) for the test contexts that do not stub it: nothing listens there, so a
# call to access-svc is refused and the command that asked refuses (fail closed). The tests of the access-svc client
# set their own URL.
rules.access-svc-url=http://127.0.0.1:1

# The required limit of lane REPROCESSING (INV-T-4978): the code has no default and the application.yaml no production
# number, so each test context states its own. The tests of the limit set theirs.
rules.reprocessing.rate-limit.permits=1000
rules.reprocessing.rate-limit.window=PT1S
# The worker tick writes the lane window every second; the tests that prove "stores nothing" snapshot every table, and
# the reprocessing tests drive the worker themselves (INV-T-4978).
rules.reprocessing.worker=false
