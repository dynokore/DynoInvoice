# rules-bootstrap/src/main/resources/application.yaml (TPL-16; INV-T-4965)
spring:
  threads.virtual.enabled: true                     # STK-03
  main.lazy-initialization: false                   # STK-06
  # One DataSource, declared only here and in the Helm values: Spring Boot's `dataSource`, the service's one bounded,
  # elastic HikariCP pool (STK-17). No code names or builds a DataSource; service-runtime serves every platform-libs
  # adapter from it.
  datasource:
    username: rules_runtime                         # the one runtime LOGIN: NOSUPERUSER, NOBYPASSRLS, owns no table
    hikari:                                         # maximum-pool-size is not set: service-runtime sizes it from the lanes
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
  flyway:
    schemas: rules
    default-schema: rules
    user: rules_migrate                             # read only by the migration Job's MigrationRunner (TPL-12, ARC-20)
service-runtime:
  modules.schema: rules
  idempotency.schema: rules                         # API-15 store of the mapping pack commands (INV-T-4972)
  pool:
    runs-reprocessing: true                         # rules-svc runs pack-activation reprocessing (INV-Q-4485)
    # No profile and no lane budget here (INV-Q-4496): the chart supplies the lanes or the installation profile.
  idempotency.schema: rules                         # the API-15 key store of the mounted setPolicy for VP-39 (INV-Q-8972 A, INV-T-18451)
  # SecretRef under this service's secret mount; there is no spring.datasource.password and none in the environment.
  datasource.credential: db/rules_runtime
management:
  server.port: 8081                                 # API-33: health, metrics and diagnostics only on the management port
  endpoints.web:
    base-path: /
    exposure.include: health,prometheus,diagnostics
    path-mapping.prometheus: metrics
  endpoint.health:
    status.order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
    status.http-mapping: { DEGRADED: 200, DOWN: 503, OUT_OF_SERVICE: 503 }
    group:
      live.include: livenessState
      ready.include: readinessState,vault,eventLoops # own schema, event log and vault only (FR-AH.17)
logging.structured.format.console: ecs              # STK-35, JSON
inv:
  tenancy:
    # Tables with a tenant_id column that also hold platform rows every tenant reads (INV-ADR-3968 item 4a).
    # rules.pack_artefact is the holder copy of the verified packs; the kernel documents the declaration
    # (PackRegistryMigration.referenceTable, INV-Q-4596): undeclared, a tenant's read drops the platform rows.
    reference-tables: rules.pack_registry, rules.pack_entry_source, rules.pack_artefact
    # config-resolver's two table-valued functions (write_installation_setting, config_purge_tenant, created by
    # ConfigSchema.ddl) are generated by jOOQ as tables without a tenant column; they read the signed binding themselves
    # (TableClasses.verify, INV-ADR-3968 item 4a, INV-T-18451).
    platform-scoped-tables:
      - rules.write_installation_setting
      - rules.config_purge_tenant
gst:
  service: rules-svc
  db.event-log-url: ${GST_EVENT_LOG_DB_URL:}
